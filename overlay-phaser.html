<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Overlay Moved — IntoTheBattle</title>
  <script>
    const nextUrl = new URL('/overlay', window.location.origin);
    for (const [key, value] of new URLSearchParams(window.location.search)) {
      nextUrl.searchParams.set(key, value);
    }
    window.location.replace(nextUrl.toString());
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff8e6;
      background:
        radial-gradient(circle at 18% 2%, rgba(246,201,91,.18), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(232,59,95,.13), transparent 30%),
        linear-gradient(180deg, #050608, #030406);
    }
    .card {
      width: min(520px, 100%);
      padding: 30px;
      border-radius: 28px;
      border: 1px solid rgba(246,201,91,.24);
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: 0 32px 90px rgba(0,0,0,.45);
      text-align: center;
    }
    h1 { font-size: 28px; line-height: 1.1; margin-bottom: 12px; text-transform: uppercase; }
    p { color: #a8afbf; line-height: 1.65; margin-bottom: 20px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 15px;
      color: #170c02;
      background: linear-gradient(135deg,#f6c95b,#fff0b9 52%,#ff6a3d);
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Overlay moved</h1>
    <p><code>overlay-phaser.html</code> is now a compatibility alias. The production overlay lives at <code>/overlay</code>.</p>
    <a href="/overlay">Open current overlay</a>
  </main>
</body>
</html>
