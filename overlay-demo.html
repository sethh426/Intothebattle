<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IntoTheBattle Overlay Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.0.0/dist/phaser.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: 'Exo 2', 'Segoe UI', sans-serif;
    }
    body { display: grid; place-items: center; }
    #game-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #02040a;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class HomeOverlayDemoScene extends Phaser.Scene {
      constructor() {
        super({ key: 'HomeOverlayDemoScene' });
        this.players = [];
        this.tick = 0;
      }

      create() {
        const { width, height } = this.scale;
        this.drawBackground(width, height);
        this.drawHeader(width);
        this.drawHordeBar(width, height);
        this.createPlayers(width, height);
        this.createEventFeed(width, height);
        this.scheduleCombat(width, height);
      }

      drawBackground(width, height) {
        const g = this.add.graphics();
        g.fillGradientStyle(0x07101f, 0x050914, 0x12070b, 0x030406, 1);
        g.fillRect(0, 0, width, height);

        g.lineStyle(1, 0x1e5f85, 0.14);
        for (let x = 0; x <= width; x += 64) g.lineBetween(x, 0, x, height);
        for (let y = 0; y <= height; y += 64) g.lineBetween(0, y, width, y);

        const cx = width * 0.5;
        const cy = height * 0.52;
        for (let i = 0; i < 5; i += 1) {
          g.lineStyle(2, 0xf6c95b, 0.08 - i * 0.01);
          g.strokeCircle(cx, cy, Math.min(width, height) * (0.18 + i * 0.07));
        }

        const glow = this.add.graphics();
        glow.fillStyle(0xf6c95b, 0.06);
        glow.fillCircle(width * 0.5, height * 0.5, Math.min(width, height) * 0.34);
        glow.fillStyle(0x55e7ff, 0.05);
        glow.fillCircle(width * 0.18, height * 0.78, Math.min(width, height) * 0.23);
        glow.fillStyle(0xe83b5f, 0.05);
        glow.fillCircle(width * 0.86, height * 0.24, Math.min(width, height) * 0.22);
      }

      drawHeader(width) {
        const bar = this.add.graphics();
        bar.fillStyle(0x000000, 0.34);
        bar.fillRoundedRect(22, 18, width - 44, 54, 18);
        bar.lineStyle(1, 0xf6c95b, 0.24);
        bar.strokeRoundedRect(22, 18, width - 44, 54, 18);

        this.add.text(42, 34, 'INTOTHEBATTLE', {
          fontFamily: 'Exo 2', fontSize: '18px', fontStyle: '900', color: '#fff8e6', letterSpacing: 2
        });
        this.add.text(width - 42, 35, 'LIVE ARENA DEMO', {
          fontFamily: 'Rajdhani', fontSize: '17px', fontStyle: '700', color: '#ffdf8a'
        }).setOrigin(1, 0);

        const liveDot = this.add.circle(width - 192, 45, 5, 0xe83b5f, 1);
        this.tweens.add({ targets: liveDot, alpha: 0.25, duration: 620, yoyo: true, repeat: -1 });
      }

      drawHordeBar(width, height) {
        const y = height - 78;
        const g = this.add.graphics();
        g.fillGradientStyle(0x34101b, 0x351018, 0x38210a, 0x16090b, 0.88);
        g.fillRoundedRect(26, y, width - 52, 52, 18);
        g.lineStyle(1, 0xe83b5f, 0.36);
        g.strokeRoundedRect(26, y, width - 52, 52, 18);
        this.add.text(48, y + 15, 'THE HORDE', {
          fontFamily: 'Rajdhani', fontSize: '20px', fontStyle: '700', color: '#ffe5ea'
        });
        this.hordeText = this.add.text(width - 48, y + 15, '42 VIEWERS CHARGING THE ARENA', {
          fontFamily: 'Rajdhani', fontSize: '18px', fontStyle: '700', color: '#ffdf8a'
        }).setOrigin(1, 0);
      }

      createPlayers(width, height) {
        const positions = [
          { id: 'nova', name: '@Nova', x: width * 0.16, y: height * 0.27, hp: 92, accent: 0x77f0a1 },
          { id: 'jax', name: '@Jax', x: width * 0.74, y: height * 0.32, hp: 58, accent: 0xff6a3d },
          { id: 'luna', name: '@Luna', x: width * 0.39, y: height * 0.63, hp: 76, accent: 0x55e7ff },
          { id: 'milo', name: '@Milo', x: width * 0.59, y: height * 0.52, hp: 41, accent: 0xf6c95b }
        ];
        positions.forEach((data, index) => this.players.push(this.createPlayerCard(data, index)));
      }

      createPlayerCard(data, index) {
        const group = this.add.container(data.x, data.y);
        group.demo = data;

        const bg = this.add.graphics();
        bg.fillStyle(0x05070c, 0.82);
        bg.fillRoundedRect(-58, -42, 116, 84, 18);
        bg.lineStyle(2, data.accent, 0.46);
        bg.strokeRoundedRect(-58, -42, 116, 84, 18);
        group.add(bg);

        const avatar = this.add.circle(-34, -10, 18, data.accent, 0.2);
        avatar.setStrokeStyle(2, data.accent, 0.78);
        group.add(avatar);

        const name = this.add.text(-8, -28, data.name, {
          fontFamily: 'Rajdhani', fontSize: '18px', fontStyle: '700', color: '#ffffff'
        });
        group.add(name);

        const hpBg = this.add.rectangle(0, 18, 92, 8, 0xffffff, 0.12).setOrigin(0.5);
        group.add(hpBg);

        const hp = this.add.rectangle(-46, 18, 92 * data.hp / 100, 8, data.accent, 1).setOrigin(0, 0.5);
        group.add(hp);
        group.hpBar = hp;

        const hpText = this.add.text(0, 31, `${data.hp} HP`, {
          fontFamily: 'Rajdhani', fontSize: '13px', fontStyle: '700', color: '#a8afbf'
        }).setOrigin(0.5, 0);
        group.add(hpText);
        group.hpText = hpText;

        this.tweens.add({ targets: group, y: data.y - 7, duration: 1200 + index * 180, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        return group;
      }

      createEventFeed(width, height) {
        this.feed = this.add.container(32, height - 190);
        this.feedItems = [];
        ['@Nova joined the arena', '@Jax charged Fire Strike', '@Luna healed the Horde'].forEach((text, i) => this.pushFeed(text, i === 0));
      }

      pushFeed(text, instant = false) {
        const item = this.add.container(0, this.feedItems.length * 32);
        const bg = this.add.graphics();
        bg.fillStyle(0x000000, 0.38);
        bg.fillRoundedRect(0, 0, 300, 26, 10);
        bg.lineStyle(1, 0xffffff, 0.08);
        bg.strokeRoundedRect(0, 0, 300, 26, 10);
        item.add(bg);
        item.add(this.add.circle(13, 13, 4, 0xf6c95b, 1));
        item.add(this.add.text(26, 6, text, { fontFamily: 'Rajdhani', fontSize: '15px', fontStyle: '700', color: '#dfe6f3' }));
        item.setAlpha(instant ? 0.82 : 0);
        this.feed.add(item);
        this.feedItems.unshift(item);
        this.feedItems.forEach((entry, i) => this.tweens.add({ targets: entry, y: i * 32, alpha: i > 2 ? 0 : 0.82, duration: 240 }));
        this.feedItems = this.feedItems.slice(0, 4);
      }

      scheduleCombat(width, height) {
        this.time.addEvent({ delay: 1250, loop: true, callback: () => this.combatTick(width, height) });
      }

      combatTick(width, height) {
        const attacker = this.players[this.tick % this.players.length];
        const target = this.players[(this.tick + 1) % this.players.length];
        const damage = [18, 27, 42, 64][this.tick % 4];
        const color = damage >= 42 ? '#ff445f' : '#ffdf8a';

        this.drawLaser(attacker.x, attacker.y, target.x, target.y, damage >= 42);
        target.demo.hp = Math.max(12, target.demo.hp - Math.floor(damage / 3));
        this.tweens.add({ targets: target.hpBar, width: 92 * target.demo.hp / 100, duration: 260, ease: 'Power2' });
        target.hpText.setText(`${target.demo.hp} HP`);

        const dmg = this.add.text(target.x, target.y - 70, `-${damage}`, {
          fontFamily: 'Exo 2', fontSize: damage >= 42 ? '32px' : '25px', fontStyle: '900', color,
          stroke: '#000000', strokeThickness: 5
        }).setOrigin(0.5);
        this.tweens.add({ targets: dmg, y: dmg.y - 62, alpha: 0, duration: 850, ease: 'Quad.easeOut', onComplete: () => dmg.destroy() });

        if (this.tick % 3 === 0) this.showBanner(`${attacker.demo.name} ACTIVATED FIRE STRIKE`);
        if (this.tick % 5 === 0) this.flashScreen(width, height);
        if (target.demo.hp <= 18) {
          target.demo.hp = 100;
          target.hpText.setText('100 HP');
          target.hpBar.width = 92;
          this.showBanner(`${attacker.demo.name} GOT THE KNOCKOUT`);
        }
        this.pushFeed(`${attacker.demo.name} hit ${target.demo.name} for ${damage}`);
        this.hordeText.setText(`${42 + (this.tick % 11)} VIEWERS PUSHING THE ARENA`);
        this.tick += 1;
      }

      drawLaser(x1, y1, x2, y2, critical) {
        const line = this.add.line(0, 0, x1, y1, x2, y2, critical ? 0xff445f : 0x55e7ff, 0.92).setLineWidth(critical ? 6 : 4);
        line.setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({ targets: line, alpha: 0, duration: 260, onComplete: () => line.destroy() });
      }

      showBanner(text) {
        const banner = this.add.text(this.scale.width / 2, 100, text, {
          fontFamily: 'Exo 2', fontSize: '28px', fontStyle: '900', color: '#ffdf8a',
          stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setAlpha(0);
        this.tweens.add({ targets: banner, y: 118, alpha: 1, duration: 220, ease: 'Back.easeOut' });
        this.time.delayedCall(900, () => this.tweens.add({ targets: banner, y: 92, alpha: 0, duration: 350, onComplete: () => banner.destroy() }));
      }

      flashScreen(width, height) {
        const flash = this.add.rectangle(width / 2, height / 2, width, height, 0xff6a3d, 0.18);
        this.tweens.add({ targets: flash, alpha: 0, duration: 220, onComplete: () => flash.destroy() });
      }
    }

    const game = new Phaser.Game({
      type: Phaser.CANVAS,
      parent: 'game-container',
      width: 1280,
      height: 720,
      backgroundColor: '#02040a',
      scene: HomeOverlayDemoScene,
      render: { antialias: true, pixelArt: false },
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
    });
  </script>
</body>
</html>
