<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IntoTheBattle Overlay Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.0.0/dist/phaser.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
    body { display: grid; place-items: center; }
    #game-container { width: 100vw; height: 100vh; overflow: hidden; background: #02040a; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class HomeOverlayDemoScene extends Phaser.Scene {
      constructor() {
        super({ key: 'HomeOverlayDemoScene' });
        this.players = [];
        this.tick = 0;
      }

      create() {
        const { width, height } = this.scale;
        this.cx = width / 2;
        this.cy = height / 2;
        this.drawBackground(width, height);
        this.drawScoreboard(width);
        this.drawArena(width, height);
        this.createPlayers(width, height);
        this.createEventRail(width, height);
        this.drawHordeBar(width, height);
        this.time.addEvent({ delay: 1350, loop: true, callback: () => this.combatTick(width, height) });
      }

      drawBackground(width, height) {
        const g = this.add.graphics();
        g.fillGradientStyle(0x06111f, 0x070914, 0x16080d, 0x030406, 1);
        g.fillRect(0, 0, width, height);
        g.lineStyle(1, 0x2c6f91, 0.11);
        for (let x = 0; x <= width; x += 72) g.lineBetween(x, 0, x, height);
        for (let y = 0; y <= height; y += 72) g.lineBetween(0, y, width, y);
        g.fillStyle(0xf6c95b, 0.055); g.fillCircle(width * 0.5, height * 0.52, 270);
        g.fillStyle(0x55e7ff, 0.045); g.fillCircle(width * 0.18, height * 0.78, 180);
        g.fillStyle(0xe83b5f, 0.045); g.fillCircle(width * 0.86, height * 0.25, 170);
      }

      drawScoreboard(width) {
        const g = this.add.graphics();
        g.fillStyle(0x03060b, 0.78);
        g.fillRoundedRect(34, 26, width - 68, 68, 20);
        g.lineStyle(1, 0xf6c95b, 0.28);
        g.strokeRoundedRect(34, 26, width - 68, 68, 20);
        this.add.text(60, 43, 'INTOTHEBATTLE', { fontFamily: 'Exo 2', fontSize: '22px', fontStyle: '900', color: '#fff8e6' });
        this.add.text(60, 67, 'VIEWER-POWERED LIVE ARENA', { fontFamily: 'Rajdhani', fontSize: '14px', fontStyle: '700', color: '#a8afbf' });
        this.add.text(width - 60, 42, 'LIVE PREVIEW', { fontFamily: 'Rajdhani', fontSize: '20px', fontStyle: '700', color: '#ffdf8a' }).setOrigin(1, 0);
        const dot = this.add.circle(width - 205, 54, 5, 0xe83b5f, 1);
        this.tweens.add({ targets: dot, alpha: 0.22, duration: 620, yoyo: true, repeat: -1 });
      }

      drawArena(width, height) {
        const g = this.add.graphics();
        const cx = width / 2;
        const cy = height * 0.5;
        g.lineStyle(3, 0xf6c95b, 0.18);
        g.strokeCircle(cx, cy, 210);
        g.lineStyle(2, 0xf6c95b, 0.12);
        g.strokeCircle(cx, cy, 148);
        g.lineStyle(1, 0x55e7ff, 0.13);
        g.strokeCircle(cx, cy, 282);
        g.fillStyle(0x000000, 0.16);
        g.fillCircle(cx, cy, 122);
        this.add.text(cx, cy - 10, 'ARENA', { fontFamily: 'Exo 2', fontSize: '34px', fontStyle: '900', color: '#ffffff', alpha: 0.16 }).setOrigin(0.5);
      }

      createPlayers(width, height) {
        const data = [
          { id: 'nova', name: '@Nova', x: width * 0.25, y: height * 0.36, hp: 92, accent: 0x77f0a1 },
          { id: 'jax', name: '@Jax', x: width * 0.75, y: height * 0.36, hp: 58, accent: 0xff6a3d },
          { id: 'luna', name: '@Luna', x: width * 0.35, y: height * 0.63, hp: 76, accent: 0x55e7ff },
          { id: 'milo', name: '@Milo', x: width * 0.65, y: height * 0.63, hp: 41, accent: 0xf6c95b }
        ];
        data.forEach((player, index) => this.players.push(this.createPlayerCard(player, index)));
      }

      createPlayerCard(data, index) {
        const group = this.add.container(data.x, data.y);
        group.demo = data;
        const bg = this.add.graphics();
        bg.fillStyle(0x05070c, 0.9);
        bg.fillRoundedRect(-72, -48, 144, 96, 18);
        bg.lineStyle(2, data.accent, 0.52);
        bg.strokeRoundedRect(-72, -48, 144, 96, 18);
        group.add(bg);
        const avatar = this.add.circle(-48, -15, 19, data.accent, 0.2);
        avatar.setStrokeStyle(2, data.accent, 0.78);
        group.add(avatar);
        group.add(this.add.text(-18, -34, data.name, { fontFamily: 'Rajdhani', fontSize: '20px', fontStyle: '700', color: '#ffffff' }));
        group.add(this.add.text(-18, -12, 'ACTIVE', { fontFamily: 'Rajdhani', fontSize: '12px', fontStyle: '700', color: '#a8afbf' }));
        group.add(this.add.rectangle(0, 22, 112, 9, 0xffffff, 0.12).setOrigin(0.5));
        const hp = this.add.rectangle(-56, 22, 112 * data.hp / 100, 9, data.accent, 1).setOrigin(0, 0.5);
        group.add(hp);
        group.hpBar = hp;
        const hpText = this.add.text(0, 34, `${data.hp} HP`, { fontFamily: 'Rajdhani', fontSize: '14px', fontStyle: '700', color: '#ffdf8a' }).setOrigin(0.5, 0);
        group.add(hpText);
        group.hpText = hpText;
        this.tweens.add({ targets: group, y: data.y - 6, duration: 1150 + index * 170, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        return group;
      }

      createEventRail(width, height) {
        this.feed = this.add.container(40, height - 204);
        this.feedItems = [];
        ['@Nova joined the arena', '@Jax charged Fire Strike', '@Luna boosted the Horde'].forEach((text, i) => this.pushFeed(text, i === 0));
      }

      pushFeed(text, instant = false) {
        const item = this.add.container(0, this.feedItems.length * 34);
        const bg = this.add.graphics();
        bg.fillStyle(0x000000, 0.46);
        bg.fillRoundedRect(0, 0, 328, 28, 10);
        bg.lineStyle(1, 0xffffff, 0.09);
        bg.strokeRoundedRect(0, 0, 328, 28, 10);
        item.add(bg);
        item.add(this.add.circle(14, 14, 4, 0xf6c95b, 1));
        item.add(this.add.text(28, 6, text, { fontFamily: 'Rajdhani', fontSize: '16px', fontStyle: '700', color: '#dfe6f3' }));
        item.setAlpha(instant ? 0.86 : 0);
        this.feed.add(item);
        this.feedItems.unshift(item);
        this.feedItems.forEach((entry, i) => this.tweens.add({ targets: entry, y: i * 34, alpha: i > 2 ? 0 : 0.86, duration: 240 }));
        this.feedItems = this.feedItems.slice(0, 4);
      }

      drawHordeBar(width, height) {
        const y = height - 74;
        const g = this.add.graphics();
        g.fillGradientStyle(0x34101b, 0x351018, 0x38210a, 0x16090b, 0.9);
        g.fillRoundedRect(34, y, width - 68, 48, 18);
        g.lineStyle(1, 0xe83b5f, 0.42);
        g.strokeRoundedRect(34, y, width - 68, 48, 18);
        this.add.text(58, y + 13, 'THE HORDE', { fontFamily: 'Rajdhani', fontSize: '20px', fontStyle: '700', color: '#ffe5ea' });
        this.hordeText = this.add.text(width - 58, y + 13, '42 VIEWERS PUSHING THE ARENA', { fontFamily: 'Rajdhani', fontSize: '18px', fontStyle: '700', color: '#ffdf8a' }).setOrigin(1, 0);
      }

      combatTick(width, height) {
        const attacker = this.players[this.tick % this.players.length];
        const target = this.players[(this.tick + 1) % this.players.length];
        const damage = [18, 27, 42, 64][this.tick % 4];
        const critical = damage >= 42;
        this.drawLaser(attacker.x, attacker.y, target.x, target.y, critical);
        target.demo.hp = Math.max(12, target.demo.hp - Math.floor(damage / 3));
        this.tweens.add({ targets: target.hpBar, width: 112 * target.demo.hp / 100, duration: 260, ease: 'Power2' });
        target.hpText.setText(`${target.demo.hp} HP`);
        const dmg = this.add.text(target.x, target.y - 76, `-${damage}`, { fontFamily: 'Exo 2', fontSize: critical ? '34px' : '26px', fontStyle: '900', color: critical ? '#ff445f' : '#ffdf8a', stroke: '#000000', strokeThickness: 5 }).setOrigin(0.5);
        this.tweens.add({ targets: dmg, y: dmg.y - 60, alpha: 0, duration: 850, ease: 'Quad.easeOut', onComplete: () => dmg.destroy() });
        if (this.tick % 3 === 0) this.showBanner(`${attacker.demo.name} FIRE STRIKE`);
        if (this.tick % 5 === 0) this.flashScreen(width, height);
        if (target.demo.hp <= 18) {
          target.demo.hp = 100;
          target.hpText.setText('100 HP');
          target.hpBar.width = 112;
          this.showBanner(`${attacker.demo.name} KNOCKOUT`);
        }
        this.pushFeed(`${attacker.demo.name} hit ${target.demo.name} for ${damage}`);
        this.hordeText.setText(`${42 + (this.tick % 11)} VIEWERS PUSHING THE ARENA`);
        this.tick += 1;
      }

      drawLaser(x1, y1, x2, y2, critical) {
        const line = this.add.line(0, 0, x1, y1, x2, y2, critical ? 0xff445f : 0x55e7ff, 0.95).setLineWidth(critical ? 7 : 4);
        line.setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({ targets: line, alpha: 0, duration: 260, onComplete: () => line.destroy() });
      }

      showBanner(text) {
        const banner = this.add.text(this.scale.width / 2, 126, text, { fontFamily: 'Exo 2', fontSize: '30px', fontStyle: '900', color: '#ffdf8a', stroke: '#000000', strokeThickness: 6 }).setOrigin(0.5).setAlpha(0);
        this.tweens.add({ targets: banner, y: 146, alpha: 1, duration: 220, ease: 'Back.easeOut' });
        this.time.delayedCall(900, () => this.tweens.add({ targets: banner, y: 116, alpha: 0, duration: 350, onComplete: () => banner.destroy() }));
      }

      flashScreen(width, height) {
        const flash = this.add.rectangle(width / 2, height / 2, width, height, 0xff6a3d, 0.16);
        this.tweens.add({ targets: flash, alpha: 0, duration: 220, onComplete: () => flash.destroy() });
      }
    }

    new Phaser.Game({
      type: Phaser.CANVAS,
      parent: 'game-container',
      width: 1280,
      height: 720,
      backgroundColor: '#02040a',
      scene: HomeOverlayDemoScene,
      render: { antialias: true, pixelArt: false },
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
    });
  </script>
</body>
</html>
