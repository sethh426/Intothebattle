<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Password Reset - Battle Royale LIVE</title>
    <meta name="description" content="Forgot your IntoTheBattle password? Request a secure password reset link via email and regain access to your account." />
    <meta name="keywords" content="password reset, forgot password, account recovery, IntoTheBattle login help" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="IntoTheBattle" />
    <link rel="canonical" href="https://intothebattle.com/request-password-reset" />
  
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IntoTheBattle Password Reset" />
    <meta property="og:description" content="Request a password reset link to regain access to your IntoTheBattle account." />
    <meta property="og:url" content="https://intothebattle.com/request-password-reset" />
    <meta property="og:image" content="https://intothebattle.com/intothebattlelogo_logo_only.svg" />
    <meta property="og:site_name" content="IntoTheBattle" />
  
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IntoTheBattle Password Reset" />
    <meta name="twitter:description" content="Request a password reset link to regain access to your IntoTheBattle account." />
    <meta name="twitter:image" content="https://intothebattle.com/intothebattlelogo_logo_only.svg" />
  
    <link rel="icon" href="/intothebattlelogo_logo_only.svg" />
    <link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg" />
  
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "IntoTheBattle Password Reset",
      "url": "https://intothebattle.com/request-password-reset",
      "description": "Request a secure password reset link to regain access to your IntoTheBattle account.",
      "isPartOf": {
        "@type": "WebSite",
        "name": "IntoTheBattle",
        "url": "https://intothebattle.com/"
      }
    }
    </script>
  
  <style>
    :root { --bg:#050d1a; --surface:#0f1726; --border:#3751ff22; --text:#e8eef8; --muted:#8ca2d1; --accent:#4d96ff; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
    body{min-height:100vh;background:linear-gradient(180deg,#020611 0%,#070d22 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(520px,100%);background:rgba(10,18,36,.96);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35);}
    h1{font-size:2rem;margin-bottom:12px;}
    p{color:var(--muted);margin-bottom:24px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px;}
    input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;}
    button{width:100%;padding:14px 16px;border:none;border-radius:14px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#6ab0ff);cursor:pointer;}
    .notice{border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:.95rem;}
    .error{background:rgba(255,85,95,.12);border:1px solid rgba(255,85,95,.18);color:#ffb1b1;}
    .success{background:rgba(107,203,119,.12);border:1px solid rgba(107,203,119,.18);color:#c6ffcf;}
    .helper{margin-top:18px;color:var(--muted);font-size:.95rem;}
    .helper a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p>Enter your account email and we will send password reset instructions.</p>
    <div id="status"></div>
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" /></div>
    <button id="requestBtn" type="button">Request reset</button>
    <p class="helper"><a href="/login">Back to login</a></p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    document.getElementById('requestBtn').addEventListener('click', async () => {
      statusEl.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      if (!email) return statusEl.innerHTML = '<div class="notice error">Email is required.</div>';
      try {
        const res = await fetch('/auth/user/request-password-reset', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, credentials:'same-origin',
          body: JSON.stringify({ email }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Request failed');
        let msg = json.message || 'If an account exists, reset instructions were sent.';
        if (json.devResetLink) {
          msg += `<br><br><strong>Development reset link:</strong><br><a href="${json.devResetLink}">${json.devResetLink}</a>`;
        }
        statusEl.innerHTML = `<div class="notice success">${msg}</div>`;
      } catch (err) {
        statusEl.innerHTML = `<div class="notice error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
