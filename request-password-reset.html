<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Reset Password — IntoTheBattle</title><meta name="description" content="Request a secure IntoTheBattle password reset link."/><meta name="robots" content="index, follow"/><link rel="canonical" href="https://intothebattle.com/request-password-reset"/><link rel="icon" href="/intothebattlelogo_logo_only.svg"/><link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg"/><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff8e6;background:radial-gradient(circle at 18% 2%,rgba(246,201,91,.18),transparent 30%),radial-gradient(circle at 84% 18%,rgba(232,59,95,.13),transparent 30%),linear-gradient(180deg,#050608,#030406)}body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(246,201,91,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(246,201,91,.035) 1px,transparent 1px);background-size:58px 58px;mask-image:radial-gradient(circle at top,black,transparent 72%);z-index:-1}.card{width:min(540px,100%);padding:34px;border-radius:30px;border:1px solid rgba(246,201,91,.24);background:radial-gradient(circle at top left,rgba(246,201,91,.14),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 32px 90px rgba(0,0,0,.45)}.logo{width:68px;height:68px;border-radius:22px;overflow:hidden;border:1px solid rgba(246,201,91,.38);background:rgba(246,201,91,.08);margin-bottom:20px}.logo img{width:100%;height:auto;display:block;transform:scale(1.1)}h1{text-transform:uppercase;font-size:34px;line-height:1;margin-bottom:12px}p{color:#a8afbf;line-height:1.7;margin-bottom:22px}.form-group{margin-bottom:16px}label{display:block;color:#a8afbf;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}input{width:100%;min-height:52px;padding:13px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);color:#fff}button{width:100%;min-height:54px;border:0;border-radius:16px;color:#170c02;background:linear-gradient(135deg,#f6c95b,#fff0b9 52%,#ff6a3d);font-weight:900;cursor:pointer}.notice{border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.5}.error{background:rgba(232,59,95,.1);border:1px solid rgba(232,59,95,.25);color:#ffb1b8}.success{background:rgba(119,240,161,.08);border:1px solid rgba(119,240,161,.25);color:#b8ffd0}.helper{margin-top:18px;text-align:center}.helper a{color:#ffdf8a;text-decoration:none;font-weight:900}</style></head><body><div class="card"><div class="logo"><img src="/intothebattlelogo_logo_only.svg" alt="IntoTheBattle logo"></div><h1>Reset your password</h1><p>Enter your account email and we will send password reset instructions.</p><div id="status"></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div><button id="requestBtn" type="button">Request reset</button><p class="helper"><a href="/login">Back to login</a></p></div><script>const statusEl=document.getElementById('status');document.getElementById('requestBtn').addEventListener('click',async()=>{statusEl.innerHTML='';const email=document.getElementById('email').value.trim();if(!email)return statusEl.innerHTML='<div class="notice error">Email is required.</div>';try{const res=await fetch('/auth/user/request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email})});const json=await res.json();if(!res.ok)throw new Error(json.error||'Request failed');let msg=json.message||'If an account exists, reset instructions were sent.';if(json.devResetLink){msg+=`<br><br><strong>Development reset link:</strong><br><a href="${json.devResetLink}">${json.devResetLink}</a>`;}statusEl.innerHTML=`<div class="notice success">${msg}</div>`;}catch(err){statusEl.innerHTML=`<div class="notice error">${err.message}</div>`;}});</script></body></html>
