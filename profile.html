<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Profile — IntoTheBattle</title>
  <meta name="description" content="Manage your IntoTheBattle creator profile, TikTok username, rooms, subscription, and password." />
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="IntoTheBattle" />
  <link rel="canonical" href="https://intothebattle.com/profile" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/js/clarity-loader.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: clamp(16px, 3vw, 28px);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--txt, #edf0fa);
      overflow-x: hidden;
    }
    a { color: var(--gold-l, #ffe99a); text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
    button, input { font-family: inherit; }

    .page { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; padding-top: 8px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 12px 16px;
      border: 1px solid var(--b-gold, rgba(245,200,66,0.26));
      border-radius: var(--r-lg, 24px);
      background: rgba(5,8,14,0.80);
      backdrop-filter: blur(22px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.07);
      position: sticky;
      top: 16px;
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo {
      width: 52px; height: 52px;
      border-radius: var(--r-md, 18px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(245,200,66,0.36);
      background: rgba(245,200,66,0.08);
      box-shadow: 0 0 32px rgba(245,200,66,0.16);
      flex: 0 0 auto;
    }
    .brand-logo img { width: 100%; height: auto; display: block; transform: scale(1.1); }

    .brand-text strong {
      display: block;
      font-family: 'Black Ops One', sans-serif;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .brand-text span {
      display: block;
      color: var(--muted, #8896ae);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 3px;
    }

    .topbar-links { display: flex; gap: 10px; align-items: center; }
    .topbar-links a {
      display: inline-flex;
      align-items: center;
      padding: 9px 14px;
      border-radius: var(--r-pill, 999px);
      font-size: 13px;
      font-weight: 700;
      color: var(--muted, #8896ae);
      text-decoration: none;
      transition: color 0.16s, background 0.16s;
    }
    .topbar-links a:hover { color: var(--txt, #edf0fa); background: rgba(255,255,255,0.06); }
    .topbar-links .logout-btn {
      color: rgba(255,80,80,0.85);
      border: 1px solid rgba(255,42,74,0.22);
      background: rgba(255,42,74,0.06);
    }
    .topbar-links .logout-btn:hover { color: #ff8a8a; background: rgba(255,42,74,0.10); }

    h1, h2, h3 {
      font-family: 'Black Ops One', sans-serif;
      text-transform: uppercase;
      line-height: 1;
    }
    h1 { font-size: clamp(26px, 4vw, 44px); }

    .subtext { color: var(--muted, #8896ae); margin-top: 6px; font-size: 14px; }

    .hero {
      padding: clamp(26px, 4vw, 40px);
      border-radius: var(--r-xl, 32px);
      border: 1px solid var(--b-gold, rgba(245,200,66,0.26));
      background:
        radial-gradient(circle at top left, rgba(245,200,66,0.12) 0%, transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.025) 100%);
      box-shadow: 0 24px 70px rgba(0,0,0,0.28);
    }
    .hero h2 { font-size: clamp(28px, 4.5vw, 52px); margin-bottom: 12px; }
    .hero h2 span {
      color: transparent;
      background: var(--grad-heading, linear-gradient(115deg, #fff5d6, #f5c842, #ff6b35));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.065) 0%, rgba(255,255,255,0.025) 100%);
      border: 1px solid var(--border, rgba(255,255,255,0.09));
      border-radius: var(--r-lg, 24px);
      padding: clamp(20px, 3vw, 28px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.22);
    }

    .section-title {
      color: var(--gold-l, #ffe99a);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      color: var(--muted, #8896ae);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: var(--r-sm, 12px);
      border: 1px solid var(--border, rgba(255,255,255,0.09));
      background: rgba(255,255,255,0.055);
      color: var(--txt, #edf0fa);
      font-size: 15px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    input:focus {
      border-color: rgba(245,200,66,0.55);
      box-shadow: 0 0 0 4px rgba(245,200,66,0.08);
    }
    input::placeholder { color: rgba(255,255,255,0.26); }

    button, .small-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: none;
      border-radius: var(--r-sm, 12px);
      color: #0a0700;
      background: var(--grad-primary, linear-gradient(135deg, #f5c842, #ffe99a 42%, #ff7a3a));
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .small-button { min-height: 32px; font-size: 12px; margin-left: 8px; }

    .note { color: var(--muted, #8896ae); font-size: 14px; line-height: 1.65; }

    .notice {
      border-radius: var(--r-sm, 12px);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .error { background: rgba(255,42,74,0.08); border: 1px solid rgba(255,42,74,0.26); color: #ffb1b8; }
    .success { background: rgba(57,216,117,0.07); border: 1px solid rgba(57,216,117,0.26); color: #b8ffd0; }

    .card-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      display: inline-flex;
      padding: 8px 13px;
      border-radius: var(--r-pill, 999px);
      border: 1px solid var(--b-gold, rgba(245,200,66,0.24));
      background: rgba(245,200,66,0.07);
      color: var(--gold-l, #ffe99a);
      font-weight: 700;
      font-size: 13px;
    }
    .free-forever-label {
      color: #ffe99a;
      text-shadow: 0 0 18px rgba(245,200,66,0.28);
      font-weight: 900;
    }

    @media (max-width: 820px) {
      .topbar { position: static; flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/css/site-refresh.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <a class="brand-logo" href="/dashboard" aria-label="Command Center">
          <img src="/intothebattlelogo_logo_only.svg" alt="IntoTheBattle logo" width="52" height="52" />
        </a>
        <div class="brand-text">
          <strong>IntoTheBattle</strong>
          <span>Account profile</span>
        </div>
      </div>
      <div class="topbar-links">
        <a href="/dashboard">Command Center</a>
        <a href="#" id="logoutLink" class="logout-btn">Logout</a>
      </div>
    </header>

    <section class="hero">
      <h2>Your creator account. <span>Your arena access.</span></h2>
      <p class="note">Keep your profile, TikTok username, rooms, and subscription details ready for live stream operations.</p>
    </section>

    <div id="status"></div>
    <div id="emailVerificationStatus"></div>

    <section class="card">
      <div class="section-title">Active subscription</div>
      <div id="subscriptionDetails"><p class="note">Loading subscription details...</p></div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="section-title">Profile details</div>
        <div class="form-group"><label for="name">Name</label><input id="name" type="text" /></div>
        <div class="form-group"><label for="tiktokUsername">TikTok username</label><input id="tiktokUsername" type="text" /></div>
        <div class="form-group"><label for="email">Email</label><input id="email" type="email" /></div>
        <button id="saveProfile">Save profile</button>
      </div>
      <div class="card">
        <div class="section-title">Change password</div>
        <div class="form-group"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" /></div>
        <div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" /></div>
        <button id="changePassword">Update password</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Rooms</div>
      <div id="roomList" class="card-list"></div>
      <div class="form-group" style="margin-top:16px;"><label for="roomName">Create a new room</label><input id="roomName" type="text" placeholder="My second room" /></div>
      <button id="createRoom">Add room</button>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const emailVerificationStatusEl = document.getElementById('emailVerificationStatus');
    const subscriptionEl = document.getElementById('subscriptionDetails');
    const roomListEl = document.getElementById('roomList');
    const logoutLink = document.getElementById('logoutLink');

    function showStatus(message, isError = false) {
      statusEl.innerHTML = `<div class="notice ${isError ? 'error' : 'success'}">${message}</div>`;
    }

    async function loadProfile() {
      try {
        const res = await fetch('/auth/user/me', { credentials: 'same-origin' });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unauthorized');

        document.getElementById('name').value = json.user.name || '';
        document.getElementById('tiktokUsername').value = json.user.tiktok_username || '';
        document.getElementById('email').value = json.user.email || '';
        updateEmailVerificationStatus(json.user);

        const subscription = json.subscription;
        const subscriptionStatus = String(subscription?.status || '').toLowerCase();
        const isTrial = ['trial', 'trialing', 'free-trial', 'full-access-trial'].includes(subscriptionStatus);
        const freeForever = Boolean(subscription?.free_forever || subscription?.freeForever || /free\s*forever/i.test(subscription?.display_plan || subscription?.plan_type || subscription?.planType || ''));
        if (subscription && (subscriptionStatus === 'active' || isTrial)) {
          subscriptionEl.innerHTML = freeForever
            ? `
              <p class="note">Status: <strong>active</strong></p>
              <p class="note">Plan: <strong class="free-forever-label">Free forever</strong></p>
              <p class="note">Billing: No billing. This account has permanent access.</p>
            `
            : `
              <p class="note">Status: <strong>${subscription.status}</strong></p>
              <p class="note">Plan: ${subscription.display_plan || subscription.plan_type || (isTrial ? '7-Day Full Access' : 'Creator Pro')}</p>
              <p class="note">${isTrial ? 'Trial ends' : 'Next billing'}: ${subscription.expires_at || subscription.next_billing_date || 'Pending'}</p>
            `;
        } else {
          subscriptionEl.innerHTML = '<p class="note">Plan: <strong>Free</strong></p><p class="note">Upgrade to Creator Pro when you want advanced creator controls.</p><p style="margin-top:14px;"><a class="small-button" href="/paywall" style="margin-left:0;">Upgrade to Creator Pro</a></p>';
        }

        roomListEl.innerHTML = json.rooms.length
          ? json.rooms.map(room => `<div class="pill">${room.room_name || room.room_id}</div>`).join('')
          : '<p class="note">No rooms yet. Create one below.</p>';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    function updateEmailVerificationStatus(user) {
      if (user.email_verified) {
        emailVerificationStatusEl.innerHTML = '<div class="notice success">Email verified. Thank you for confirming your address.</div>';
        return;
      }

      emailVerificationStatusEl.innerHTML = `<div class="notice error">Your email is not verified. <button id="resendVerification" type="button" class="small-button">Resend email</button></div>`;
      document.getElementById('resendVerification')?.addEventListener('click', async () => {
        try {
          const res = await fetch('/auth/user/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Unable to resend verification email');
          showStatus(json.message || 'Verification email resent.');
        } catch (err) {
          showStatus(err.message, true);
        }
      });
    }

    document.getElementById('saveProfile').addEventListener('click', async () => {
      try {
        const res = await fetch('/auth/user/update-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            tiktokUsername: document.getElementById('tiktokUsername').value.trim(),
            email: document.getElementById('email').value.trim(),
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to save profile');
        showStatus(json.message || 'Profile updated.');
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    document.getElementById('changePassword').addEventListener('click', async () => {
      try {
        const res = await fetch('/auth/user/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value,
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to change password');
        showStatus(json.message || 'Password updated.');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    document.getElementById('createRoom').addEventListener('click', async () => {
      const roomName = document.getElementById('roomName').value.trim();
      if (!roomName) return showStatus('Room name is required.', true);
      try {
        const res = await fetch('/auth/user/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ roomName }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to create room');
        showStatus('Room created. Refreshing list...');
        document.getElementById('roomName').value = '';
        await loadProfile();
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    logoutLink.addEventListener('click', async (event) => {
      event.preventDefault();
      await fetch('/auth/user/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/';
    });

    loadProfile();
  </script>
</body>
</html>
