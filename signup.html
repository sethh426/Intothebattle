<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "IntoTheBattle Free Trial Signup",
    "url": "https://intothebattle.com/signup",
    "description": "Start your free trial of IntoTheBattle, the interactive TikTok LIVE battle overlay platform.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "IntoTheBattle",
      "url": "https://intothebattle.com/"
    }
  }
  </script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4D96FF;
      --accent: #6BCB77;
      --dark: #050d1a;
      --card: #0a1428;
      --border: rgba(77, 150, 255, 0.15);
      --text: #e8eef8;
      --text-muted: #5a7a9e;
      --success: #6BCB77;
      --error: #ff5f6d;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(77, 150, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 150, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridShift { from { background-position: 0 0; } to { background-position: 48px 48px; } }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(77, 150, 255, 0.1); top: -140px; right: -80px; }
    .orb-2 { width: 360px; height: 360px; background: rgba(107, 203, 119, 0.07); bottom: -80px; left: -100px; }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(8, 18, 40, 0.92);
      border: 1px solid rgba(77, 150, 255, 0.15);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 0 60px rgba(77, 150, 255, 0.08), 0 24px 48px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .card-sub {
      font-size: 14px;
      color: #5a7a9e;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #5a7a9e;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(77, 150, 255, 0.2);
      border-radius: 10px;
      color: #e8eef8;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: rgba(77, 150, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.1);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.18);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6ab0ff);
      box-shadow: 0 0 24px rgba(77, 150, 255, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 0 36px rgba(77, 150, 255, 0.45);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.15), transparent 60%);
      pointer-events: none;
    }

    .step-indicator {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(77, 150, 255, 0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .code-display {
      background: rgba(107, 203, 119, 0.1);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin: 24px 0;
    }

    .code-display-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .code-display-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      word-break: break-all;
    }

    .code-copy-btn {
      background: var(--accent);
      color: var(--dark);
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .code-copy-btn:hover {
      filter: brightness(1.1);
    }

    .code-copied {
      display: none;
      color: var(--accent);
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(107, 203, 119, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .alert.error {
      background: rgba(255, 95, 109, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .form-group.two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group.two-col input {
      width: 100%;
    }

    .info-block {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 24px;
      color: var(--text-muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .info-block strong {
      color: #fff;
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }

      .card-title {
        font-size: 24px;
      }

      .form-group.two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What does the free trial include?",
        "acceptedAnswer": { "@type": "Answer", "text": "A 14-day trial including overlay access, dashboard controls, and room configuration." }
      },
      {
        "@type": "Question",
        "name": "Is a credit card required?",
        "acceptedAnswer": { "@type": "Answer", "text": "No — the trial does not require a credit card to start." }
      },
      {
        "@type": "Question",
        "name": "How do I sign up?",
        "acceptedAnswer": { "@type": "Answer", "text": "Use the Google button to sign up instantly, or click the email signup link to register with your email." }
      }
    ]
  }
  </script>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <span class="card-icon">🎮</span>
        <div class="card-title">Create your Battle Account</div>
        <div class="card-sub">14-day trial, TikTok LIVE overlay access, no credit card required</div>
      </div>

      <div class="info-block">
        <strong>Sign up for a battle-ready room</strong>
        Sign up instantly with Google, or register with email on the next page.
      </div>

      <div class="action-buttons">
        <a href="/auth/google" class="btn btn-primary" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;">
          Continue with Google
        </a>
        <a href="/register" class="btn" style="background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-top: 12px;">
          Sign up with email
        </a>
      </div>

      <div class="login-link" style="margin-top: 20px;">
        Already have an account? <a href="/login">Sign in here</a>
      </div>
    </div>
  </div>
</body>
</html>
