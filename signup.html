<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Trial - Battle Royale LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4D96FF;
      --accent: #6BCB77;
      --dark: #050d1a;
      --card: #0a1428;
      --border: rgba(77, 150, 255, 0.15);
      --text: #e8eef8;
      --text-muted: #5a7a9e;
      --success: #6BCB77;
      --error: #ff5f6d;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(77, 150, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 150, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridShift { from { background-position: 0 0; } to { background-position: 48px 48px; } }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(77, 150, 255, 0.1); top: -140px; right: -80px; }
    .orb-2 { width: 360px; height: 360px; background: rgba(107, 203, 119, 0.07); bottom: -80px; left: -100px; }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: rgba(8, 18, 40, 0.92);
      border: 1px solid rgba(77, 150, 255, 0.15);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 0 60px rgba(77, 150, 255, 0.08), 0 24px 48px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .card-sub {
      font-size: 14px;
      color: #5a7a9e;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #5a7a9e;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(77, 150, 255, 0.2);
      border-radius: 10px;
      color: #e8eef8;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: rgba(77, 150, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.1);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.18);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6ab0ff);
      box-shadow: 0 0 24px rgba(77, 150, 255, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 0 36px rgba(77, 150, 255, 0.45);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.15), transparent 60%);
      pointer-events: none;
    }

    .step-indicator {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(77, 150, 255, 0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .code-display {
      background: rgba(107, 203, 119, 0.1);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin: 24px 0;
    }

    .code-display-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .code-display-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      word-break: break-all;
    }

    .code-copy-btn {
      background: var(--accent);
      color: var(--dark);
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .code-copy-btn:hover {
      filter: brightness(1.1);
    }

    .code-copied {
      display: none;
      color: var(--accent);
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
    }

    .code-copied.show {
      display: block;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(107, 203, 119, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .alert.error {
      background: rgba(255, 95, 109, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .form-group.two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group.two-col input {
      width: 100%;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }

      .card-title {
        font-size: 24px;
      }

      .form-group.two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What does the free trial include?",
        "acceptedAnswer": { "@type": "Answer", "text": "A 14-day trial including overlay access, dashboard controls, and room configuration." }
      },
      {
        "@type": "Question",
        "name": "Is a credit card required?",
        "acceptedAnswer": { "@type": "Answer", "text": "No — the trial does not require a credit card to start." }
      },
      {
        "@type": "Question",
        "name": "How do I get my access code?",
        "acceptedAnswer": { "@type": "Answer", "text": "Enter your email on this signup page and click 'Generate Access Code' to receive a trial code instantly." }
      }
    ]
  }
  </script>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <span class="card-icon">🎮</span>
        <div class="card-title">Start Your Trial</div>
        <div class="card-sub">14 days of full access, no credit card required</div>
      </div>

      <div class="step-indicator">
        <div class="step-dot active" id="step1-dot"></div>
        <div class="step-dot" id="step2-dot"></div>
      </div>

      <form id="signupForm">
        <!-- STEP 1: EMAIL & CODE -->
        <div class="form-section active" id="step1">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <button type="button" class="btn btn-primary" onclick="generateCode()">
            Generate Access Code
          </button>

          <div class="alert" id="codeAlert"></div>

          <div class="code-display" id="codeDisplay" style="display: none;">
            <div class="code-display-label">Your Access Code</div>
            <div class="code-display-value" id="generatedCode"></div>
            <button type="button" class="code-copy-btn" onclick="copyCode()">📋 Copy Code</button>
            <div class="code-copied" id="codeCopied">✓ Copied to clipboard</div>
          </div>

          <div class="form-group" id="step1-submit" style="display: none;">
            <label for="codeConfirm">Enter Your Code Below</label>
            <input
              type="text"
              id="codeConfirm"
              name="codeConfirm"
              placeholder="ABC123XYZ"
              style="text-transform: uppercase;"
            />
          </div>

          <button
            type="button"
            class="btn btn-primary"
            id="continueBtn"
            onclick="continueToStep2()"
            style="display: none; margin-top: 12px;"
          >
            Continue →
          </button>
        </div>

        <!-- STEP 2: PROFILE -->
        <div class="form-section" id="step2">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your Name"
              required
            />
          </div>

          <div class="form-group">
            <label for="tiktokUsername">TikTok Username</label>
            <input
              type="text"
              id="tiktokUsername"
              name="tiktokUsername"
              placeholder="@yourhandle"
              required
            />
          </div>

          <div class="form-group">
            <label for="roomName">Room Name (Battle Title)</label>
            <input
              type="text"
              id="roomName"
              name="roomName"
              placeholder="My Battle Royale"
              required
            />
          </div>

          <div class="alert" id="profileAlert"></div>

          <button type="submit" class="btn btn-primary">
            🚀 Create Account & Start Trial
          </button>

          <button
            type="button"
            class="btn"
            onclick="backToStep1()"
            style="background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 12px;"
          >
            ← Back
          </button>
        </div>
      </form>

      <div class="login-link">
        Already have an account? <a href="/login">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let generatedAccessCode = null;
    let userEmail = null;

    function showAlert(elementId, message, type) {
      const alert = document.getElementById(elementId);
      alert.textContent = message;
      alert.className = `alert show ${type}`;
      setTimeout(() => alert.classList.remove('show'), 4000);
    }

    async function generateCode() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showAlert('codeAlert', '❌ Please enter your email', 'error');
        return;
      }

      try {
        const res = await fetch('/auth/generate-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to generate code');

        generatedAccessCode = data.code;
        userEmail = email;

        document.getElementById('generatedCode').textContent = generatedAccessCode;
        document.getElementById('codeDisplay').style.display = 'block';
        document.getElementById('step1-submit').style.display = 'block';
        document.getElementById('continueBtn').style.display = 'block';
        showAlert('codeAlert', '✓ Code generated! Enter it below to continue.', 'success');
      } catch (err) {
        showAlert('codeAlert', `❌ ${err.message}`, 'error');
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(generatedAccessCode).then(() => {
        const copied = document.getElementById('codeCopied');
        copied.classList.add('show');
        setTimeout(() => copied.classList.remove('show'), 2000);
      });
    }

    function continueToStep2() {
      const codeConfirm = document.getElementById('codeConfirm').value.trim().toUpperCase();
      if (!codeConfirm) {
        showAlert('codeAlert', '❌ Please enter your code', 'error');
        return;
      }

      if (codeConfirm !== generatedAccessCode) {
        showAlert('codeAlert', '❌ Code does not match', 'error');
        return;
      }

      currentStep = 2;
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('step1-dot').classList.remove('active');
      document.getElementById('step2-dot').classList.add('active');
    }

    function backToStep1() {
      currentStep = 1;
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('step2-dot').classList.remove('active');
      document.getElementById('step1-dot').classList.add('active');
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const tiktokUsername = document.getElementById('tiktokUsername').value.trim();
      const roomName = document.getElementById('roomName').value.trim();

      if (!name || !tiktokUsername || !roomName) {
        showAlert('profileAlert', '❌ Please fill in all fields', 'error');
        return;
      }

      try {
        const res = await fetch('/auth/create-account', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userEmail,
            code: generatedAccessCode,
            name,
            tiktokUsername,
            roomName,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create account');

        // Redirect to dashboard
        window.location.href = '/dashboard';
      } catch (err) {
        showAlert('profileAlert', `❌ ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
