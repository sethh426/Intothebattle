<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — IntoTheBattle</title>
  <meta name="description" content="Verify your email address to complete your IntoTheBattle creator account setup." />
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="IntoTheBattle" />
  <link rel="canonical" href="https://intothebattle.com/verify-email" />
  <link rel="icon" href="/intothebattlelogo_logo_only.svg" />
  <link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Sans:wght@400;500;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <script type="module" src="/js/clarity-loader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold:#f6c95b; --gold2:#ffdf8a; --ember:#ff6a3d; --red:#e83b5f; --green:#77f0a1; --text:#fff8e6; --muted:#a8afbf; --line:rgba(246,201,91,.24); --shadow:0 32px 90px rgba(0,0,0,.45); }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; font-family:'DM Sans',system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 18% 2%,rgba(246,201,91,.18),transparent 30%),radial-gradient(circle at 84% 18%,rgba(232,59,95,.13),transparent 30%),linear-gradient(180deg,#050608,#030406); overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(rgba(246,201,91,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(246,201,91,.035) 1px,transparent 1px); background-size:58px 58px; mask-image:radial-gradient(circle at top,black,transparent 72%); z-index:-1; }
    .card { width:min(560px,100%); padding:34px; border-radius:30px; border:1px solid var(--line); background:radial-gradient(circle at top left,rgba(246,201,91,.14),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025)); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.08); }
    .logo { width:70px; height:70px; border-radius:22px; overflow:hidden; border:1px solid rgba(246,201,91,.38); background:rgba(246,201,91,.08); margin-bottom:22px; box-shadow:0 0 36px rgba(246,201,91,.18); }
    .logo img { width:100%; height:auto; display:block; transform:scale(1.1); }
    .kicker { display:inline-flex; margin-bottom:14px; padding:8px 12px; border-radius:999px; border:1px solid rgba(246,201,91,.3); background:rgba(246,201,91,.08); color:var(--gold2); font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font-family:'Black Ops One','Rajdhani',sans-serif; text-transform:uppercase; font-size:clamp(32px,7vw,46px); line-height:1; margin-bottom:18px; }
    p { color:var(--muted); line-height:1.7; margin-bottom:18px; }
    .notice { border-radius:16px; padding:16px 18px; margin-bottom:18px; font-size:14px; line-height:1.5; }
    .error { background:rgba(232,59,95,.1); border:1px solid rgba(232,59,95,.25); color:#ffb1b8; }
    .success { background:rgba(119,240,161,.08); border:1px solid rgba(119,240,161,.25); color:#b8ffd0; }
    label { display:block; color:var(--muted); font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
    input { width:100%; min-height:52px; padding:13px 15px; border-radius:16px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.055); color:#fff; margin-bottom:16px; outline:none; font-size:15px; }
    input:focus { border-color:rgba(246,201,91,.55); box-shadow:0 0 0 4px rgba(246,201,91,.08); }
    button { width:100%; min-height:54px; border:0; border-radius:16px; color:#170c02; background:linear-gradient(135deg,var(--gold),#fff0b9 52%,var(--ember)); font-weight:900; cursor:pointer; transition:.16s ease; }
    button:hover { transform:translateY(-1px); filter:brightness(1.06); }
    .links { margin-top:18px; text-align:right; }
    .links a { color:var(--gold2); text-decoration:none; font-weight:900; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/intothebattlelogo_logo_only.svg" alt="IntoTheBattle logo" /></div>
    <div class="kicker">Account setup</div>
    <h1>Verify your email</h1>
    <div id="message" class="notice"></div>
    <div id="resendSection" style="display:none;">
      <p>If your verification link has expired, resend it using your email address.</p>
      <label for="resendEmail">Email address</label>
      <input id="resendEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      <button id="resendButton" type="button">Resend verification email</button>
    </div>
    <div class="links"><a href="/login">Back to login</a></div>
  </main>

  <script>
    const messageEl = document.getElementById('message');
    const resendSection = document.getElementById('resendSection');
    const resendEmailInput = document.getElementById('resendEmail');
    const resendButton = document.getElementById('resendButton');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    function showStatus(message, isError = false) {
      messageEl.textContent = message;
      messageEl.className = `notice ${isError ? 'error' : 'success'}`;
    }

    async function verifyEmail() {
      if (!token || !email) {
        showStatus('Verification details are missing. Enter your email below to resend a verification email.', true);
        if (email) resendEmailInput.value = email;
        resendSection.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/auth/user/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Verification failed');
        showStatus(json.message || 'Your email has been verified successfully.');
      } catch (err) {
        showStatus(err.message || 'Unable to verify your email.', true);
        resendSection.style.display = 'block';
        if (email) resendEmailInput.value = email;
      }
    }

    resendButton.addEventListener('click', async () => {
      const resendEmail = resendEmailInput.value.trim().toLowerCase();
      if (!resendEmail) {
        showStatus('Please enter your email address to resend the link.', true);
        return;
      }
      try {
        const res = await fetch('/auth/user/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resendEmail }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to resend verification email');
        showStatus(json.message || 'Verification email resent. Check your inbox.');
      } catch (err) {
        showStatus(err.message || 'Unable to resend verification email.', true);
      }
    });

    verifyEmail();
  </script>
</body>
</html>
