<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - Battle Royale LIVE</title>
  <style>
    :root { --bg:#050d1a; --surface:#0f1726; --border:#3751ff22; --text:#e8eef8; --muted:#8ca2d1; --accent:#4d96ff; --success:#6bcb77; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
    body{min-height:100vh;background:linear-gradient(180deg,#020611 0%,#070d22 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(520px,100%);background:rgba(10,18,36,.96);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35);}
    h1{font-size:1.9rem;margin-bottom:12px;}
    p{color:var(--muted);line-height:1.8;margin-bottom:18px;}
    .notice{border-radius:14px;padding:18px 20px;margin-bottom:20px;font-size:.95rem;}
    .success{background:rgba(107,203,119,.12);border:1px solid rgba(107,203,119,.18);color:#c6ffcf;}
    .error{background:rgba(255,85,95,.12);border:1px solid rgba(255,85,95,.18);color:#ffb1b1;}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px;}
    input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;margin-bottom:18px;}
    button{width:100%;padding:14px 16px;border:none;border-radius:14px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#6ab0ff);cursor:pointer;}
    .links{margin-top:18px;display:flex;justify-content:flex-end;}
    .links a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Verify your email</h1>
    <div id="message" class="notice"></div>
    <div id="resendSection" style="display:none;">
      <p>If your verification link has expired, you can resend it using your email address.</p>
      <label for="resendEmail">Email address</label>
      <input id="resendEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      <button id="resendButton" type="button">Resend verification email</button>
    </div>
    <div class="links"><a href="/login">Back to login</a></div>
  </div>
  <script>
    const messageEl = document.getElementById('message');
    const resendSection = document.getElementById('resendSection');
    const resendEmailInput = document.getElementById('resendEmail');
    const resendButton = document.getElementById('resendButton');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    function showStatus(message, isError = false) {
      messageEl.textContent = message;
      messageEl.className = `notice ${isError ? 'error' : 'success'}`;
    }

    async function verifyEmail() {
      if (!token || !email) {
        showStatus('Verification details are missing. Enter your email below to resend a verification email.', true);
        resendSection.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/auth/user/verify-email', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ email, token }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Verification failed');
        showStatus(json.message || 'Your email has been verified successfully.');
      } catch (err) {
        showStatus(err.message || 'Unable to verify your email.', true);
        resendSection.style.display = 'block';
        if (email) resendEmailInput.value = email;
      }
    }

    resendButton.addEventListener('click', async () => {
      const resendEmail = resendEmailInput.value.trim().toLowerCase();
      if (!resendEmail) {
        showStatus('Please enter your email address to resend the link.', true);
        return;
      }

      try {
        const res = await fetch('/auth/user/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ email: resendEmail }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to resend verification email');
        showStatus(json.message || 'Verification email resent. Check your inbox.');
      } catch (err) {
        showStatus(err.message || 'Unable to resend verification email.', true);
      }
    });

    verifyEmail();
  </script>
</body>
</html>
