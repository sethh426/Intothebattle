  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(8, 11, 17, 0.94);
      --line: rgba(255,255,255,0.12);
      --text: #f4f0e4;
      --muted: #9ba6b8;
      --gold: #f5c842;
      --cyan: #55e7ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; overflow: hidden; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .world-nav {
      z-index: 20;
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 9px clamp(12px, 2.5vw, 30px);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand, .world-actions, .world-title { display: flex; align-items: center; }
    .brand { min-width: 0; gap: 10px; color: var(--muted); }
    .brand:hover { color: var(--text); }
    .brand img { width: 38px; height: 38px; display: block; }
    .brand-copy { min-width: 0; display: grid; gap: 2px; }
    .brand-copy strong { overflow: hidden; text-overflow: ellipsis; font-size: 13px; white-space: nowrap; }
    .brand-copy span { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .world-title { justify-content: center; gap: 9px; white-space: nowrap; }
    .world-title h1 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .world-state { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px rgba(85,231,255,0.72); }
    .world-actions { justify-content: flex-end; gap: 8px; }
    .world-link {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .world-link:hover { color: var(--text); border-color: rgba(85,231,255,0.42); }
    .world-link.primary { border-color: rgba(245,200,66,0.42); background: var(--gold); color: #100d05; }
    .world-link.primary:hover { border-color: #fff1a8; background: #ffe173; color: #100d05; }
    .world-stage { position: relative; flex: 1; min-height: 0; }
    #aetheris-root { position: absolute; inset: 0; width: 100%; height: 100%; }
    @media (max-width: 760px) {
      .world-nav { min-height: 58px; grid-template-columns: auto 1fr auto; gap: 8px; padding: 8px 10px; }
      .brand-copy, .world-link.secondary { display: none; }
      .brand img { width: 36px; height: 36px; }
      .world-title { justify-content: flex-start; }
      .world-title h1 { font-size: 14px; }
      .world-link { min-height: 36px; padding: 0 10px; font-size: 11px; }
    }
  </style>
  <script type="module" src="/js/clarity-loader.js"></script>
  <script type="module" src="/js/growth-tracker.js"></script>

<body>
  <header class="world-nav">
    <a class="brand" href="/" aria-label="IntoTheBattle home">
      <img src="/intothebattlelogo_logo_only.svg" alt="" />
      <span class="brand-copy"><strong>IntoTheBattle</strong><span>Shared world</span></span>
    </a>
    <div class="world-title"><span class="world-state" aria-hidden="true"></span><h1>Aetheris World</h1></div>
    <nav class="world-actions" aria-label="Aetheris actions">
      <a class="world-link secondary" href="/how-to-play">How to play</a>
      <a class="world-link primary" href="/signup">Claim territory</a>
    </nav>
  </header>
  <main class="world-stage" aria-label="Interactive Aetheris world map">
    <div id="aetheris-root" data-mode="live" data-framing="wide"></div>
  </main>
  <script type="module" src="/aetheris-app/aetheris.js"></script>
  <link rel="stylesheet" href="/aetheris-app/aetheris.css" />
</body>
