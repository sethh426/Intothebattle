<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save New Password — IntoTheBattle</title>
  <meta name="description" content="Set a new password for your IntoTheBattle creator account." />
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="IntoTheBattle" />
  <link rel="canonical" href="https://intothebattle.com/reset-password" />
  <link rel="icon" href="/intothebattlelogo_logo_only.svg" />
  <link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg" />
  <script type="module" src="/js/clarity-loader.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--txt, #edf0fa);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .card {
      width: min(520px, 100%);
      padding: clamp(28px, 5vw, 40px);
      border-radius: var(--r-xl, 32px);
      border: 1px solid var(--b-gold, rgba(245,200,66,0.28));
      background:
        radial-gradient(circle at top left, rgba(245,200,66,0.12) 0%, transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.025) 100%);
      box-shadow: 0 32px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .logo-box {
      width: 64px; height: 64px;
      border-radius: var(--r-lg, 24px);
      border: 1px solid rgba(245,200,66,0.38);
      background: rgba(245,200,66,0.08);
      box-shadow: 0 0 32px rgba(245,200,66,0.18);
      overflow: hidden;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
    }
    .logo-box img { width: 100%; height: auto; display: block; transform: scale(1.1); }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      padding: 7px 13px;
      border-radius: var(--r-pill, 999px);
      border: 1px solid rgba(0,200,255,0.26);
      background: rgba(0,200,255,0.07);
      color: rgba(0,200,255,0.9);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Black Ops One', sans-serif;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--txt, #edf0fa);
    }

    p {
      color: var(--muted, #8896ae);
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .notice {
      border-radius: var(--r-sm, 12px);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.55;
    }
    .notice.error {
      background: rgba(255,42,74,0.08);
      border: 1px solid rgba(255,42,74,0.26);
      color: #ffb1b8;
    }
    .notice.success {
      background: rgba(57,216,117,0.07);
      border: 1px solid rgba(57,216,117,0.26);
      color: #b8ffd0;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      color: var(--muted, #8896ae);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 13px 15px;
      border-radius: var(--r-sm, 12px);
      border: 1px solid var(--border, rgba(255,255,255,0.09));
      background: rgba(255,255,255,0.055);
      color: var(--txt, #edf0fa);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    input:focus {
      border-color: rgba(245,200,66,0.55);
      box-shadow: 0 0 0 4px rgba(245,200,66,0.09);
    }
    input::placeholder { color: rgba(255,255,255,0.26); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: var(--r-md, 18px);
      color: #0a0700;
      background: var(--grad-primary, linear-gradient(135deg, #f5c842 0%, #ffe99a 42%, #ff7a3a 100%));
      box-shadow: 0 8px 28px rgba(245,200,66,0.26);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.07); }

    .card-footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted, #8896ae);
      font-size: 14px;
    }
    .card-footer a {
      color: var(--gold-l, #ffe99a);
      font-weight: 700;
    }
    .card-footer a:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="/css/site-refresh.css" />
</head>
<body>
  <main class="card">
    <div class="logo-box">
      <img src="/intothebattlelogo_logo_only.svg" alt="IntoTheBattle logo" width="64" height="64" />
    </div>
    <div class="kicker">Account recovery</div>
    <h1>Save new password</h1>
    <p>Enter the reset token from your email and choose a new password.</p>

    <div id="status" aria-live="polite"></div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label for="token">Reset token</label>
      <input id="token" type="text" autocomplete="off" placeholder="Token from your email" />
    </div>
    <div class="form-group">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="Choose a strong password" />
    </div>
    <button id="resetBtn" class="btn" type="button">Save new password</button>

    <div class="card-footer">
      <a href="/login">Back to login</a>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const token = params.get('token');
    if (email) document.getElementById('email').value = email;
    if (token) document.getElementById('token').value = token;

    document.getElementById('resetBtn').addEventListener('click', async () => {
      statusEl.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const token = document.getElementById('token').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      if (!email || !token || !newPassword) {
        statusEl.innerHTML = '<div class="notice error">Email, token, and new password are required.</div>';
        return;
      }
      try {
        const res = await fetch('/auth/user/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, token, newPassword }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to reset password');
        statusEl.innerHTML = `<div class="notice success">${json.message || 'Password reset successful.'}</div>`;
        setTimeout(() => { window.location.href = '/dashboard'; }, 1400);
      } catch (err) {
        statusEl.innerHTML = `<div class="notice error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
