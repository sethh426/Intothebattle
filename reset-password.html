<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Battle Royale LIVE</title>
    <meta name="description" content="Reset your IntoTheBattle password securely. Enter your reset token and new password to complete the account recovery process." />
    <meta name="keywords" content="password reset, new password, account recovery, IntoTheBattle security" />
    <meta name="robots" content="noindex, follow" />
    <meta name="author" content="IntoTheBattle" />
    <link rel="canonical" href="https://intothebattle.com/reset-password" />
  
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reset Your IntoTheBattle Password" />
    <meta property="og:description" content="Securely reset your IntoTheBattle password and regain account access." />
    <meta property="og:url" content="https://intothebattle.com/reset-password" />
    <meta property="og:image" content="https://intothebattle.com/intothebattle.png" />
    <meta property="og:site_name" content="IntoTheBattle" />
  
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reset Your IntoTheBattle Password" />
    <meta name="twitter:description" content="Securely reset your IntoTheBattle password and regain account access." />
    <meta name="twitter:image" content="https://intothebattle.com/intothebattle.png" />
  
    <link rel="icon" href="/intothebattle.png" />
    <link rel="apple-touch-icon" href="/intothebattle.png" />
  
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "IntoTheBattle Password Reset",
      "url": "https://intothebattle.com/reset-password",
      "description": "Securely reset your IntoTheBattle password using your reset token and new password.",
      "isPartOf": {
        "@type": "WebSite",
        "name": "IntoTheBattle",
        "url": "https://intothebattle.com/"
      }
    }
    </script>
  
  <style>
    :root { --bg:#050d1a; --surface:#0f1726; --border:#3751ff22; --text:#e8eef8; --muted:#8ca2d1; --accent:#4d96ff; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
    body{min-height:100vh;background:linear-gradient(180deg,#020611 0%,#070d22 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(520px,100%);background:rgba(10,18,36,.96);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35);}
    h1{font-size:2rem;margin-bottom:12px;}
    p{color:var(--muted);margin-bottom:24px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px;}
    input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;}
    button{width:100%;padding:14px 16px;border:none;border-radius:14px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#6ab0ff);cursor:pointer;}
    .notice{border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:.95rem;}
    .error{background:rgba(255,85,95,.12);border:1px solid rgba(255,85,95,.18);color:#ffb1b1;}
    .success{background:rgba(107,203,119,.12);border:1px solid rgba(107,203,119,.18);color:#c6ffcf;}
    .helper{margin-top:18px;color:var(--muted);font-size:.95rem;}
    .helper a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p>Enter the token from the email and your new password.</p>
    <div id="status"></div>
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" /></div>
    <div class="form-group"><label for="token">Reset token</label><input id="token" type="text" autocomplete="off" /></div>
    <div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" /></div>
    <button id="resetBtn" type="button">Save new password</button>
    <p class="helper"><a href="/login">Back to login</a></p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const token = params.get('token');
    if (email) document.getElementById('email').value = email;
    if (token) document.getElementById('token').value = token;

    document.getElementById('resetBtn').addEventListener('click', async () => {
      statusEl.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const token = document.getElementById('token').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      if (!email || !token || !newPassword) {
        statusEl.innerHTML = '<div class="notice error">Email, token, and new password are required.</div>';
        return;
      }
      try {
        const res = await fetch('/auth/user/reset-password', {
          method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
          body: JSON.stringify({ email, token, newPassword }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unable to reset password');
        statusEl.innerHTML = `<div class="notice success">${json.message || 'Password reset successful.'}</div>`;
        setTimeout(() => window.location.href = '/dashboard', 1400);
      } catch (err) {
        statusEl.innerHTML = `<div class="notice error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
