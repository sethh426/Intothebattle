version: '3.8'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - API_KEY=test
      - JWT_SECRET=local_dev_change_me
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:example@postgres:5432/tiktokbr
      - ENABLE_ROOM_SCOPED=true
      - DISK_PATH=/usr/src/app/data
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/usr/src/app
      - ./data:/usr/src/app/data

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=example
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - app

volumes:
  pgdata:
