<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IntoTheBattle Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: 'Exo 2', 'Segoe UI', sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    #game-container {
      position: relative;
      width: min(90vw, 1920px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 18px;
      background: #02040a;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        0 0 48px rgba(140, 80, 255, 0.18),
        0 0 120px rgba(80, 40, 180, 0.08);
    }
    #status-badge {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 5px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.72);
      color: #ffd84f;
      font: 800 11px 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }
    #status-badge.connected { color: #7aff87; border-color: rgba(122, 255, 135, 0.24); }
    #status-badge.disconnected { color: #ff8866; border-color: rgba(255, 136, 102, 0.24); }
    .overlay-label {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(122, 252, 255, 0.24);
      background: rgba(0, 0, 0, 0.54);
      color: #7afcff;
      font: 800 11px 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="overlay-label">IntoTheBattle overlay</div>
  <div id="game-container"></div>
  <div id="status-badge" class="demo">Demo mode</div>

  <script src="/js/overlay-scene.js"></script>
  <script src="/js/socket-overlay-handler.js"></script>
  <script>
    const config = {
      type: Phaser.CANVAS,
      parent: 'game-container',
      width: 1280,
      height: 720,
      backgroundColor: '#02040a',
      scene: OverlayScene,
      physics: { default: 'arcade', arcade: { debug: false } },
      render: { pixelArt: false, antialias: true },
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
    };

    const game = new Phaser.Game(config);
    window.overlayGame = game;

    function startSocketOverlayWhenReady() {
      const scene = game.scene.getScene('OverlayScene') || game.scene.scenes[0];
      if (scene && scene.isReady) {
        initSocketOverlay(game);
        return;
      }
      window.setTimeout(startSocketOverlayWhenReady, 50);
    }

    startSocketOverlayWhenReady();
  </script>
</body>
</html>
