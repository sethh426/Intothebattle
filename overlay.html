<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PvP Battle Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: 'Arial', sans-serif; background: #000; }
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
.panel { position: absolute; background: rgba(8,12,24,0.85); border: 1px solid rgba(100,200,255,0.25); border-radius: 8px; padding: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); backdrop-filter: blur(6px); font-size: 12px; color: #fff; }
.controls { top: 12px; right: 12px; width: 220px; pointer-events: auto; }
.controls-title { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #64c8ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px; }
.controls-title button { background: rgba(255,255,255,0.08); border: 1px solid rgba(100,200,255,0.25); color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
.controls.hidden { opacity: 0.15; }
.control-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin: 10px 0; font-size: 12px; }
.control-row span { color: #e1f7ff; }
.control-row input[type="range"] { width: 100%; }
.dmg-number { position: absolute; font-size: 32px; font-weight: 900; color: #ff3333; text-shadow: 0 0 12px rgba(255,51,51,0.8), 2px 2px 6px rgba(0,0,0,0.95); pointer-events: none; animation: dmgFloat 0.7s ease-out forwards; z-index: 30; }
@keyframes dmgFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(0.5)} }
.dmg-number.kill { color: #ffd93d; font-size: 40px; text-shadow: 0 0 16px rgba(255,217,61,0.9), 2px 2px 6px rgba(0,0,0,0.95); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <div class="panel controls" id="layoutControls">
    <div class="controls-title">
      <span>⚙️ Layout</span>
      <button id="toggleControls">Hide</button>
    </div>
    <label class="control-row">
      <span>Column Gap</span>
      <input id="gapXControl" type="range" min="0" max="220" step="10" value="10" />
      <span id="gapXValue">10</span>
    </label>
    <label class="control-row">
      <span>Horizontal Offset</span>
      <input id="offsetXControl" type="range" min="-500" max="500" step="10" value="0" />
      <span id="offsetXValue">0</span>
    </label>
    <label class="control-row">
      <span>Vertical Position</span>
      <input id="offsetYControl" type="range" min="-500" max="500" step="10" value="0" />
      <span id="offsetYValue">0</span>
    </label>
    <label class="control-row">
      <span>Card Scale</span>
      <input id="layoutScaleControl" type="range" min="40" max="150" step="5" value="100" />
      <span id="layoutScaleValue">100%</span>
    </label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
let players={}, audioConfig={}, soundEnabled=true, laserColor='#7afcff', shotType='beam', shotSpeed=1;
const lastPlayerPositions={}, audioCache={}, HORDE_ID='__horde__';
let backgroundImg=null;

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function setupCanvas(){
  const dpr=window.devicePixelRatio||1;
  canvas.width=window.innerWidth*dpr; canvas.height=window.innerHeight*dpr;
  canvas.style.width=window.innerWidth+'px'; canvas.style.height=window.innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
setupCanvas();
window.addEventListener('resize',setupCanvas);

const gapXControl=document.getElementById('gapXControl');
const offsetXControl=document.getElementById('offsetXControl');
const offsetYControl=document.getElementById('offsetYControl');
const layoutScaleControl=document.getElementById('layoutScaleControl');
const gapXValue=document.getElementById('gapXValue');
const offsetXValue=document.getElementById('offsetXValue');
const offsetYValue=document.getElementById('offsetYValue');
const layoutScaleValue=document.getElementById('layoutScaleValue');
const toggleControls=document.getElementById('toggleControls');
const layoutControls=document.getElementById('layoutControls');

let layoutGapX=Number(gapXControl.value);
let offsetX=Number(offsetXControl.value);
let offsetY=Number(offsetYControl.value);
let layoutScale=1.0;

function syncLabels(){
  gapXValue.textContent=layoutGapX; offsetXValue.textContent=offsetX;
  offsetYValue.textContent=offsetY; layoutScaleValue.textContent=Math.round(layoutScale*100)+'%';
}
syncLabels();
gapXControl.addEventListener('input',()=>{layoutGapX=Number(gapXControl.value);syncLabels();});
offsetXControl.addEventListener('input',()=>{offsetX=Number(offsetXControl.value);syncLabels();});
offsetYControl.addEventListener('input',()=>{offsetY=Number(offsetYControl.value);syncLabels();});
layoutScaleControl.addEventListener('input',()=>{layoutScale=Number(layoutScaleControl.value)/100;syncLabels();});
toggleControls.addEventListener('click',()=>{
  const h=layoutControls.classList.toggle('hidden');
  toggleControls.textContent=h?'Show':'Hide';
});

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{if(audioCtx.state==='suspended')audioCtx.resume();},{once:true});

function getAudio(f){
  if(!audioCache[f]){audioCache[f]=new Audio(`/audio/${encodeURIComponent(f)}`);audioCache[f].preload='auto';}
  return audioCache[f];
}
function preloadAudioConfig(cfg){for(const f of Object.values(cfg)){if(f)getAudio(f);}}
function playSound(event){
  if(!soundEnabled)return;
  const f=audioConfig[event]; if(!f)return;
  try{const a=getAudio(f);a.currentTime=0;a.play().catch(()=>{});}catch(_){}
}
function parseHexColor(v){
  if(typeof v!=='string')return null;
  const h=v.trim().replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h))return null;
  return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}
function updateLaserColor(c){if(typeof c==='string'&&parseHexColor(c))laserColor='#'+c.replace('#','');}

function getTopPlayers(count=5){
  return Object.values(players)
    .filter(p=>p.alive&&p.uniqueId!==HORDE_ID)
    .sort((a,b)=>{
      const aF=a.forceSpawn?1:0,bF=b.forceSpawn?1:0;
      if(aF!==bF)return bF-aF;
      const aH=a.hp??(a.maxHp||0),bH=b.hp??(b.maxHp||0);
      return bH-aH||(b.maxHp||0)-(a.maxHp||0);
    }).slice(0,count);
}
function getHordePlayer(){
  const ids=new Set(getTopPlayers(5).map(p=>p.uniqueId));
  const rest=Object.values(players).filter(p=>p.alive&&p.uniqueId!==HORDE_ID&&!ids.has(p.uniqueId));
  if(!rest.length)return null;
  return{uniqueId:HORDE_ID,nickname:'THE HORDE',hordeCount:rest.length,
    hp:rest.reduce((s,p)=>s+(p.hp||0),0),maxHp:rest.reduce((s,p)=>s+(p.maxHp||100),0),alive:true,isHorde:true};
}

function getCardDims(){
  const emojiSize=Math.round(62*layoutScale);
  const barH=Math.round(20*layoutScale);
  const nameH=Math.round(16*layoutScale);
  const hpH=Math.round(13*layoutScale);
  const cardH=emojiSize+10+barH+8+nameH+5+hpH+8;
  return{emojiSize,barH,nameH,hpH,cardH};
}

function getBandY(){
  const H=canvas.clientHeight;
  const{cardH}=getCardDims();
  const bandPad=18;
  const centerY=H*0.50+offsetY;
  return{
    centerY,
    topY:centerY-cardH/2-bandPad,
    bottomY:centerY+cardH/2+bandPad
  };
}

function getPlayerPos(player){
  if(!player)return{x:canvas.clientWidth/2+offsetX,y:getBandY().centerY};
  const sorted=getTopPlayers(5);
  const idx=sorted.findIndex(p=>p.uniqueId===player.uniqueId);
  if(idx===-1)return{x:canvas.clientWidth/2+offsetX,y:getBandY().centerY};
  const W=canvas.clientWidth;
  const pad=20, cols=5;
  const playW=Math.max(0,W-pad*2);
  const cellW=Math.max(80,(playW-layoutGapX*(cols-1))/cols);
  const gridW=cols*cellW+(cols-1)*layoutGapX;
  const startX=pad+Math.max(0,(playW-gridW)/2)+offsetX;
  return{x:startX+idx*(cellW+layoutGapX)+cellW/2, y:getBandY().centerY, cellW};
}

function getHordePos(){
  const{bottomY}=getBandY();
  return{x:canvas.clientWidth/2+offsetX, y:bottomY+16};
}

function resolveParticipant(uid){return getTopPlayers(5).some(p=>p.uniqueId===uid)?uid:HORDE_ID;}
function getAnimationPos(uid){
  if(uid===HORDE_ID)return lastPlayerPositions[HORDE_ID]||getHordePos();
  return getTopPlayers(5).some(p=>p.uniqueId===uid)
    ?(lastPlayerPositions[uid]||getPlayerPos(players[uid]))
    :(lastPlayerPositions[HORDE_ID]||getHordePos());
}

// ── Rounded rect helper ───────────────────────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── Impact effects ────────────────────────────────────────────────────────────
const impacts=[];
class ImpactEffect{
  constructor(x,y,isKill,isSpecial){
    this.x=x;this.y=y;this.isKill=isKill;this.isSpecial=isSpecial;
    this.startTime=Date.now();this.duration=isKill?900:600;this.progress=0;
    const cnt=isKill?22:isSpecial?16:10;
    const bc=isKill?[255,217,61]:isSpecial?[255,100,100]:[100,215,255];
    this.particles=Array.from({length:cnt},()=>{
      const a=Math.random()*Math.PI*2,s=1.5+Math.random()*(isKill?5:3.5);
      return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*(isKill?6:4),color:bc,life:0.6+Math.random()*0.4};
    });
    this.rings=isKill?3:isSpecial?2:1;
  }
  update(){
    this.progress=Math.min(1,(Date.now()-this.startTime)/this.duration);
    this.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.88;p.vy*=0.88;});
    return this.progress<1;
  }
  draw(ctx){
    const t=this.progress,alpha=1-t;
    const bc=this.isKill?'255,217,61':this.isSpecial?'255,100,100':'100,215,255';
    const cc=this.isKill?'255,255,200':this.isSpecial?'255,220,120':'180,240,255';
    for(let r=0;r<this.rings;r++){
      const delay=r*0.15,rt=Math.max(0,Math.min(1,(t-delay)/(1-delay)));
      if(rt<=0)continue;
      const rad=(this.isKill?60:40)*rt+r*12,ra=(1-rt)*(this.isKill?0.9:0.7);
      ctx.strokeStyle=`rgba(${bc},${ra})`;ctx.lineWidth=this.isKill?3:2;
      ctx.beginPath();ctx.arc(this.x,this.y,rad,0,Math.PI*2);ctx.stroke();
      if(r===0&&rt<0.25){ctx.fillStyle=`rgba(${cc},${(0.25-rt)*2})`;ctx.beginPath();ctx.arc(this.x,this.y,rad*0.5,0,Math.PI*2);ctx.fill();}
    }
    this.particles.forEach(p=>{
      const pA=alpha*p.life;
      ctx.shadowColor=`rgba(${p.color.join(',')},${pA*0.8})`;ctx.shadowBlur=8;
      ctx.fillStyle=`rgba(${p.color.join(',')},${pA})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-t*0.5),0,Math.PI*2);ctx.fill();
    });
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    if(t<0.18){
      const fa=(0.18-t)/0.18,fr=this.isKill?36:22;
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,fr);
      g.addColorStop(0,`rgba(${cc},${fa})`);g.addColorStop(0.5,`rgba(${bc},${fa*0.5})`);g.addColorStop(1,`rgba(${bc},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,fr,0,Math.PI*2);ctx.fill();
    }
    if(this.isKill&&t<0.5){
      const la=(0.5-t)/0.5,ll=28+30*t;
      ctx.strokeStyle=`rgba(255,255,180,${la*0.9})`;ctx.lineWidth=2;
      for(let i=0;i<8;i++){const a=(Math.PI*2/8)*i+t*0.5;ctx.beginPath();ctx.moveTo(this.x+Math.cos(a)*8,this.y+Math.sin(a)*8);ctx.lineTo(this.x+Math.cos(a)*ll,this.y+Math.sin(a)*ll);ctx.stroke();}
    }
  }
}

// ── Attack animation ──────────────────────────────────────────────────────────
class Attack{
  constructor(fx,fy,tx,ty,type='beam',speed=1,isKill=false,isSpecial=false){
    this.fromX=fx;this.fromY=fy;this.toX=tx;this.toY=ty;
    this.shotType=type;this.shotSpeed=Math.max(0.6,Math.min(2.2,speed));
    this.isKill=isKill;this.isSpecial=isSpecial;
    this.startTime=Date.now();this.duration=700/this.shotSpeed;
    this.progress=0;this.impactSpawned=false;
  }
  update(){
    this.progress=Math.min(1,(Date.now()-this.startTime)/this.duration);
    if(this.progress>=1&&!this.impactSpawned){this.impactSpawned=true;impacts.push(new ImpactEffect(this.toX,this.toY,this.isKill,this.isSpecial));}
    return this.progress<1;
  }
  draw(ctx){
    const alpha=1-this.progress,easeOut=1-Math.pow(1-this.progress,2);
    const cx=this.fromX+(this.toX-this.fromX)*easeOut, cy=this.fromY+(this.toY-this.fromY)*easeOut;
    const oc=this.isSpecial?'rgba(255,213,107,0.35)':'rgba(122,252,255,0.35)';
    const ic=this.isSpecial?'rgba(255,242,190,0.95)':'rgba(200,255,255,0.96)';
    const sc=this.isSpecial?'rgba(255,140,77,':'rgba(122,252,255,';
    const wa=Math.max(0.18,alpha*0.9),ma=Math.max(0.3,alpha*0.7);
    const px=this.toX-this.fromX,py=this.toY-this.fromY;
    const pl=Math.hypot(px,py),ang=Math.atan2(py,px);
    ctx.lineCap='round';ctx.lineJoin='round';
    if(this.shotType==='pulse'){
      const rr=12+this.progress*50;
      ctx.strokeStyle=oc;ctx.lineWidth=10;ctx.beginPath();ctx.arc(this.fromX,this.fromY,rr,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${alpha*0.6})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(this.fromX,this.fromY,rr+10,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=ic;ctx.beginPath();ctx.arc(this.fromX,this.fromY,10+(1-alpha)*4,0,Math.PI*2);ctx.fill();
    }else if(this.shotType==='waves'){
      ctx.strokeStyle=`${sc}${wa})`;ctx.lineWidth=5;ctx.beginPath();
      for(let i=0;i<=5;i++){const t=i/5,ppx=this.fromX+px*t,ppy=this.fromY+py*t,off=Math.sin((t+this.progress)*Math.PI*4)*16*(1-t);const ox=ppx+Math.cos(ang+Math.PI/2)*off,oy=ppy+Math.sin(ang+Math.PI/2)*off;i===0?ctx.moveTo(ox,oy):ctx.lineTo(ox,oy);}
      ctx.stroke();ctx.fillStyle=ic;ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fill();
    }else if(this.shotType==='burst'){
      for(let i=0;i<4;i++){const t=(this.progress+i/4*0.4)%1,bx=this.fromX+px*t,by=this.fromY+py*t,r=6+4*Math.sin((t+i)*Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${alpha*0.8})`;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();}
      ctx.strokeStyle=`${sc}${wa})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(this.fromX,this.fromY);ctx.lineTo(cx,cy);ctx.stroke();
    }else if(this.shotType==='ripple'){
      const rr=12+this.progress*pl*0.45;
      ctx.strokeStyle=oc;ctx.lineWidth=6;ctx.beginPath();ctx.arc(this.toX,this.toY,rr,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=oc;ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.toX,this.toY,rr+18,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=`rgba(255,255,255,${ma})`;ctx.beginPath();ctx.arc(this.toX,this.toY,14+(1-this.progress)*8,0,Math.PI*2);ctx.fill();
    }else{
      ctx.strokeStyle=`${sc}${alpha*0.22})`;ctx.lineWidth=this.isSpecial?26:18;ctx.beginPath();ctx.moveTo(this.fromX,this.fromY);ctx.lineTo(this.toX,this.toY);ctx.stroke();
      ctx.strokeStyle=`${sc}${ma})`;ctx.lineWidth=this.isSpecial?10:6;ctx.beginPath();ctx.moveTo(this.fromX,this.fromY);ctx.lineTo(this.toX,this.toY);ctx.stroke();
      ctx.strokeStyle=ic;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(this.fromX,this.fromY);ctx.lineTo(this.toX,this.toY);ctx.stroke();
      ctx.fillStyle=ic;ctx.shadowColor=`${sc}${alpha*0.5})`;ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(cx,cy,this.isSpecial?12:8,0,Math.PI*2);ctx.fill();
      ctx.shadowColor='transparent';ctx.shadowBlur=0;
    }
    if(this.shotType!=='ripple'){ctx.strokeStyle=`rgba(255,255,255,${alpha*0.35})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.toX,this.toY,12+this.progress*22,0,Math.PI*2);ctx.stroke();}
  }
}
const attacks=[];

// ── Neon band borders ─────────────────────────────────────────────────────────
function drawColumnBorders(posCache,topY,bottomY){
  if(!posCache.length)return;
  let hw=80;
  if(posCache.length>1)hw=(posCache[1].x-posCache[0].x)/2;
  const fx=posCache[0].x-hw, lx=posCache[posCache.length-1].x+hw;
  const bxs=[fx];
  for(let i=0;i<posCache.length-1;i++)bxs.push((posCache[i].x+posCache[i+1].x)/2);
  bxs.push(lx);
  bxs.forEach(bx=>{
    const g1=ctx.createLinearGradient(bx,topY,bx,bottomY);
    g1.addColorStop(0,'rgba(100,200,255,0)');g1.addColorStop(0.06,'rgba(100,200,255,0.10)');
    g1.addColorStop(0.5,'rgba(100,200,255,0.14)');g1.addColorStop(0.94,'rgba(100,200,255,0.10)');g1.addColorStop(1,'rgba(100,200,255,0)');
    ctx.strokeStyle=g1;ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(bx,topY);ctx.lineTo(bx,bottomY);ctx.stroke();
    const g2=ctx.createLinearGradient(bx,topY,bx,bottomY);
    g2.addColorStop(0,'rgba(100,200,255,0)');g2.addColorStop(0.06,'rgba(100,200,255,0.7)');
    g2.addColorStop(0.5,'rgba(160,220,255,0.9)');g2.addColorStop(0.94,'rgba(100,200,255,0.7)');g2.addColorStop(1,'rgba(100,200,255,0)');
    ctx.strokeStyle=g2;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx,topY);ctx.lineTo(bx,bottomY);ctx.stroke();
  });
  function hLine(y,c1,c2,lw){
    const g=ctx.createLinearGradient(fx,0,lx,0);
    g.addColorStop(0,c1);g.addColorStop(0.05,c2);g.addColorStop(0.95,c2);g.addColorStop(1,c1);
    ctx.strokeStyle=g;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(fx,y);ctx.lineTo(lx,y);ctx.stroke();
  }
  hLine(topY,'rgba(100,200,255,0)','rgba(160,220,255,0.8)',1.5);
  hLine(topY,'rgba(100,200,255,0)','rgba(100,200,255,0.13)',14);
  hLine(bottomY,'rgba(255,80,80,0)','rgba(255,120,120,0.75)',1.5);
  hLine(bottomY,'rgba(255,80,80,0)','rgba(255,80,80,0.11)',14);
  for(let i=0;i<posCache.length;i++){
    const x1=i===0?fx:(posCache[i-1].x+posCache[i].x)/2;
    const x2=i===posCache.length-1?lx:(posCache[i].x+posCache[i+1].x)/2;
    ctx.fillStyle=i%2===1?'rgba(100,200,255,0.025)':'rgba(80,160,220,0.012)';
    ctx.fillRect(x1,topY,x2-x1,bottomY-topY);
  }
}

// ── Socket ────────────────────────────────────────────────────────────────────
const socket=io({transports:['websocket','polling']});
socket.on('connect',()=>socket.emit('register',{type:'overlay'}));
socket.on('gameState',(s)=>{players=s||{};});
socket.on('audioConfig',(c)=>{audioConfig=c||{};preloadAudioConfig(audioConfig);});
socket.on('overlaySettings',(s)=>{
  if(!s)return;
  if(typeof s.shotType==='string'&&s.shotType)shotType=s.shotType;
  if(typeof s.shotSpeed==='number'&&s.shotSpeed>0)shotSpeed=s.shotSpeed;
  if(typeof s.laserColor==='string')updateLaserColor(s.laserColor);
});
socket.on('laserColor',(c)=>updateLaserColor(c));
socket.on('soundEvent',({event})=>playSound(event));
socket.on('soundSettings',({enabled})=>{soundEnabled=!!enabled;});
socket.on('devSound',({type})=>{const m={laser:'attack',heal:'heal',special:'kill'};playSound(m[type]||type);});
socket.on('forceReload',()=>location.reload());
socket.on('backgroundChanged',({filename})=>{
  if(!filename){backgroundImg=null;return;}
  const img=new Image();img.onload=()=>{backgroundImg=img;};img.src=`/background/${filename}?v=${Date.now()}`;
});
socket.on('heal',({uniqueId})=>{if(players[uniqueId])playSound('heal');});
socket.on('giftEffect',()=>{});
socket.on('attack',({attacker,target,damage,killed,special})=>{
  const eA=resolveParticipant(attacker),eT=resolveParticipant(target);
  const fp=getAnimationPos(eA),tp=getAnimationPos(eT);
  if(players[attacker]&&players[target]){
    attacks.push(new Attack(fp.x,fp.y,tp.x,tp.y,shotType,shotSpeed,killed,special));
    playSound('attack');
    players[target].hp=Math.max(0,(players[target].hp||0)-damage);
    if(killed)players[target].alive=false;
    showDmg(tp.x,tp.y,damage,killed);
  }
});
socket.on('giftAttack',({attacker,target,damage,killed})=>{
  const eA=resolveParticipant(attacker),eT=resolveParticipant(target);
  const fp=getAnimationPos(eA),tp=getAnimationPos(eT);
  if(players[attacker]&&players[target]){
    attacks.push(new Attack(fp.x,fp.y,tp.x,tp.y,shotType,shotSpeed,killed,true));
    playSound('gift');
    players[target].hp=Math.max(0,(players[target].hp||0)-damage);
    if(killed||players[target].hp===0)players[target].alive=false;
    showDmg(tp.x,tp.y,damage,killed);
  }
});

function showDmg(x,y,dmg,isKill){
  const el=document.createElement('div');
  el.className=`dmg-number ${isKill?'kill':''}`;
  el.textContent=isKill?'💀 KILL!':`-${dmg}`;
  el.style.left=(x-20)+'px';el.style.top=(y-30)+'px';
  document.querySelector('.ui').appendChild(el);
  setTimeout(()=>el.remove(),700);
}

function drawBackground(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!backgroundImg){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0d1117');g.addColorStop(0.5,'#111827');g.addColorStop(1,'#0d1117');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);return;
  }
  const s=Math.max(w/backgroundImg.width,h/backgroundImg.height);
  const dw=backgroundImg.width*s,dh=backgroundImg.height*s;
  ctx.drawImage(backgroundImg,(w-dw)/2,(h-dh)/2,dw,dh);
}

// ── drawPlayers ───────────────────────────────────────────────────────────────
function drawPlayers(){
  const sorted=getTopPlayers(5);
  const W=canvas.clientWidth;
  const {emojiSize,barH,nameH,hpH,cardH}=getCardDims();
  const {centerY,topY,bottomY}=getBandY();

  // Horizontal layout
  const pad=20,cols=5;
  const playW=Math.max(0,W-pad*2);
  const cellW=Math.max(80,(playW-layoutGapX*(cols-1))/cols);
  const gridW=cols*cellW+(cols-1)*layoutGapX;
  const startX=pad+Math.max(0,(playW-gridW)/2)+offsetX;

  // Build position cache
  const posCache=[];
  sorted.forEach((player,idx)=>{
    const cx=startX+idx*(cellW+layoutGapX)+cellW/2;
    posCache.push({x:cx,y:centerY});
    if(player.uniqueId)lastPlayerPositions[player.uniqueId]={x:cx,y:centerY};
  });

  // Neon band borders
  if(posCache.length>0)drawColumnBorders(posCache,topY,bottomY);

  // ── Each player card ────────────────────────────────────────────────────────
  sorted.forEach((player,idx)=>{
    const cx=posCache[idx].x;
    const hpPct=Math.max(0,Math.min(1,(player.hp||100)/(player.maxHp||100)));
    const hpVal=Math.round(player.hp||100);
    const maxHp=player.maxHp||100;
    const name=(player.nickname||player.uniqueId||'Player').slice(0,14);
    const bw=Math.min(cellW-10,Math.round(150*layoutScale));

    // Card top-down Y positions
    const emojiY=centerY-cardH/2;
    const barY=emojiY+emojiSize+10;
    const nameY=barY+barH+8;
    const hpTxtY=nameY+nameH+3;

    // 1 — Emoji at top
    ctx.font=`${emojiSize}px Arial`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(player.iconEmoji||'💎',cx,emojiY);

    // 2 — HP bar background
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,cx-bw/2,barY,bw,barH,5);ctx.fill();
    ctx.strokeStyle='rgba(100,200,255,0.45)';ctx.lineWidth=1.5;
    roundRect(ctx,cx-bw/2,barY,bw,barH,5);ctx.stroke();

    // 2a — HP bar fill
    const fillColor=hpPct>0.6?'#2ecc71':hpPct>0.3?'#f39c12':'#e74c3c';
    const fillW=Math.max(0,(bw-4)*hpPct);
    if(fillW>0){
      ctx.fillStyle=fillColor;
      roundRect(ctx,cx-bw/2+2,barY+2,fillW,barH-4,4);ctx.fill();
      // Shine
      ctx.fillStyle='rgba(255,255,255,0.20)';
      roundRect(ctx,cx-bw/2+2,barY+2,fillW,(barH-4)*0.45,4);ctx.fill();
    }

    // 3 — Player name
    const nfs=Math.max(11,Math.round(14*layoutScale));
    ctx.font=`bold ${nfs}px Arial`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.strokeStyle='rgba(0,0,0,0.95)';ctx.lineWidth=3;ctx.strokeText(name,cx,nameY);
    ctx.fillStyle='#ffffff';ctx.fillText(name,cx,nameY);

    // 4 — HP numbers
    const hfs=Math.max(9,Math.round(11*layoutScale));
    ctx.font=`${hfs}px Arial`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=2;ctx.strokeText(`${hpVal}/${maxHp}`,cx,hpTxtY);
    ctx.fillStyle='#99ccff';ctx.fillText(`${hpVal}/${maxHp}`,cx,hpTxtY);
  });

  // ── Horde — sits just below the player band ─────────────────────────────────
  const horde=getHordePlayer();
  if(horde){
    const hp=getHordePos();
    const hx=hp.x, hy=hp.y;
    lastPlayerPositions[HORDE_ID]={x:hx,y:hy};

    const hpPct=Math.max(0,Math.min(1,horde.hp/(horde.maxHp||1)));
    const hEsz=Math.round(64*layoutScale);
    const hBarW=Math.min(240,Math.round(220*layoutScale));
    const hBarH=Math.round(22*layoutScale);
    const pulse=0.5+0.5*Math.sin(Date.now()/400);

    // Label above
    ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText('⚔ THE HORDE',hx,hy-4);
    ctx.fillStyle='#ff6666';ctx.fillText('⚔ THE HORDE',hx,hy-4);

    ctx.font='bold 11px Arial';
    ctx.strokeText(`${horde.hordeCount} players`,hx,hy+10);
    ctx.fillStyle='#ffaaaa';ctx.fillText(`${horde.hordeCount} players`,hx,hy+10);

    // Skull
    ctx.font=`${hEsz}px Arial`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('💀',hx,hy+14);

    // Pulse rings around skull
    ctx.strokeStyle=`rgba(255,80,80,${0.18+pulse*0.22})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hx,hy+14+hEsz*0.5,hEsz*0.6+16,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=`rgba(255,60,60,${0.07+pulse*0.10})`;ctx.lineWidth=10;
    ctx.beginPath();ctx.arc(hx,hy+14+hEsz*0.5,hEsz*0.6+28,0,Math.PI*2);ctx.stroke();

    // HP bar
    const hbY=hy+14+hEsz+8;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,hx-hBarW/2,hbY,hBarW,hBarH,5);ctx.fill();
    ctx.strokeStyle='rgba(255,80,80,0.55)';ctx.lineWidth=1.5;
    roundRect(ctx,hx-hBarW/2,hbY,hBarW,hBarH,5);ctx.stroke();

    const hFillW=Math.max(0,(hBarW-4)*hpPct);
    if(hFillW>0){
      ctx.fillStyle=`rgb(255,${Math.floor(40+hpPct*100)},0)`;
      roundRect(ctx,hx-hBarW/2+2,hbY+2,hFillW,hBarH-4,4);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.15)';
      roundRect(ctx,hx-hBarW/2+2,hbY+2,hFillW,(hBarH-4)*0.4,4);ctx.fill();
    }

    // HP text
    ctx.font=`bold 12px Arial`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=2;
    ctx.strokeText(`${Math.round(horde.hp)}/${Math.round(horde.maxHp)}`,hx,hbY+hBarH+4);
    ctx.fillStyle='#ffcccc';
    ctx.fillText(`${Math.round(horde.hp)}/${Math.round(horde.maxHp)}`,hx,hbY+hBarH+4);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function animate(){
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  drawBackground();
  drawPlayers();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=attacks.length-1;i>=0;i--){if(!attacks[i].update())attacks.splice(i,1);else attacks[i].draw(ctx);}
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=impacts.length-1;i>=0;i--){if(!impacts[i].update())impacts.splice(i,1);else impacts[i].draw(ctx);}
  ctx.restore();
  requestAnimationFrame(animate);
}

animate();
if(!location.search.includes('v=')){location.replace(location.pathname+'?v='+Date.now());}
</script>
