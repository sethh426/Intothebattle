<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Battle Royale Overlay · Cinematic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;700;900&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: ‘Exo 2’, ‘Segoe UI’, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }

#overlay-container {
position: relative;
width: min(90vw, 1920px);
aspect-ratio: 16 / 9;
background: rgba(4, 8, 18, 0.92);
border: 1px solid rgba(180, 120, 255, 0.35);
border-radius: 18px;
box-shadow:
inset 0 0 0 1px rgba(255,255,255,0.06),
0 0 48px rgba(140,80,255,0.18),
0 0 120px rgba(80,40,180,0.08);
overflow: hidden;
}
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ── Layout panel ── */
.panel-wrapper {
position: fixed; top: 16px; right: 0;
display: flex; align-items: flex-start;
pointer-events: auto; z-index: 30;
}
.panel-tab {
width: 28px;
background: rgba(6,10,20,0.88);
border: 1px solid rgba(100,200,255,0.2);
border-right: none;
border-radius: 8px 0 0 8px;
padding: 10px 0;
cursor: pointer;
display: flex; flex-direction: column; align-items: center; gap: 6px;
color: #8fd8ff;
font-size: 10px; font-weight: 800; letter-spacing: 1px;
text-transform: uppercase; writing-mode: vertical-rl; text-orientation: mixed;
user-select: none; transition: background 0.2s;
font-family: ‘Rajdhani’, sans-serif;
}
.panel-tab:hover { background: rgba(20,40,70,0.95); }
.panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }

.layout-panel {
width: 240px; padding: 14px 16px;
border-radius: 0 0 0 16px;
background: rgba(6,10,20,0.94);
backdrop-filter: blur(16px);
border: 1px solid rgba(100,200,255,0.14);
border-right: none;
box-shadow: -8px 0 30px rgba(0,0,0,0.5);
transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
transform-origin: right top;
max-height: 90vh; overflow-y: auto;
}
.layout-panel.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }

.layout-title {
color: #8fd8ff; font-size: 12px; font-weight: 800;
letter-spacing: 2px; text-transform: uppercase;
margin-bottom: 14px; font-family: ‘Rajdhani’, sans-serif;
}
.control { margin-bottom: 13px; }
.control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.control-top span { font-size: 11px; color: #cfefff; font-family: ‘Rajdhani’, sans-serif; letter-spacing: 0.5px; }
.control input[type=range] {
width: 100%; appearance: none; height: 5px;
border-radius: 999px; background: rgba(255,255,255,0.08); outline: none;
}
.control input[type=range]::-webkit-slider-thumb {
appearance: none; width: 16px; height: 16px; border-radius: 50%;
background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer;
}
.control input[type=range]::-moz-range-thumb {
width: 16px; height: 16px; border-radius: 50%;
background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9);
cursor: pointer; border: none;
}

/* ── Status badge ── */
#status-badge {
position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
border-radius: 24px; padding: 4px 16px;
font-size: 11px; font-weight: bold; letter-spacing: 1px;
color: #aaa; pointer-events: none; z-index: 9999;
font-family: ‘Rajdhani’, monospace; transition: 0.2s;
}
#status-badge.connected    { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
#status-badge.disconnected { color: #ff8866; }

/* ── Floating damage numbers ── */
.damage {
position: fixed; font-weight: 900;
font-size: clamp(18px, 3vw, 28px);
color: #ff5050;
text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9);
animation: floatDamage 0.85s ease-out forwards;
pointer-events: none; z-index: 9999;
transform: translate(-50%, -50%);
white-space: nowrap;
font-family: ‘Rajdhani’, sans-serif;
}
.damage.kill {
color: #ffd84f; font-size: clamp(22px, 4vw, 34px);
text-shadow: 0 0 20px rgba(255,216,79,0.95);
}
.damage.critical {
color: #ff2244; font-size: clamp(24px, 4.5vw, 38px);
text-shadow: 0 0 24px rgba(255,34,68,1), 0 0 48px rgba(255,100,0,0.6);
}
@keyframes floatDamage {
0%   { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
100% { opacity: 0; transform: translate(-50%, -190%) scale(0.6);  }
}

/* ── Banners ── */
.banner {
position: fixed; left: 50%; top: 8%;
transform: translate(-50%, 0);
z-index: 10000; pointer-events: none;
font-family: ‘Rajdhani’, sans-serif;
font-weight: 900; text-align: center;
animation: bannerIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), bannerOut 0.5s ease-in 2.6s forwards;
white-space: nowrap;
}
.banner.kill {
font-size: clamp(18px, 2vw, 32px);
color: #ffcc44;
text-shadow: 0 0 30px rgba(255,200,0,0.9), 0 0 80px rgba(255,100,0,0.6);
letter-spacing: 2px;
}
.banner.streak {
font-size: clamp(20px, 2.2vw, 36px);
color: #ff44aa;
text-shadow: 0 0 40px rgba(255,68,170,0.9), 0 0 80px rgba(255,0,100,0.4);
letter-spacing: 3px;
}
.banner.gift {
font-size: clamp(14px, 1.8vw, 26px);
color: #fff;
background: rgba(0,0,0,0.55);
padding: 10px 32px;
border-radius: 40px;
backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.12);
text-shadow: 0 0 20px rgba(255,255,255,0.8);
}
.banner.legendary {
font-size: clamp(22px, 2.5vw, 40px);
color: #FFD700;
text-shadow: 0 0 40px rgba(255,215,0,1), 0 0 100px rgba(255,140,0,0.8);
letter-spacing: 4px;
animation: bannerIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), legendaryPulse 0.5s ease-in-out infinite alternate, bannerOut 0.5s ease-in 3.5s forwards;
}
@keyframes legendaryPulse {
from { text-shadow: 0 0 40px rgba(255,215,0,1), 0 0 100px rgba(255,140,0,0.8); }
to   { text-shadow: 0 0 70px rgba(255,215,0,1), 0 0 160px rgba(255,200,0,1);   }
}
@keyframes bannerIn {
0%   { opacity: 0; transform: translate(-50%, -24px) scale(0.88); }
100% { opacity: 1; transform: translate(-50%, 0)      scale(1);    }
}
@keyframes bannerOut {
to { opacity: 0; transform: translate(-50%, -16px); }
}

/* ── Reload overlay ── */
.reload-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,0.88); z-index: 99999;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
pointer-events: auto;
}
.reload-overlay .countdown {
font-size: 5vw; color: #fff;
font-family: ‘Rajdhani’, monospace; font-weight: 700;
text-shadow: 0 0 40px rgba(122,252,255,0.8);
letter-spacing: 4px;
}
.reload-overlay .reason {
font-size: 1.2vw; color: #8fd8ff;
margin-top: 20px; letter-spacing: 2px;
font-family: ‘Rajdhani’, sans-serif;
text-transform: uppercase;
}
</style>

</head>
<body>
<div id="overlay-container">
  <canvas id="canvas"></canvas>
</div>

<!-- Layout panel (outside container so it's always on top) -->

<div class="panel-wrapper">
  <div class="panel-tab" id="togglePanel">
    <span class="panel-tab-icon">⚡</span>LAYOUT
  </div>
  <div class="layout-panel hidden" id="layoutPanel">
    <div class="layout-title">Layout Controls</div>
    <div class="control">
      <div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div>
      <input id="gapControl" type="range" min="0" max="200" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div>
      <input id="offsetXControl" type="range" min="-400" max="400" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div>
      <input id="offsetYControl" type="range" min="-200" max="200" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Layout Height</span><span id="heightValue">85%</span></div>
      <input id="heightControl" type="range" min="30" max="100" value="85" />
    </div>
    <div class="control">
      <div class="control-top"><span>Zoom</span><span id="zoomValue">100%</span></div>
      <input id="zoomControl" type="range" min="60" max="140" value="100" />
    </div>
  </div>
</div>

<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>

<script src="/socket.io/socket.io.js"></script>

<script>
(function () {
  // ── Canvas & context ──────────────────────────────────────────────────────
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d', { alpha: true });
  const container = document.getElementById('overlay-container');
  const statusDiv = document.getElementById('status-badge');

  // ── Layout panel controls ─────────────────────────────────────────────────
  const gapControl    = document.getElementById('gapControl');
  const offsetXControl = document.getElementById('offsetXControl');
  const offsetYControl = document.getElementById('offsetYControl');
  const heightControl = document.getElementById('heightControl');
  const zoomControl   = document.getElementById('zoomControl');
  const togglePanel   = document.getElementById('togglePanel');
  const layoutPanel   = document.getElementById('layoutPanel');

  // ── State ─────────────────────────────────────────────────────────────────
  let players        = {};
  let attacks        = [];
  let layoutGap      = 0;
  let offsetX        = 0;
  let offsetY        = 0;
  let layoutZoom     = 1;
  let backgroundImg  = null;
  let socket         = null;
  let audioConfig    = {};
  let audioCache     = {};
  let overlaySettings = { shotType: 'beam', laserColor: '#7afcff', shotSpeed: 1 };

  const HORDE_ID = '__HORDE__';

  // ── Canvas resize — only on window resize, NOT every frame ───────────────
  // FIX: moved out of draw() to avoid layout thrash at 60fps
  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvas.width  = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function cw() { return canvas.width;  }
  function ch() { return canvas.height; }

  // ── Layout panel UI ───────────────────────────────────────────────────────
  function updateControlLabels() {
    document.getElementById('gapValue').textContent    = Math.round(layoutGap);
    document.getElementById('offsetXValue').textContent = Math.round(offsetX);
    document.getElementById('offsetYValue').textContent = Math.round(offsetY);
    document.getElementById('heightValue').textContent  = heightControl.value + '%';
    document.getElementById('zoomValue').textContent    = `${Math.round(layoutZoom * 100)}%`;
  }
  gapControl.oninput    = () => { layoutGap  = parseFloat(gapControl.value);           updateControlLabels(); };
  offsetXControl.oninput = () => { offsetX   = parseFloat(offsetXControl.value);        updateControlLabels(); };
  offsetYControl.oninput = () => { offsetY   = parseFloat(offsetYControl.value);        updateControlLabels(); };
  heightControl.oninput  = () => { container.style.height = heightControl.value + 'vh'; resizeCanvas(); updateControlLabels(); };
  zoomControl.oninput    = () => { layoutZoom = parseFloat(zoomControl.value) / 100;    updateControlLabels(); };
  togglePanel.onclick    = () => {
    layoutPanel.classList.toggle('hidden');
    togglePanel.querySelector('.panel-tab-icon').textContent =
      layoutPanel.classList.contains('hidden') ? '⚙' : '⚡';
  };
  updateControlLabels();

  // ── Player helpers ────────────────────────────────────────────────────────
  function isAlive(p) { return p && p.alive !== false; }

  function topPlayers() {
    return Object.values(players)
      .filter(p => isAlive(p) && p.uniqueId !== HORDE_ID)
      .sort((a, b) => {
        const hpDiff = (b.hp || 0) - (a.hp || 0);
        if (hpDiff !== 0) return hpDiff;
        const kDiff  = (b.kills || 0) - (a.kills || 0);
        if (kDiff !== 0) return kDiff;
        return (b.lastActive || 0) - (a.lastActive || 0);
      })
      .slice(0, 5);
  }

  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest   = Object.values(players).filter(p => isAlive(p) && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return {
      uniqueId:   HORDE_ID,
      nickname:   'THE HORDE',
      hp:         rest.reduce((s, p) => s + (p.hp    || 0),   0),
      maxHp:      rest.reduce((s, p) => s + (p.maxHp || 100), 0),
      hordeCount: rest.length,
      alive:      true,
    };
  }

  // ── Positioning ───────────────────────────────────────────────────────────
  function getPlayerPosition(index, total) {
    const W = cw(), H = ch();
    const cardH      = H * 0.5 * 0.84 * layoutZoom;
    const cardW      = cardH * 0.72;
    const totalWidth = cardW * total + layoutGap * Math.max(0, total - 1);
    const startX     = (W - totalWidth) / 2 + offsetX;
    return {
      x: startX + index * (cardW + layoutGap) + cardW / 2,
      y: H * 0.28 + offsetY + H * 0.16 * (1 - layoutZoom),
    };
  }

  function getHordePosition() {
    const W = cw(), H = ch();
    return { x: W / 2 + offsetX, y: H * 0.72 + offsetY + H * 0.20 * (1 - layoutZoom) };
  }

  function getPositionForPlayer(id) {
    const top = topPlayers();
    const idx = top.findIndex(p => p.uniqueId === id || p.id === id);
    if (idx !== -1) return getPlayerPosition(idx, top.length);
    const horde = hordePlayer();
    return horde ? getHordePosition() : null;
  }

  function canvasToViewport(cx, cy) {
    const rect   = canvas.getBoundingClientRect();
    const scaleX = rect.width  / cw();
    const scaleY = rect.height / ch();
    return { x: rect.left + cx * scaleX, y: rect.top + cy * scaleY };
  }

  // ── Audio ─────────────────────────────────────────────────────────────────
  function getAudio(filename) {
    if (!audioCache[filename]) {
      const a  = new Audio(`/audio/${filename}`);
      a.preload = 'auto';
      audioCache[filename] = a;
    }
    return audioCache[filename];
  }
  function playSound(type) {
    const filename = audioConfig[type];
    if (!filename) return;
    try { const a = getAudio(filename); a.currentTime = 0; a.play().catch(() => {}); } catch (_) {}
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function showBanner(className, html, duration = 3200) {
    const el = document.createElement('div');
    el.className = `banner ${className}`;
    el.innerHTML = html;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  function showDamage(cx, cy, damage, kill, critical) {
    const vp = canvasToViewport(cx, cy);
    const el = document.createElement('div');
    el.className = `damage${kill ? ' kill' : critical ? ' critical' : ''}`;
    el.textContent = kill ? '💀 KILL!' : critical ? `⚡ ${Math.round(damage)}` : `-${Math.round(damage)}`;
    el.style.left  = vp.x + 'px';
    el.style.top   = vp.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ── Particle class ────────────────────────────────────────────────────────
  class Particle {
    constructor(x, y, opts = {}) {
      this.x     = x;
      this.y     = y;
      this.vx    = (Math.random() - 0.5) * (opts.speed  || 4);
      this.vy    = (Math.random() - 0.5) * (opts.speed  || 4) - (opts.rise || 0);
      this.life  = 1;
      this.decay = opts.decay  || (0.02 + Math.random() * 0.03);
      this.r     = opts.radius || (2 + Math.random() * 3);
      this.color = opts.color  || '#7afcff';
      this.emoji = opts.emoji  || null;
      this.fs    = opts.fontSize || 18;
    }
    update() {
      this.x   += this.vx;
      this.y   += this.vy;
      this.vy  += 0.06;
      this.life -= this.decay;
      return this.life > 0;
    }
    draw(c) {
      c.save();
      c.globalAlpha = Math.max(0, this.life);
      if (this.emoji) {
        c.font          = `${this.fs}px Arial`;
        c.textAlign     = 'center';
        c.textBaseline  = 'middle';
        c.fillText(this.emoji, this.x, this.y);
      } else {
        c.fillStyle  = this.color;
        c.shadowColor = this.color;
        c.shadowBlur  = 10;
        c.beginPath();
        c.arc(this.x, this.y, this.r * Math.max(0, this.life), 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }
  }

  // ── Attack class ──────────────────────────────────────────────────────────
  class Attack {
    constructor(from, to, type = 'laser', options = {}) {
      this.from           = from;
      this.to             = to;
      this.type           = type;
      this.intensity      = options.intensity      ?? 0.5;
      this.critical       = options.critical       ?? false;
      this.streak         = options.streak         ?? 0;
      this.giftBoosted    = options.giftBoosted    ?? false;
      this.remainingHpPct = options.remainingHpPct ?? 1;
      this.killingBlow    = options.killingBlow    ?? false;
      this.color          = options.color          || overlaySettings.laserColor || '#7afcff';
      this.start          = Date.now();
      this.progress       = 0;
      this.particles      = [];
      this.spawned        = false;

      // FIX: shotSpeed is now forwarded in every attack payload from server.js
      const speed = Math.max(0.5, options.shotSpeed || overlaySettings.shotSpeed || 1);

      const durations = {
        static: 1800, projectile: 700, gift: 900, explosion: 750,
        beam: 360, neon: 420, ripple: 520, fire: 680, bubble: 680, sphere: 720,
      };
      this.duration = Math.round((durations[type] || 500) / speed);

      // Pre-seed particles for fire and high-intensity / critical hits
      if (type === 'fire') {
        const count = 40 + Math.floor(this.intensity * 24);
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(this.to.x, this.to.y, {
            speed: 3 + Math.random() * 6, color: i % 3 === 0 ? '#ffdd44' : '#ff8844',
            radius: 2 + Math.random() * 4, decay: 0.028,
          }));
        }
      }
      if (this.critical) {
        for (let i = 0; i < 14; i++) {
          this.particles.push(new Particle(this.to.x, this.to.y, {
            speed: 5 + Math.random() * 5, color: '#ffffff',
            radius: 1.5 + Math.random() * 2, decay: 0.04,
          }));
        }
      }
      if (this.giftBoosted) {
        for (let i = 0; i < 10; i++) {
          this.particles.push(new Particle(this.from.x, this.from.y, {
            speed: 2, color: '#ffd700', radius: 1.5, decay: 0.045, rise: 0.6,
          }));
        }
      }
    }

    update() {
      const elapsed  = Date.now() - this.start;
      this.progress  = Math.min(1, elapsed / this.duration);
      this.particles = this.particles.filter(p => p.update());
      return elapsed < this.duration || this.particles.length > 0;
    }

    draw() {
      ctx.save();
      switch (this.type) {
        case 'laser':     this.drawLaser();     break;
        case 'beam':      this.drawBeam();      break;
        case 'projectile':this.drawProjectile();break;
        case 'gift':      this.drawGift();      break;
        case 'explosion': this.drawExplosion(); break;
        case 'neon':      this.drawNeon();      break;
        case 'ripple':    this.drawRipple();    break;
        case 'fire':      this.drawFire();      break;
        case 'bubble':    this.drawBubble();    break;
        case 'sphere':    this.drawSphere();    break;
        case 'static':    this.drawStatic();    break;
        default:          this.drawLaser();
      }
      ctx.restore();
    }

    // ── Draw: laser ──
    drawLaser() {
      const { from, to, progress } = this;
      const x     = from.x + (to.x - from.x) * progress;
      const y     = from.y + (to.y - from.y) * progress;
      const alpha = progress < 0.6 ? 1 : 1 - (progress - 0.6) / 0.4;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (this.giftBoosted) {
        ctx.globalAlpha = alpha * 0.28;
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 28; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      }
      ctx.globalAlpha = alpha * (0.4 + this.intensity * 0.35);
      ctx.strokeStyle = this.color; ctx.lineWidth = 14 + this.intensity * 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      if (this.critical) {
        ctx.globalAlpha = alpha * 0.55;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      }
      ctx.restore();
    }

    // ── Draw: beam ──
    drawBeam() {
      const { from, to, progress } = this;
      const alpha  = progress < 0.3 ? 1 : 1 - (progress - 0.3) / 0.7;
      const pulse  = 1 + Math.sin(Date.now() / 110) * 0.16;
      const midX   = from.x + (to.x - from.x) * progress;
      const midY   = from.y + (to.y - from.y) * progress;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (this.giftBoosted) {
        ctx.globalAlpha = alpha * 0.28;
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 32; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
      }
      ctx.globalAlpha = alpha * (0.3 + this.intensity * 0.25);
      ctx.strokeStyle = this.color; ctx.lineWidth = (20 + this.intensity * 8) * pulse; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
      if (this.critical) {
        ctx.globalAlpha = alpha * 0.65;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
      }
      ctx.restore();
    }

    // ── Draw: projectile ──
    drawProjectile() {
      const { from, to, progress } = this;
      const x = from.x + (to.x - from.x) * progress;
      const y = from.y + (to.y - from.y) * progress;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const radius = 18 + this.intensity * 10;
      const grad   = ctx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0,   'rgba(255,255,255,1)');
      grad.addColorStop(0.45,'rgba(122,252,255,0.9)');
      grad.addColorStop(1,   'rgba(122,252,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      if (this.critical) {
        ctx.globalAlpha = 0.65;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, radius * 0.65, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // ── Draw: gift ──
    drawGift() {
      if (!this.spawned) {
        this.spawned = true;
        const emojis = ['❤️', '💖', '💘', '💝', '💫'];
        const count  = 18 + Math.floor(this.intensity * 14);
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(this.to.x, this.to.y, {
            speed: 6 + Math.random() * 5, emoji: emojis[i % emojis.length],
            fontSize: 18 + Math.random() * 14, decay: 0.018, rise: 1.2,
          }));
        }
      }
      ctx.globalCompositeOperation = 'lighter';
      this.particles.forEach(p => p.draw(ctx));
    }

    // ── Draw: explosion ──
    drawExplosion() {
      if (!this.spawned) {
        this.spawned = true;
        const count  = 34 + Math.floor(this.intensity * 24);
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(this.to.x, this.to.y, {
            speed:  7 + Math.random() * (10 + this.intensity * 8),
            color:  ['#ff6644','#ffcc44','#ff2222','#ff8800'][i % 4],
            radius: 3 + Math.random() * (5 + this.intensity * 4),
            decay:  0.014 - this.intensity * 0.004,
          }));
        }
      }
      ctx.globalCompositeOperation = 'lighter';
      this.particles.forEach(p => p.draw(ctx));
    }

    // ── Draw: neon ──
    drawNeon() {
      const { from, to, progress } = this;
      const x = from.x + (to.x - from.x) * progress;
      const y = from.y + (to.y - from.y) * progress;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth   = 12 + this.intensity * 8;
      ctx.strokeStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur  = 24;
      ctx.lineCap     = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      if (this.critical) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      }
    }

    // ── Draw: ripple ──
    drawRipple() {
      const { from, to, progress } = this;
      const x     = from.x + (to.x - from.x) * progress;
      const y     = from.y + (to.y - from.y) * progress;
      const rings = 3 + Math.floor(this.intensity * 3);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < rings; i++) {
        const t = progress - i * 0.07;
        if (t <= 0) continue;
        const alpha = (1 - t) * (0.6 + this.intensity * 0.3);
        ctx.strokeStyle = `rgba(100,220,255,${alpha})`;
        ctx.lineWidth   = 2.5;
        ctx.beginPath();
        ctx.arc(x, y, 12 + t * 55 + this.intensity * 12, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // ── Draw: fire ──
    drawFire() {
      const { from, to, progress } = this;
      const x    = from.x + (to.x - from.x) * progress;
      const y    = from.y + (to.y - from.y) * progress;
      const size = 28 + this.intensity * 18;
      ctx.globalCompositeOperation = 'lighter';
      const flame = ctx.createRadialGradient(x, y, 0, x, y, size);
      flame.addColorStop(0,   '#fff8e0');
      flame.addColorStop(0.25,'#ffcc44');
      flame.addColorStop(0.55,'#ff5500');
      flame.addColorStop(1,   '#880000');
      ctx.fillStyle = flame;
      ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
      this.particles.forEach(p => p.draw(ctx));
    }

    // ── Draw: bubble ──
    drawBubble() {
      const { from, to, progress } = this;
      const x     = from.x + (to.x - from.x) * progress;
      const y     = from.y + (to.y - from.y) * progress;
      const count = 4 + Math.floor(this.intensity * 3);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < count; i++) {
        const angle = Date.now() * 0.003 + i * 1.5;
        const bx    = x + Math.cos(angle) * 12;
        const by    = y + Math.sin(angle) * 12;
        const r     = 13 - i * 1.5 + this.intensity * 5;
        ctx.globalAlpha = 0.55 + this.intensity * 0.2;
        ctx.fillStyle   = `rgba(100,210,255,0.6)`;
        ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
        // Highlight
        ctx.globalAlpha = 0.4;
        ctx.fillStyle   = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(bx - r * 0.28, by - r * 0.28, r * 0.28, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ── Draw: sphere ──
    drawSphere() {
      const { from, to, progress } = this;
      const x      = from.x + (to.x - from.x) * progress;
      const y      = from.y + (to.y - from.y) * progress;
      const radius = 26 + this.intensity * 14;
      ctx.globalCompositeOperation = 'lighter';
      const orb = ctx.createRadialGradient(x - radius * 0.25, y - radius * 0.25, 0, x, y, radius);
      orb.addColorStop(0,   '#ddffff');
      orb.addColorStop(0.35,'#2299ff');
      orb.addColorStop(0.75,'#0033aa');
      orb.addColorStop(1,   '#001133');
      ctx.fillStyle = orb;
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      // Energy ring
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = 'rgba(100,200,255,0.9)';
      ctx.lineWidth   = 2.5;
      ctx.beginPath(); ctx.arc(x, y, radius * 1.2, 0, Math.PI * 2); ctx.stroke();
      if (this.critical) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, radius * 0.75, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ── Draw: static (particle-only) ──
    drawStatic() {
      this.particles.forEach(p => p.draw(ctx));
    }
  }

  // ── Effect type map ───────────────────────────────────────────────────────
  const TYPE_MAP = {
    fire: 'fire',       bubble: 'bubble',     bubbles: 'bubble',  water: 'bubble',
    beam: 'beam',       laser: 'laser',       shot: 'laser',      projectile: 'projectile',
    neon: 'neon',       ripple: 'ripple',     wave: 'ripple',
    sphere: 'sphere',   gift: 'gift',         hearts: 'gift',
    explosion: 'explosion', boom: 'explosion',
    meteor: 'fire',     tsunami: 'ripple',    nuke: 'explosion',  nukes: 'explosion',
  };

  // ── Fire an attack visual ─────────────────────────────────────────────────
  function fireAttack(attackerId, targetId, damage, killed, special, effect, meta = {}) {
    const top   = topPlayers();
    const horde = hordePlayer();

    let from = attackerId === HORDE_ID
      ? (horde ? getHordePosition() : null)
      : getPositionForPlayer(attackerId) || (horde ? getHordePosition() : null);

    let to = targetId === HORDE_ID
      ? (horde ? getHordePosition() : null)
      : getPositionForPlayer(targetId) || (horde ? getHordePosition() : null);

    if (!from || !to) return;

    // Resolve visual type
    let type;
    if (effect) {
      type = TYPE_MAP[String(effect).toLowerCase()] || String(effect).toLowerCase();
    } else if (special) {
      type = 'gift';
    } else if (killed) {
      type = 'explosion';
    } else {
      const s = overlaySettings.shotType;
      type = s === 'beam'   ? 'beam'      :
             s === 'pulse'  ? 'fire'      :
             s === 'wave'   ? 'ripple'    :
             s === 'burst'  ? 'explosion' :
             s === 'ripple' ? 'ripple'    : 'laser';
    }

    attacks.push(new Attack(from, to, type, {
      intensity:      meta.intensity      ?? 0.5,
      critical:       meta.critical       ?? false,
      streak:         meta.streak         ?? 0,
      giftBoosted:    meta.giftBoosted    ?? false,
      remainingHpPct: meta.remainingHpPct ?? 1,
      killingBlow:    !!killed,
      color:          meta.laserColor     || overlaySettings.laserColor,
      shotSpeed:      meta.shotSpeed      || overlaySettings.shotSpeed,
    }));

    showDamage(to.x, to.y, damage || 0, !!killed, !!meta.critical);
  }

  // ── Heart storm (for 'like' events) ──────────────────────────────────────
  function fireHeartEffect(playerId, hearts = 1, intensity = 0, color = '#ff4088') {
    let pos = getPositionForPlayer(playerId);
    if (!pos) {
      const top = topPlayers();
      pos = top.length ? getPlayerPosition(0, top.length) : getHordePosition();
    }
    const emojis = ['❤️', '💖', '💘', '💝'];
    const count  = Math.max(1, Math.floor(hearts * (1 + intensity * 2)));
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const tempAtk = new Attack(pos, pos, 'static');
        tempAtk.particles.push(new Particle(pos.x, pos.y, {
          speed:    5 + Math.random() * 5,
          emoji:    emojis[i % emojis.length],
          fontSize: 16 + i * 3 + intensity * 8,
          decay:    0.016 - intensity * 0.003,
          rise:     2.5 + intensity * 2,
        }));
        attacks.push(tempAtk);
      }, i * 90);
    }
  }

  // ── Respawn particle burst ────────────────────────────────────────────────
  function spawnRespawnEffect(uniqueId) {
    const pos = getPositionForPlayer(uniqueId);
    if (!pos) return;
    const atk = new Attack(pos, pos, 'static');
    for (let i = 0; i < 28; i++) {
      atk.particles.push(new Particle(pos.x, pos.y, {
        speed: 3 + Math.random() * 6, color: '#ffaa00',
        radius: 2 + Math.random() * 3, decay: 0.022, rise: 1.5,
      }));
    }
    attacks.push(atk);
    playSound('respawn');
  }

  // ── Background ────────────────────────────────────────────────────────────
  function drawBackground() {
    const W = cw(), H = ch();
    if (backgroundImg) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      ctx.drawImage(
        backgroundImg,
        (W - backgroundImg.width  * scale) / 2,
        (H - backgroundImg.height * scale) / 2,
        backgroundImg.width  * scale,
        backgroundImg.height * scale
      );
      return;
    }
    // Fallback: dark grid
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0d1a2e');
    grad.addColorStop(1, '#050b12');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(100,200,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(140,80,255,0.22)';
    ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
  }

  // ── Player card ───────────────────────────────────────────────────────────
  function drawPlayerCard(player, pos, rank) {
    const hp      = player.hp    || 0;
    const maxHp   = player.maxHp || 100;
    const hpPct   = Math.max(0, Math.min(1, hp / maxHp));
    const nearDeath = hpPct < 0.2;
    const H       = ch();
    const cardH   = H * 0.5 * 0.84 * layoutZoom;
    const avatarR = cardH * 0.26;
    const avatarY = pos.y - cardH * 0.14;
    const nameY   = avatarY - avatarR - cardH * 0.06;
    const barW    = cardH * 0.72 * 0.88;
    const barH    = Math.max(6, cardH * 0.09);
    const barX    = pos.x - barW / 2;
    const barY    = avatarY + avatarR + cardH * 0.05;
    const hpTextY = barY + barH + cardH * 0.07;

    // Near-death red aura
    if (nearDeath) {
      const pulse   = 0.5 + Math.sin(Date.now() / 280) * 0.5;
      const redGlow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, avatarR * 3.2);
      redGlow.addColorStop(0, `rgba(255,30,30,${0.2 + pulse * 0.12})`);
      redGlow.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = redGlow;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, avatarR * 3.2, 0, Math.PI * 2); ctx.fill();
    }

    // Ambient glow
    const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, avatarR * 2.6);
    glow.addColorStop(0, 'rgba(122,252,255,0.14)');
    glow.addColorStop(1, 'rgba(122,252,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, avatarR * 2.6, 0, Math.PI * 2); ctx.fill();

    // Avatar ring — gold for rank 1
    ctx.strokeStyle = rank === 1 ? 'rgba(255,210,80,0.75)' : 'rgba(122,252,255,0.4)';
    ctx.lineWidth   = Math.max(2, avatarR * 0.08);
    ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR, 0, Math.PI * 2); ctx.stroke();

    // Avatar fill
    ctx.fillStyle = 'rgba(8,18,30,0.92)';
    ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR - 2, 0, Math.PI * 2); ctx.fill();

    // Emoji icon
    ctx.font          = `${avatarR * 1.3}px Arial`;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'middle';
    ctx.fillStyle     = '#fff';
    ctx.fillText(player.iconEmoji || '⚔️', pos.x, avatarY);

    // Name
    const name = (player.nickname || player.uniqueId || 'Player').slice(0, 13);
    ctx.font        = `bold ${Math.max(9, cardH * 0.11)}px 'Rajdhani', 'Segoe UI', sans-serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth   = 3;
    ctx.strokeStyle = '#000';
    ctx.strokeText(name, pos.x, nameY);
    ctx.fillStyle   = '#fff';
    ctx.fillText(name, pos.x, nameY);

    // HP bar background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(barX, barY, barW, barH);

    // HP bar fill
    const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    barGrad.addColorStop(0, hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#ff4d4d');
    barGrad.addColorStop(1, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = barGrad;
    ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpPct, barH - 2);

    // HP bar border
    ctx.strokeStyle = 'rgba(122,252,255,0.3)';
    ctx.lineWidth   = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    // HP text
    ctx.font          = `${Math.max(8, cardH * 0.085)}px 'Rajdhani', 'Segoe UI', sans-serif`;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'middle';
    ctx.strokeStyle   = '#000';
    ctx.lineWidth     = 2.5;
    ctx.strokeText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);
    ctx.fillStyle     = '#ccc';
    ctx.fillText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);

    // Kill count badge (if any)
    if (player.kills > 0) {
      const kx = pos.x + avatarR * 0.75;
      const ky = avatarY + avatarR * 0.75;
      ctx.fillStyle = 'rgba(255,80,80,0.85)';
      ctx.beginPath(); ctx.arc(kx, ky, avatarR * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.font         = `bold ${Math.max(7, avatarR * 0.32)}px 'Rajdhani', sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#fff';
      ctx.fillText(player.kills, kx, ky);
    }
  }

  // ── Horde ─────────────────────────────────────────────────────────────────
  function drawHorde(horde) {
    if (!horde) return;
    const pos   = getHordePosition();
    const H     = ch();
    const W     = cw();
    const ring  = H * 0.28 * layoutZoom;
    const pulse = 0.5 + Math.sin(Date.now() / 350) * 0.5;

    // Pulsing aura
    ctx.fillStyle = `rgba(255,70,70,${0.07 + pulse * 0.05})`;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, ring + pulse * 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,70,70,${0.45 + pulse * 0.3})`;
    ctx.lineWidth   = Math.max(2, ring * 0.1);
    ctx.beginPath(); ctx.arc(pos.x, pos.y, ring * 0.88, 0, Math.PI * 2); ctx.stroke();

    // Skull icon
    ctx.font          = `${ring * 1.5}px Arial`;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'middle';
    ctx.fillText('💀', pos.x, pos.y);

    // Label (to the left of circle — stays in bounds)
    const labelX = Math.max(ring * 2.4, pos.x - ring * 1.35);
    ctx.font        = `bold ${Math.max(10, H * 0.08)}px 'Rajdhani', 'Segoe UI', sans-serif`;
    ctx.textAlign   = 'right';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText('⚔ THE HORDE', labelX, pos.y - H * 0.05);
    ctx.fillStyle = '#ff7b7b';
    ctx.fillText('⚔ THE HORDE', labelX, pos.y - H * 0.05);

    ctx.font      = `${Math.max(8, H * 0.06)}px 'Rajdhani', 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#ffc2c2';
    ctx.fillText(`${horde.hordeCount} players`, labelX, pos.y + H * 0.08);

    // HP bar — clamped to right of circle, within canvas
    const hpPct = Math.min(1, horde.hp / Math.max(1, horde.maxHp));
    const barW  = Math.min(W * 0.28, W - (pos.x + ring * 1.35) - 16);
    const barH  = Math.max(8, H * 0.045);
    const barX  = pos.x + ring * 1.1;
    const barY  = pos.y - barH / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX, barY, barW, barH);
    const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hpGrad.addColorStop(0, '#ff2222');
    hpGrad.addColorStop(1, '#ff8888');
    ctx.fillStyle = hpGrad;
    ctx.fillRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth   = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    ctx.font          = `${Math.max(8, H * 0.05)}px 'Rajdhani', 'Segoe UI', sans-serif`;
    ctx.textAlign     = 'left';
    ctx.fillStyle     = '#ffaaaa';
    ctx.strokeStyle   = '#000'; ctx.lineWidth = 2.5;
    const hpText      = `${Math.round(horde.hp)} / ${Math.round(horde.maxHp)}`;
    ctx.strokeText(hpText, barX, barY + barH + H * 0.09);
    ctx.fillText(hpText,   barX, barY + barH + H * 0.09);
  }

  // ── Main render loop ──────────────────────────────────────────────────────
  function draw() {
    // DO NOT call resizeCanvas() here — only on window resize
    ctx.clearRect(0, 0, cw(), ch());
    ctx.globalAlpha              = 1;
    ctx.globalCompositeOperation = 'source-over';

    drawBackground();

    const top = topPlayers();
    top.forEach((p, i) => drawPlayerCard(p, getPlayerPosition(i, top.length), i + 1));
    drawHorde(hordePlayer());

    ctx.globalAlpha              = 1;
    ctx.globalCompositeOperation = 'source-over';
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });

    ctx.globalAlpha              = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }

  // ── Player state normalizer ───────────────────────────────────────────────
  function normalizePlayers(state) {
    const out = {};
    for (const key in state) {
      const p      = state[key] || {};
      p.uniqueId   = p.uniqueId || p.id || key;
      out[p.uniqueId] = p;
    }
    return out;
  }

  // ── Socket event handlers ─────────────────────────────────────────────────

  // killEvent: dedicated kill screen + banner
  function onKillEvent(data) {
    fireAttack(data.killer, data.victim, data.damage, true, false, data.effect || 'explosion', {
      intensity:      0.95,
      critical:       true,
      streak:         data.killerStreak || 0,
      remainingHpPct: 0,
      killingBlow:    true,
    });
    showBanner('kill',
      `${data.killerNick || data.killer} 💀 ${data.victimNick || data.victim}` +
      `<span style="font-size:0.68em;opacity:0.8"> (${data.killerKills} kills)</span>`
    );
    playSound('kill');
  }

  // streakEvent: milestone kill-streak banner
  // FIX: was referencing data.killerNick and data.streakCount — server sends data.nickname and data.streak
  function onStreakEvent(data) {
    const name   = data.nickname  || data.killerNick  || '???';
    const streak = data.streak    || data.streakCount  || 0;
    const label  = data.label     || `${streak} KILL STREAK`;
    showBanner('streak', `🔥 ${name} – ${label}!`);
  }

  // giftCelebration: delayed gift banner after damage hits
  function onGiftCelebration(data) {
    const tier     = (data.tier || 'common').toUpperCase();
    const isLegend = data.tier === 'legendary';
    showBanner(
      isLegend ? 'legendary' : 'gift',
      `${data.giftLabel || '🎁'} <strong>${data.nickname}</strong> sent <strong>${data.giftName || 'a gift'}</strong> · ${data.diamonds} 💎 · ${tier}`,
      isLegend ? 4500 : 3200
    );
  }

  // like: FIX — server emits 'like' (not 'likeStorm'), fields are 'hearts'/'intensity'/'color'
  function onLike(data) {
    fireHeartEffect(
      data.uniqueId,
      data.hearts    || 1,
      data.intensity || 0,
      data.color     || '#ff4088'
    );
    playSound('heal');
  }

  // respawn: particle burst at player position
  function onRespawn(data) {
    spawnRespawnEffect(data.uniqueId);
  }

  // soundEvent: FIX — server now sends { event, intensity, tier, _ts }
  function onSoundEvent(data) {
    if (data && data.event) playSound(data.event);
  }

  // forceReload: FIX — server sends { v, delayMs, reason, _ts }
  function onForceReload(data) {
    const delayMs  = data.delayMs || 3000;
    const reason   = data.reason  || 'Operator reload';
    const overlay  = document.createElement('div');
    overlay.className = 'reload-overlay';
    overlay.innerHTML = `
      <div class="countdown" id="reload-countdown">${Math.ceil(delayMs / 1000)}</div>
      <div class="reason">${reason}</div>
    `;
    document.body.appendChild(overlay);
    let remaining = Math.ceil(delayMs / 1000);
    const interval = setInterval(() => {
      remaining--;
      const el = document.getElementById('reload-countdown');
      if (remaining <= 0) { clearInterval(interval); location.reload(); }
      else if (el) el.textContent = remaining;
    }, 1000);
  }

  // ── Socket init ───────────────────────────────────────────────────────────
  function initSocket() {
    try {
      socket = io({ transports: ['websocket', 'polling'], timeout: 5000 });

      socket.on('connect', () => {
        statusDiv.textContent = '🟢 LIVE · CONNECTED';
        statusDiv.className   = 'connected';
        socket.emit('register', { type: 'overlay' });
      });
      socket.on('disconnect', () => {
        statusDiv.textContent = '🔴 DISCONNECTED · waiting...';
        statusDiv.className   = 'disconnected';
      });
      socket.on('connect_error', () => {
        statusDiv.textContent = '⚠️ SERVER ERROR · retrying';
        statusDiv.className   = 'disconnected';
      });

      socket.on('gameState', state => {
        if (state && typeof state === 'object') {
          players = normalizePlayers(state);
          if (!Object.keys(players).length) {
            fetch('/state').then(r => r.json()).then(s => {
              players = normalizePlayers(s || {});
            }).catch(() => {});
          }
        }
      });

      socket.on('audioConfig', cfg => {
        if (cfg) audioConfig = cfg;
      });

      socket.on('overlaySettings', settings => {
        if (settings && typeof settings === 'object') {
          overlaySettings = { ...overlaySettings, ...settings };
        }
      });

      // FIX: emitEvent now wraps all payloads in objects with _ts.
      // laserColor arrives as { color, _ts } not a raw string.
      socket.on('laserColor', data => {
        const color = typeof data === 'string' ? data : (data && data.color);
        if (color) overlaySettings.laserColor = color;
      });

      socket.on('backgroundChanged', data => {
        const filename = data && data.filename;
        if (!filename) { backgroundImg = null; return; }
        const img  = new Image();
        img.onload = () => { backgroundImg = img; };
        img.src    = `/background/${filename}?v=${Date.now()}`;
      });

      // Attack events — enriched payload from server.js
      socket.on('attack', data => {
        fireAttack(
          data.attacker, data.target,
          data.damage, data.killed, data.special, data.effect,
          {
            intensity:      data.intensity,
            critical:       data.critical,
            streak:         data.streak,
            giftBoosted:    data.giftBoosted,
            remainingHpPct: data.remainingHpPct,
            killingBlow:    data.killingBlow,
            laserColor:     data.laserColor,
            shotSpeed:      data.shotSpeed,
          }
        );
      });

      // giftAttack — FIX: server sends 'tier' not 'giftTier'
      socket.on('giftAttack', data => {
        fireAttack(
          data.attacker, data.target,
          data.damage, data.killed, true, data.effect || 'gift',
          {
            intensity:      data.intensity      || 0.5,
            giftBoosted:    true,
            remainingHpPct: data.killed ? 0 : (players[data.target]?.hp / players[data.target]?.maxHp || 1),
            killingBlow:    !!data.killed,
            laserColor:     data.giftColor,
          }
        );
      });

      // New enriched events
      socket.on('killEvent',       onKillEvent);
      socket.on('streakEvent',     onStreakEvent);
      socket.on('giftCelebration', onGiftCelebration);
      socket.on('like',            onLike);        // FIX: was 'likeStorm', server emits 'like'
      socket.on('respawn',         onRespawn);
      socket.on('soundEvent',      onSoundEvent);
      socket.on('forceReload',     onForceReload);

    } catch (err) {
      statusDiv.textContent = '❌ SOCKET ERROR · no live data';
      statusDiv.className   = 'disconnected';
    }
  }

  initSocket();
  requestAnimationFrame(draw);
})();
</script>
