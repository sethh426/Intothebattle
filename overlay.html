<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PvP Battle Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}

body {
font-family: ‘Arial’, sans-serif;
background: #000;
}

#canvas {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: block;
}

.ui {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 100;
}

.panel {
position: absolute;
background: rgba(8, 12, 24, 0.85);
border: 1px solid rgba(100, 200, 255, 0.25);
border-radius: 8px;
padding: 12px;
box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
backdrop-filter: blur(6px);
font-size: 12px;
color: #fff;
}

.status {
bottom: 12px;
left: 12px;
width: 280px;
min-height: 100px;
}

.status-title {
font-size: 12px;
font-weight: 700;
color: #64c8ff;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 8px;
border-bottom: 1px solid rgba(100, 200, 255, 0.2);
padding-bottom: 6px;
}

.status-row {
display: flex;
justify-content: space-between;
padding: 4px 0;
font-size: 12px;
}

.status-label { color: #a0c0ff; }

.status-value {
color: #64c8ff;
font-weight: 600;
}

.live-indicator {
display: inline-block;
width: 8px;
height: 8px;
background: #ff4444;
border-radius: 50%;
margin-right: 4px;
animation: pulse 1.3s infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.5; }
}

.leaderboard {
top: 12px;
right: 12px;
width: 280px;
max-height: 220px;
}

.board-title {
font-size: 12px;
font-weight: 700;
color: #ffd93d;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 8px;
border-bottom: 1px solid rgba(255, 217, 61, 0.2);
padding-bottom: 6px;
}

.board-entry {
display: flex;
justify-content: space-between;
align-items: center;
padding: 7px 8px;
margin: 4px 0;
background: rgba(100, 200, 255, 0.08);
border: 1px solid rgba(100, 200, 255, 0.15);
border-radius: 6px;
font-size: 12px;
transition: all 0.1s;
}

.board-entry.rank-1 { background: rgba(255, 217, 61, 0.12); border-color: rgba(255, 217, 61, 0.3); }
.board-entry.rank-2 { background: rgba(200, 200, 200, 0.08); border-color: rgba(200, 200, 200, 0.2); }
.board-entry.rank-3 { background: rgba(200, 100, 100, 0.08); border-color: rgba(200, 100, 100, 0.2); }

.rank-num { min-width: 18px; font-weight: 700; color: #64c8ff; }
.rank-name { flex: 1; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-score { color: #ffd93d; font-weight: 700; min-width: 30px; text-align: right; }

.eventlog {
right: 12px;
bottom: 12px;
width: 280px;
height: 120px;
max-height: 120px;
overflow-y: auto;
overflow-x: hidden;
}

.controls {
top: 250px;
right: 12px;
width: 280px;
pointer-events: auto;
}

.controls-title {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 12px;
font-weight: 700;
color: #64c8ff;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 8px;
border-bottom: 1px solid rgba(100, 200, 255, 0.2);
padding-bottom: 6px;
}

.controls-title button {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(100, 200, 255, 0.25);
color: #fff;
padding: 4px 8px;
border-radius: 6px;
cursor: pointer;
font-size: 11px;
}

.controls.hidden { opacity: 0.15; }

.control-row {
display: grid;
grid-template-columns: 1fr auto;
align-items: center;
gap: 10px;
margin: 10px 0;
font-size: 12px;
}

.control-row span { color: #e1f7ff; }
.control-row input[type=“range”] { width: 100%; }

.eventlog > #eventlog {
max-height: calc(100% - 26px);
overflow-y: auto;
}

.log-title {
font-size: 12px;
font-weight: 700;
color: #64c8ff;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 8px;
border-bottom: 1px solid rgba(100, 200, 255, 0.2);
padding-bottom: 6px;
}

.log-entry {
padding: 4px 6px;
margin: 2px 0;
background: rgba(255, 255, 255, 0.04);
border-left: 2px solid rgba(100, 200, 255, 0.3);
border-radius: 4px;
font-size: 10px;
line-height: 1.2;
color: #ddd;
}

.log-entry.kill { background: rgba(255, 51, 51, 0.12); border-left-color: #ff4444; color: #ffdddd; font-weight: 600; }
.log-entry.gift { background: rgba(255, 217, 61, 0.12); border-left-color: #ffd93d; color: #ffe6cc; }

.eventlog::-webkit-scrollbar { width: 6px; }
.eventlog::-webkit-scrollbar-thumb { background: rgba(100, 200, 255, 0.3); border-radius: 3px; }

.dmg-number {
position: absolute;
font-size: 32px;
font-weight: 900;
color: #ff3333;
text-shadow: 0 0 12px rgba(255, 51, 51, 0.8), 2px 2px 6px rgba(0, 0, 0, 0.95);
pointer-events: none;
animation: dmgFloat 0.7s ease-out forwards;
z-index: 30;
}

@keyframes dmgFloat {
0% { opacity: 1; transform: translateY(0) scale(1); }
100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
}

.dmg-number.kill {
color: #ffd93d;
font-size: 40px;
text-shadow: 0 0 16px rgba(255, 217, 61, 0.9), 2px 2px 6px rgba(0, 0, 0, 0.95);
}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="panel status">
    <div class="status-title"><span class="live-indicator"></span>Battle Status</div>
    <div class="status-row">
      <span class="status-label">Server:</span>
      <span class="status-value" id="serverStatus">Connecting...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Players:</span>
      <span class="status-value" id="playerCount">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Audio:</span>
      <span class="status-value" id="audioStatus">Enabled</span>
    </div>
    <div class="status-row">
      <button id="enableAudioBtn" style="font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;">Enable Audio</button>
    </div>
    <div class="status-row">
      <span class="status-label">Showing:</span>
      <span class="status-value" id="showingCount">0 / 0</span>
    </div>
  </div>

  <div class="panel leaderboard">
    <div class="board-title">🏆 Highest HP (Top 20)</div>
    <div id="leaderboard"></div>
  </div>

  <div class="panel eventlog">
    <div class="log-title">⚔️ Events</div>
    <div id="eventlog"></div>
  </div>

  <!-- LAYOUT CONTROLS: Row Gap removed, replaced with Horizontal Offset -->

  <div class="panel controls" id="layoutControls">
    <div class="controls-title">
      <span>⚙️ Layout Controls</span>
      <button id="toggleControls">Hide</button>
    </div>
    <label class="control-row">
      <span>Column Gap</span>
      <input id="gapXControl" type="range" min="0" max="220" step="10" value="150" />
      <span id="gapXValue">100</span>
    </label>
    <label class="control-row">
      <span>Horizontal Offset</span>
      <input id="offsetXControl" type="range" min="-500" max="500" step="10" value="0" />
      <span id="offsetXValue">0</span>
    </label>
    <label class="control-row">
      <span>Vertical Position</span>
      <input id="offsetYControl" type="range" min="-500" max="500" step="10" value="0" />
      <span id="offsetYValue">0</span>
    </label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>

<script>
let players = {};
const lastPlayerPositions = {};
let backgroundImg = null;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── Layout controls ──────────────────────────────────────────────────────────
const gapXControl    = document.getElementById('gapXControl');
const offsetXControl = document.getElementById('offsetXControl');
const offsetYControl = document.getElementById('offsetYControl');
const gapXValue      = document.getElementById('gapXValue');
const offsetXValue   = document.getElementById('offsetXValue');
const offsetYValue   = document.getElementById('offsetYValue');
const toggleControls = document.getElementById('toggleControls');
const layoutControls = document.getElementById('layoutControls');
const audioStatusLabel = document.getElementById('audioStatus');
const enableAudioBtn   = document.getElementById('enableAudioBtn');

let layoutGapX = gapXControl    ? Number(gapXControl.value)    : 150;
let offsetX    = offsetXControl ? Number(offsetXControl.value) : 0;
let offsetY    = offsetYControl ? Number(offsetYControl.value) : 0;

function syncLabels() {
  if (gapXValue)   gapXValue.textContent   = layoutGapX;
  if (offsetXValue) offsetXValue.textContent = offsetX;
  if (offsetYValue) offsetYValue.textContent = offsetY;
}

if (gapXControl) {
  gapXControl.addEventListener('input', () => {
    layoutGapX = Number(gapXControl.value);
    syncLabels();
  });
}

if (offsetXControl) {
  offsetXControl.addEventListener('input', () => {
    offsetX = Number(offsetXControl.value);
    syncLabels();
  });
}

if (offsetYControl) {
  offsetYControl.addEventListener('input', () => {
    offsetY = Number(offsetYControl.value);
    syncLabels();
  });
}

if (toggleControls && layoutControls) {
  toggleControls.addEventListener('click', () => {
    const hidden = layoutControls.classList.toggle('hidden');
    toggleControls.textContent = hidden ? 'Show' : 'Hide';
  });
}

syncLabels();

// ── Audio ────────────────────────────────────────────────────────────────────
let overlaySoundEnabled = true;
const laserSound = new Audio('Singleshot.m4a');
const giftSound  = new Audio('tripleshot.m4a');
laserSound.preload = 'auto';
giftSound.preload  = 'auto';

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioReady = audioCtx.state !== 'suspended';

function setAudioStatus() {
  if (!audioStatusLabel) return;
  if (!overlaySoundEnabled) { audioStatusLabel.textContent = 'Muted'; return; }
  if (audioCtx.state === 'suspended') { audioStatusLabel.textContent = 'Click to enable'; return; }
  audioStatusLabel.textContent = audioReady ? 'Ready' : 'Unavailable';
}

function resumeAudio() {
  if (!audioCtx) return;
  audioCtx.resume()
    .then(() => { audioReady = true; setAudioStatus(); playTone(880, 0.05, 'square', 0.1); })
    .catch(() => setAudioStatus());
}

if (enableAudioBtn) {
  enableAudioBtn.addEventListener('click', (e) => { e.stopPropagation(); resumeAudio(); });
}

document.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') resumeAudio();
  else { audioReady = true; setAudioStatus(); }
}, { once: true });

function playTone(frequency, duration = 0.12, type = 'triangle', volume = 0.18, when = 0) {
  if (!audioCtx || !audioReady) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = frequency;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const start = audioCtx.currentTime + when;
  const stop  = start + duration;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, stop);
  osc.start(start);
  osc.stop(stop);
}

function playSound(name) {
  if (!overlaySoundEnabled) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => { audioReady = true; setAudioStatus(); playSound(name); }).catch(() => {});
    return;
  }
  if (!audioReady) return;
  switch (name) {
    case 'single': case 'laser': laserSound.currentTime = 0; laserSound.play().catch(() => {}); break;
    case 'triple': case 'special': giftSound.currentTime = 0; giftSound.play().catch(() => {}); break;
    case 'heal':
      playTone(520, 0.14, 'triangle', 0.14);
      playTone(660, 0.16, 'sine', 0.1, 0.05);
      break;
  }
}

// ── Canvas setup ─────────────────────────────────────────────────────────────
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

setupCanvas();
window.addEventListener('resize', setupCanvas);

// ── Player helpers ────────────────────────────────────────────────────────────
const HORDE_ID = '__horde__';

function getTopPlayers(count = 5) {
  return Object.values(players)
    .filter(p => p.alive && p.uniqueId !== HORDE_ID)
    .sort((a, b) => {
      const aForce = a.forceSpawn ? 1 : 0;
      const bForce = b.forceSpawn ? 1 : 0;
      if (aForce !== bForce) return bForce - aForce;
      const aHp = a.hp != null ? a.hp : (a.maxHp || 0);
      const bHp = b.hp != null ? b.hp : (b.maxHp || 0);
      const hpDiff = bHp - aHp;
      if (hpDiff !== 0) return hpDiff;
      return (b.maxHp || 0) - (a.maxHp || 0);
    })
    .slice(0, count);
}

// Returns the combined "Horde" boss representing all players NOT in top 5
function getHordePlayer() {
  const alive    = Object.values(players).filter(p => p.alive && p.uniqueId !== HORDE_ID);
  const top5ids  = new Set(getTopPlayers(5).map(p => p.uniqueId));
  const rest     = alive.filter(p => !top5ids.has(p.uniqueId));
  if (!rest.length) return null;

  const totalHp    = rest.reduce((sum, p) => sum + (p.hp    || 0),   0);
  const totalMaxHp = rest.reduce((sum, p) => sum + (p.maxHp || 100), 0);

  return {
    uniqueId: HORDE_ID,
    nickname: `THE HORDE`,
    hordeCount: rest.length,
    hp:    totalHp,
    maxHp: totalMaxHp,
    alive: true,
    isHorde: true,
  };
}

// ── Position helpers ──────────────────────────────────────────────────────────

// Fixed fallback anchor when a player is fully off-screen and has no last position
function getOffScreenAnchor() {
  return {
    x: canvas.clientWidth  / 2,
    y: canvas.clientHeight * 0.72,
  };
}

// Position for one of the top-5 players in the row
function getPlayerPos(player) {
  if (!player) return getOffScreenAnchor();

  const width  = canvas.clientWidth;
  const height = canvas.clientHeight;

  const alive = Object.values(players).filter(p => p.alive);
  if (!alive.length) return { x: width / 2, y: height / 2 };

  const sorted   = getTopPlayers(5);
  const playerId = player.uniqueId;
  const idx      = sorted.findIndex(p => p.uniqueId === playerId);

  if (idx === -1) {
    // Player not in top 5 — return last known or off-screen anchor
    return lastPlayerPositions[playerId] || getOffScreenAnchor();
  }

  const cols = 5;
  const rows = 1;

  const leftBuffer = 20;
  const rightBuffer = 90;
  const topBuffer   = height * 0.15;
  const botBuffer   = height * 0.25;

  const playW = Math.max(0, width  - leftBuffer - rightBuffer);
  const playH = Math.max(0, height - topBuffer  - botBuffer);

  const gapX  = layoutGapX;
  const gapY  = 0; // single row, no row gap needed

  const cellW = Math.max(80, (playW - gapX * (cols - 1)) / cols);
  const cellH = Math.max(80, playH);

  const gridWidth = cols * cellW + (cols - 1) * gapX;

  // offsetX shifts the entire row horizontally; offsetY shifts vertically
  const startX = leftBuffer + Math.max(0, (playW - gridWidth) / 2) + offsetX;
  const startY = topBuffer  + Math.max(0, (playH - cellH)     / 2) + offsetY;

  const col = idx % cols;
  const row = Math.floor(idx / cols);

  const x = startX + col * (cellW + gapX) + cellW / 2;
  const y = startY + row * cellH          + cellH  / 2;

  return { x, y };
}

// Position for the Horde boss — fixed slot to the right of the row
function getHordePos() {
  const width  = canvas.clientWidth;
  const height = canvas.clientHeight;
  // Place horde boss slightly above center-right, shifted by offsetY as well
  return {
    x: width  * 0.88,
    y: height * 0.30 + offsetY,
  };
}

// Master position resolver — ALWAYS use this for laser origins/targets
// so every fallback is consistent
function getAnimationPos(uniqueId) {
  // Special horde boss
  if (uniqueId === HORDE_ID) {
    return lastPlayerPositions[HORDE_ID] || getHordePos();
  }

  // Last known on-screen position (most reliable)
  if (lastPlayerPositions[uniqueId]) {
    return lastPlayerPositions[uniqueId];
  }

  // Player currently visible in top-5
  if (players[uniqueId]) {
    return getPlayerPos(players[uniqueId]);
  }

  // Truly unknown — use fixed anchor so ALL off-screen lasers land same spot
  return getOffScreenAnchor();
}

// Decide effective target for a laser: if target not in top-5, redirect to horde
function resolveTarget(targetId) {
  const inTop5 = getTopPlayers(5).some(p => p.uniqueId === targetId);
  return inTop5 ? targetId : HORDE_ID;
}

// ── Attack animation ─────────────────────────────────────────────────────────
class Attack {
  constructor(fromX, fromY, toX, toY, isKill, isSpecial = false) {
    this.fromX = fromX; this.fromY = fromY;
    this.toX   = toX;   this.toY   = toY;
    this.isKill    = isKill;
    this.isSpecial = isSpecial;
    this.startTime = Date.now();
    this.duration  = 650;
    this.progress  = 0;
  }

  update() {
    this.progress = Math.min(1, (Date.now() - this.startTime) / this.duration);
    return this.progress < 1;
  }

  draw(ctx) {
    const alpha   = 1 - this.progress;
    const easeOut = 1 - Math.pow(1 - this.progress, 2);
    const x = this.fromX + (this.toX - this.fromX) * easeOut;
    const y = this.fromY + (this.toY - this.fromY) * easeOut;

    const glowColor = this.isSpecial ? '255, 100, 100' : '100, 215, 255';
    const coreColor = this.isSpecial ? '255, 220, 120' : '180, 240, 255';
    const orbColor  = this.isSpecial ? '255, 217, 61'  : '150, 220, 255';

    // Outer glow
    ctx.strokeStyle = `rgba(${glowColor}, ${alpha * 0.22})`;
    ctx.lineWidth   = this.isSpecial ? 24 : 16;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();

    // Mid beam
    ctx.strokeStyle = `rgba(${glowColor}, ${alpha * 0.85})`;
    ctx.lineWidth   = this.isSpecial ? 10 : 6;
    ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();

    // Core line
    ctx.strokeStyle = `rgba(${coreColor}, ${alpha})`;
    ctx.lineWidth   = 2;
    ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();

    // Travelling orb
    ctx.fillStyle   = `rgba(${orbColor}, ${alpha})`;
    ctx.shadowColor = `rgba(${glowColor}, ${alpha * 0.7})`;
    ctx.shadowBlur  = 16;
    ctx.beginPath(); ctx.arc(x, y, this.isSpecial ? 12 : 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

    // Impact rings
    ctx.strokeStyle = `rgba(${glowColor}, ${alpha * 0.6})`;
    ctx.lineWidth   = 3;
    ctx.beginPath(); ctx.arc(this.toX, this.toY, 12 + 26 * this.progress, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = `rgba(${coreColor}, ${alpha * 0.35})`;
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.arc(this.toX, this.toY,  6 + 18 * this.progress, 0, Math.PI * 2); ctx.stroke();
  }
}

const attacks = [];

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io();

socket.on('connect',    () => { document.getElementById('serverStatus').textContent = '🟢 LIVE'; socket.emit('register', { type: 'overlay' }); });
socket.on('disconnect', () => { document.getElementById('serverStatus').textContent = 'Offline'; });

socket.on('gameState', (state) => { players = state || {}; updateUI(); });

socket.on('soundSettings', ({ enabled }) => { overlaySoundEnabled = !!enabled; });

socket.on('devSound', ({ type }) => {
  if (['laser', 'heal', 'special'].includes(type)) playSound(type);
});

// ── Attack handler ────────────────────────────────────────────────────────────
socket.on('attack', ({ attacker, target, damage, killed, special }) => {
  // Always use getAnimationPos for consistent laser anchoring
  const fromPos = getAnimationPos(attacker);
  const effectiveTarget = resolveTarget(target);
  const toPos   = getAnimationPos(effectiveTarget);

  if (players[attacker] && players[target]) {
    attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, killed, special));
    playSound('single');

    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (killed) players[target].alive = false;

    const attackerName = players[attacker].nickname || attacker.slice(0, 10);
    const targetName   = players[target].nickname   || target.slice(0, 10);

    addLog(`⚔️ ${attackerName} → ${targetName} -${damage}${special ? ' ⚡' : ''}${killed ? ' 💀' : ''}`, killed ? 'kill' : '');
    showDmg(toPos.x, toPos.y, damage, killed);
    updateUI();
  }
});

socket.on('giftAttack', ({ attacker, target, damage, killed }) => {
  const fromPos = getAnimationPos(attacker);
  const effectiveTarget = resolveTarget(target);
  const toPos   = getAnimationPos(effectiveTarget);

  if (players[attacker] && players[target]) {
    attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, killed, true));
    playSound('triple');

    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (killed || players[target].hp === 0) players[target].alive = false;

    const attackerName = players[attacker].nickname || attacker.slice(0, 10);
    const targetName   = players[target].nickname   || target.slice(0, 10);

    addLog(`🎁 ${attackerName} → ${targetName} -${damage}${killed ? ' 💀' : ''}`, killed ? 'kill' : 'gift');
    showDmg(toPos.x, toPos.y, damage, killed);
    updateUI();
  }
});

socket.on('giftEffect', ({ attacker, giftName, diamonds }) => {
  const attackerName = players[attacker]?.nickname || attacker || 'Someone';
  addLog(`🎁 ${attackerName} sent ${giftName || 'a gift'} (${diamonds || 0} 💎)`, 'gift');
});

socket.on('respawn', ({ uniqueId }) => {
  if (players[uniqueId]) {
    addLog(`✨ ${players[uniqueId].nickname || uniqueId.slice(0, 10)} respawned!`, '');
  }
});

socket.on('heal', ({ uniqueId, amount }) => {
  if (players[uniqueId]) {
    addLog(`💚 ${players[uniqueId].nickname || uniqueId.slice(0, 10)} healed +${amount} HP`, 'gift');
    playSound('heal');
  }
});

socket.on('backgroundChanged', ({ filename }) => {
  if (!filename) { backgroundImg = null; return; }
  const img  = new Image();
  img.onload = () => { backgroundImg = img; };
  img.src    = `/background/${filename}?v=${Date.now()}`;
});

socket.on('forceReload', () => location.reload());

// ── UI ────────────────────────────────────────────────────────────────────────
function updateUI() {
  const alive = Object.values(players).filter(p => p.alive);
  const shown = Math.min(20, alive.length);

  document.getElementById('playerCount').textContent  = alive.length;
  document.getElementById('showingCount').textContent = `${shown} / ${alive.length}`;

  const top3 = getTopPlayers(3);
  const html  = top3.map((p, i) => `
    <div class="board-entry rank-${i + 1}">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${(p.nickname || p.uniqueId || 'Player').slice(0, 14)}</span>
      <span class="rank-score">${Math.round(p.hp || 0)} HP</span>
    </div>
  `).join('');

  document.getElementById('leaderboard').innerHTML = html || '<div class="board-entry">No players</div>';
}

function addLog(msg, type) {
  const log   = document.getElementById('eventlog');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type || ''}`;
  entry.textContent = msg;
  log.insertBefore(entry, log.firstChild);
  while (log.children.length > 6) log.removeChild(log.lastChild);
}

function showDmg(x, y, dmg, isKill) {
  const el = document.createElement('div');
  el.className   = `dmg-number ${isKill ? 'kill' : ''}`;
  el.textContent = isKill ? '💀 KILL!' : `-${dmg}`;
  el.style.left  = (x - 20) + 'px';
  el.style.top   = (y - 30) + 'px';
  document.querySelector('.ui').appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBackground() {
  const width  = canvas.clientWidth;
  const height = canvas.clientHeight;

  if (!backgroundImg) {
    const gradient = ctx.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0,   '#b8f2b8');
    gradient.addColorStop(0.5, '#88d688');
    gradient.addColorStop(1,   '#9be99b');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    return;
  }

  const img   = backgroundImg;
  const scale = Math.max(width / img.width, height / img.height);
  const drawW = img.width  * scale;
  const drawH = img.height * scale;
  ctx.drawImage(img, (width - drawW) / 2, (height - drawH) / 2, drawW, drawH);
}

function drawPlayers() {
  const sorted = getTopPlayers(5);

  sorted.forEach((player, idx) => {
    const pos = getPlayerPos(player);

    // Always cache last position so lasers can find it later
    if (player.uniqueId) lastPlayerPositions[player.uniqueId] = { x: pos.x, y: pos.y };

    const rank    = idx + 1;
    const hpPct   = Math.max(0, Math.min(1, (player.hp || 100) / (player.maxHp || 100)));
    const hpValue = Math.round(player.hp || 100);
    const maxHp   = player.maxHp || 100;

    let nameSize = 20, barWidth = 140, emojiSize = 64;
    if      (rank === 1) { nameSize = 24; barWidth = 180; emojiSize = 88; }
    else if (rank === 2) { nameSize = 22; barWidth = 164; emojiSize = 80; }
    else if (rank === 3) { nameSize = 22; barWidth = 150; emojiSize = 76; }
    else if (rank <= 6)  { nameSize = 20; barWidth = 144; emojiSize = 72; }

    const glowRadius = emojiSize / 2 + 12;
    const name = (player.nickname || player.uniqueId || 'Player').slice(0, 14);

    // Name
    ctx.font         = `bold ${nameSize}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle  = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(name, pos.x, pos.y - emojiSize / 2 - 18);
    ctx.fillStyle = '#fff';
    ctx.fillText(name,   pos.x, pos.y - emojiSize / 2 - 18);

    // Glow ring
    ctx.fillStyle = `rgba(100, 200, 255, 0.1)`;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2); ctx.fill();

    // Emoji
    ctx.font         = `${emojiSize}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💎', pos.x, pos.y);

    // HP bar
    const barY = pos.y + emojiSize / 2 + 36;
    ctx.fillStyle   = '#0a0e1a';
    ctx.fillRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.strokeStyle = '#64c8ff'; ctx.lineWidth = 2;
    ctx.strokeRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(pos.x - barWidth / 2 + 2, barY + 2, Math.max(0, (barWidth - 4) * hpPct), 14);

    // HP text
    ctx.font         = `18px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.strokeStyle  = '#000'; ctx.lineWidth = 2;
    ctx.strokeText(`${hpValue}/${maxHp}`, pos.x, barY + 22);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${hpValue}/${maxHp}`,   pos.x, barY + 22);
  });

  // ── Draw Horde boss ─────────────────────────────────────────────────────────
  const horde = getHordePlayer();
  if (horde) {
    const pos = getHordePos();
    lastPlayerPositions[HORDE_ID] = { x: pos.x, y: pos.y };

    const hpPct   = Math.max(0, Math.min(1, horde.hp / (horde.maxHp || 1)));
    const barWidth = 160;
    const emojiSize = 80;

    // Pulsing danger glow
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
    ctx.fillStyle = `rgba(255, 60, 60, ${0.08 + pulse * 0.08})`;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, emojiSize / 2 + 24, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = `rgba(255, 80, 80, ${0.3 + pulse * 0.3})`;
    ctx.lineWidth   = 2;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, emojiSize / 2 + 28, 0, Math.PI * 2); ctx.stroke();

    // Name label
    ctx.font         = `bold 18px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle  = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('⚔ THE HORDE', pos.x, pos.y - emojiSize / 2 - 22);
    ctx.fillStyle = '#ff6666';
    ctx.fillText('⚔ THE HORDE',   pos.x, pos.y - emojiSize / 2 - 22);

    // Sub-label: count
    ctx.font      = `bold 13px Arial`;
    ctx.fillStyle = '#ffaaaa';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText(`${horde.hordeCount} players`, pos.x, pos.y - emojiSize / 2 - 6);
    ctx.fillText(`${horde.hordeCount} players`,   pos.x, pos.y - emojiSize / 2 - 6);

    // Boss emoji
    ctx.font         = `${emojiSize}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💀', pos.x, pos.y);

    // HP bar — red/orange for boss
    const barY = pos.y + emojiSize / 2 + 14;
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2;
    ctx.strokeRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.fillStyle = `rgba(255, ${Math.floor(80 + hpPct * 80)}, 0, 1)`;
    ctx.fillRect(pos.x - barWidth / 2 + 2, barY + 2, Math.max(0, (barWidth - 4) * hpPct), 14);

    const hpDisplay = Math.round(horde.hp);
    const maxDisplay = Math.round(horde.maxHp);
    ctx.font         = `14px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.strokeStyle  = '#000'; ctx.lineWidth = 2;
    ctx.strokeText(`${hpDisplay}/${maxDisplay}`, pos.x, barY + 22);
    ctx.fillStyle = '#ffcccc';
    ctx.fillText(`${hpDisplay}/${maxDisplay}`,   pos.x, barY + 22);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function animate() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  drawBackground();
  drawPlayers();

  for (let i = attacks.length - 1; i >= 0; i--) {
    if (!attacks[i].update()) {
      attacks.splice(i, 1);
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      attacks[i].draw(ctx);
      ctx.restore();
    }
  }

  requestAnimationFrame(animate);
}

animate();
updateUI();

if (!location.search.includes('v=')) {
  location.replace(location.pathname + '?v=' + Date.now());
}
</script>
