<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<title>Battle Royale Overlay · Professional Lasers</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Segoe UI', sans-serif; }
#overlay-wrap { position: absolute; inset: 0; background: #02040a; }
#overlay-positioner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: top 0.05s linear; }
#overlay-viewbox { position: relative; width: min(90vw, 1920px); max-height: 1080px; aspect-ratio: 16 / 9; pointer-events: none; }
#overlay-rect { position: relative; width: 100%; height: 100%; min-height: 240px; overflow: hidden; border-radius: 18px; background: rgba(4,8,18,0.85); border: 1px solid rgba(180,120,255,0.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 48px rgba(140,80,255,0.18); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 18px; }
.damage { position: fixed; font-weight: 900; font-size: clamp(18px,3vw,28px); color: #ff5050; text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9); animation: floatDamage 0.85s ease-out forwards; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); white-space: nowrap; }
.damage.kill { color: #ffd84f; font-size: clamp(22px,4vw,34px); text-shadow: 0 0 20px rgba(255,216,79,0.95); }
@keyframes floatDamage { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%,-160%) scale(0.65); } }
.ui { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.panel-wrapper { position: absolute; top: 16px; right: 0; display: flex; align-items: flex-start; pointer-events: auto; }
.panel-tab { width: 28px; background: rgba(6,10,20,0.88); border: 1px solid rgba(100,200,255,0.2); border-right: none; border-radius: 8px 0 0 8px; padding: 10px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #8fd8ff; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; writing-mode: vertical-rl; text-orientation: mixed; user-select: none; transition: background 0.2s; }
.panel-tab:hover { background: rgba(20,40,70,0.95); }
.panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }
.layout-panel { width: 240px; padding: 14px 16px; border-radius: 0 0 0 16px; background: rgba(6,10,20,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(100,200,255,0.14); border-right: none; box-shadow: -8px 0 30px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; transform-origin: right top; }
.layout-panel.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
.layout-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.layout-title { color: #8fd8ff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.layout-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; transition: 0.2s; }
.layout-btn:hover { background: rgba(255,255,255,0.12); }
.control { margin-bottom: 13px; }
.control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.control-top span { font-size: 11px; color: #cfefff; }
.control input { width: 100%; appearance: none; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); outline: none; }
.control input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; }
#status-badge { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 24px; padding: 4px 16px; font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #aaa; pointer-events: none; z-index: 9999; font-family: monospace; transition: 0.2s; }
#status-badge.connected { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
#status-badge.disconnected { color: #ff8866; }
</style>

<script src="/socket.io/socket.io.js"></script>

</head>

<body>

<div id="overlay-wrap">
  <div id="overlay-positioner">
    <div id="overlay-viewbox">
      <div id="overlay-rect">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<div class="ui">
  <div class="panel-wrapper">
    <div class="panel-tab" id="togglePanel">
      <span class="panel-tab-icon">⚡</span>
      LAYOUT
    </div>
    <div class="layout-panel" id="layoutPanel">
      <div class="control">
        <div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div>
        <input id="gapControl" type="range" min="0" max="200" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div>
        <input id="offsetXControl" type="range" min="-400" max="400" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div>
        <input id="offsetYControl" type="range" min="-200" max="200" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Layout Height</span><span id="heightValue">20%</span></div>
        <input id="heightControl" type="range" min="10" max="55" value="20" />
      </div>
      <div class="control">
        <div class="control-top"><span>Screen Position</span><span id="screenYValue">↕ Centre</span></div>
        <input id="screenYControl" type="range" min="-50" max="50" value="0" />
      </div>
    </div>
  </div>
</div>
<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>

<script>
(function () {
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const rectEl  = document.getElementById('overlay-rect');
  const statusDiv = document.getElementById('status-badge');

  let players = {};
  let attacks = [];
  let layoutGap = 0, offsetX = 0, offsetY = 0, layoutScale = 1;
  let backgroundImg = null;
  const audioCache = {};
  let audioConfig = {}, soundEnabled = true;
  const HORDE_ID = '__HORDE__';
  let currentScale = 1;
  let socket = null;
  let isConnected = false;

  function cw() { return rectEl.offsetWidth; }
  function ch() { return rectEl.offsetHeight; }

  function clampOverlaySettings() {
    const W = cw(), H = ch();
    const cardH = H * 0.60 * 0.84;
    const cardW = cardH * 0.72;
    const totalCardsWidth = cardW * 5;
    const maxGap = Math.max(0, (W - totalCardsWidth) / 4);
    layoutGap = Math.min(maxGap, Math.max(0, layoutGap));

    const totalRowWidth = cardW * 5 + layoutGap * 4;
    const maxOffsetX = Math.max(0, (W - totalRowWidth) / 2);
    offsetX = Math.min(maxOffsetX, Math.max(-maxOffsetX, offsetX));

    const minOffsetY = -H * 0.2;
    const maxOffsetY = H * 0.3;
    offsetY = Math.min(maxOffsetY, Math.max(minOffsetY, offsetY));

    if (gapControl) gapControl.max = Math.round(maxGap);
    if (offsetXControl) { offsetXControl.max = Math.round(maxOffsetX); offsetXControl.min = -Math.round(maxOffsetX); }
    if (offsetYControl) { offsetYControl.min = Math.round(minOffsetY); offsetYControl.max = Math.round(maxOffsetY); }
  }

  function getPlayerPosition(index) {
    const W = cw(), cellW = (W * 0.82) / 5, gap = layoutGap * currentScale;
    const totalW = cellW * 5 + gap * 4, startX = (W - totalW) / 2 + offsetX;
    return { x: startX + index * (cellW + gap) + cellW / 2, y: ch() * 0.30 + offsetY };
  }

  function isPlayerAlive(player) {
    return player && player.alive !== false;
  }

  function getPositionForPlayer(playerId) {
    const allAlive = Object.values(players).filter(p => isPlayerAlive(p) && p.uniqueId !== HORDE_ID);
    const index = allAlive.findIndex(p => p.uniqueId === playerId || p.id === playerId);
    if (index === -1) return null;
    const total = allAlive.length;
    const W = cw();
    const cellW = (W * 0.82) / total;
    const gap = layoutGap * currentScale;
    const totalW = cellW * total + gap * (total - 1);
    const startX = (W - totalW) / 2 + offsetX;
    return { x: startX + index * (cellW + gap) + cellW / 2, y: ch() * 0.30 + offsetY };
  }

  function getHordePosition() { return { x: cw() / 2 + offsetX, y: ch() * 0.78 + offsetY }; }

  function canvasToViewport(cx, cy) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = rect.width  / cw();
    const scaleY = rect.height / ch();
    return { x: rect.left + cx * scaleX, y: rect.top + cy * scaleY };
  }

  function resizeCanvas() {
    const w = rectEl.offsetWidth, h = rectEl.offsetHeight;
    canvas.width  = w;
    canvas.height = h;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    clampOverlaySettings();
    syncValues();
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const gapControl     = document.getElementById('gapControl');
  const offsetXControl = document.getElementById('offsetXControl');
  const offsetYControl = document.getElementById('offsetYControl');
  const heightControl  = document.getElementById('heightControl');
  const screenYControl = document.getElementById('screenYControl');
  const positioner     = document.getElementById('overlay-positioner');

  function syncValues() {
    clampOverlaySettings();
    document.getElementById('gapValue').textContent    = Math.round(layoutGap);
    document.getElementById('offsetXValue').textContent = Math.round(offsetX);
    document.getElementById('offsetYValue').textContent = Math.round(offsetY);
    if (gapControl) gapControl.value = layoutGap;
    if (offsetXControl) offsetXControl.value = offsetX;
    if (offsetYControl) offsetYControl.value = offsetY;
  }

  gapControl.oninput     = () => { layoutGap = +gapControl.value;     syncValues(); };
  offsetXControl.oninput = () => { offsetX   = +offsetXControl.value; syncValues(); };
  offsetYControl.oninput = () => { offsetY   = +offsetYControl.value; syncValues(); };
  heightControl.oninput  = () => {
    const pct = +heightControl.value;
    document.getElementById('heightValue').textContent = pct + '%';
    rectEl.style.height = pct + 'vh';
    resizeCanvas();
    syncValues();
  };
  screenYControl.oninput = () => {
    const v = +screenYControl.value;
    document.getElementById('screenYValue').textContent = v === 0 ? '↕ Centre' : v > 0 ? `▲ ${v}%` : `▼ ${Math.abs(v)}%`;
    positioner.style.top = (50 - v) + 'vh';
  };
  syncValues();

  const panel = document.getElementById('layoutPanel');
  const tab   = document.getElementById('togglePanel');
  tab.onclick = () => { panel.classList.toggle('hidden'); tab.querySelector('.panel-tab-icon').textContent = panel.classList.contains('hidden') ? '⚙' : '⚡'; };

  function getAudio(f) { if (!audioCache[f]) { const a = new Audio(`/audio/${f}`); a.preload = 'auto'; audioCache[f] = a; } return audioCache[f]; }
  function playSound(type) { if (!soundEnabled) return; const f = audioConfig[type]; if (!f) return; try { const a = getAudio(f); a.currentTime = 0; a.play().catch(() => {}); } catch(e) {} }

  function topPlayers() { return Object.values(players).filter(p => isPlayerAlive(p) && p.uniqueId !== HORDE_ID).sort((a, b) => (b.hp || 0) - (a.hp || 0)).slice(0, 5); }

  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest   = Object.values(players).filter(p => isPlayerAlive(p) && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return { uniqueId: HORDE_ID, nickname: 'THE HORDE', hp: rest.reduce((s, p) => s + (p.hp || 0), 0), maxHp: rest.reduce((s, p) => s + (p.maxHp || 100), 0), hordeCount: rest.length, alive: true };
  }

  function initSocket() {
    try {
      socket = io({ transports: ['websocket', 'polling'], timeout: 5000 });
      socket.on('connect', () => {
        isConnected = true;
        statusDiv.textContent = '🟢 LIVE · CONNECTED';
        statusDiv.className   = 'connected';
        console.log('Overlay socket connected', socket.id);
        socket.emit('register', { type: 'overlay' });
      });

      socket.on('disconnect', () => { isConnected = false; statusDiv.textContent = '🔴 DISCONNECTED · waiting...'; statusDiv.className = 'disconnected'; });
      socket.on('connect_error', (err) => { console.warn('Socket connection error:', err); statusDiv.textContent = '⚠️ SERVER ERROR · retrying'; statusDiv.className = 'disconnected'; });

      socket.on('gameState', (state) => {
        try {
          if (state && typeof state === 'object') {
            const normalized = {};
            for (const k in state) {
              const p = state[k] || {};
              p.uniqueId = p.uniqueId || p.id || k;
              normalized[p.uniqueId] = p;
            }
            players = normalized;
            const aliveCount = Object.values(players).filter(isPlayerAlive).length;
            console.log('gameState received, total players=', Object.keys(players).length, 'alive=', aliveCount);
          }
        } catch (e) { console.error('Error applying gameState', e, state); }

        if (!players || Object.keys(players).length === 0) {
          fetch('/state').then(r => r.json()).then(s => {
            try {
              const normalized = {};
              for (const k in s) { const p = s[k] || {}; p.uniqueId = p.uniqueId || p.id || k; normalized[p.uniqueId] = p; }
              players = normalized;
              console.log('Fetched /state fallback, players=', Object.keys(players).length);
            } catch (e) { console.error('Error normalizing /state', e, s); }
          }).catch(err => console.warn('Fallback /state request failed', err));
        }
      });

      socket.on('audioConfig', (cfg) => { if (cfg) audioConfig = cfg; });
      socket.on('backgroundChanged', ({ filename }) => { if (!filename) { backgroundImg = null; return; } const img = new Image(); img.onload = () => { backgroundImg = img; }; img.src = `/background/${filename}?v=${Date.now()}`; });

      socket.on('attack', (data) => { fireAttack(data.attacker, data.target, data.damage, data.killed, data.special, data.effect); });
      socket.on('giftAttack', ({ attacker, target, damage, killed }) => { fireAttack(attacker, target, damage, killed, true); });

    } catch (err) { console.error('Socket init error:', err); statusDiv.textContent = '❌ SOCKET ERROR · no live data'; statusDiv.className   = 'disconnected'; }
  }

  function drawBackground() {
    const W = cw(), H = ch();
    if (backgroundImg) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      ctx.drawImage(backgroundImg, (W - backgroundImg.width * scale) / 2, (H - backgroundImg.height * scale) / 2, backgroundImg.width * scale, backgroundImg.height * scale);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1a2e'); g.addColorStop(1, '#050b12'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(100,200,255,0.04)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(140,80,255,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
    }
  }

  function drawNeonLaser(ctx, from, to, progress, special, time) {
    const headX = from.x + (to.x - from.x) * progress;
    const headY = from.y + (to.y - from.y) * progress;
    const intensity  = 0.7 + Math.sin(time * 0.018) * 0.3;
    const coreColor  = special ? '#fff2b0' : '#ffffff';
    const midColor   = special ? '#ff6640' : '#00ccff';
    const glowColor  = special ? '#ff2200' : '#0066ff';
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(headX, headY); ctx.strokeStyle = glowColor; ctx.lineWidth = 32 * intensity; ctx.globalAlpha = 0.35; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x + 4, from.y + 2); ctx.lineTo(headX + 4, headY + 2); ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 14; ctx.globalAlpha = 0.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x - 4, from.y - 2); ctx.lineTo(headX - 4, headY - 2); ctx.strokeStyle = '#33ffcc'; ctx.lineWidth = 14; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(headX, headY); ctx.strokeStyle = midColor; ctx.lineWidth = 10 * intensity; ctx.globalAlpha = 0.9; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(headX, headY); ctx.strokeStyle = coreColor; ctx.lineWidth = 3.5; ctx.setLineDash([12, 8]); ctx.stroke(); ctx.setLineDash([]);
    const headRad = 12 + Math.sin(time * 0.025) * 2.5; ctx.shadowBlur = 20; ctx.shadowColor = midColor; ctx.beginPath(); ctx.arc(headX, headY, headRad, 0, Math.PI * 2); ctx.fillStyle = coreColor; ctx.globalAlpha = 1; ctx.fill();
    for (let i = 1; i <= 6; i++) { const trailT = Math.max(0, progress - i * 0.025); if (trailT <= 0) break; const trailX = from.x + (to.x - from.x) * trailT; const trailY = from.y + (to.y - from.y) * trailT; const age  = progress - trailT; const size = 3 * (1 - age * 3); if (size <= 0) continue; ctx.beginPath(); ctx.arc(trailX, trailY, size, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 200, ${1 - age * 2})`; ctx.fill(); }
    ctx.restore();
  }

  function drawRippleLaser(ctx, from, to, progress, special, time) { const headX = from.x + (to.x - from.x) * progress; const headY = from.y + (to.y - from.y) * progress; ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (let i = 0; i < 4; i++) { const delay = i * 0.08; const ringPhase = (progress - delay) * 2.5; if (ringPhase < 0 || ringPhase > 1) continue; const radius = 10 + ringPhase * 45; const alpha  = (1 - ringPhase) * 0.7; ctx.beginPath(); ctx.arc(headX, headY, radius, 0, Math.PI * 2); ctx.strokeStyle = `rgba(100,220,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke(); } ctx.restore(); }
  function drawFireLaser(ctx, from, to, progress, special, time, particles) { const headX = from.x + (to.x - from.x) * progress; const headY = from.y + (to.y - from.y) * progress; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const flameRad = 14 + Math.sin(time * 0.03) * 2; const grad = ctx.createRadialGradient(headX - 4, headY - 4, 2, headX, headY, flameRad); grad.addColorStop(0, '#fff8e0'); grad.addColorStop(0.3, '#ffaa44'); grad.addColorStop(0.7, '#ff4400'); grad.addColorStop(1, '#992200'); ctx.beginPath(); ctx.arc(headX, headY, flameRad, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill(); ctx.restore(); }
  function drawBubbleLaser(ctx, from, to, progress, special, time) { const headX = from.x + (to.x - from.x) * progress; const headY = from.y + (to.y - from.y) * progress; ctx.save(); ctx.globalCompositeOperation = 'source-over'; for (let i = 0; i < 3; i++) { const angle = time * 0.03 + i * 1.2; const rad = 9 + Math.sin(time * 0.04 + i) * 2; const x = headX + Math.cos(angle) * rad; const y = headY + Math.sin(angle) * rad * 0.6; const size = 12 - i * 2; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fillStyle = 'rgba(200,240,255,0.7)'; ctx.fill(); } ctx.restore(); }
  function drawSphereLaser(ctx, from, to, progress, special, time) { const headX  = from.x + (to.x - from.x) * progress; const headY  = from.y + (to.y - from.y) * progress; const radius = 18 + Math.sin(time * 0.015) * 2; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const coreGrad = ctx.createRadialGradient(headX - 6, headY - 6, 3, headX, headY, radius); coreGrad.addColorStop(0, '#bbffff'); coreGrad.addColorStop(0.4, '#2288ff'); coreGrad.addColorStop(1, '#002244'); ctx.beginPath(); ctx.arc(headX, headY, radius, 0, Math.PI * 2); ctx.fillStyle = coreGrad; ctx.fill(); ctx.restore(); }

  class Particle { constructor(x, y, opts = {}) { this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * (opts.speed || 4); this.vy = (Math.random() - 0.5) * (opts.speed || 4) - (opts.rise || 0); this.life = 1; this.decay = opts.decay || (0.02 + Math.random() * 0.03); this.r = opts.radius || (2 + Math.random() * 3); this.color = opts.color || '#7afcff'; this.emoji = opts.emoji || null; this.fs = opts.fontSize || 18; } update() { this.x += this.vx; this.y += this.vy; this.vy += 0.06; this.life -= this.decay; return this.life > 0; } draw(c) { c.save(); c.globalAlpha = Math.max(0, this.life); if (this.emoji) { c.font = `${this.fs}px Arial`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(this.emoji, this.x, this.y); } else { c.fillStyle = this.color; c.shadowColor = this.color; c.shadowBlur = 8; c.beginPath(); c.arc(this.x, this.y, this.r * Math.max(0, this.life), 0, Math.PI * 2); c.fill(); } c.restore(); } }

  class Attack {
    constructor(from, to, effectType = 'laser') {
      this.from = from; this.to = to; this.effectType = effectType; this.start = performance.now(); this.progress = 0; this.alpha = 1; this.particles = []; this.trail = []; this._spawned = false; this._impacted = false;
      switch (effectType) {
        case 'laser': this.duration = 420; break;
        case 'projectile': this.duration = 600; this.radius = 7; break;
        case 'gift': this.duration = 900; break;
        case 'explosion': this.duration = 750; this.rings = [{maxR:55},{maxR:38}]; break;
        case 'neon': case 'ripple': case 'bubble': case 'sphere': this.duration = 550; break;
        case 'fire': this.duration = 550; for (let i = 0; i < 40; i++) this.particles.push(new Particle(this.to?.x||0, this.to?.y||0, {speed:4+Math.random()*4, color:'#ff8844', radius:2+Math.random()*3, decay:0.03})); break;
        default: this.duration = 500;
      }
    }
    update() { const elapsed = performance.now() - this.start; this.progress = Math.min(1, elapsed / this.duration); this.alpha = this.progress < 0.6 ? 1 : 1 - (this.progress - 0.6) / 0.4; this.particles = this.particles.filter(p => p.update()); return elapsed < this.duration || this.particles.length > 0; }
    draw() { const now = performance.now(); switch (this.effectType) { case 'laser': this._drawLaser(); break; case 'projectile': this._drawProjectile(); break; case 'gift': this._drawGift(); break; case 'explosion': this._drawExplosion(); break; case 'neon': drawNeonLaser(ctx, this.from, this.to, this.progress, false, now); break; case 'ripple': drawRippleLaser(ctx, this.from, this.to, this.progress, false, now); break; case 'fire': drawFireLaser(ctx, this.from, this.to, this.progress, false, now, this.particles); break; case 'bubble': drawBubbleLaser(ctx, this.from, this.to, this.progress, false, now); break; case 'sphere': drawSphereLaser(ctx, this.from, this.to, this.progress, false, now); break; } }
    _drawLaser() { const { from, to, alpha } = this; const flicker = 0.75 + Math.random() * 0.25; ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.lineCap = 'round'; ctx.shadowColor = '#7afcff'; ctx.shadowBlur = 22; ctx.strokeStyle = `rgba(122,252,255,${alpha * flicker * 0.5})`; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); ctx.strokeStyle = `rgba(255,255,255,${alpha * flicker})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); if (this.progress < 0.82) { ctx.beginPath(); ctx.arc(to.x, to.y, 6, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill(); } ctx.restore(); }
    _drawProjectile() { const { from, to, progress, radius = 7 } = this; const px = from.x + (to.x - from.x) * progress; const py = from.y + (to.y - from.y) * progress; this.trail.push({ x: px, y: py, a: this.alpha }); if (this.trail.length > 18) this.trail.shift(); ctx.save(); ctx.globalCompositeOperation = 'screen'; for (let i = 0; i < this.trail.length; i++) { const t = this.trail[i]; const a = (i / this.trail.length) * t.a * 0.6; ctx.beginPath(); ctx.arc(t.x, t.y, Math.max(0.6, (i / this.trail.length) * radius * 0.6), 0, Math.PI * 2); ctx.fillStyle = `rgba(122,252,255,${a})`; ctx.fill(); } const grad = ctx.createRadialGradient(px, py, 0, px, py, radius * 2); grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.5, 'rgba(122,252,255,0.9)'); grad.addColorStop(1, 'rgba(122,252,255,0)'); ctx.beginPath(); ctx.arc(px, py, radius * 2, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill(); if (progress > 0.9 && !this._impacted) { this._impacted = true; for (let i = 0; i < 12; i++) this.particles.push(new Particle(to.x, to.y, { speed: 4 + Math.random() * 4, color: '#7afcff', radius: 2 + Math.random() * 3, decay: 0.03 })); } this.particles.forEach(p => p.draw(ctx)); ctx.restore(); }
    _drawGift() { if (!this._spawned) { this._spawned = true; for (let i = 0; i < 18; i++) this.particles.push(new Particle(this.to.x, this.to.y, { speed: 6 + Math.random() * 4, color: ['#ffd84f','#ff9aff','#7afcff','#ff7777'][i % 4], radius: 2 + Math.random() * 3, decay: 0.017 })); } ctx.save(); ctx.globalCompositeOperation = 'screen'; this.particles.forEach(p => p.draw(ctx)); ctx.restore(); }
    _drawExplosion() { if (!this._spawned) { this._spawned = true; for (let i = 0; i < 28; i++) this.particles.push(new Particle(this.to.x, this.to.y, { speed: 5 + Math.random() * 8, color: ['#ff6644','#ffcc44','#ff2222'][i % 3], radius: 3 + Math.random() * 4, decay: 0.015 })); } ctx.save(); ctx.globalCompositeOperation = 'screen'; this.particles.forEach(p => p.draw(ctx)); ctx.restore(); }
  }

  function showDamage(canvasX, canvasY, dmg, kill) {
    const vp = canvasToViewport(canvasX, canvasY);
    const el = document.createElement('div');
    el.className   = `damage${kill ? ' kill' : ''}`;
    el.textContent = kill ? '💀 KILL!' : `-${Math.round(dmg)}`;
    el.style.left = vp.x + 'px'; el.style.top = vp.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function fireAttack(attackerId, targetId, damage, killed, special, effect) {
    const top   = topPlayers();
    const horde = hordePlayer();

    let from = null;
    if (attackerId === HORDE_ID) { if (horde) from = getHordePosition(); }
    else {
      const topIdx = top.findIndex(p => p.uniqueId === attackerId || p.id === attackerId);
      if (topIdx !== -1) { from = getPlayerPosition(topIdx); } else { from = getPositionForPlayer(attackerId); }
    }

    let to = null;
    if (targetId === HORDE_ID) { if (horde) to = getHordePosition(); }
    else {
      const topIdx = top.findIndex(p => p.uniqueId === targetId || p.id === targetId);
      if (topIdx !== -1) { to = getPlayerPosition(topIdx); } else { to = getPositionForPlayer(targetId); }
    }

    if (!from || !to) { console.warn(`Attack skipped: cannot find positions for attacker=${attackerId} target=${targetId}`); return; }

    let effectType;
    if (effect) { const e = String(effect).toLowerCase(); const map = { fire:'fire', bubble:'bubble', bubbles:'bubble', neon:'neon', ripple:'ripple', sphere:'sphere', laser:'laser', projectile:'projectile', gift:'gift', explosion:'explosion' }; effectType = map[e] || e; }
    else if (special) effectType = 'gift';
    else if (killed) effectType = 'explosion';
    else { const pool = ['laser','projectile','neon','ripple','fire','bubble','sphere']; effectType = pool[Math.floor(Math.random() * pool.length)]; }

    attacks.push(new Attack(from, to, effectType));
    showDamage(to.x, to.y, damage, killed);
    playSound(special ? 'gift' : 'attack');
  }

  function draw() {
    currentScale = Math.min(cw() / 1920, ch() / 200, 1.4) * layoutScale; if (currentScale < 0.05) currentScale = 0.05;
    ctx.clearRect(0, 0, cw(), ch());
    drawBackground();
    const topList = topPlayers();
    topList.forEach((p, i) => drawPlayerCard(p, getPlayerPosition(i), i + 1));
    drawHorde(hordePlayer());
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });
    requestAnimationFrame(draw);
  }

  function drawPlayerCard(player, pos, rank) {
    const hp    = player.hp    || 0; const maxHp = player.maxHp || 100; const hpPct = Math.max(0, Math.min(1, hp / maxHp));
    const H = ch(), cardH = H * 0.60 * 0.84, cardW = cardH * 0.72; const cx = pos.x, cy = pos.y; const avatarR = cardH * 0.26, avatarY = cy - cardH * 0.14; const nameY  = avatarY - avatarR - cardH * 0.06; const barW   = cardW * 0.88, barH = Math.max(6, cardH * 0.09); const barX   = cx - barW / 2, barY = avatarY + avatarR + cardH * 0.05; const hpTextY = barY + barH + cardH * 0.07;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, avatarR * 2.5); glow.addColorStop(0, 'rgba(122,252,255,0.18)'); glow.addColorStop(1, 'rgba(122,252,255,0)'); ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, avatarR * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rank === 1 ? 'rgba(255,210,80,0.7)' : 'rgba(122,252,255,0.35)'; ctx.lineWidth = Math.max(2, avatarR * 0.08); ctx.beginPath(); ctx.arc(cx, avatarY, avatarR, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(8,18,30,0.92)'; ctx.beginPath(); ctx.arc(cx, avatarY, avatarR - 2, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${avatarR * 1.3}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(player.iconEmoji || '⚔️', cx, avatarY);
    const nameFontSize = Math.max(9, cardH * 0.11); ctx.font = `bold ${nameFontSize}px "Segoe UI"`; ctx.textBaseline = 'middle'; const name = (player.nickname || player.uniqueId || 'Player').slice(0, 13); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(name, cx, nameY); ctx.fillStyle = '#fff'; ctx.fillText(name, cx, nameY);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(barX, barY, barW, barH); const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0); hpGrad.addColorStop(0, hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#ff4d4d'); hpGrad.addColorStop(1, '#ffffff55'); ctx.fillStyle = hpGrad; ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpPct, barH - 2); ctx.strokeStyle = 'rgba(122,252,255,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);
    const hpFontSize = Math.max(8, cardH * 0.085); ctx.font = `${hpFontSize}px "Segoe UI"`; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.strokeText(`${Math.round(hp)}/${maxHp}`, cx, hpTextY); ctx.fillStyle = '#ccc'; ctx.fillText(`${Math.round(hp)}/${maxHp}`, cx, hpTextY);
  }

  function drawHorde(horde) {
    if (!horde) return;
    const pos = getHordePosition(), H = ch(), rowH = H * 0.40; const pulse = 0.5 + Math.sin(Date.now() / 350) * 0.5; const skullR = rowH * 0.28, cx = pos.x, cy = pos.y;
    ctx.beginPath(); ctx.arc(cx, cy, skullR + pulse * 4, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,70,70,${0.08 + pulse * 0.05})`; ctx.fill(); ctx.strokeStyle = `rgba(255,70,70,${0.5 + pulse * 0.3})`; ctx.lineWidth = Math.max(2, skullR * 0.1); ctx.beginPath(); ctx.arc(cx, cy, skullR * 0.88, 0, Math.PI * 2); ctx.stroke(); ctx.font = `${skullR * 1.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💀', cx, cy);
    const titleFont = Math.max(10, rowH * 0.22); ctx.font = `bold ${titleFont}px "Segoe UI"`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText('⚔ THE HORDE', cx - skullR * 1.35, cy - rowH * 0.1); ctx.fillStyle = '#ff7b7b'; ctx.fillText('⚔ THE HORDE', cx - skullR * 1.35, cy - rowH * 0.1); ctx.font = `${Math.max(8, rowH * 0.16)}px "Segoe UI"`; ctx.textAlign = 'right'; ctx.fillStyle = '#ffc2c2'; ctx.fillText(`${horde.hordeCount} players`, cx - skullR * 1.35, cy + rowH * 0.14);
    const hpPct = Math.min(1, horde.hp / Math.max(1, horde.maxHp)); const barW = cw() * 0.28, barH2 = Math.max(8, rowH * 0.16); const barX = cx + skullR * 1.35, barY = cy - barH2 / 2; ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH2); const rg = ctx.createLinearGradient(barX, 0, barX + barW, 0); rg.addColorStop(0, '#ff2222'); rg.addColorStop(1, '#ff8888'); ctx.fillStyle = rg; ctx.fillRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH2 - 4); ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH2);
    ctx.font = `${Math.max(8, rowH * 0.14)}px "Segoe UI"`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; const hpStr = `${Math.round(horde.hp)} / ${Math.round(horde.maxHp)}`; ctx.strokeText(hpStr, barX, barY + barH2 + rowH * 0.12); ctx.fillStyle = '#ffaaaa'; ctx.fillText(hpStr, barX, barY + barH2 + rowH * 0.12);
  }

  initSocket();
  draw();
})();
</script>
