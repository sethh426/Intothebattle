<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PvP Battle Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #8edc8e;
  }

  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #b8f2b8 0%, #88d688 50%, #9be99b 100%);
  }

  /* Canvas */
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI Container */
  .ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* Panels */
  .panel {
    position: absolute;
    background: rgba(8, 12, 24, 0.85);
    border: 1px solid rgba(100, 200, 255, 0.25);
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    font-size: 12px;
    color: #fff;
  }

  /* Bottom Left - Status */
  .status {
    bottom: 12px;
    left: 12px;
    width: 280px;
    min-height: 100px;
  }

  .status-title {
    font-size: 12px;
    font-weight: 700;
    color: #64c8ff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(100, 200, 255, 0.2);
    padding-bottom: 6px;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 12px;
  }

  .status-label {
    color: #a0c0ff;
  }

  .status-value {
    color: #64c8ff;
    font-weight: 600;
  }

  .live-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ff4444;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Top Right - Leaderboard */
  .leaderboard {
    top: 12px;
    right: 12px;
    width: 260px;
    max-height: 280px;
  }

  .board-title {
    font-size: 12px;
    font-weight: 700;
    color: #ffd93d;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255, 217, 61, 0.2);
    padding-bottom: 6px;
  }

  .board-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 8px;
    margin: 4px 0;
    background: rgba(100, 200, 255, 0.08);
    border: 1px solid rgba(100, 200, 255, 0.15);
    border-radius: 6px;
    font-size: 12px;
    transition: all 0.1s;
  }

  .board-entry.rank-1 {
    background: rgba(255, 217, 61, 0.12);
    border-color: rgba(255, 217, 61, 0.3);
  }

  .board-entry.rank-2 {
    background: rgba(200, 200, 200, 0.08);
    border-color: rgba(200, 200, 200, 0.2);
  }

  .board-entry.rank-3 {
    background: rgba(200, 100, 100, 0.08);
    border-color: rgba(200, 100, 100, 0.2);
  }

  .rank-num {
    min-width: 18px;
    font-weight: 700;
    color: #64c8ff;
  }

  .rank-name {
    flex: 1;
    margin: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-score {
    color: #ffd93d;
    font-weight: 700;
    min-width: 30px;
    text-align: right;
  }

  /* Bottom - Event Log */
  .eventlog {
    right: 12px;
    bottom: 12px;
    width: 280px;
    height: 120px;
    max-height: 120px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .leaderboard {
    top: 12px;
    right: 12px;
    width: 280px;
    max-height: 220px;
  }

  .controls {
    top: 250px;
    right: 12px;
    width: 280px;
    pointer-events: auto;
  }

  .controls-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: #64c8ff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(100, 200, 255, 0.2);
    padding-bottom: 6px;
  }

  .controls-title button {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(100, 200, 255, 0.25);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
  }

  .controls.hidden {
    display: none;
  }

  .control-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    font-size: 12px;
  }

  .control-row span {
    color: #e1f7ff;
  }

  .control-row input[type="range"] {
    width: 100%;
  }

  .eventlog > #eventlog {
    max-height: calc(100% - 26px);
    overflow-y: auto;
  }

  .log-title {
    font-size: 12px;
    font-weight: 700;
    color: #64c8ff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(100, 200, 255, 0.2);
    padding-bottom: 6px;
  }

  .log-entry {
    padding: 4px 6px;
    margin: 2px 0;
    background: rgba(255, 255, 255, 0.04);
    border-left: 2px solid rgba(100, 200, 255, 0.3);
    border-radius: 4px;
    font-size: 10px;
    line-height: 1.2;
    color: #ddd;
  }

  .log-entry.kill {
    background: rgba(255, 51, 51, 0.12);
    border-left-color: #ff4444;
    color: #ffdddd;
    font-weight: 600;
  }

  .log-entry.gift {
    background: rgba(255, 217, 61, 0.12);
    border-left-color: #ffd93d;
    color: #ffe6cc;
  }

  /* Scrollbar */
  .eventlog::-webkit-scrollbar {
    width: 6px;
  }

  .eventlog::-webkit-scrollbar-thumb {
    background: rgba(100, 200, 255, 0.3);
    border-radius: 3px;
  }

  /* Damage Numbers */
  .dmg-number {
    position: absolute;
    font-size: 32px;
    font-weight: 900;
    color: #ff3333;
    text-shadow: 0 0 12px rgba(255, 51, 51, 0.8), 2px 2px 6px rgba(0, 0, 0, 0.95);
    pointer-events: none;
    animation: dmgFloat 0.7s ease-out forwards;
    z-index: 30;
  }

  @keyframes dmgFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
  }

  .dmg-number.kill {
    color: #ffd93d;
    font-size: 40px;
    text-shadow: 0 0 16px rgba(255, 217, 61, 0.9), 2px 2px 6px rgba(0, 0, 0, 0.95);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="panel status">
    <div class="status-title"><span class="live-indicator"></span>Battle Status</div>
    <div class="status-row">
      <span class="status-label">Server:</span>
      <span class="status-value" id="serverStatus">Connecting...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Players:</span>
      <span class="status-value" id="playerCount">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Showing:</span>
      <span class="status-value" id="showingCount">0 / 0</span>
    </div>
  </div>

  <div class="panel leaderboard">
    <div class="board-title">🏆 Highest HP (Top 20)</div>
    <div id="leaderboard"></div>
  </div>

  <div class="panel eventlog">
    <div class="log-title">⚔️ Events</div>
    <div id="eventlog"></div>
  </div>
  <div class="panel controls" id="layoutControls">
    <div class="controls-title">
      <span>⚙️ Layout Controls</span>
      <button id="toggleControls">Hide</button>
    </div>
    <label class="control-row">
      <span>Column Gap</span>
      <input id="gapXControl" type="range" min="0" max="220" step="10" value="150" />
      <span id="gapXValue">150</span>
    </label>
    <label class="control-row">
      <span>Row Gap</span>
      <input id="gapYControl" type="range" min="100" max="1000" step="10" value="260" />
      <span id="gapYValue">260</span>
    </label>
  </div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
let players = {};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const gapXControl = document.getElementById('gapXControl');
const gapYControl = document.getElementById('gapYControl');
const gapXValue = document.getElementById('gapXValue');
const gapYValue = document.getElementById('gapYValue');
const toggleControls = document.getElementById('toggleControls');
const layoutControls = document.getElementById('layoutControls');
let layoutGapX = gapXControl ? Number(gapXControl.value) : 150;
let layoutGapY = gapYControl ? Number(gapYControl.value) : 260;

function syncGapLabels() {
  if (gapXValue) gapXValue.textContent = layoutGapX;
  if (gapYValue) gapYValue.textContent = layoutGapY;
}

if (gapXControl) {
  gapXControl.addEventListener('input', () => {
    layoutGapX = Number(gapXControl.value);
    syncGapLabels();
  });
}

if (gapYControl) {
  gapYControl.addEventListener('input', () => {
    layoutGapY = Number(gapYControl.value);
    syncGapLabels();
  });
}

if (toggleControls && layoutControls) {
  toggleControls.addEventListener('click', () => {
    const hidden = layoutControls.classList.toggle('hidden');
    toggleControls.textContent = hidden ? 'Show' : 'Hide';
  });
}

syncGapLabels();

// Setup canvas
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

setupCanvas();
window.addEventListener('resize', setupCanvas);

function getTopPlayers(count = 20) {
  return Object.values(players)
    .filter(p => p.alive)
    .sort((a, b) => {
      const aForce = a.forceSpawn ? 1 : 0;
      const bForce = b.forceSpawn ? 1 : 0;
      if (aForce !== bForce) return bForce - aForce;

      const aHp = a.hp != null ? a.hp : (a.maxHp || 0);
      const bHp = b.hp != null ? b.hp : (b.maxHp || 0);
      const hpDiff = bHp - aHp;
      if (hpDiff !== 0) return hpDiff;
      const aMax = a.maxHp || 0;
      const bMax = b.maxHp || 0;
      return bMax - aMax;
    })
    .slice(0, count);
}

// Attack Animation
class Attack {
  constructor(fromX, fromY, toX, toY, isKill, isSpecial = false) {
    this.fromX = fromX;
    this.fromY = fromY;
    this.toX = toX;
    this.toY = toY;
    this.isKill = isKill;
    this.isSpecial = isSpecial;
    this.startTime = Date.now();
    this.duration = 500;
  }

  update() {
    const elapsed = Date.now() - this.startTime;
    this.progress = Math.min(1, elapsed / this.duration);
    return this.progress < 1;
  }

  draw(ctx) {
    const alpha = 1 - this.progress;
    const easeOut = 1 - Math.pow(1 - this.progress, 2);
    const x = this.fromX + (this.toX - this.fromX) * easeOut;
    const y = this.fromY + (this.toY - this.fromY) * easeOut;

    const glowColor = this.isSpecial ? '255, 100, 100' : '100, 215, 255';
    const coreColor = this.isSpecial ? '255, 180, 180' : '180, 240, 255';
    const orbColor = this.isSpecial ? '255, 150, 150' : '150, 220, 255';

    // Outer glow
    ctx.strokeStyle = `rgba(${glowColor}, ${alpha * 0.2})`;
    ctx.lineWidth = this.isSpecial ? 20 : 16;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(this.fromX, this.fromY);
    ctx.lineTo(this.toX, this.toY);
    ctx.stroke();

    // Main beam
    ctx.strokeStyle = `rgba(${glowColor}, ${alpha * 0.8})`;
    ctx.lineWidth = this.isSpecial ? 8 : 6;
    ctx.beginPath();
    ctx.moveTo(this.fromX, this.fromY);
    ctx.lineTo(this.toX, this.toY);
    ctx.stroke();

    // Core bright line
    ctx.strokeStyle = `rgba(${coreColor}, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.fromX, this.fromY);
    ctx.lineTo(this.toX, this.toY);
    ctx.stroke();

    // Projectile orb
    ctx.fillStyle = `rgba(${orbColor}, ${alpha})`;
    ctx.shadowColor = `rgba(${glowColor}, ${alpha * 0.6})`;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(x, y, this.isSpecial ? 10 : 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;

    // Impact ring - expands outward
    ctx.strokeStyle = `rgba(100, 215, 255, ${alpha * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.toX, this.toY, 10 + 20 * this.progress, 0, Math.PI * 2);
    ctx.stroke();

    // Inner impact ring
    ctx.strokeStyle = `rgba(150, 220, 255, ${alpha * 0.3})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.toX, this.toY, 5 + 15 * this.progress, 0, Math.PI * 2);
    ctx.stroke();
  }
}

const attacks = [];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioReady = audioCtx.state !== 'suspended';

document.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => { audioReady = true; }).catch(() => {});
  } else {
    audioReady = true;
  }
}, { once: true });

function playTone(frequency, duration = 0.12, type = 'triangle', volume = 0.18, when = 0) {
  if (!audioCtx || !audioReady) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = frequency;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const start = audioCtx.currentTime + when;
  const stop = start + duration;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, stop);
  osc.start(start);
  osc.stop(stop);
}

function playSound(name) {
  if (!audioReady && audioCtx.state === 'suspended') return;
  switch (name) {
    case 'laser':
      playTone(740, 0.08, 'square', 0.2);
      playTone(1120, 0.1, 'triangle', 0.12, 0.03);
      break;
    case 'special':
      playTone(520, 0.12, 'sawtooth', 0.18);
      playTone(840, 0.14, 'triangle', 0.14, 0.02);
      break;
    case 'heal':
      playTone(520, 0.14, 'triangle', 0.14);
      playTone(660, 0.16, 'sine', 0.1, 0.05);
      break;
    default:
      break;
  }
}

// Socket
const socket = io({ transports: ['websocket', 'polling'] });

socket.on('connect', () => {
  document.getElementById('serverStatus').textContent = '🟢 LIVE';
  socket.emit('register', { type: 'overlay' });
});

socket.on('disconnect', () => {
  document.getElementById('serverStatus').textContent = 'Offline';
});

socket.on('gameState', (state) => {
  players = state;
  updateUI();
});

socket.on('attack', ({ attacker, target, damage, killed, special }) => {
  if (players[attacker] && players[target]) {
    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (killed) players[target].alive = false;

    const fromPos = getPlayerPos(players[attacker]);
    const toPos = getPlayerPos(players[target]);
    
    // Only create animation if both positions are valid (not center fallback)
    if (fromPos && toPos) {
      attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, killed, special));
      playSound(special ? 'special' : 'laser');
    }

    const attackerName = players[attacker].nickname || attacker.slice(0, 10);
    const targetName = players[target].nickname || target.slice(0, 10);
    addLog(`⚔️ ${attackerName} → ${targetName} -${damage}${special ? ' ⚡' : ''}${killed ? ' 💀' : ''}`, killed ? 'kill' : '');
    showDmg(toPos.x, toPos.y, damage, killed);
    
    updateUI();
  }
});

socket.on('giftAttack', ({ attacker, target, damage, diamonds }) => {
  if (players[attacker] && players[target]) {
    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (players[target].hp === 0) players[target].alive = false;

    const fromPos = getPlayerPos(players[attacker]);
    const toPos = getPlayerPos(players[target]);
    
    // Only create animation if both positions are valid
    if (fromPos && toPos) {
      attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, false));
    }

    const attackerName = players[attacker].nickname || attacker.slice(0, 10);
    const targetName = players[target].nickname || target.slice(0, 10);
    addLog(`🎁 ${attackerName} → ${targetName} -${damage}`, 'gift');
    showDmg(toPos.x, toPos.y, damage, false);
    
    updateUI();
  }
});

socket.on('respawn', ({ uniqueId }) => {
  if (players[uniqueId]) {
    const playerName = players[uniqueId].nickname || uniqueId.slice(0, 10);
    addLog(`✨ ${playerName} respawned!`, '');
  }
});

socket.on('heal', ({ uniqueId, amount }) => {
  if (players[uniqueId]) {
    const playerName = players[uniqueId].nickname || uniqueId.slice(0, 10);
    addLog(`💚 ${playerName} healed +${amount} HP`, 'gift');
    playSound('heal');
  }
});

// Helper functions - MAJOR POSITIONING UPDATE
function getPlayerPos(player) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const alive = Object.values(players).filter(p => p.alive);
  if (!alive.length) return { x: width / 2, y: height / 2 };

  const sorted = getTopPlayers(20);
  const idx = sorted.findIndex(p => p.uniqueId === player.uniqueId);
  if (idx === -1) return { x: width / 2, y: height / 2 };

  // Layout config
  const cols = 5;
  const rows = 4;
  
  // Reserve a centered play area with margins around UI panels
  const leftBuffer = 260;
  const rightBuffer = 260;
  const topBuffer = 240;
  const botBuffer = 340;
  
  // Available play area
  const playW = width - leftBuffer - rightBuffer;
  const playH = height - topBuffer - botBuffer;
  
  // Grid spacing with gaps
  const gapX = layoutGapX;
  const gapY = layoutGapY;
  const cellW = (playW - gapX * (cols - 1)) / cols;
  const cellH = (playH - gapY * (rows - 1)) / rows;
  
  // Center the grid inside the available play area
  const gridWidth = cols * cellW + (cols - 1) * gapX;
  const gridHeight = rows * cellH + (rows - 1) * gapY;
  const startX = leftBuffer + Math.max(0, (playW - gridWidth) / 2);
  const startY = topBuffer + Math.max(0, (playH - gridHeight) / 2);

  // Grid position
  const col = idx % cols;
  const row = Math.floor(idx / cols);
  
  // Final coordinates
  const x = startX + col * (cellW + gapX) + cellW / 2;
  const y = startY + row * (cellH + gapY) + cellH / 2;
  
  return { x, y };
}

function updateUI() {
  const alive = Object.values(players).filter(p => p.alive);
  const shown = Math.min(20, alive.length);
  document.getElementById('playerCount').textContent = alive.length;
  document.getElementById('showingCount').textContent = `${shown} / ${alive.length}`;

  const top3 = getTopPlayers(3);
  const html = top3.map((p, i) => `
    <div class="board-entry rank-${i + 1}">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${p.nickname.slice(0, 14)}</span>
      <span class="rank-score">${Math.round(p.hp || 0)} HP</span>
    </div>
  `).join('');

  document.getElementById('leaderboard').innerHTML = html || '<div class="board-entry">No players</div>';
}

function addLog(msg, type) {
  const log = document.getElementById('eventlog');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = msg;
  log.insertBefore(entry, log.firstChild);
  while (log.children.length > 2) log.removeChild(log.lastChild);
}

function showDmg(x, y, dmg, isKill) {
  const el = document.createElement('div');
  el.className = `dmg-number ${isKill ? 'kill' : ''}`;
  el.textContent = isKill ? '💀 KILL!' : `-${dmg}`;
  el.style.left = (x - 20) + 'px';
  el.style.top = (y - 30) + 'px';
  document.querySelector('.ui').appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function drawPlayers() {
  const sorted = getTopPlayers(20);

  sorted.forEach((player, idx) => {
    const pos = getPlayerPos(player);
    const rank = idx + 1;
    const hpPct = Math.max(0, Math.min(1, (player.hp || 100) / (player.maxHp || 100)));
    const hpValue = Math.round((player.hp || 100));
    const maxHp = (player.maxHp || 100);
    
    // Scale based on rank
    let size = 20;
    let nameSize = 20;
    let barWidth = 140;
    let emojiSize = 64;
    
    if (rank === 1) {
      size = 24;
      nameSize = 24;
      barWidth = 180;
      emojiSize = 88;
    } else if (rank === 2) {
      size = 22;
      nameSize = 22;
      barWidth = 164;
      emojiSize = 80;
    } else if (rank === 3) {
      size = 22;
      nameSize = 22;
      barWidth = 150;
      emojiSize = 76;
    } else if (rank <= 6) {
      size = 21;
      nameSize = 20;
      barWidth = 144;
      emojiSize = 72;
    }

    const glowRadius = Math.max(size + 10, emojiSize / 2 + 12);

    // Player name - above emoji
    ctx.font = `bold ${nameSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(player.nickname.slice(0, 14), pos.x, pos.y - size - 8);
    ctx.fillText(player.nickname.slice(0, 14), pos.x, pos.y - size - 8);

    // Subtle glow
    ctx.fillStyle = `rgba(100, 200, 255, 0.1)`;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // Diamond emoji
    ctx.font = `${emojiSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💎', pos.x, pos.y);

    // HP bar background
    const barY = pos.y + Math.max(size, emojiSize / 2) + 36;
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.strokeStyle = '#64c8ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(pos.x - barWidth / 2, barY, barWidth, 18);

    // HP bar fill
    const hpColor = '#ff3333';
    ctx.fillStyle = hpColor;
    ctx.fillRect(pos.x - barWidth / 2 + 2, barY + 2, Math.max(0, (barWidth - 4) * hpPct), 14);

    // HP number below bar
    ctx.font = `18px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText(`${hpValue}/${maxHp}`, pos.x, barY + 22);
    ctx.fillText(`${hpValue}/${maxHp}`, pos.x, barY + 22);
  });
}

// Main loop
let lastTime = Date.now();
function animate() {
  const now = Date.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Clear with subtle green motion trail
  ctx.fillStyle = 'rgba(144, 238, 144, 0.08)';
  ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

  // Draw players with clean rendering
  drawPlayers();

  // Update and draw attacks
  for (let i = attacks.length - 1; i >= 0; i--) {
    if (!attacks[i].update()) {
      attacks.splice(i, 1);
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      attacks[i].draw(ctx);
      ctx.restore();
    }
  }

  requestAnimationFrame(animate);
}

animate();
updateUI();

// Cache bust
if (!location.search.includes('v=')) {
  location.replace(location.pathname + '?v=' + Date.now());
}
</script>
