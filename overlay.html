<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Battle Royale Overlay · Polished</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
body { display: flex; align-items: center; justify-content: center; }

#overlay-container {
  position: relative;
  width: min(90vw, 1920px);
  aspect-ratio: 16 / 9;
  background: rgba(4, 8, 18, 0.92);
  border: 1px solid rgba(180, 120, 255, 0.35);
  border-radius: 18px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.06),
    0 0 48px rgba(140,80,255,0.18),
    0 0 120px rgba(80,40,180,0.08);
  overflow: hidden;
}
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.panel-wrapper {
  position: fixed; top: 16px; right: 0;
  display: flex; align-items: flex-start;
  pointer-events: auto; z-index: 30;
}
.panel-tab {
  width: 28px;
  background: rgba(6,10,20,0.88);
  border: 1px solid rgba(100,200,255,0.2);
  border-right: none; border-radius: 8px 0 0 8px;
  padding: 10px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: #8fd8ff; font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; writing-mode: vertical-rl; text-orientation: mixed;
  user-select: none; transition: background 0.2s;
  font-family: 'Rajdhani', sans-serif;
}
.panel-tab:hover { background: rgba(20,40,70,0.95); }
.panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }
.layout-panel {
  width: 260px; padding: 14px 16px; border-radius: 0 0 0 16px;
  background: rgba(6,10,20,0.94); backdrop-filter: blur(16px);
  border: 1px solid rgba(100,200,255,0.14); border-right: none;
  box-shadow: -8px 0 30px rgba(0,0,0,0.5);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
  transform-origin: right top; max-height: 90vh; overflow-y: auto;
}
.layout-panel.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
.layout-title {
  color: #8fd8ff; font-size: 12px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 14px; font-family: 'Rajdhani', sans-serif;
}
.control { margin-bottom: 13px; }
.control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.control-top span { font-size: 11px; color: #cfefff; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; }
.control input[type=range] {
  width: 100%; appearance: none; height: 5px;
  border-radius: 999px; background: rgba(255,255,255,0.08); outline: none;
}
.control input[type=range]::-webkit-slider-thumb {
  appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer;
}
.control input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9);
  cursor: pointer; border: none;
}
.control label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cfefff; font-family: 'Rajdhani', sans-serif; cursor: pointer; }
.control select, .control button, .control input[type=color] {
  background: rgba(10,20,40,0.8); border: 1px solid rgba(100,200,255,0.3); color: #cfefff;
  padding: 4px 8px; border-radius: 6px; font-family: 'Rajdhani', sans-serif;
  font-size: 12px; outline: none; cursor: pointer; width: 100%; margin-top: 4px;
}
.control button:hover { background: rgba(30,60,100,0.8); }

#status-badge {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  border-radius: 24px; padding: 4px 16px;
  font-size: 11px; font-weight: bold; letter-spacing: 1px;
  color: #aaa; pointer-events: none; z-index: 9999;
  font-family: 'Rajdhani', monospace; transition: 0.2s;
}
#status-badge.connected    { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
#status-badge.disconnected { color: #ff8866; }
#status-badge.demo         { color: #ffd84f; text-shadow: 0 0 4px #ffaa00; }

.damage {
  position: fixed; font-weight: 900; font-size: clamp(18px, 3vw, 28px);
  color: #ff5050;
  text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9);
  animation: floatDamage 0.85s ease-out forwards;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%); white-space: nowrap;
  font-family: 'Rajdhani', sans-serif;
}
.damage.kill     { color: #ffd84f; font-size: clamp(22px, 4vw, 34px);   text-shadow: 0 0 20px rgba(255,216,79,0.95); }
.damage.critical { color: #ff2244; font-size: clamp(24px, 4.5vw, 38px); text-shadow: 0 0 24px rgba(255,34,68,1), 0 0 48px rgba(255,100,0,0.6); }
@keyframes floatDamage {
  0%   { opacity: 1; transform: translate(-50%, -50%)  scale(1.25); }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(0.6);  }
}

.banner {
  position: fixed; left: 50%; top: 8%;
  transform: translate(-50%, 0); z-index: 10000; pointer-events: none;
  font-family: 'Rajdhani', sans-serif; font-weight: 900; text-align: center;
  animation: bannerIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), bannerOut 0.5s ease-in 2.6s forwards;
  white-space: nowrap;
}
.banner.kill      { font-size: clamp(18px,2vw,32px);   color: #ffcc44; text-shadow: 0 0 30px rgba(255,200,0,0.9), 0 0 80px rgba(255,100,0,0.6); letter-spacing: 2px; }
.banner.streak    { font-size: clamp(20px,2.2vw,36px); color: #ff44aa; text-shadow: 0 0 40px rgba(255,68,170,0.9), 0 0 80px rgba(255,0,100,0.4); letter-spacing: 3px; }
.banner.gift      { font-size: clamp(14px,1.8vw,26px); color: #fff; background: rgba(0,0,0,0.55); padding: 10px 32px; border-radius: 40px; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); text-shadow: 0 0 20px rgba(255,255,255,0.8); }
.banner.legendary { font-size: clamp(22px,2.5vw,40px); color: #FFD700; text-shadow: 0 0 40px rgba(255,215,0,1), 0 0 100px rgba(255,140,0,0.8); letter-spacing: 4px; animation: bannerIn 0.35s cubic-bezier(0.2,1.4,0.4,1), legendaryPulse 0.5s ease-in-out infinite alternate, bannerOut 0.5s ease-in 3.5s forwards; }
@keyframes legendaryPulse {
  from { text-shadow: 0 0 40px rgba(255,215,0,1), 0 0 100px rgba(255,140,0,0.8); }
  to   { text-shadow: 0 0 70px rgba(255,215,0,1), 0 0 160px rgba(255,200,0,1);   }
}
@keyframes bannerIn  { 0%  { opacity:0; transform:translate(-50%,-24px) scale(0.88); } 100% { opacity:1; transform:translate(-50%,0) scale(1); } }
@keyframes bannerOut { to  { opacity:0; transform:translate(-50%,-16px); } }

.reload-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto;
}
.reload-overlay .countdown { font-size: 5vw; color: #fff; font-family: 'Rajdhani', monospace; font-weight: 700; text-shadow: 0 0 40px rgba(122,252,255,0.8); letter-spacing: 4px; }
.reload-overlay .reason    { font-size: 1.2vw; color: #8fd8ff; margin-top: 20px; letter-spacing: 2px; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }
</style>
</head>
<body>
<div id="overlay-container">
  <canvas id="canvas"></canvas>
</div>

<div class="panel-wrapper">
  <div class="panel-tab" id="togglePanel">
    <span class="panel-tab-icon">⚡</span>LAYOUT
  </div>
  <div class="layout-panel hidden" id="layoutPanel">
    <div class="layout-title">Layout Controls</div>
    <div class="control">
      <div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div>
      <input id="gapControl" type="range" min="0" max="200" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div>
      <input id="offsetXControl" type="range" min="-400" max="400" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div>
      <input id="offsetYControl" type="range" min="-200" max="200" value="0" />
    </div>
    <div class="control">
      <div class="control-top"><span>Layout Height</span><span id="heightValue">85%</span></div>
      <input id="heightControl" type="range" min="30" max="100" value="85" />
    </div>
    <div class="control">
      <div class="control-top"><span>Zoom</span><span id="zoomValue">100%</span></div>
      <input id="zoomControl" type="range" min="60" max="140" value="100" />
    </div>
  </div>
</div>

<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>

<script src="/socket.io/socket.io.js"></script>

<script>
(function () {
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d', { alpha: true });
  const container = document.getElementById('overlay-container');
  const statusDiv = document.getElementById('status-badge');

  const gapControl     = document.getElementById('gapControl');
  const offsetXControl = document.getElementById('offsetXControl');
  const offsetYControl = document.getElementById('offsetYControl');
  const heightControl  = document.getElementById('heightControl');
  const zoomControl    = document.getElementById('zoomControl');
  const togglePanel    = document.getElementById('togglePanel');
  const layoutPanel    = document.getElementById('layoutPanel');

  let players          = {};
  let attacks          = [];
  let layoutGap        = 0;
  let offsetX          = 0;
  let offsetY          = 0;
  let layoutZoom       = 1;
  let backgroundImg    = null;
  let socket           = null;
  let audioConfig      = {};
  let audioCache       = {};
  let overlaySettings  = { shotType: 'beam', laserColor: '#7afcff', shotSpeed: 1 };
  let isDemoMode       = false;
  let demoLoopTimer    = null;
  let darkMode         = true;
  let flashAlpha       = 0;
  let needsDraw        = true;

  const HORDE_ID = '__HORDE__';

  // ── Particle pool ──
  const particlePool = [];
  const MAX_POOLED = 300;

  function acquireParticle(x, y, opts = {}) {
    let p;
    if (particlePool.length > 0) {
      p = particlePool.pop();
      p.x = x; p.y = y;
      p.vx = (Math.random() - 0.5) * (opts.speed || 4);
      p.vy = (Math.random() - 0.5) * (opts.speed || 4) - (opts.rise || 0);
      p.life = 1;
      p.decay = opts.decay || (0.02 + Math.random() * 0.03);
      p.r = opts.radius || (2 + Math.random() * 3);
      p.color = opts.color || '#7afcff';
      p.emoji = opts.emoji || null;
      p.fs = opts.fontSize || 18;
    } else {
      p = new Particle(x, y, opts);
    }
    return p;
  }

  function releaseParticle(p) {
    if (particlePool.length < MAX_POOLED) particlePool.push(p);
  }

  // ── Demo players ──
  const DEMO_PLAYERS = [
    { uniqueId:'p1', nickname:'NebulaX',   hp:180, maxHp:200, alive:true, iconEmoji:'🔥', kills:3 },
    { uniqueId:'p2', nickname:'Vortex',    hp:95,  maxHp:150, alive:true, iconEmoji:'⚡', kills:1 },
    { uniqueId:'p3', nickname:'GhostByte', hp:210, maxHp:250, alive:true, iconEmoji:'👾', kills:5 },
    { uniqueId:'p4', nickname:'IronRift',  hp:60,  maxHp:180, alive:true, iconEmoji:'🛡️', kills:0 },
    { uniqueId:'p5', nickname:'PsyBlaze',  hp:130, maxHp:160, alive:true, iconEmoji:'🌀', kills:2 },
    { uniqueId:'h1', nickname:'Grunt1',    hp:50,  maxHp:80,  alive:true, iconEmoji:'💀', kills:0 },
    { uniqueId:'h2', nickname:'Grunt2',    hp:40,  maxHp:80,  alive:true, iconEmoji:'💀', kills:0 },
    { uniqueId:'h3', nickname:'Grunt3',    hp:70,  maxHp:100, alive:true, iconEmoji:'💀', kills:0 },
  ];

  function normalizePlayers(state) {
    if (!state || typeof state !== 'object') return {};
    const out = {};
    const arr = Array.isArray(state)
      ? state
      : Array.isArray(state.players)
        ? state.players
        : Object.values(state);
    arr.forEach(p => {
      if (p && p.uniqueId) out[p.uniqueId] = p;
    });
    return out;
  }

  function activePlayers() {
    const real = Object.values(players);
    return real.length > 0 ? real : DEMO_PLAYERS;
  }

  function stopDemoLoop() {
    if (demoLoopTimer) { clearInterval(demoLoopTimer); demoLoopTimer = null; }
  }

  function enterDemoMode() {
    if (isDemoMode) return;
    isDemoMode = true;
    players = {};
    statusDiv.textContent = '🟡 DEMO MODE · no server';
    statusDiv.className   = 'demo';
    needsDraw = true;

    demoLoopTimer = setInterval(() => {
      const pool = DEMO_PLAYERS.filter(p => p.alive);
      if (pool.length < 2) return;
      const attacker = pool[Math.floor(Math.random() * pool.length)];
      let target;
      do { target = pool[Math.floor(Math.random() * pool.length)]; } while (target === attacker);

      const dmg = 10 + Math.floor(Math.random() * 30);
      target.hp = Math.max(0, target.hp - dmg);
      if (target.hp === 0) {
        target.hp = target.maxHp;
        attacker.kills = (attacker.kills || 0) + 1;
      }
      needsDraw = true;

      const types = ['beam','laser','neon','ripple','fire','bubble','sphere','projectile'];
      const effect = types[Math.floor(Math.random() * types.length)];
      fireAttack(attacker.uniqueId, target.uniqueId, dmg, false, false, effect, { intensity: 0.5 + Math.random() * 0.5 });
    }, 1500);
  }

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvas.width  = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function cw() { return canvas.width; }
  function ch() { return canvas.height; }

  // ── Layout panel ──
  function updateControlLabels() {
    document.getElementById('gapValue').textContent     = Math.round(layoutGap);
    document.getElementById('offsetXValue').textContent = Math.round(offsetX);
    document.getElementById('offsetYValue').textContent = Math.round(offsetY);
    document.getElementById('heightValue').textContent  = heightControl.value + '%';
    document.getElementById('zoomValue').textContent    = `${Math.round(layoutZoom * 100)}%`;
  }

  function saveLayout() {
    const s = {
      gap: layoutGap, offsetX, offsetY,
      height: heightControl.value, zoom: zoomControl.value,
      laserColor: overlaySettings.laserColor,
      darkMode, shotType: overlaySettings.shotType
    };
    try { localStorage.setItem('battleOverlayLayout', JSON.stringify(s)); } catch(_) {}
  }

  function loadLayout() {
    let saved;
    try { saved = localStorage.getItem('battleOverlayLayout'); } catch(_) {}
    if (!saved) return;
    try {
      const s = JSON.parse(saved);
      layoutGap = s.gap ?? 0;
      offsetX   = s.offsetX ?? 0;
      offsetY   = s.offsetY ?? 0;
      heightControl.value = s.height ?? 85;
      zoomControl.value   = s.zoom ?? 100;
      layoutZoom = parseFloat(zoomControl.value) / 100;
      overlaySettings.laserColor = s.laserColor || '#7afcff';
      darkMode = s.darkMode !== undefined ? s.darkMode : true;
      overlaySettings.shotType = s.shotType || 'beam';
      gapControl.value = layoutGap;
      offsetXControl.value = offsetX;
      offsetYControl.value = offsetY;
      container.style.height = heightControl.value + 'vh';
      updateControlLabels();
      const cp = document.getElementById('laserColorPicker');
      if (cp) cp.value = overlaySettings.laserColor;
      const dm = document.getElementById('themeToggle');
      if (dm) dm.checked = darkMode;
      const st = document.getElementById('shotTypeSelect');
      if (st) st.value = overlaySettings.shotType;
    } catch (_) {}
  }

  gapControl.oninput = () => { layoutGap = parseFloat(gapControl.value); updateControlLabels(); saveLayout(); };
  offsetXControl.oninput = () => { offsetX = parseFloat(offsetXControl.value); updateControlLabels(); saveLayout(); };
  offsetYControl.oninput = () => { offsetY = parseFloat(offsetYControl.value); updateControlLabels(); saveLayout(); };
  heightControl.oninput = () => { container.style.height = heightControl.value + 'vh'; resizeCanvas(); updateControlLabels(); saveLayout(); };
  zoomControl.oninput = () => { layoutZoom = parseFloat(zoomControl.value) / 100; updateControlLabels(); saveLayout(); };
  togglePanel.onclick = () => {
    layoutPanel.classList.toggle('hidden');
    togglePanel.querySelector('.panel-tab-icon').textContent =
      layoutPanel.classList.contains('hidden') ? '⚙' : '⚡';
  };

  function buildExtraControls() {
    const panel = layoutPanel;
    const colorDiv = document.createElement('div');
    colorDiv.className = 'control';
    colorDiv.innerHTML = `<div class="control-top"><span>Laser Color</span></div>`;
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.id = 'laserColorPicker';
    colorInput.value = overlaySettings.laserColor;
    colorInput.addEventListener('input', (e) => { overlaySettings.laserColor = e.target.value; saveLayout(); });
    colorDiv.appendChild(colorInput);
    panel.appendChild(colorDiv);

    const themeDiv = document.createElement('div');
    themeDiv.className = 'control';
    themeDiv.innerHTML = `<label><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}> Dark Grid</label>`;
    themeDiv.querySelector('#themeToggle').addEventListener('change', (e) => { darkMode = e.target.checked; saveLayout(); });
    panel.appendChild(themeDiv);

    const shotDiv = document.createElement('div');
    shotDiv.className = 'control';
    shotDiv.innerHTML = `<div class="control-top"><span>Shot Type</span></div>`;
    const select = document.createElement('select');
    select.id = 'shotTypeSelect';
    ['laser','beam','projectile','neon','ripple','fire','bubble','sphere'].forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t.charAt(0).toUpperCase() + t.slice(1);
      select.appendChild(opt);
    });
    select.value = overlaySettings.shotType;
    select.addEventListener('change', (e) => { overlaySettings.shotType = e.target.value; saveLayout(); });
    shotDiv.appendChild(select);

    const testBtn = document.createElement('button');
    testBtn.textContent = 'Test Effect';
    testBtn.style.marginTop = '6px';
    testBtn.addEventListener('click', () => {
      const top = topPlayers();
      if (top.length >= 2) fireAttack(top[0].uniqueId, top[1].uniqueId, 15, false, false, overlaySettings.shotType, { intensity: 0.8 });
      else if (top.length === 1) fireAttack(top[0].uniqueId, top[0].uniqueId, 5, false, false, overlaySettings.shotType, { intensity: 0.5 });
    });
    shotDiv.appendChild(testBtn);
    panel.appendChild(shotDiv);
  }
  buildExtraControls();
  loadLayout();
  updateControlLabels();

  // ── Helpers ──
  function isAlive(p) { return p && p.alive !== false; }

  function topPlayers() {
    return activePlayers()
      .filter(p => isAlive(p) && p.uniqueId !== HORDE_ID)
      .sort((a, b) => {
        const hpDiff = (b.hp || 0) - (a.hp || 0);
        if (hpDiff !== 0) return hpDiff;
        const kDiff  = (b.kills || 0) - (a.kills || 0);
        if (kDiff !== 0) return kDiff;
        return (b.lastActive || 0) - (a.lastActive || 0);
      })
      .slice(0, 5);
  }

  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest   = activePlayers().filter(p => isAlive(p) && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return {
      uniqueId: HORDE_ID, nickname: 'THE HORDE',
      hp: rest.reduce((s, p) => s + (p.hp || 0), 0),
      maxHp: rest.reduce((s, p) => s + (p.maxHp || 100), 0),
      hordeCount: rest.length, alive: true,
    };
  }

  function getPlayerPosition(index, total) {
    const W = cw(), H = ch();
    const cardH      = H * 0.5 * 0.84 * layoutZoom;
    const cardW      = cardH * 0.72;
    const totalWidth = cardW * total + layoutGap * Math.max(0, total - 1);
    const startX     = (W - totalWidth) / 2 + offsetX;
    return {
      x: startX + index * (cardW + layoutGap) + cardW / 2,
      y: H * 0.28 + offsetY + H * 0.16 * (1 - layoutZoom),
    };
  }

  function getHordePosition() {
    const W = cw(), H = ch();
    return { x: W / 2 + offsetX, y: H * 0.72 + offsetY + H * 0.20 * (1 - layoutZoom) };
  }

  function getPositionForPlayer(id) {
    const top = topPlayers();
    const idx = top.findIndex(p => p.uniqueId === id || p.id === id);
    if (idx !== -1) return getPlayerPosition(idx, top.length);
    const horde = hordePlayer();
    return horde ? getHordePosition() : null;
  }

  // ── Card animations ──
  const cardAnimations = {};
  const ANIM_SPEED = 0.12;

  function updateCardAnimation(id, targetX, targetY) {
    let anim = cardAnimations[id];
    if (!anim) {
      anim = { currentX: targetX, currentY: targetY, targetX, targetY, active: true };
      cardAnimations[id] = anim;
    } else {
      anim.targetX = targetX; anim.targetY = targetY; anim.active = true;
    }
  }

  function removeCardAnimation(id) {
    if (cardAnimations[id]) {
      cardAnimations[id].targetX = cw() + 200;
      cardAnimations[id].active = false;
    }
  }

  // ── Smooth HP ──
  const hpDisplay = {};
  const HP_LERP = 0.12;

  // ── Highlight ──
  let lastAttackerId = null, lastTargetId = null, highlightTimer = 0;
  function setHighlight(attackerId, targetId) {
    lastAttackerId = attackerId; lastTargetId = targetId; highlightTimer = 1200;
  }

  function canvasToViewport(cx, cy) {
    const rect   = canvas.getBoundingClientRect();
    const scaleX = rect.width  / cw();
    const scaleY = rect.height / ch();
    return { x: rect.left + cx * scaleX, y: rect.top + cy * scaleY };
  }

  // ── Audio ──
  function getAudio(filename) {
    if (!audioCache[filename]) {
      const a = new Audio(`/audio/${filename}`);
      a.preload = 'auto';
      audioCache[filename] = a;
    }
    return audioCache[filename];
  }
  function playSound(type, pan = 0) {
    const filename = audioConfig[type];
    if (!filename) return;
    try {
      const a = getAudio(filename);
      try { a.pan = pan; } catch (_) {}
      a.currentTime = 0; a.play().catch(() => {});
    } catch (_) {}
  }

  // ── DOM helpers ──
  function showBanner(className, html, duration = 3200) {
    const el = document.createElement('div');
    el.className = `banner ${className}`; el.innerHTML = html;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  function showDamage(cx, cy, damage, kill, critical) {
    const vp = canvasToViewport(cx, cy);
    const el = document.createElement('div');
    el.className = `damage${kill ? ' kill' : critical ? ' critical' : ''}`;
    el.textContent = kill ? '💀 KILL!' : critical ? `⚡ ${Math.round(damage)}` : `-${Math.round(damage)}`;
    el.style.left = vp.x + 'px'; el.style.top = vp.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ── Particle ──
  class Particle {
    constructor(x, y, opts = {}) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.5) * (opts.speed || 4);
      this.vy = (Math.random() - 0.5) * (opts.speed || 4) - (opts.rise || 0);
      this.life = 1;
      this.decay = opts.decay || (0.02 + Math.random() * 0.03);
      this.r = opts.radius || (2 + Math.random() * 3);
      this.color = opts.color || '#7afcff';
      this.emoji = opts.emoji || null;
      this.fs = opts.fontSize || 18;
    }
    update() {
      this.x += this.vx; this.y += this.vy; this.vy += 0.06; this.life -= this.decay;
      return this.life > 0;
    }
    draw(c) {
      c.save(); c.globalAlpha = Math.max(0, this.life);
      if (this.emoji) {
        c.font = `${this.fs}px Arial`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(this.emoji, this.x, this.y);
      } else {
        c.fillStyle = this.color; c.shadowColor = this.color; c.shadowBlur = 10;
        c.beginPath(); c.arc(this.x, this.y, this.r * Math.max(0, this.life), 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
  }

  // ── Attack ──
  class Attack {
    constructor(from, to, type, options = {}) {
      this.from           = from;
      this.to             = to;
      this.type           = type;
      this.intensity      = options.intensity      ?? 0.5;
      this.critical       = options.critical       ?? false;
      this.streak         = options.streak         ?? 0;
      this.giftBoosted    = options.giftBoosted    ?? false;
      this.remainingHpPct = options.remainingHpPct ?? 1;
      this.killingBlow    = options.killingBlow    ?? false;
      this.color          = options.color          || overlaySettings.laserColor || '#7afcff';
      this.start          = Date.now();
      this.progress       = 0;
      this.particles      = [];
      this.spawned        = false;
      this.trail          = [];
      this._impacted      = false;

      const speed = Math.max(0.5, options.shotSpeed || overlaySettings.shotSpeed || 1);
      const durations = {
        static: 1800, projectile: 700, gift: 900, explosion: 750,
        beam: 360, laser: 420, neon: 520, ripple: 580, fire: 700, bubble: 680, sphere: 720,
      };
      this.duration = Math.round((durations[type] || 500) / speed);

      if (type === 'fire') {
        const cnt = 40 + Math.floor(this.intensity * 24);
        for (let i = 0; i < cnt; i++) {
          this.particles.push(acquireParticle(this.to.x, this.to.y, {
            speed: 3+Math.random()*6, color: i%3===0?'#ffdd44':'#ff8844',
            radius:2+Math.random()*4, decay:0.025
          }));
        }
      }
      if (this.critical) {
        for (let i=0;i<14;i++) this.particles.push(acquireParticle(this.to.x, this.to.y,
          { speed:5+Math.random()*5, color:'#ffffff', radius:1.5+Math.random()*2, decay:0.04 }));
      }
      if (this.giftBoosted) {
        for (let i=0;i<10;i++) this.particles.push(acquireParticle(this.from.x, this.from.y,
          { speed:2, color:'#ffd700', radius:1.5, decay:0.045, rise:0.6 }));
      }
    }

    update() {
      const elapsed = Date.now() - this.start;
      this.progress = Math.min(1, elapsed / this.duration);
      this.particles = this.particles.filter(p => {
        const alive = p.update();
        if (!alive) releaseParticle(p);
        return alive;
      });
      return elapsed < this.duration || this.particles.length > 0;
    }

    draw() {
      ctx.save();
      switch (this.type) {
        case 'laser':      this.drawLaser();      break;
        case 'beam':       this.drawBeam();       break;
        case 'projectile': this.drawProjectile(); break;
        case 'gift':       this.drawGift();       break;
        case 'explosion':  this.drawExplosion();  break;
        case 'neon':       this.drawNeon();       break;
        case 'ripple':     this.drawRipple();     break;
        case 'fire':       this.drawFire();       break;
        case 'bubble':     this.drawBubble();     break;
        case 'sphere':     this.drawSphere();     break;
        case 'static':                            break;
        default:           this.drawLaser();
      }
      ctx.restore();
      if (this.particles.length) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        this.particles.forEach(p => p.draw(ctx));
        ctx.restore();
      }
    }
  }

  Attack.prototype.drawLaser = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const alpha = progress < 0.6 ? 1 : 1 - (progress - 0.6) / 0.4;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    if (this.giftBoosted) {
      ctx.globalAlpha = alpha * 0.28; ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 28; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.globalAlpha = alpha * (0.4 + this.intensity * 0.35);
    ctx.strokeStyle = this.color; ctx.lineWidth = 14 + this.intensity * 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
    ctx.globalAlpha = alpha; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
    if (this.critical) {
      ctx.globalAlpha = alpha * 0.55; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.restore();
  };

  Attack.prototype.drawBeam = function() {
    const { from, to, progress } = this;
    const alpha = progress < 0.3 ? 1 : 1 - (progress - 0.3) / 0.7;
    const pulse = 1 + Math.sin(Date.now() / 110) * 0.16;
    const midX  = from.x + (to.x - from.x) * progress;
    const midY  = from.y + (to.y - from.y) * progress;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    if (this.giftBoosted) {
      ctx.globalAlpha = alpha * 0.28; ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 32; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
    }
    ctx.globalAlpha = alpha * (0.3 + this.intensity * 0.25);
    ctx.strokeStyle = this.color; ctx.lineWidth = (20 + this.intensity * 8) * pulse; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
    ctx.globalAlpha = alpha * 0.8; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
    if (this.critical) {
      ctx.globalAlpha = alpha * 0.65; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(midX, midY); ctx.stroke();
    }
    ctx.restore();
  };

  Attack.prototype.drawProjectile = function() {
    const { from, to, progress } = this;
    const px = from.x + (to.x - from.x) * progress;
    const py = from.y + (to.y - from.y) * progress;
    this.trail.push({ x: px, y: py, a: progress < 0.6 ? 1 : 1 - (progress - 0.6) / 0.4 });
    if (this.trail.length > 18) this.trail.shift();
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const radius = 18 + this.intensity * 10;
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length) * t.a * 0.55;
      ctx.beginPath(); ctx.arc(t.x, t.y, Math.max(0.6, (i / this.trail.length) * radius * 0.55), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(122,252,255,${a})`; ctx.fill();
    }
    const grad = ctx.createRadialGradient(px, py, 0, px, py, radius);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.45, 'rgba(122,252,255,0.9)');
    grad.addColorStop(1, 'rgba(122,252,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
    if (progress > 0.9 && !this._impacted) {
      this._impacted = true;
      for (let i = 0; i < 14; i++) {
        this.particles.push(acquireParticle(to.x, to.y, {
          speed:4+Math.random()*5, color:'#7afcff', radius:2+Math.random()*3, decay:0.03
        }));
      }
    }
    ctx.restore();
  };

  Attack.prototype.drawGift = function() {
    if (!this.spawned) {
      this.spawned = true;
      const emojis = ['❤️','💖','💘','💝','💫'];
      const count = 18 + Math.floor(this.intensity * 14);
      for (let i = 0; i < count; i++) {
        this.particles.push(acquireParticle(this.to.x, this.to.y, {
          speed:6+Math.random()*5, emoji: emojis[i%emojis.length],
          fontSize:18+Math.random()*14, decay:0.018, rise:1.2
        }));
      }
    }
  };

  Attack.prototype.drawExplosion = function() {
    if (!this.spawned) {
      this.spawned = true;
      const count = 34 + Math.floor(this.intensity * 24);
      const colors = ['#ff6644','#ffcc44','#ff2222','#ff8800'];
      for (let i = 0; i < count; i++) {
        this.particles.push(acquireParticle(this.to.x, this.to.y, {
          speed:7+Math.random()*(10+this.intensity*8), color:colors[i%4],
          radius:3+Math.random()*(5+this.intensity*4), decay:0.014-this.intensity*0.004
        }));
      }
    }
  };

  Attack.prototype.drawNeon = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const now = Date.now();
    const intensity = 0.7 + Math.sin(now * 0.018) * 0.3;
    const coreColor = this.critical ? '#fff2b0' : '#ffffff';
    const midColor  = this.critical ? '#ff6640' : (this.color || '#00ccff');
    const glowColor = this.critical ? '#ff2200' : '#0044cc';
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = glowColor; ctx.lineWidth = 32 * intensity; ctx.globalAlpha = 0.3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x + 4, from.y + 2); ctx.lineTo(x + 4, y + 2);
    ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 10; ctx.globalAlpha = 0.55; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x - 4, from.y - 2); ctx.lineTo(x - 4, y - 2);
    ctx.strokeStyle = '#33ffcc'; ctx.lineWidth = 10; ctx.globalAlpha = 0.55; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = midColor; ctx.lineWidth = 9 * intensity; ctx.globalAlpha = 0.9; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = coreColor; ctx.lineWidth = 3; ctx.globalAlpha = 1;
    ctx.setLineDash([14, 8]); ctx.stroke(); ctx.setLineDash([]);
    const headRad = 13 + Math.sin(now * 0.025) * 2.5;
    ctx.shadowBlur = 22; ctx.shadowColor = midColor;
    ctx.beginPath(); ctx.arc(x, y, headRad, 0, Math.PI * 2);
    ctx.fillStyle = coreColor; ctx.fill(); ctx.shadowBlur = 0;
    for (let i = 1; i <= 7; i++) {
      const t2 = Math.max(0, progress - i * 0.022); if (t2 <= 0) break;
      const tx = from.x + (to.x - from.x) * t2;
      const ty = from.y + (to.y - from.y) * t2;
      const age = progress - t2, sz = 3 * (1 - age * 2.8); if (sz <= 0) continue;
      ctx.beginPath(); ctx.arc(tx, ty, sz, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,200,${Math.max(0, 1 - age * 2.2)})`; ctx.fill();
    }
    ctx.restore();
  };

  Attack.prototype.drawRipple = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const rings = 3 + Math.floor(this.intensity * 3);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = `rgba(100,220,255,${0.55 * (1 - progress)})`;
    ctx.lineWidth = 6 + this.intensity * 4; ctx.stroke();
    for (let i = 0; i < rings; i++) {
      const t = progress - i * 0.07; if (t <= 0) continue;
      const alpha = (1 - t) * (0.55 + this.intensity * 0.3);
      ctx.strokeStyle = `rgba(100,220,255,${alpha})`;
      ctx.lineWidth = 2.5 + this.intensity * 1.5;
      ctx.beginPath(); ctx.arc(x, y, 12 + t * (55 + this.intensity * 14), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1 - progress; ctx.fillStyle = 'rgba(180,240,255,0.9)';
    ctx.beginPath(); ctx.arc(x, y, 5 + this.intensity * 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  Attack.prototype.drawFire = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const size = 26 + this.intensity * 18;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = `rgba(255,110,20,${0.65 * (1 - progress * 0.6)})`;
    ctx.lineWidth = 8 + this.intensity * 6; ctx.stroke();
    const flicker = 1 + Math.sin(Date.now() * 0.04) * 0.12;
    const flame = ctx.createRadialGradient(x - size * 0.2, y - size * 0.2, 1, x, y, size * flicker);
    flame.addColorStop(0, '#fff8e0'); flame.addColorStop(0.22, '#ffcc44');
    flame.addColorStop(0.55, '#ff5500'); flame.addColorStop(1, '#880000');
    ctx.fillStyle = flame;
    ctx.beginPath(); ctx.arc(x, y, size * flicker, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  Attack.prototype.drawBubble = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const count = 4 + Math.floor(this.intensity * 3);
    const now = Date.now();
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = `rgba(160,230,255,${0.4 * (1 - progress)})`;
    ctx.lineWidth = 5 + this.intensity * 3; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < count; i++) {
      const angle = now * 0.003 + i * (Math.PI * 2 / count);
      const orbit = 10 + this.intensity * 4;
      const bx = x + Math.cos(angle) * orbit;
      const by = y + Math.sin(angle) * orbit * 0.65;
      const r = Math.max(2, 14 - i * 1.2 + this.intensity * 4);
      ctx.globalAlpha = 0.55 + this.intensity * 0.2;
      ctx.fillStyle = 'rgba(100,210,255,0.55)';
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.45; ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(bx - r * 0.28, by - r * 0.28, r * 0.28, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  };

  Attack.prototype.drawSphere = function() {
    const { from, to, progress } = this;
    const x = from.x + (to.x - from.x) * progress;
    const y = from.y + (to.y - from.y) * progress;
    const radius = 24 + this.intensity * 14 + Math.sin(Date.now() * 0.015) * 2;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y);
    ctx.strokeStyle = `rgba(34,136,255,${0.5 * (1 - progress)})`; ctx.lineWidth = 6 + this.intensity * 4; ctx.stroke();
    const orb = ctx.createRadialGradient(x - radius * 0.28, y - radius * 0.28, 1, x, y, radius);
    orb.addColorStop(0, '#ddfffe'); orb.addColorStop(0.35, '#2299ff');
    orb.addColorStop(0.75, '#0033aa'); orb.addColorStop(1, '#001133');
    ctx.fillStyle = orb;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.6; ctx.strokeStyle = 'rgba(100,200,255,0.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, radius * 1.22, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.3; ctx.strokeStyle = 'rgba(180,240,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, radius * 1.5, 0, Math.PI * 2); ctx.stroke();
    if (this.critical) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, radius * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  };

  const TYPE_MAP = {
    fire:'fire', bubble:'bubble', bubbles:'bubble', water:'bubble',
    beam:'beam', laser:'laser', shot:'laser', projectile:'projectile',
    neon:'neon', ripple:'ripple', wave:'ripple',
    sphere:'sphere', gift:'gift', hearts:'gift',
    explosion:'explosion', boom:'explosion',
    meteor:'fire', tsunami:'ripple', nuke:'explosion', nukes:'explosion',
  };

  function fireAttack(attackerId, targetId, damage, killed, special, effect, meta = {}) {
    let from = attackerId === HORDE_ID
      ? (hordePlayer() ? getHordePosition() : null)
      : getPositionForPlayer(attackerId) || (hordePlayer() ? getHordePosition() : null);
    let to = targetId === HORDE_ID
      ? (hordePlayer() ? getHordePosition() : null)
      : getPositionForPlayer(targetId) || (hordePlayer() ? getHordePosition() : null);
    if (!from || !to) return;

    let type;
    if (effect) {
      type = TYPE_MAP[String(effect).toLowerCase()] || String(effect).toLowerCase();
    } else if (special) {
      type = 'gift';
    } else if (killed) {
      type = 'explosion';
    } else {
      const s = overlaySettings.shotType;
      type = s === 'beam' ? 'beam' : s === 'pulse' ? 'fire' : s === 'wave' ? 'ripple'
           : s === 'burst' ? 'explosion' : s === 'ripple' ? 'ripple' : 'laser';
    }

    attacks.push(new Attack(from, to, type, {
      intensity: meta.intensity ?? 0.5, critical: meta.critical ?? false,
      streak: meta.streak ?? 0, giftBoosted: meta.giftBoosted ?? false,
      remainingHpPct: meta.remainingHpPct ?? 1, killingBlow: !!killed,
      color: meta.laserColor || overlaySettings.laserColor,
      shotSpeed: meta.shotSpeed || overlaySettings.shotSpeed,
    }));

    showDamage(to.x, to.y, damage || 0, !!killed, !!meta.critical);
    setHighlight(attackerId, targetId);
    const pan = (from.x / cw()) * 2 - 1;
    playSound(killed ? 'kill' : 'shoot', pan);
    if (killed) flashAlpha = 0.35;
  }

  function fireHeartEffect(playerId, hearts = 1, intensity = 0) {
    let pos = getPositionForPlayer(playerId);
    if (!pos) { const top = topPlayers(); pos = top.length ? getPlayerPosition(0, top.length) : getHordePosition(); }
    const emojis = ['❤️','💖','💘','💝'];
    const count = Math.max(1, Math.floor(hearts * (1 + intensity * 2)));
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const atk = new Attack(pos, pos, 'static');
        atk.particles.push(acquireParticle(pos.x, pos.y, {
          speed:5+Math.random()*5, emoji:emojis[i%emojis.length],
          fontSize:16+i*3+intensity*8, decay:0.016-intensity*0.003, rise:2.5+intensity*2
        }));
        attacks.push(atk);
      }, i * 90);
    }
  }

  function spawnRespawnEffect(uniqueId) {
    const pos = getPositionForPlayer(uniqueId);
    if (!pos) return;
    const atk = new Attack(pos, pos, 'static');
    for (let i = 0; i < 28; i++) {
      atk.particles.push(acquireParticle(pos.x, pos.y, {
        speed:3+Math.random()*6, color:'#ffaa00', radius:2+Math.random()*3, decay:0.022, rise:1.5
      }));
    }
    attacks.push(atk);
    playSound('respawn');
  }

  // ── Background ──
  function drawBackground() {
    const W = cw(), H = ch();
    if (backgroundImg) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      ctx.drawImage(backgroundImg,
        (W - backgroundImg.width * scale)/2, (H - backgroundImg.height * scale)/2,
        backgroundImg.width * scale, backgroundImg.height * scale);
      return;
    }
    if (darkMode) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0d1a2e'); grad.addColorStop(1, '#050b12');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(100,200,255,0.04)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#e8f0fe'); grad.addColorStop(1, '#c8d8f0');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    }
    ctx.strokeStyle = 'rgba(140,80,255,0.22)';
    ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
  }

  // ── Player card ──
  function drawPlayerCard(player, pos, rank) {
    const hp = player.hp || 0, maxHp = player.maxHp || 100;
    const realRatio = Math.max(0, Math.min(1, hp / maxHp));

    let disp = hpDisplay[player.uniqueId];
    if (!disp) { disp = { currentRatio: realRatio }; hpDisplay[player.uniqueId] = disp; }
    disp.currentRatio += (realRatio - disp.currentRatio) * HP_LERP;
    const hpPct = disp.currentRatio;

    const nearDeath = hpPct < 0.2;
    const H = ch();
    const cardH   = H * 0.5 * 0.84 * layoutZoom;
    const avatarR = cardH * 0.26;
    const avatarY = pos.y - cardH * 0.14;
    const nameY   = avatarY - avatarR - cardH * 0.06;
    const barW    = cardH * 0.72 * 0.88;
    const barH    = Math.max(6, cardH * 0.09);
    const barX    = pos.x - barW / 2;
    const barY    = avatarY + avatarR + cardH * 0.05;
    const hpTextY = barY + barH + cardH * 0.07;

    if (nearDeath) {
      const pulse = 0.5 + Math.sin(Date.now() / 280) * 0.5;
      const redGlow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, avatarR * 3.2);
      redGlow.addColorStop(0, `rgba(255,30,30,${0.2 + pulse * 0.12})`);
      redGlow.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = redGlow;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, avatarR * 3.2, 0, Math.PI * 2); ctx.fill();
    }

    const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, avatarR * 2.6);
    glow.addColorStop(0, 'rgba(122,252,255,0.14)'); glow.addColorStop(1, 'rgba(122,252,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pos.x, pos.y, avatarR * 2.6, 0, Math.PI * 2); ctx.fill();

    if (highlightTimer > 0) {
      if (player.uniqueId === lastAttackerId) {
        ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 3; ctx.stroke();
      }
      if (player.uniqueId === lastTargetId) {
        ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 3; ctx.stroke();
      }
    }

    ctx.strokeStyle = rank === 1 ? 'rgba(255,210,80,0.75)' : 'rgba(122,252,255,0.4)';
    ctx.lineWidth = Math.max(2, avatarR * 0.08);
    ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(8,18,30,0.92)';
    ctx.beginPath(); ctx.arc(pos.x, avatarY, avatarR - 2, 0, Math.PI * 2); ctx.fill();

    ctx.font = `${avatarR * 1.3}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText(player.iconEmoji || '⚔️', pos.x, avatarY);

    const fullName = (player.nickname || player.uniqueId || 'Player').slice(0, 18);
    ctx.font = `bold ${Math.max(9, cardH * 0.11)}px 'Rajdhani','Segoe UI',sans-serif`;
    const maxWidth = barW * 1.1;
    let displayName = fullName;
    while (ctx.measureText(displayName).width > maxWidth && displayName.length > 2) {
      displayName = displayName.slice(0, -1);
    }
    if (displayName !== fullName) displayName += '…';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3;
    ctx.strokeStyle = '#000'; ctx.strokeText(displayName, pos.x, nameY);
    ctx.fillStyle = '#fff'; ctx.fillText(displayName, pos.x, nameY);

    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(barX, barY, barW, barH);
    const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    barGrad.addColorStop(0, hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#ff4d4d');
    barGrad.addColorStop(1, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = barGrad; ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpPct, barH - 2);
    ctx.strokeStyle = 'rgba(122,252,255,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);

    ctx.font = `${Math.max(8, cardH * 0.085)}px 'Rajdhani','Segoe UI',sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.strokeText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);
    ctx.fillStyle = '#ccc'; ctx.fillText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);

    if (player.kills > 0) {
      const kx = pos.x + avatarR * 0.75, ky = avatarY + avatarR * 0.75;
      ctx.fillStyle = 'rgba(255,80,80,0.85)';
      ctx.beginPath(); ctx.arc(kx, ky, avatarR * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.font = `bold ${Math.max(7, avatarR * 0.32)}px 'Rajdhani',sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.fillText(player.kills, kx, ky);
    }
  }

  function drawHorde(horde) {
    if (!horde) return;
    const pos = getHordePosition();
    const H = ch(), W = cw();
    const ring = H * 0.28 * layoutZoom;
    const pulse = 0.5 + Math.sin(Date.now() / 350) * 0.5;

    ctx.fillStyle = `rgba(255,70,70,${0.07 + pulse * 0.05})`;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, ring + pulse * 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,70,70,${0.45 + pulse * 0.3})`;
    ctx.lineWidth = Math.max(2, ring * 0.1);
    ctx.beginPath(); ctx.arc(pos.x, pos.y, ring * 0.88, 0, Math.PI * 2); ctx.stroke();

    ctx.font = `${ring * 1.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💀', pos.x, pos.y);

    const labelX = Math.max(ring * 2.4, pos.x - ring * 1.35);
    ctx.font = `bold ${Math.max(10, H * 0.08)}px 'Rajdhani','Segoe UI',sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText('⚔ THE HORDE', labelX, pos.y - H * 0.05);
    ctx.fillStyle = '#ff7b7b'; ctx.fillText('⚔ THE HORDE', labelX, pos.y - H * 0.05);
    ctx.font = `${Math.max(8, H * 0.06)}px 'Rajdhani','Segoe UI',sans-serif`;
    ctx.fillStyle = '#ffc2c2'; ctx.fillText(`${horde.hordeCount} players`, labelX, pos.y + H * 0.08);

    const hpPct  = Math.min(1, horde.hp / Math.max(1, horde.maxHp));
    const barW   = Math.min(W * 0.28, W - (pos.x + ring * 1.35) - 16);
    const barH   = Math.max(8, H * 0.045);
    const barX   = pos.x + ring * 1.1, barY = pos.y - barH / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH);
    const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hpGrad.addColorStop(0, '#ff2222'); hpGrad.addColorStop(1, '#ff8888');
    ctx.fillStyle = hpGrad; ctx.fillRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);

    ctx.font = `${Math.max(8, H * 0.05)}px 'Rajdhani','Segoe UI',sans-serif`;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffaaaa';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    const hpText = `${Math.round(horde.hp)} / ${Math.round(horde.maxHp)}`;
    ctx.strokeText(hpText, barX, barY + barH + H * 0.09);
    ctx.fillText(hpText,   barX, barY + barH + H * 0.09);
  }

  // ── Render loop ──
  let lastFrameTime = 0;
  const IDLE_DELAY = 1000 / 15;

  function draw(timestamp) {
    const activeAttacks = attacks.length > 0;
    const stateChanged  = needsDraw;
    if (!activeAttacks && !stateChanged) {
      if (timestamp - lastFrameTime < IDLE_DELAY) { requestAnimationFrame(draw); return; }
    }
    lastFrameTime = timestamp;
    needsDraw = false;

    ctx.clearRect(0, 0, cw(), ch());
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    drawBackground();

    const top    = topPlayers();
    const topIds = top.map(p => p.uniqueId);

    top.forEach((p, i) => {
      const target = getPlayerPosition(i, top.length);
      updateCardAnimation(p.uniqueId, target.x, target.y);
    });

    for (const id in cardAnimations) {
      if (!topIds.includes(id) && id !== HORDE_ID) removeCardAnimation(id);
    }

    for (const id in cardAnimations) {
      const anim = cardAnimations[id];
      anim.currentX += (anim.targetX - anim.currentX) * ANIM_SPEED;
      anim.currentY += (anim.targetY - anim.currentY) * ANIM_SPEED;
      const player = top.find(p => p.uniqueId === id) || (id === HORDE_ID ? hordePlayer() : null);
      if (player) {
        drawPlayerCard(player, { x: anim.currentX, y: anim.currentY }, top.findIndex(p => p.uniqueId === id) + 1);
      }
      if (!anim.active && anim.currentX > cw() + 100) delete cardAnimations[id];
    }

    drawHorde(hordePlayer());

    if (highlightTimer > 0) { highlightTimer -= 16; if (highlightTimer < 0) highlightTimer = 0; }

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,0,0,${flashAlpha})`;
      ctx.fillRect(0, 0, cw(), ch());
      flashAlpha *= 0.9;
      if (flashAlpha < 0.01) flashAlpha = 0;
    }

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });

    requestAnimationFrame(draw);
  }

  // ── Safe handler ──
  function safeHandler(fn) {
    return (...args) => { try { fn(...args); } catch(e) { console.error('Event handler error:', e); } };
  }

  // ── Socket event handlers ──
  function onKillEvent(data) {
    if (!data) return;
    const name = data.killerName || data.killer || 'Unknown';
    const victim = data.victimName || data.victim || 'someone';
    showBanner('kill', `💀 ${name} eliminated ${victim}!`);
    flashAlpha = 0.4;
    if (players[data.victim]) { players[data.victim].alive = false; needsDraw = true; }
  }

  function onStreakEvent(data) {
    if (!data) return;
    const name = data.playerName || data.player || 'Player';
    const streak = data.streak || data.count || '?';
    showBanner('streak', `🔥 ${name} is on a ${streak}-kill STREAK!`, 3600);
  }

  function onGiftCelebration(data) {
    if (!data) return;
    const from = data.fromName || data.from || 'Someone';
    const to   = data.toName   || data.to   || 'a player';
    showBanner('gift', `🎁 ${from} gifted ${to}!`);
    if (data.to) fireHeartEffect(data.to, data.hearts || 3, data.intensity || 0.5);
  }

  function onLike(data) {
    if (!data) return;
    if (data.playerId) fireHeartEffect(data.playerId, data.count || 1, (data.count || 1) / 10);
  }

  function onRespawn(data) {
    if (!data) return;
    const id = data.uniqueId || data.playerId;
    if (!id) return;
    if (players[id]) { players[id].alive = true; players[id].hp = players[id].maxHp || 100; }
    spawnRespawnEffect(id);
    needsDraw = true;
  }

  function onSoundEvent(data) {
    if (!data) return;
    playSound(data.type || data.sound, data.pan || 0);
  }

  function onForceReload(data) {
    const reason = (data && data.reason) || 'Server requested reload';
    const delay  = (data && data.delay)  || 3;
    const overlay = document.createElement('div');
    overlay.className = 'reload-overlay';
    overlay.innerHTML = `<div class="countdown" id="reloadCountdown">${delay}</div><div class="reason">${reason}</div>`;
    document.body.appendChild(overlay);
    let count = delay;
    const timer = setInterval(() => {
      count--;
      const el = document.getElementById('reloadCountdown');
      if (el) el.textContent = count;
      if (count <= 0) { clearInterval(timer); location.reload(); }
    }, 1000);
  }

  // ── Socket init ──
  function initSocket() {
    if (typeof io === 'undefined') { enterDemoMode(); return; }
    try {
      socket = io({ transports: ['websocket', 'polling'], timeout: 5000 });
      socket.on('connect', safeHandler(() => {
        isDemoMode = false; stopDemoLoop();
        statusDiv.textContent = '🟢 LIVE · CONNECTED';
        statusDiv.className   = 'connected';
        socket.emit('register', { type: 'overlay' });
      }));
      socket.on('disconnect', safeHandler(() => {
        statusDiv.textContent = '🔴 DISCONNECTED · waiting...';
        statusDiv.className   = 'disconnected';
      }));
      socket.on('connect_error', safeHandler(() => {
        statusDiv.textContent = '⚠️ SERVER ERROR · retrying';
        statusDiv.className   = 'disconnected';
        if (Object.keys(players).length === 0) enterDemoMode();
      }));
      socket.on('gameState', safeHandler(state => {
        if (state && typeof state === 'object') {
          players = normalizePlayers(state);
          isDemoMode = false; stopDemoLoop();
          needsDraw = true;
          if (!Object.keys(players).length) {
            fetch('/state').then(r => r.json()).then(s => { players = normalizePlayers(s || {}); }).catch(() => {});
          }
        }
      }));
      socket.on('audioConfig',     safeHandler(cfg      => { if (cfg) audioConfig = cfg; }));
      socket.on('overlaySettings', safeHandler(settings => { if (settings) overlaySettings = { ...overlaySettings, ...settings }; }));
      socket.on('laserColor',      safeHandler(data     => { const c = typeof data === 'string' ? data : (data && data.color); if (c) overlaySettings.laserColor = c; }));
      socket.on('backgroundChanged', safeHandler(data   => {
        const filename = data && data.filename;
        if (!filename) { backgroundImg = null; return; }
        const img = new Image();
        img.onload = () => { backgroundImg = img; };
        img.src = `/background/${filename}?v=${Date.now()}`;
      }));
      socket.on('attack', safeHandler(data => {
        fireAttack(data.attacker, data.target, data.damage, data.killed, data.special, data.effect, {
          intensity: data.intensity, critical: data.critical, streak: data.streak,
          giftBoosted: data.giftBoosted, remainingHpPct: data.remainingHpPct,
          killingBlow: data.killingBlow, laserColor: data.laserColor, shotSpeed: data.shotSpeed,
        });
      }));
      // ──────────────────────────────────────────────────────────────────────
      // FIX: Respect server‑provided effect for gifts (laser / meteor)
      socket.on('giftAttack', safeHandler(data => {
        const forcedEffect = data.effect || (overlaySettings.shotType === 'beam' ? 'beam' :
          overlaySettings.shotType === 'pulse' ? 'fire' :
          overlaySettings.shotType === 'wave'  ? 'ripple' :
          overlaySettings.shotType === 'burst' ? 'explosion' :
          overlaySettings.shotType === 'ripple' ? 'ripple' : 'laser');
        fireAttack(data.attacker, data.target, data.damage, data.killed, true, forcedEffect, {
          intensity: data.intensity || 0.5, giftBoosted: true,
          remainingHpPct: data.killed ? 0 : (players[data.target]?.hp / players[data.target]?.maxHp || 1),
          killingBlow: !!data.killed, laserColor: data.giftColor,
        });
      }));
      // ──────────────────────────────────────────────────────────────────────
      socket.on('killEvent',        safeHandler(onKillEvent));
      socket.on('streakEvent',      safeHandler(onStreakEvent));
      socket.on('giftCelebration',  safeHandler(onGiftCelebration));
      socket.on('like',             safeHandler(onLike));
      socket.on('respawn',          safeHandler(onRespawn));
      socket.on('soundEvent',       safeHandler(onSoundEvent));
      socket.on('forceReload',      safeHandler(onForceReload));
      setTimeout(() => { if (Object.keys(players).length === 0) enterDemoMode(); }, 3000);
    } catch (err) {
      console.error('Socket init error:', err);
      statusDiv.textContent = '❌ SOCKET ERROR · demo mode';
      statusDiv.className   = 'disconnected';
      enterDemoMode();
    }
  }

  initSocket();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
