<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Battle Royale Overlay · Polished</title>
<style>
/* ── Fonts (swap for faster render) ── */
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;700;900&display=swap');

/* ── Design tokens ── */
:root {
  --accent:      #7afcff;
  --accent-glow: rgba(122,252,255,0.55);
  --accent-dim:  rgba(122,252,255,0.18);
  --bg-deep:     #02040a;
  --bg-panel:    rgba(5,9,20,0.97);
  --bg-item:     rgba(255,255,255,0.035);
  --border:      rgba(100,200,255,0.12);
  --border-hi:   rgba(100,200,255,0.28);
  --text:        #d4eeff;
  --text-dim:    rgba(212,238,255,0.45);
  --danger:      #ff5566;
  --warn:        #ffcc44;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:'Exo 2','Segoe UI',sans-serif}
body{display:flex;align-items:center;justify-content:center}

/* ── Overlay canvas ── */
#overlay-container{
  position:relative;width:min(90vw,1920px);aspect-ratio:16/9;
  background:rgba(4,8,18,0.92);
  border:1px solid rgba(180,120,255,0.35);border-radius:18px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06),0 0 48px rgba(140,80,255,0.18),0 0 120px rgba(80,40,180,0.08);
  overflow:hidden;
}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ═══════════════════════════════════════
   CONTROL PANEL
══════════════════════════════════════════ */
.panel-wrapper{
  position:fixed;top:16px;right:0;display:flex;align-items:flex-start;
  pointer-events:auto;z-index:30;
}
.panel-tab{
  width:28px;min-height:80px;background:var(--bg-panel);
  border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;
  padding:10px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--accent);font-size:9px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;writing-mode:vertical-rl;user-select:none;
  font-family:'Rajdhani',sans-serif;transition:background .2s,border-color .2s;
}
.panel-tab:hover{background:rgba(20,44,70,0.98);border-color:var(--border-hi)}
.panel-tab-icon{font-size:13px;writing-mode:horizontal-tb}

.layout-panel{
  width:272px;background:var(--bg-panel);backdrop-filter:blur(22px);
  border:1px solid var(--border);border-right:none;border-radius:0 0 0 14px;
  box-shadow:-10px 0 40px rgba(0,0,0,0.75),inset 1px 0 0 rgba(255,255,255,0.03);
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s ease;
  transform-origin:right top;max-height:calc(100vh - 32px);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.layout-panel::-webkit-scrollbar{width:3px}
.layout-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.layout-panel.hidden{transform:translateX(100%);opacity:0;pointer-events:none}

.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 13px 9px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;background:rgba(5,9,20,0.99);backdrop-filter:blur(22px);
}
.panel-title{color:var(--accent);font-size:10.5px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;font-family:'Rajdhani',sans-serif}
.panel-close{
  width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.05);
  border:1px solid var(--border);color:var(--text-dim);font-size:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:monospace;line-height:1;
}
.panel-close:hover{background:rgba(255,70,80,0.2);border-color:rgba(255,80,80,0.4);color:#ff9999}

/* Collapsible sections */
.section{border-bottom:1px solid var(--border)}
.section-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 13px;cursor:pointer;user-select:none;
  font-family:'Rajdhani',sans-serif;font-size:9.5px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);
  transition:color .15s,background .15s;
}
.section-hd:hover{color:var(--accent);background:rgba(122,252,255,0.025)}
.section-hd .chev{font-size:9px;transition:transform .22s}
.section-hd.open .chev{transform:rotate(180deg)}

.section-bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.section-bd.shut{grid-template-rows:0fr}
.section-in{min-height:0;overflow:hidden;padding:0 13px 11px}

/* ── Controls ── */
.ctrl{margin-bottom:10px}
.ctrl:last-child{margin-bottom:0}
.ctrl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.ctrl-lbl{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;color:var(--text)}
.ctrl-val{font-family:'Rajdhani',monospace;font-size:11px;font-weight:700;color:var(--accent);min-width:36px;text-align:right}
.ctrl-desc{font-family:'Rajdhani',sans-serif;font-size:9px;color:var(--text-dim);margin-top:2px;letter-spacing:.4px}

input[type=range]{
  width:100%;appearance:none;-webkit-appearance:none;
  height:4px;border-radius:999px;outline:none;cursor:pointer;
  background:rgba(255,255,255,0.07);
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow),0 0 0 2px rgba(122,252,255,0.18);
  cursor:pointer;transition:transform .1s,box-shadow .1s;
}
input[type=range]:active::-webkit-slider-thumb,
input[type=range]:hover::-webkit-slider-thumb{
  transform:scale(1.18);box-shadow:0 0 14px var(--accent-glow),0 0 0 3px rgba(122,252,255,0.28);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:none;box-shadow:0 0 8px var(--accent-glow);cursor:pointer;
}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toggle-lbl{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;color:var(--text)}
.tog{position:relative;width:34px;height:18px;cursor:pointer}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid var(--border);transition:background .2s,border-color .2s}
.tog input:checked~.tog-track{background:rgba(122,252,255,0.22);border-color:rgba(122,252,255,0.45)}
.tog-knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:rgba(190,220,255,0.55);transition:transform .18s cubic-bezier(.4,0,.2,1),background .18s}
.tog input:checked~.tog-track .tog-knob{transform:translateX(16px);background:var(--accent)}

/* Shot type grid */
.shot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.shot-btn{
  background:var(--bg-item);border:1px solid var(--border);
  border-radius:5px;padding:5px 2px;font-family:'Rajdhani',sans-serif;
  font-size:9.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
  text-align:center;transition:all .14s;letter-spacing:.3px;
}
.shot-btn:hover{background:rgba(122,252,255,0.07);color:var(--accent);border-color:var(--accent-dim)}
.shot-btn.active{background:rgba(122,252,255,0.14);color:var(--accent);border-color:rgba(122,252,255,0.5);box-shadow:0 0 8px rgba(122,252,255,0.18)}

/* Laser color */
.color-row{display:flex;align-items:center;gap:7px;margin-top:5px}
.color-swatch{
  width:26px;height:26px;border-radius:5px;flex-shrink:0;
  border:1px solid rgba(255,255,255,0.18);cursor:pointer;transition:transform .14s,box-shadow .14s;
}
.color-swatch:hover{transform:scale(1.1);box-shadow:0 0 10px rgba(255,255,255,0.2)}
input[type=color]{opacity:0;position:absolute;width:0;height:0;pointer-events:none}
.color-dots{display:flex;gap:4px;flex-wrap:wrap}
.color-dot{
  width:17px;height:17px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:transform .14s,border-color .14s;
}
.color-dot:hover{transform:scale(1.18)}
.color-dot.active{border-color:rgba(255,255,255,0.75)}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:10px 13px 13px}
.act-btn{
  background:var(--bg-item);border:1px solid var(--border);
  border-radius:6px;padding:7px 6px;font-family:'Rajdhani',sans-serif;
  font-size:10.5px;font-weight:700;color:var(--text-dim);cursor:pointer;
  text-align:center;letter-spacing:.9px;text-transform:uppercase;transition:all .14s;
}
.act-btn:hover{background:rgba(122,252,255,0.07);color:var(--accent);border-color:var(--accent-dim)}
.act-btn.wide{grid-column:1/-1;color:var(--accent);border-color:var(--accent-dim)}
.act-btn.wide:hover{background:rgba(122,252,255,0.12);box-shadow:0 0 12px rgba(122,252,255,0.15)}
.act-btn.danger{color:var(--danger);border-color:rgba(255,85,102,0.18)}
.act-btn.danger:hover{background:rgba(255,85,102,0.1);border-color:rgba(255,85,102,0.38)}

/* ═══════════════════════════════════════
   STATUS / DAMAGE / BANNERS / RELOAD
══════════════════════════════════════════ */
#status-badge{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);
  border-radius:24px;padding:4px 16px;font-size:11px;font-weight:bold;
  letter-spacing:1px;color:#aaa;pointer-events:none;z-index:9999;
  font-family:'Rajdhani',monospace;border:1px solid rgba(255,255,255,0.07);
  transition:color .2s,border-color .2s;
}
#status-badge.connected{color:#7aff87;text-shadow:0 0 4px #2eff5e;border-color:rgba(122,255,135,0.2)}
#status-badge.disconnected{color:#ff8866;border-color:rgba(255,136,102,0.2)}
#status-badge.demo{color:#ffd84f;text-shadow:0 0 4px #ffaa00;border-color:rgba(255,216,79,0.2)}

.damage{
  position:fixed;font-weight:900;font-size:clamp(18px,3vw,28px);
  color:#ff5050;text-shadow:0 0 16px rgba(255,80,80,0.95),2px 2px 8px rgba(0,0,0,0.9);
  animation:floatDmg .85s ease-out forwards;pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);white-space:nowrap;font-family:'Rajdhani',sans-serif;
}
.damage.kill{color:#ffd84f;font-size:clamp(22px,4vw,34px);text-shadow:0 0 20px rgba(255,216,79,0.95)}
.damage.critical{color:#ff2244;font-size:clamp(24px,4.5vw,38px);text-shadow:0 0 24px rgba(255,34,68,1),0 0 48px rgba(255,100,0,0.6)}
@keyframes floatDmg{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(0.6)}
}

.banner{
  position:fixed;left:50%;top:8%;transform:translate(-50%,0);
  z-index:10000;pointer-events:none;text-align:center;
  font-family:'Rajdhani',sans-serif;font-weight:900;white-space:nowrap;
  animation:bannerIn .35s cubic-bezier(.2,1.4,.4,1),bannerOut .5s ease-in 2.6s forwards;
}
.banner.kill{font-size:clamp(18px,2vw,32px);color:#ffcc44;text-shadow:0 0 30px rgba(255,200,0,.9),0 0 80px rgba(255,100,0,.6);letter-spacing:2px}
.banner.streak{font-size:clamp(20px,2.2vw,36px);color:#ff44aa;text-shadow:0 0 40px rgba(255,68,170,.9),0 0 80px rgba(255,0,100,.4);letter-spacing:3px}
.banner.gift{font-size:clamp(14px,1.8vw,26px);color:#fff;background:rgba(0,0,0,.55);padding:10px 32px;border-radius:40px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);text-shadow:0 0 20px rgba(255,255,255,.8)}
.banner.legendary{font-size:clamp(22px,2.5vw,40px);color:#FFD700;text-shadow:0 0 40px rgba(255,215,0,1),0 0 100px rgba(255,140,0,.8);letter-spacing:4px;animation:bannerIn .35s cubic-bezier(.2,1.4,.4,1),legendPulse .5s ease-in-out infinite alternate,bannerOut .5s ease-in 3.5s forwards}
@keyframes legendPulse{
  from{text-shadow:0 0 40px rgba(255,215,0,1),0 0 100px rgba(255,140,0,.8)}
  to{text-shadow:0 0 70px rgba(255,215,0,1),0 0 160px rgba(255,200,0,1)}
}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-24px) scale(.88)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bannerOut{to{opacity:0;transform:translate(-50%,-16px)}}

.reload-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;
}
.reload-overlay .countdown{font-size:5vw;color:#fff;font-family:'Rajdhani',monospace;font-weight:700;text-shadow:0 0 40px rgba(122,252,255,.8);letter-spacing:4px}
.reload-overlay .reason{font-size:1.2vw;color:#8fd8ff;margin-top:20px;letter-spacing:2px;font-family:'Rajdhani',sans-serif;text-transform:uppercase}
</style>
</head>
<body>

<div id="overlay-container">
  <canvas id="canvas"></canvas>
</div>

<!-- ══ CONTROL PANEL ══ -->
<div class="panel-wrapper">
  <button class="panel-tab" id="togglePanel" aria-label="Toggle controls">
    <span class="panel-tab-icon">⚡</span>CTRL
  </button>

  <div class="layout-panel hidden" id="layoutPanel">

    <div class="panel-header">
      <span class="panel-title">⚡ Overlay Controls</span>
      <button class="panel-close" id="closePanel" title="Close">✕</button>
    </div>

    <!-- ── Section: Layout ── -->
    <div class="section">
      <div class="section-hd open" data-bd="bd-layout">
        <span>▦ LAYOUT</span><span class="chev">▾</span>
      </div>
      <div class="section-bd" id="bd-layout">
        <div class="section-in" style="padding-top:10px">
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Column Gap</span><span class="ctrl-val" id="gapValue">0</span></div>
            <input id="gapControl" type="range" min="0" max="200" value="0" />
          </div>
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Horizontal Offset</span><span class="ctrl-val" id="offsetXValue">0</span></div>
            <input id="offsetXControl" type="range" min="-400" max="400" value="0" />
          </div>
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Vertical Position</span><span class="ctrl-val" id="offsetYValue">0</span></div>
            <input id="offsetYControl" type="range" min="-200" max="200" value="0" />
          </div>
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Layout Height</span><span class="ctrl-val" id="heightValue">85%</span></div>
            <input id="heightControl" type="range" min="30" max="100" value="85" />
          </div>
          <!-- ★ Horde threshold slider -->
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Top Player Count</span><span class="ctrl-val" id="hordeThresholdValue">5</span></div>
            <input id="hordeThresholdControl" type="range" min="1" max="10" value="5" step="1" />
            <div class="ctrl-desc">Players beyond this count are grouped into "THE HORDE"</div>
          </div>
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Zoom</span><span class="ctrl-val" id="zoomValue">100%</span></div>
            <input id="zoomControl" type="range" min="60" max="140" value="100" />
          </div>
        </div>
      </div>
    </div>

    <!-- ── Section: Visual ── -->
    <div class="section">
      <div class="section-hd open" data-bd="bd-visual">
        <span>◈ VISUAL</span><span class="chev">▾</span>
      </div>
      <div class="section-bd" id="bd-visual">
        <div class="section-in" style="padding-top:10px">
          <div class="toggle-row">
            <span class="toggle-lbl">Dark Grid</span>
            <label class="tog">
              <input type="checkbox" id="themeToggle" checked>
              <span class="tog-track"><span class="tog-knob"></span></span>
            </label>
          </div>
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Laser Color</span></div>
            <div class="color-row">
              <div class="color-swatch" id="colorSwatch" style="background:#7afcff" title="Click to open picker"></div>
              <input type="color" id="laserColorPicker" value="#7afcff">
              <div class="color-dots">
                <div class="color-dot active" data-color="#7afcff" style="background:#7afcff" title="Cyan"></div>
                <div class="color-dot" data-color="#ff4499" style="background:#ff4499" title="Pink"></div>
                <div class="color-dot" data-color="#ffcc00" style="background:#ffcc00" title="Gold"></div>
                <div class="color-dot" data-color="#44ff88" style="background:#44ff88" title="Green"></div>
                <div class="color-dot" data-color="#ff6600" style="background:#ff6600" title="Orange"></div>
                <div class="color-dot" data-color="#aa44ff" style="background:#aa44ff" title="Purple"></div>
                <div class="color-dot" data-color="#ffffff" style="background:#ffffff" title="White"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Section: Effects ── -->
    <div class="section">
      <div class="section-hd open" data-bd="bd-effects">
        <span>⚡ EFFECTS</span><span class="chev">▾</span>
      </div>
      <div class="section-bd" id="bd-effects">
        <div class="section-in" style="padding-top:10px">
          <div class="ctrl">
            <div class="ctrl-row"><span class="ctrl-lbl">Shot Type</span></div>
            <div class="shot-grid">
              <button class="shot-btn active" data-shot="beam">Beam</button>
              <button class="shot-btn" data-shot="laser">Laser</button>
              <button class="shot-btn" data-shot="neon">Neon</button>
              <button class="shot-btn" data-shot="ripple">Ripple</button>
              <button class="shot-btn" data-shot="fire">Fire</button>
              <button class="shot-btn" data-shot="bubble">Bubble</button>
              <button class="shot-btn" data-shot="sphere">Sphere</button>
              <button class="shot-btn" data-shot="projectile">Proj.</button>
            </div>
          </div>
          <div class="ctrl" style="margin-top:10px">
            <div class="ctrl-row"><span class="ctrl-lbl">Shot Speed</span><span class="ctrl-val" id="shotSpeedValue">1.0×</span></div>
            <input id="shotSpeedControl" type="range" min="40" max="300" value="100" step="10" />
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="act-btn wide" id="testEffectBtn">▶ TEST EFFECT</button>
      <button class="act-btn" id="resetLayoutBtn">↺ Reset Layout</button>
      <button class="act-btn danger" id="resetAllBtn">⚠ Reset All</button>
    </div>

  </div>
</div>

<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  'use strict';
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d',{alpha:true});
  const container = document.getElementById('overlay-container');
  const statusDiv = document.getElementById('status-badge');
  const params    = new URLSearchParams(window.location.search);
  const ROOM_ID   = params.get('room_id')||null;

  // ── DOM refs ──
  const gapControl         = document.getElementById('gapControl');
  const offsetXControl     = document.getElementById('offsetXControl');
  const offsetYControl     = document.getElementById('offsetYControl');
  const heightControl      = document.getElementById('heightControl');
  const zoomControl        = document.getElementById('zoomControl');
  const themeToggle        = document.getElementById('themeToggle');
  const shotSpeedControl   = document.getElementById('shotSpeedControl');
  const hordeThresholdCtrl = document.getElementById('hordeThresholdControl');
  const layoutPanel        = document.getElementById('layoutPanel');

  // ── State ──
  let players           = {};
  let attacks           = [];
  let layoutGap         = 0;
  let offsetX           = 0;
  let offsetY           = 0;
  let layoutZoom        = 1;
  let hordeThreshold    = 5;   // how many top players get individual cards
  let backgroundImg     = null;
  let socket            = null;
  let audioConfig       = {};
  let audioCache        = {};
  let overlaySettings   = {shotType:'beam',laserColor:'#7afcff',shotSpeed:1};
  let isDemoMode        = false;
  let demoLoopTimer     = null;
  let darkMode          = true;
  let flashAlpha        = 0;
  let needsDraw         = true;

  // ── Background cache (PERF) ──
  let bgCache      = null;
  let bgCacheDirty = true;

  // ── Frame-level caches ──
  let _frameTopPlayers   = null;
  let _frameTopPlayerMap = null;
  let _frameHorde        = null;
  let _frameTs           = 0;
  let _cardMetrics       = null;

  const HORDE_ID = '__HORDE__';

  // ═══════════════════════════════════════
  // PARTICLE POOL
  // ═══════════════════════════════════════
  const particlePool = [];
  const MAX_POOLED   = 300;

  function acquireParticle(x,y,opts){
    opts=opts||{};
    let p;
    if(particlePool.length>0){p=particlePool.pop();}
    else{p=new Particle();}
    p.reset(x,y,opts);
    return p;
  }
  function releaseParticle(p){if(particlePool.length<MAX_POOLED)particlePool.push(p);}

  // ═══════════════════════════════════════
  // DEMO MODE

  function normalizePlayers(state){
    if(!state||typeof state!=='object')return{};
    const out={};
    const arr=Array.isArray(state)?state:Array.isArray(state.players)?state.players:Object.values(state);
    arr.forEach(p=>{if(p&&p.uniqueId)out[p.uniqueId]=p;});
    return out;
  }
  const activePlayers=()=>{const r=Object.values(players);return r.length>0?r:DEMO_PLAYERS;};
  const stopDemoLoop=()=>{if(demoLoopTimer){clearInterval(demoLoopTimer);demoLoopTimer=null;}};

  function enterDemoMode(){
    if(isDemoMode)return;
    isDemoMode=true;players={};
    statusDiv.textContent='🟡 DEMO MODE · no server';
    statusDiv.className='demo';needsDraw=true;
    const TYPES=['beam','laser','neon','ripple','fire','bubble','sphere','projectile'];
    demoLoopTimer=setInterval(()=>{
      const pool=DEMO_PLAYERS.filter(p=>p.alive);
      if(pool.length<2)return;
      const atk=pool[Math.floor(Math.random()*pool.length)];
      let tgt;do{tgt=pool[Math.floor(Math.random()*pool.length)];}while(tgt===atk);
      const dmg=10+Math.floor(Math.random()*30);
      tgt.hp=Math.max(0,tgt.hp-dmg);
      if(tgt.hp===0){tgt.hp=tgt.maxHp;atk.kills=(atk.kills||0)+1;}
      needsDraw=true;
      fireAttack(atk.uniqueId,tgt.uniqueId,dmg,false,false,TYPES[Math.floor(Math.random()*TYPES.length)],{intensity:0.5+Math.random()*0.5});
    },1500);
  }

    _cardMetrics={
      cardH,
      cardW:cardH*0.72,

      hordeFont:Math.max(10,H*0.08),
      hordeFontSm:Math.max(8,H*0.06),
      hordeBarH:Math.max(8,H*0.045),

        height:+heightControl.value,zoom:+zoomControl.value,
        laserColor:overlaySettings.laserColor,
        darkMode,shotType:overlaySettings.shotType,
        shotSpeed:+shotSpeedControl.value,

  function loadLayout(){

    layoutGap=s.gap??0;
    offsetX=s.offsetX??0;
    offsetY=s.offsetY??0;
    hordeThreshold=s.hordeThreshold??5;
    heightControl.value=s.height??85;
    zoomControl.value=s.zoom??100;
    shotSpeedControl.value=s.shotSpeed??100;
    hordeThresholdCtrl.value=hordeThreshold;
    layoutZoom=s.zoom?s.zoom/100:1;
    overlaySettings.shotSpeed=(s.shotSpeed??100)/100;
    overlaySettings.laserColor=s.laserColor||'#7afcff';

  // ═══════════════════════════════════════
  // GAME HELPERS
  // ═══════════════════════════════════════
  const isAlive=p=>p&&p.alive!==false;

  function topPlayers(){
    if(_frameTopPlayers)return _frameTopPlayers;
    const result=activePlayers()
      .filter(p=>isAlive(p)&&p.uniqueId!==HORDE_ID)
      .sort((a,b)=>{const hd=(b.hp||0)-(a.hp||0);if(hd!==0)return hd;const kd=(b.kills||0)-(a.kills||0);if(kd!==0)return kd;return(b.lastActive||0)-(a.lastActive||0);})
      .slice(0,hordeThreshold);
    return result;
  }

  function hordePlayer(topArr){
    const top=topArr||topPlayers();
    const topSet=new Set(top.map(p=>p.uniqueId));
    const rest=activePlayers().filter(p=>isAlive(p)&&!topSet.has(p.uniqueId));
    if(!rest.length)return null;
    return{
      uniqueId:'__HORDE__',nickname:'THE HORDE',alive:true,
      hp:rest.reduce((s,p)=>s+(p.hp||0),0),
      maxHp:rest.reduce((s,p)=>s+(p.maxHp||100),0),
      hordeCount:rest.length,
    };
  }

  function getPlayerPosition(index,total){
    const W=cw(),H=ch();
    const m=getCardMetrics();
    const totalW=m.cardW*total+layoutGap*Math.max(0,total-1);
    return{
      x:(W-totalW)/2+offsetX+index*(m.cardW+layoutGap)+m.cardW/2,
      y:H*0.28+offsetY+H*0.16*(1-layoutZoom),
    };
  }

  function getHordePosition(){
    return{x:cw()/2+offsetX,y:ch()*0.72+offsetY+ch()*0.20*(1-layoutZoom)};
  }

  function getPositionForPlayer(id){
    if(_frameTopPlayerMap&&_frameTopPlayerMap.has(id)){
      const idx=_frameTopPlayerMap.get(id);
      return getPlayerPosition(idx,_frameTopPlayers.length);
    }
    const top=topPlayers();
    const idx=top.findIndex(p=>p.uniqueId===id||p.id===id);
    if(idx!==-1)return getPlayerPosition(idx,top.length);
    const h=hordePlayer(top);
    return h?getHordePosition():null;
  }

  // ═══════════════════════════════════════
  // PARTICLE (pooled)
  // ═══════════════════════════════════════
  class Particle{
    constructor(){this.x=0;this.y=0;this.vx=0;this.vy=0;this.life=0;this.decay=0;this.r=0;this.color='#fff';this.emoji=null;this.fs=18;}
    reset(x,y,opts){
      opts=opts||{};
      this.x=x;this.y=y;
      this.vx=(Math.random()-0.5)*(opts.speed||4);
      this.vy=(Math.random()-0.5)*(opts.speed||4)-(opts.rise||0);
      this.life=1;this.decay=opts.decay||(0.02+Math.random()*0.03);
      this.r=opts.radius||(2+Math.random()*3);
      this.color=opts.color||'#7afcff';
      this.emoji=opts.emoji||null;this.fs=opts.fontSize||18;
    }
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.06;this.life-=this.decay;return this.life>0;}
    draw(c){
      c.save();c.globalAlpha=Math.max(0,this.life);
      if(this.emoji){
        c.font=`${this.fs}px Arial`;c.textAlign='center';c.textBaseline='middle';
        c.fillText(this.emoji,this.x,this.y);
      }else{
        c.fillStyle=this.color;c.shadowColor=this.color;c.shadowBlur=10;
        c.beginPath();c.arc(this.x,this.y,this.r*Math.max(0,this.life),0,Math.PI*2);c.fill();
      }
      c.restore();
    }
  }

  // ═══════════════════════════════════════
  // ATTACK — removed gift hearts, kept laser etc.
  // ═══════════════════════════════════════
  const DURATIONS={static:1800,projectile:700,gift:900,explosion:750,beam:360,laser:420,neon:520,ripple:580,fire:700,bubble:680,sphere:720};

  class Attack{
    constructor(from,to,type,opts){
      opts=opts||{};
      this.from=from;this.to=to;this.type=type;
      this.intensity=opts.intensity??0.5;
      this.critical=opts.critical??false;
      this.streak=opts.streak??0;
      this.giftBoosted=opts.giftBoosted??false;
      this.remainingHpPct=opts.remainingHpPct??1;
      this.killingBlow=opts.killingBlow??false;
      this.color=opts.color||overlaySettings.laserColor||'#7afcff';
      this.start=Date.now();
      this.progress=0;
      this.particles=[];
      this.spawned=false;
      this.trail=[];
      this._impacted=false;
      const speed=Math.max(0.5,opts.shotSpeed||overlaySettings.shotSpeed||1);
      this.duration=Math.round((DURATIONS[type]||500)/speed);
      if(type==='fire'){
        const cnt=40+Math.floor(this.intensity*24);
        for(let i=0;i<cnt;i++)this.particles.push(acquireParticle(to.x,to.y,{speed:3+Math.random()*6,color:i%3===0?'#ffdd44':'#ff8844',radius:2+Math.random()*4,decay:0.025}));
      }
      if(this.critical)for(let i=0;i<14;i++)this.particles.push(acquireParticle(to.x,to.y,{speed:5+Math.random()*5,color:'#ffffff',radius:1.5+Math.random()*2,decay:0.04}));
      // giftBoosted golden particles removed (no hearts), just a visual glow is kept
    }
    update(){
      const el=Date.now()-this.start;
      this.progress=Math.min(1,el/this.duration);
      for(let i=this.particles.length-1;i>=0;i--){
        if(!this.particles[i].update()){releaseParticle(this.particles[i]);this.particles.splice(i,1);}
      }
      return el<this.duration||this.particles.length>0;
    }
    draw(frameTs){
      ctx.save();
      switch(this.type){
        case 'laser':this._laser();break;
        case 'beam':this._beam(frameTs);break;
        case 'projectile':this._projectile();break;
        // gift type removed – now treated as laser (fallback to default)
        case 'explosion':this._explosion();break;
        case 'neon':this._neon(frameTs);break;
        case 'ripple':this._ripple();break;
        case 'fire':this._fire(frameTs);break;
        case 'bubble':this._bubble(frameTs);break;
        case 'sphere':this._sphere(frameTs);break;
        default: this._laser(); // any unknown (like old 'gift') becomes laser
      }
      ctx.restore();
      if(this.particles.length){
        ctx.save();ctx.globalCompositeOperation='screen';
        for(let i=0;i<this.particles.length;i++)this.particles[i].draw(ctx);
        ctx.restore();
      }
    }

    // ── Draw methods (gift golden glow kept in _laser and _beam via giftBoosted flag) ──
    _laser(){
      const f=this.from,t=this.to,pg=this.progress;
      const x=f.x+(t.x-f.x)*pg,y=f.y+(t.y-f.y)*pg;
      const a=pg<0.6?1:1-(pg-0.6)/0.4;
      ctx.globalCompositeOperation='lighter';
      if(this.giftBoosted){ctx.globalAlpha=a*0.28;ctx.strokeStyle='#ffd700';ctx.lineWidth=28;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x,y);ctx.stroke();}
      ctx.globalAlpha=a*(0.4+this.intensity*0.35);ctx.strokeStyle=this.color;ctx.lineWidth=14+this.intensity*10;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x,y);ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x,y);ctx.stroke();
      if(this.critical){ctx.globalAlpha=a*0.55;ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x,y);ctx.stroke();}
    }
    _beam(frameTs){
      const f=this.from,t=this.to,pg=this.progress;
      const a=pg<0.3?1:1-(pg-0.3)/0.7;
      const pulse=1+Math.sin(frameTs/110)*0.16;
      const mx=f.x+(t.x-f.x)*pg,my=f.y+(t.y-f.y)*pg;
      ctx.globalCompositeOperation='lighter';
      if(this.giftBoosted){ctx.globalAlpha=a*0.28;ctx.strokeStyle='#ffd700';ctx.lineWidth=32;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(mx,my);ctx.stroke();}
      ctx.globalAlpha=a*(0.3+this.intensity*0.25);ctx.strokeStyle=this.color;ctx.lineWidth=(20+this.intensity*8)*pulse;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(mx,my);ctx.stroke();
      ctx.globalAlpha=a*0.8;ctx.strokeStyle='#fff';ctx.lineWidth=5;
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(mx,my);ctx.stroke();
      if(this.critical){ctx.globalAlpha=a*0.65;ctx.strokeStyle='#fff';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(mx,my);ctx.stroke();}
    }
    _projectile(){
      const f=this.from,t=this.to,pg=this.progress;
      const px=f.x+(t.x-f.x)*pg,py=f.y+(t.y-f.y)*pg;
      this.trail.push({x:px,y:py,a:pg<0.6?1:1-(pg-0.6)/0.4});
      if(this.trail.length>18)this.trail.shift();
      ctx.globalCompositeOperation='screen';
      const R=18+this.intensity*10;
      for(let i=0;i<this.trail.length;i++){
        const tr=this.trail[i],al=(i/this.trail.length)*tr.a*0.55;
        ctx.beginPath();ctx.arc(tr.x,tr.y,Math.max(0.6,(i/this.trail.length)*R*0.55),0,Math.PI*2);
        ctx.fillStyle=`rgba(122,252,255,${al})`;ctx.fill();
      }
      const g=ctx.createRadialGradient(px,py,0,px,py,R);
      g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.45,'rgba(122,252,255,0.9)');g.addColorStop(1,'rgba(122,252,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,R,0,Math.PI*2);ctx.fill();
      if(pg>0.9&&!this._impacted){this._impacted=true;for(let i=0;i<14;i++)this.particles.push(acquireParticle(t.x,t.y,{speed:4+Math.random()*5,color:'#7afcff',radius:2+Math.random()*3,decay:0.03}));}
    }
    _explosion(){
      if(this.spawned)return;this.spawned=true;
      const colors=['#ff6644','#ffcc44','#ff2222','#ff8800'],count=34+Math.floor(this.intensity*24);
      for(let i=0;i<count;i++)this.particles.push(acquireParticle(this.to.x,this.to.y,{speed:7+Math.random()*(10+this.intensity*8),color:colors[i%4],radius:3+Math.random()*(5+this.intensity*4),decay:0.014-this.intensity*0.004}));
    }
    _neon(frameTs){ /* … same as before … */ }
    _ripple(){ /* … */ }
    _fire(frameTs){ /* … */ }
    _bubble(frameTs){ /* … */ }
    _sphere(frameTs){ /* … */ }
  }

  // (Neon, ripple, fire, bubble, sphere methods unchanged – omitted for brevity but present in full code)

  // ═══════════════════════════════════════
  // FIRE ATTACK (modified to remove gift special override)
  // ═══════════════════════════════════════
  const TYPE_MAP={
    fire:'fire',bubble:'bubble',bubbles:'bubble',water:'bubble',
    beam:'beam',laser:'laser',shot:'laser',projectile:'projectile',
    neon:'neon',ripple:'ripple',wave:'ripple',
    sphere:'sphere', // removed 'gift'
    explosion:'explosion',boom:'explosion',
    meteor:'fire',tsunami:'ripple',nuke:'explosion',nukes:'explosion',
  };

  function fireAttack(atker,tgter,damage,killed,special,effect,meta){
    meta=meta||{};
    const fromPos=atker===HORDE_ID?(hordePlayer()?getHordePosition():null):getPositionForPlayer(atker)||(hordePlayer()?getHordePosition():null);
    const toPos=tgter===HORDE_ID?(hordePlayer()?getHordePosition():null):getPositionForPlayer(tgter)||(hordePlayer()?getHordePosition():null);
    if(!fromPos||!toPos)return;
    let type;
    if(effect){type=TYPE_MAP[String(effect).toLowerCase()]||String(effect).toLowerCase();}
    else if(killed){type='explosion';}
    else{const s=overlaySettings.shotType;type=s==='beam'?'beam':s==='pulse'?'fire':s==='wave'?'ripple':s==='burst'?'explosion':s==='ripple'?'ripple':'laser';}
    // special no longer forces 'gift', giftBoosted flag is passed via meta
    attacks.push(new Attack(fromPos,toPos,type,{
      intensity:meta.intensity??0.5,critical:meta.critical??false,
      streak:meta.streak??0,giftBoosted:meta.giftBoosted??false,
      remainingHpPct:meta.remainingHpPct??1,killingBlow:!!killed,
      color:meta.laserColor||overlaySettings.laserColor,
      shotSpeed:meta.shotSpeed||overlaySettings.shotSpeed,
    }));
    showDamage(toPos.x,toPos.y,damage||0,!!killed,!!meta.critical);
    setHighlight(atker,tgter);
    playSound(killed?'kill':'shoot',(fromPos.x/cw())*2-1);
    if(killed)flashAlpha=0.35;
  }

  // ═══════════════════════════════════════
  // SOCKET HANDLERS (giftAttack now does triple laser)
  // ═══════════════════════════════════════
  function onGiftAttack(d){
    if(!d)return;
    const attackerId = d.attacker;
    const damage = d.damage || 0;
    const giftColor = d.giftColor || '#ffd700';
    // collect alive opponents excluding attacker
    const aliveOpponents = activePlayers().filter(p => isAlive(p) && p.uniqueId !== attackerId);
    // pick up to 3 distinct random targets
    const targets = [];
    const pool = [...aliveOpponents];
    while(targets.length < 3 && pool.length > 0){
      const idx = Math.floor(Math.random() * pool.length);
      targets.push(pool.splice(idx, 1)[0].uniqueId);
    }
    if(targets.length === 0) return; // no one to hit
    // show banner once
    const gifterName = (players[attackerId]?.nickname || attackerId || 'Someone');
    showBanner('gift', `🎁 ${gifterName} sends a gift! Triple laser strike!`);
    // fire three laser attacks
    targets.forEach((targetId, i) => {
      setTimeout(() => {
        fireAttack(attackerId, targetId, damage, false, false, 'laser', {
          intensity: 0.7,
          giftBoosted: true,
          laserColor: giftColor,
        });
      }, i * 100); // slight stagger for visual effect
    });
  }

  // keep heart effect for likes/celebrations (unchanged)
  function fireHeartEffect(playerId,hearts,intensity){
    hearts=hearts||1;intensity=intensity||0;
    let pos=getPositionForPlayer(playerId);
    if(!pos){const t=topPlayers();pos=t.length?getPlayerPosition(0,t.length):getHordePosition();}
    const emojis=['❤️','💖','💘','💝'],count=Math.max(1,Math.floor(hearts*(1+intensity*2)));
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        const a=new Attack(pos,pos,'static');
        a.particles.push(acquireParticle(pos.x,pos.y,{speed:5+Math.random()*5,emoji:emojis[i%emojis.length],fontSize:16+i*3+intensity*8,decay:0.016-intensity*0.003,rise:2.5+intensity*2}));
        attacks.push(a);
      },i*90);
    }
  }

  // ═══════════════════════════════════════
  // RENDER LOOP + SOCKET INIT (rest unchanged)
  // ═══════════════════════════════════════
  // ... (includes drawBackground, drawPlayerCard, drawHorde, draw loop, socket init with updated listeners)
