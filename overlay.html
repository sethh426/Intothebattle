<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle Royale Overlay · Fixed</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #02040a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
#canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.damage {
  position: fixed;
  font-weight: bold; font-size: 28px;
  color: #ff5050;
  text-shadow: 0 0 10px black;
  animation: floatUp 0.8s ease-out forwards;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
}
.damage.kill { color: gold; font-size: 34px; }
@keyframes floatUp {
  0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-150%) scale(0.8); }
}
#status {
  position: fixed; bottom: 10px; left: 10px;
  background: black; color: #0f0; padding: 4px 12px;
  border-radius: 20px; font-family: monospace; font-size: 12px;
  z-index: 1000;
}
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">🔌 CONNECTING...</div>

<script>
// ------------------- UTILITIES -------------------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let players = {};
let attacks = [];
let backgroundImg = null;
let socket = null;

// For damage numbers
function showDamage(worldX, worldY, dmg, isKill) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const screenX = rect.left + worldX * (rect.width / canvas.width);
    const screenY = rect.top + worldY * (rect.height / canvas.height);
    const div = document.createElement('div');
    div.className = 'damage' + (isKill ? ' kill' : '');
    div.textContent = isKill ? '💀 KILL!' : `-${Math.round(dmg)}`;
    div.style.left = screenX + 'px';
    div.style.top = screenY + 'px';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 800);
}

// ------------------- RENDERING -------------------
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Background
function drawBackground() {
    if (backgroundImg) {
        ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#0a0f1e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(100,200,255,0.1)';
        for (let i = 0; i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let i = 0; i < canvas.height; i += 80) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }
    }
}

// Top 5 players (by HP)
function topPlayers() {
    return Object.values(players)
        .filter(p => p.alive)
        .sort((a,b) => (b.hp||0) - (a.hp||0))
        .slice(0,5);
}

// Position for top 5 (horizontal row)
function getPosition(index) {
    const total = 5;
    const cardW = 180;
    const gap = 20;
    const totalW = total * cardW + (total-1) * gap;
    const startX = (canvas.width - totalW) / 2;
    const y = canvas.height * 0.3;
    return { x: startX + index * (cardW + gap) + cardW/2, y: y };
}

// Draw a single player card
function drawPlayer(p, idx) {
    const pos = getPosition(idx);
    const hp = p.hp || 0;
    const maxHp = p.maxHp || 100;
    const hpPercent = hp / maxHp;
    const cardW = 180;
    const cardH = 220;
    const x = pos.x - cardW/2;
    const y = pos.y - cardH/2;

    // Card background
    ctx.fillStyle = '#11151fe0';
    ctx.shadowBlur = 0;
    ctx.fillRect(x, y, cardW, cardH);
    ctx.strokeStyle = '#7afcff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, cardW, cardH);

    // Avatar circle
    const avatarR = 50;
    const avatarX = pos.x;
    const avatarY = y + 70;
    ctx.beginPath();
    ctx.arc(avatarX, avatarY, avatarR, 0, Math.PI*2);
    ctx.fillStyle = '#1e2a3a';
    ctx.fill();
    ctx.strokeStyle = '#7afcff';
    ctx.stroke();
    // Emoji
    ctx.font = `${avatarR-10}px Arial`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.iconEmoji || '⚔️', avatarX, avatarY);

    // Name
    ctx.font = 'bold 16px "Segoe UI"';
    ctx.fillStyle = '#fff';
    ctx.fillText((p.nickname || p.uniqueId).slice(0,12), pos.x, y + 30);

    // HP bar
    const barW = cardW - 20;
    const barH = 12;
    const barX = x + 10;
    const barY = y + cardH - 30;
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = hpPercent > 0.6 ? '#2ecc71' : (hpPercent > 0.3 ? '#f39c12' : '#e74c3c');
    ctx.fillRect(barX, barY, barW * hpPercent, barH);

    // HP text
    ctx.font = '12px monospace';
    ctx.fillStyle = '#ccc';
    ctx.fillText(`${Math.round(hp)}/${maxHp}`, pos.x, barY - 5);
}

// Draw "THE HORDE" – all other players combined
function drawHorde() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest = Object.values(players).filter(p => p.alive && !topSet.has(p.uniqueId));
    if (rest.length === 0) return;

    const totalHp = rest.reduce((s,p) => s + (p.hp||0), 0);
    const totalMaxHp = rest.reduce((s,p) => s + (p.maxHp||100), 0);
    const hpPercent = totalHp / totalMaxHp;

    const x = canvas.width/2;
    const y = canvas.height * 0.75;
    const w = 300;
    const h = 100;

    ctx.fillStyle = '#1a0f0fe0';
    ctx.fillRect(x - w/2, y - h/2, w, h);
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - w/2, y - h/2, w, h);

    ctx.font = 'bold 22px "Segoe UI"';
    ctx.fillStyle = '#ff8888';
    ctx.textAlign = 'center';
    ctx.fillText(`💀 THE HORDE (${rest.length})`, x, y - 20);

    const barW = w - 40;
    const barH = 14;
    const barX = x - barW/2;
    const barY = y + 10;
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(barX, barY, barW * hpPercent, barH);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#ffcccc';
    ctx.fillText(`${Math.round(totalHp)}/${Math.round(totalMaxHp)}`, x, barY + 25);
}

// Simple laser effect
class Laser {
    constructor(from, to) {
        this.from = from;
        this.to = to;
        this.start = performance.now();
        this.duration = 400;
    }
    update() {
        const elapsed = performance.now() - this.start;
        this.progress = Math.min(1, elapsed / this.duration);
        return elapsed < this.duration;
    }
    draw() {
        const fromX = this.from.x;
        const fromY = this.from.y;
        const toX = this.to.x;
        const toY = this.to.y;
        const headX = fromX + (toX - fromX) * this.progress;
        const headY = fromY + (toY - fromY) * this.progress;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(headX, headY);
        ctx.strokeStyle = '#7afcff';
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(headX, headY, 10, 0, Math.PI*2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.restore();
    }
}

function fireAttack(attackerId, targetId, damage, killed) {
    // Find attacker position
    const top = topPlayers();
    let fromPos = null, toPos = null;

    // Attacker
    const attackerTopIndex = top.findIndex(p => p.uniqueId === attackerId);
    if (attackerTopIndex !== -1) {
        fromPos = getPosition(attackerTopIndex);
    } else if (attackerId === '__HORDE__') {
        fromPos = { x: canvas.width/2, y: canvas.height * 0.75 };
    } else {
        // Not in top 5 – skip attack animation for simplicity
        fromPos = null;
    }

    // Target
    const targetTopIndex = top.findIndex(p => p.uniqueId === targetId);
    if (targetTopIndex !== -1) {
        toPos = getPosition(targetTopIndex);
    } else if (targetId === '__HORDE__') {
        toPos = { x: canvas.width/2, y: canvas.height * 0.75 };
    } else {
        toPos = null;
    }

    if (fromPos && toPos) {
        attacks.push(new Laser(fromPos, toPos));
    }

    // Show damage numbers: approximate world position = canvas position
    const damagePos = toPos || fromPos || { x: canvas.width/2, y: canvas.height/2 };
    showDamage(damagePos.x, damagePos.y, damage, killed);
}

// ------------------- SOCKET (same as diagnostic) -------------------
function initSocket() {
    socket = io({
        transports: ['websocket', 'polling'],
        reconnectionAttempts: 5,
        timeout: 10000
    });

    socket.on('connect', () => {
        document.getElementById('status').innerHTML = '🟢 CONNECTED';
        socket.emit('register', { type: 'overlay' });
    });

    socket.on('disconnect', () => {
        document.getElementById('status').innerHTML = '🔴 DISCONNECTED';
    });

    socket.on('connect_error', (err) => {
        document.getElementById('status').innerHTML = `⚠️ ERROR: ${err.message}`;
    });

    socket.on('gameState', (state) => {
        if (state && typeof state === 'object') {
            players = state;
        }
    });

    socket.on('backgroundChanged', ({ filename }) => {
        if (!filename) { backgroundImg = null; return; }
        const img = new Image();
        img.onload = () => { backgroundImg = img; };
        img.src = `/background/${filename}?v=${Date.now()}`;
    });

    socket.on('attack', (data) => {
        fireAttack(data.attacker, data.target, data.damage, data.killed);
    });

    socket.on('giftAttack', ({ attacker, target, damage, killed }) => {
        fireAttack(attacker, target, damage, killed);
    });
}

// ------------------- ANIMATION LOOP -------------------
function animate() {
    drawBackground();
    const top = topPlayers();
    for (let i = 0; i < top.length; i++) {
        drawPlayer(top[i], i);
    }
    drawHorde();
    attacks = attacks.filter(laser => {
        const keep = laser.update();
        if (keep) laser.draw();
        return keep;
    });
    requestAnimationFrame(animate);
}

// Start
initSocket();
animate();
</script>
</body>
</html>
