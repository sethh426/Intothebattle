<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PvP Battle Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: 'Arial', sans-serif; background: #000; }
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
.panel {
  position: absolute;
  background: rgba(8, 12, 24, 0.85);
  border: 1px solid rgba(100, 200, 255, 0.25);
  border-radius: 8px; padding: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  font-size: 12px; color: #fff;
}
.status { bottom: 12px; left: 12px; width: 280px; min-height: 100px; }
.status-title { font-size: 12px; font-weight: 700; color: #64c8ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px; }
.status-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.status-label { color: #a0c0ff; }
.status-value { color: #64c8ff; font-weight: 600; }
.live-indicator { display: inline-block; width: 8px; height: 8px; background: #ff4444; border-radius: 50%; margin-right: 4px; animation: pulse 1.3s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.leaderboard { top: 12px; right: 12px; width: 220px; max-height: 220px; }
.board-title { font-size: 12px; font-weight: 700; color: #ffd93d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,217,61,0.2); padding-bottom: 6px; }
.board-entry { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; margin: 4px 0; background: rgba(100,200,255,0.08); border: 1px solid rgba(100,200,255,0.15); border-radius: 6px; font-size: 12px; }
.board-entry.rank-1 { background: rgba(255,217,61,0.12); border-color: rgba(255,217,61,0.3); }
.board-entry.rank-2 { background: rgba(200,200,200,0.08); border-color: rgba(200,200,200,0.2); }
.board-entry.rank-3 { background: rgba(200,100,100,0.08); border-color: rgba(200,100,100,0.2); }
.rank-num { min-width: 18px; font-weight: 700; color: #64c8ff; }
.rank-name { flex: 1; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-score { color: #ffd93d; font-weight: 700; min-width: 30px; text-align: right; }
.eventlog { right: 12px; bottom: 12px; width: 220px; height: 120px; max-height: 120px; overflow-y: auto; overflow-x: hidden; }
.controls { top: 250px; right: 12px; width: 220px; pointer-events: auto; }
.controls-title { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #64c8ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px; }
.controls-title button { background: rgba(255,255,255,0.08); border: 1px solid rgba(100,200,255,0.25); color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
.controls.hidden { opacity: 0.15; }
.control-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin: 10px 0; font-size: 12px; }
.control-row span { color: #e1f7ff; }
.control-row input[type="range"] { width: 100%; }
.log-title { font-size: 12px; font-weight: 700; color: #64c8ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px; }
.log-entry { padding: 4px 6px; margin: 2px 0; background: rgba(255,255,255,0.04); border-left: 2px solid rgba(100,200,255,0.3); border-radius: 4px; font-size: 10px; line-height: 1.2; color: #ddd; }
.log-entry.kill { background: rgba(255,51,51,0.12); border-left-color: #ff4444; color: #ffdddd; font-weight: 600; }
.log-entry.gift { background: rgba(255,217,61,0.12); border-left-color: #ffd93d; color: #ffe6cc; }
.eventlog::-webkit-scrollbar { width: 6px; }
.eventlog::-webkit-scrollbar-thumb { background: rgba(100,200,255,0.3); border-radius: 3px; }
.dmg-number { position: absolute; font-size: 32px; font-weight: 900; color: #ff3333; text-shadow: 0 0 12px rgba(255,51,51,0.8), 2px 2px 6px rgba(0,0,0,0.95); pointer-events: none; animation: dmgFloat 0.7s ease-out forwards; z-index: 30; }
@keyframes dmgFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(0.5)} }
