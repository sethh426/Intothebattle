<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Battle Royale Overlay · Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Segoe UI', sans-serif; }

    #overlay-wrap {
      position: absolute; inset: 0;
      background: #02040a;
    }

    #overlay-positioner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: top 0.05s linear;
    }

    #overlay-rect {
      position: relative;
      width: 80vw; height: 20vh; min-height: 140px;
      overflow: visible;
      border: 1px solid rgba(140,80,255,0.45);
      border-radius: 10px;
      box-shadow: 0 0 48px rgba(140,80,255,0.3), inset 0 0 4px rgba(255,255,255,0.05);
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 10px; overflow: hidden; }

    /* Damage numbers */
    .damage {
      position: fixed;
      font-weight: 900; font-size: clamp(18px,3vw,28px);
      color: #ff5050;
      text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9);
      animation: floatDamage 0.85s ease-out forwards;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .damage.kill {
      color: #ffd84f; font-size: clamp(22px,4vw,34px);
      text-shadow: 0 0 20px rgba(255,216,79,0.95);
    }
    @keyframes floatDamage {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%,-160%) scale(0.65); }
    }

    /* UI panel */
    .ui { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
    .panel-wrapper {
      position: absolute; top: 16px; right: 0;
      display: flex; align-items: flex-start;
      pointer-events: auto;
    }
    .panel-tab {
      width: 28px;
      background: rgba(6,10,20,0.88);
      border: 1px solid rgba(100,200,255,0.2);
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 10px 0;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: #8fd8ff; font-size: 10px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
      writing-mode: vertical-rl; text-orientation: mixed;
      user-select: none;
      transition: background 0.2s;
    }
    .panel-tab:hover { background: rgba(20,40,70,0.95); }
    .panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }

    .layout-panel {
      width: 240px;
      padding: 14px 16px; border-radius: 0 0 0 16px;
      background: rgba(6,10,20,0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(100,200,255,0.14);
      border-right: none;
      box-shadow: -8px 0 30px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
      transform-origin: right top;
    }
    .layout-panel.hidden {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }
    .layout-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .layout-title { color: #8fd8ff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .layout-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: white; border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; transition: 0.2s;
    }
    .layout-btn:hover { background: rgba(255,255,255,0.12); }
    .control { margin-bottom: 13px; }
    .control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .control-top span { font-size: 11px; color: #cfefff; }
    .control input { width: 100%; appearance: none; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); outline: none; }
    .control input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; }

    /* Connection status badge */
    #status-badge {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 4px 16px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #aaa;
      pointer-events: none;
      z-index: 9999;
      font-family: monospace;
      transition: 0.2s;
    }
    #status-badge.connected { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
    #status-badge.disconnected { color: #ff8866; }
  </style>
  <!-- Socket.IO client (required for live data) -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="overlay-wrap">
  <div id="overlay-positioner">
    <div id="overlay-rect">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</div>

<div class="ui">
  <div class="panel-wrapper">
    <div class="panel-tab" id="togglePanel">
      <span class="panel-tab-icon">⚡</span>
      LAYOUT
    </div>
    <div class="layout-panel" id="layoutPanel">
      <div class="control">
        <div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div>
        <input id="gapControl" type="range" min="0" max="200" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div>
        <input id="offsetXControl" type="range" min="-400" max="400" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div>
        <input id="offsetYControl" type="range" min="-200" max="200" value="0" />
      </div>
      <div class="control">
        <div class="control-top"><span>Layout Height</span><span id="heightValue">20%</span></div>
        <input id="heightControl" type="range" min="10" max="55" value="20" />
      </div>
      <div class="control">
        <div class="control-top"><span>Screen Position</span><span id="screenYValue">↕ Centre</span></div>
        <input id="screenYControl" type="range" min="-50" max="50" value="0" />
      </div>
    </div>
  </div>
</div>
<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const rectEl = document.getElementById('overlay-rect');
  const statusDiv = document.getElementById('status-badge');

  let players = {};           // will be populated by server
  let attacks = [];
  let layoutGap = 0, offsetX = 0, offsetY = 0, layoutScale = 1;
  let backgroundImg = null;
  const audioCache = {}; let audioConfig = {}, soundEnabled = true;
  const HORDE_ID = '__HORDE__';
  let currentScale = 1;
  let socket = null;
  let isConnected = false;

  // ── Socket.IO connection (live data) ──
  function initSocket() {
    try {
      socket = io({ transports: ['websocket', 'polling'], timeout: 5000 });
      
      socket.on('connect', () => {
        console.log('[Live] Socket connected');
        isConnected = true;
        statusDiv.textContent = '🟢 LIVE · CONNECTED';
        statusDiv.className = 'connected';
        socket.emit('register', { type: 'overlay' });
      });

      socket.on('disconnect', () => {
        console.warn('[Live] Socket disconnected');
        isConnected = false;
        statusDiv.textContent = '🔴 DISCONNECTED · waiting...';
        statusDiv.className = 'disconnected';
      });

      socket.on('connect_error', (err) => {
        console.error('[Live] Connection error:', err);
        statusDiv.textContent = '⚠️ SERVER ERROR · retrying';
        statusDiv.className = 'disconnected';
      });

      // Real game state from server
      socket.on('gameState', (state) => {
        if (state && typeof state === 'object') {
          players = state;
          console.log('[Live] gameState updated, players:', Object.keys(players).length);
        } else {
          console.warn('[Live] Invalid gameState received', state);
        }
      });

      socket.on('audioConfig', (cfg) => {
        if (cfg) audioConfig = cfg;
      });

      socket.on('backgroundChanged', ({ filename }) => {
        if (!filename) {
          backgroundImg = null;
          return;
        }
        const img = new Image();
        img.onload = () => { backgroundImg = img; };
        img.src = `/background/${filename}?v=${Date.now()}`;
      });

      socket.on('attack', (data) => {
        fireAttack(data.attacker, data.target, data.damage, data.killed, data.special);
      });

    } catch (err) {
      console.error('[Live] Failed to init socket:', err);
      statusDiv.textContent = '❌ SOCKET ERROR · no live data';
    }
  }

  // ── Resize & canvas scaling ──
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const w = rectEl.offsetWidth, h = rectEl.offsetHeight;
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // ── UI Controls ──
  const gapControl     = document.getElementById('gapControl');
  const offsetXControl = document.getElementById('offsetXControl');
  const offsetYControl = document.getElementById('offsetYControl');
  const heightControl  = document.getElementById('heightControl');
  const screenYControl = document.getElementById('screenYControl');
  const positioner     = document.getElementById('overlay-positioner');

  function syncValues() {
    document.getElementById('gapValue').textContent     = layoutGap;
    document.getElementById('offsetXValue').textContent = offsetX;
    document.getElementById('offsetYValue').textContent = offsetY;
  }
  gapControl.oninput     = () => { layoutGap = +gapControl.value;     syncValues(); };
  offsetXControl.oninput = () => { offsetX   = +offsetXControl.value; syncValues(); };
  offsetYControl.oninput = () => { offsetY   = +offsetYControl.value; syncValues(); };
  heightControl.oninput  = () => {
    const pct = +heightControl.value;
    document.getElementById('heightValue').textContent = pct + '%';
    rectEl.style.height = pct + 'vh';
    resizeCanvas();
  };
  screenYControl.oninput = () => {
    const v = +screenYControl.value;
    const topVh = 50 - v;
    document.getElementById('screenYValue').textContent =
      v === 0 ? '↕ Centre' : v > 0 ? `▲ ${v}%` : `▼ ${Math.abs(v)}%`;
    positioner.style.top = topVh + 'vh';
  };
  syncValues();

  const panel = document.getElementById('layoutPanel');
  const tab   = document.getElementById('togglePanel');
  tab.onclick = () => {
    panel.classList.toggle('hidden');
    tab.querySelector('.panel-tab-icon').textContent = panel.classList.contains('hidden') ? '⚙' : '⚡';
  };

  // ── Audio helpers ──
  function getAudio(f) {
    if (!audioCache[f]) {
      const a = new Audio(`/audio/${f}`);
      a.preload = 'auto';
      audioCache[f] = a;
    }
    return audioCache[f];
  }
  function playSound(type) {
    if (!soundEnabled) return;
    const f = audioConfig[type];
    if (!f) return;
    try {
      const a = getAudio(f);
      a.currentTime = 0;
      a.play().catch(() => {});
    } catch(e) {}
  }

  // ── Data extraction for top players & horde ──
  function topPlayers() {
    return Object.values(players)
      .filter(p => p.alive && p.uniqueId !== HORDE_ID)
      .sort((a, b) => (b.hp || 0) - (a.hp || 0))
      .slice(0, 5);
  }

  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest = Object.values(players).filter(p => p.alive && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return {
      uniqueId: HORDE_ID,
      nickname: 'THE HORDE',
      hp:    rest.reduce((s, p) => s + (p.hp    || 0), 0),
      maxHp: rest.reduce((s, p) => s + (p.maxHp || 100), 0),
      hordeCount: rest.length,
      alive: true
    };
  }

  function cw() { return rectEl.offsetWidth; }
  function ch() { return rectEl.offsetHeight; }

  function getPlayerPosition(index) {
    const W = cw(), cellW = (W * 0.82) / 5, gap = layoutGap * currentScale;
    const totalW = cellW * 5 + gap * 4, startX = (W - totalW) / 2 + offsetX;
    return { x: startX + index * (cellW + gap) + cellW / 2, y: ch() * 0.30 + offsetY };
  }
  function getHordePosition() {
    return { x: cw() / 2 + offsetX, y: ch() * 0.78 + offsetY };
  }

  // Convert canvas-local coords to viewport for damage numbers
  function canvasToViewport(cx, cy) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = rect.width  / cw();
    const scaleY = rect.height / ch();
    return { x: rect.left + cx * scaleX, y: rect.top  + cy * scaleY };
  }

  // ── Drawing routines ──
  function drawBackground() {
    const W = cw(), H = ch();
    if (backgroundImg) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      ctx.drawImage(backgroundImg,
        (W - backgroundImg.width  * scale) / 2,
        (H - backgroundImg.height * scale) / 2,
        backgroundImg.width * scale, backgroundImg.height * scale);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0d1a2e'); g.addColorStop(1, '#050b12');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(100,200,255,0.04)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(140,80,255,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
    }
  }

  function drawPlayerCard(player, pos, rank) {
    const hp = player.hp || 0, maxHp = player.maxHp || 100;
    const hpPct = Math.max(0, Math.min(1, hp / maxHp));
    const H = ch(), cardH = H * 0.60 * 0.84, cardW = cardH * 0.72;
    const cx = pos.x, cy = pos.y;
    const avatarR = cardH * 0.26, avatarY = cy - cardH * 0.14;
    const nameY = avatarY - avatarR - cardH * 0.06;
    const barW = cardW * 0.88, barH = Math.max(6, cardH * 0.09);
    const barX = cx - barW / 2, barY = avatarY + avatarR + cardH * 0.05;
    const hpTextY = barY + barH + cardH * 0.07;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, avatarR * 2.5);
    glow.addColorStop(0, 'rgba(122,252,255,0.18)'); glow.addColorStop(1, 'rgba(122,252,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, avatarR * 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = rank === 1 ? 'rgba(255,210,80,0.7)' : 'rgba(122,252,255,0.35)';
    ctx.lineWidth = Math.max(2, avatarR * 0.08);
    ctx.beginPath(); ctx.arc(cx, avatarY, avatarR, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(8,18,30,0.92)';
    ctx.beginPath(); ctx.arc(cx, avatarY, avatarR - 2, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${avatarR * 1.3}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(player.iconEmoji || '⚔️', cx, avatarY);

    const nameFontSize = Math.max(9, cardH * 0.11);
    ctx.font = `bold ${nameFontSize}px "Segoe UI"`; ctx.textBaseline = 'middle';
    const name = (player.nickname || player.uniqueId || 'Player').slice(0, 13);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(name, cx, nameY);
    ctx.fillStyle = '#fff'; ctx.fillText(name, cx, nameY);

    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(barX, barY, barW, barH);
    const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hpGrad.addColorStop(0, hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#ff4d4d');
    hpGrad.addColorStop(1, '#ffffff55');
    ctx.fillStyle = hpGrad; ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpPct, barH - 2);
    ctx.strokeStyle = 'rgba(122,252,255,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);

    const hpFontSize = Math.max(8, cardH * 0.085);
    ctx.font = `${hpFontSize}px "Segoe UI"`;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.strokeText(`${Math.round(hp)}/${maxHp}`, cx, hpTextY);
    ctx.fillStyle = '#ccc'; ctx.fillText(`${Math.round(hp)}/${maxHp}`, cx, hpTextY);
  }

  function drawHorde(horde) {
    if (!horde) return;
    const pos = getHordePosition(), H = ch(), rowH = H * 0.40;
    const pulse = 0.5 + Math.sin(Date.now() / 350) * 0.5;
    const skullR = rowH * 0.28, cx = pos.x, cy = pos.y;

    ctx.beginPath(); ctx.arc(cx, cy, skullR + pulse * 4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,70,70,${0.08 + pulse * 0.05})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,70,70,${0.5 + pulse * 0.3})`;
    ctx.lineWidth = Math.max(2, skullR * 0.1);
    ctx.beginPath(); ctx.arc(cx, cy, skullR * 0.88, 0, Math.PI * 2); ctx.stroke();
    ctx.font = `${skullR * 1.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💀', cx, cy);

    const titleFont = Math.max(10, rowH * 0.22);
    ctx.font = `bold ${titleFont}px "Segoe UI"`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText('⚔ THE HORDE', cx - skullR * 1.35, cy - rowH * 0.1);
    ctx.fillStyle = '#ff7b7b'; ctx.fillText('⚔ THE HORDE', cx - skullR * 1.35, cy - rowH * 0.1);
    ctx.font = `${Math.max(8, rowH * 0.16)}px "Segoe UI"`; ctx.textAlign = 'right';
    ctx.fillStyle = '#ffc2c2'; ctx.fillText(`${horde.hordeCount} players`, cx - skullR * 1.35, cy + rowH * 0.14);

    const hpPct = Math.min(1, horde.hp / Math.max(1, horde.maxHp));
    const barW = cw() * 0.28, barH2 = Math.max(8, rowH * 0.16);
    const barX = cx + skullR * 1.35, barY = cy - barH2 / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH2);
    const rg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    rg.addColorStop(0, '#ff2222'); rg.addColorStop(1, '#ff8888');
    ctx.fillStyle = rg; ctx.fillRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH2 - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH2);
    ctx.font = `${Math.max(8, rowH * 0.14)}px "Segoe UI"`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    const hpStr = `${Math.round(horde.hp)} / ${Math.round(horde.maxHp)}`;
    ctx.strokeText(hpStr, barX, barY + barH2 + rowH * 0.12);
    ctx.fillStyle = '#ffaaaa'; ctx.fillText(hpStr, barX, barY + barH2 + rowH * 0.12);
  }

  // Attack visual effect
  class Attack {
    constructor(from, to, special = false) {
      this.from = from; this.to = to; this.special = special;
      this.start = Date.now(); this.duration = 550;
    }
    update() { return Date.now() - this.start < this.duration; }
    draw() {
      const progress = (Date.now() - this.start) / this.duration;
      const alpha = 1 - progress;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      if (this.special) {
        ctx.shadowColor = 'rgba(255,170,80,0.9)';
        ctx.shadowBlur  = 18;
        ctx.strokeStyle = `rgba(255,200,80,${alpha})`;
        ctx.lineWidth   = 10;
      } else {
        ctx.shadowColor = 'rgba(122,252,255,0.9)';
        ctx.shadowBlur  = 14;
        ctx.strokeStyle = `rgba(122,252,255,${alpha})`;
        ctx.lineWidth   = 5;
      }
      const tx = this.from.x + (this.to.x - this.from.x) * progress;
      const ty = this.from.y + (this.to.y - this.from.y) * progress;
      ctx.beginPath(); ctx.moveTo(this.from.x, this.from.y); ctx.lineTo(tx, ty); ctx.stroke();
      const headR = this.special ? 8 : 5;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(tx, ty, headR, 0, Math.PI * 2); ctx.fill();
      if (this.special) {
        ctx.strokeStyle = `rgba(255,255,100,${alpha * 0.6})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(tx, ty, headR + 6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function showDamage(canvasX, canvasY, dmg, kill) {
    const vp = canvasToViewport(canvasX, canvasY);
    const el = document.createElement('div');
    el.className = `damage${kill ? ' kill' : ''}`;
    el.textContent = kill ? '💀 KILL!' : `-${Math.round(dmg)}`;
    el.style.left = vp.x + 'px';
    el.style.top  = vp.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // Attack dispatcher (from server or local)
  function fireAttack(attackerId, targetId, damage, killed, special) {
    const top = topPlayers();
    const horde = hordePlayer();
    const isAttackerHorde = attackerId === HORDE_ID;
    const isTargetHorde   = targetId === HORDE_ID;

    let from, to;
    if (isAttackerHorde) {
      from = getHordePosition();
    } else {
      const idx = top.findIndex(p => p.uniqueId === attackerId);
      if (idx === -1) return; // attacker not visible
      from = getPlayerPosition(idx);
    }

    if (isTargetHorde) {
      to = getHordePosition();
    } else {
      const idx = top.findIndex(p => p.uniqueId === targetId);
      if (idx === -1) return;
      to = getPlayerPosition(idx);
    }

    attacks.push(new Attack(from, to, special));
    showDamage(to.x, to.y, damage, killed);
    playSound(special ? 'gift' : 'attack');
  }

  // ── Animation loop ──
  function draw() {
    currentScale = Math.min(cw() / 1920, ch() / 200, 1.4) * layoutScale;
    if (currentScale < 0.05) currentScale = 0.05;
    ctx.clearRect(0, 0, cw(), ch());
    drawBackground();
    const topList = topPlayers();
    topList.forEach((p, i) => drawPlayerCard(p, getPlayerPosition(i), i + 1));
    drawHorde(hordePlayer());
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });
    requestAnimationFrame(draw);
  }

  // Start everything
  initSocket();
  draw();
})();
</script>
</body>
