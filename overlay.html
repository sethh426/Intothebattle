<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Battle Royale Overlay · Professional Lasers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Segoe UI', sans-serif; }
body { display: flex; align-items: center; justify-content: center; }
#overlay-container { position: relative; width: min(90vw, 1920px); aspect-ratio: 16 / 9; background: rgba(4, 8, 18, 0.92); border: 1px solid rgba(180, 120, 255, 0.35); border-radius: 18px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 48px rgba(140,80,255,0.18); overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
.panel-wrapper { position: fixed; top: 16px; right: 0; display: flex; align-items: flex-start; pointer-events: auto; z-index: 30; }
.panel-tab { width: 28px; background: rgba(6,10,20,0.88); border: 1px solid rgba(100,200,255,0.2); border-right: none; border-radius: 8px 0 0 8px; padding: 10px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #8fd8ff; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; writing-mode: vertical-rl; text-orientation: mixed; user-select: none; transition: background 0.2s; }
.panel-tab:hover { background: rgba(20,40,70,0.95); }
.panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }
.layout-panel { width: 240px; padding: 14px 16px; border-radius: 0 0 0 16px; background: rgba(6,10,20,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(100,200,255,0.14); border-right: none; box-shadow: -8px 0 30px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; transform-origin: right top; max-height: 90vh; overflow-y: auto; }
.layout-panel.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
.layout-title { color: #8fd8ff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
.control { margin-bottom: 13px; }
.control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.control-top span { font-size: 11px; color: #cfefff; }
.control input { width: 100%; appearance: none; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); outline: none; }
.control input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; }
.control input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; border: none; }
#status-badge { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 24px; padding: 4px 16px; font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #aaa; pointer-events: none; z-index: 9999; font-family: monospace; transition: 0.2s; }
#status-badge.connected { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
#status-badge.disconnected { color: #ff8866; }
.damage { position: fixed; font-weight: 900; font-size: clamp(18px,3vw,28px); color: #ff5050; text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9); animation: floatDamage 0.85s ease-out forwards; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); white-space: nowrap; }
.damage.kill { color: #ffd84f; font-size: clamp(22px,4vw,34px); text-shadow: 0 0 20px rgba(255,216,79,0.95); }
@keyframes floatDamage { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(0.65); } }
</style>
</head>
<body>
<div id="overlay-container">
  <canvas id="canvas"></canvas>
</div>
<div class="ui-layer">
  <div class="panel-wrapper">
    <div class="panel-tab" id="togglePanel"><span class="panel-tab-icon">⚡</span>LAYOUT</div>
    <div class="layout-panel" id="layoutPanel">
      <div class="layout-title">Layout Controls</div>
      <div class="control"><div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div><input id="gapControl" type="range" min="0" max="200" value="0" /></div>
      <div class="control"><div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div><input id="offsetXControl" type="range" min="-400" max="400" value="0" /></div>
      <div class="control"><div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div><input id="offsetYControl" type="range" min="-200" max="200" value="0" /></div>
      <div class="control"><div class="control-top"><span>Layout Height</span><span id="heightValue">85%</span></div><input id="heightControl" type="range" min="30" max="100" value="85" /></div>
      <div class="control"><div class="control-top"><span>Screen Position</span><span id="screenYValue">↕ Centre</span></div><input id="screenYControl" type="range" min="-50" max="50" value="0" /></div>
    </div>
  </div>
</div>
<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const container = document.getElementById('overlay-container');
  const statusDiv = document.getElementById('status-badge');
  const gapControl = document.getElementById('gapControl');
  const offsetXControl = document.getElementById('offsetXControl');
  const offsetYControl = document.getElementById('offsetYControl');
  const heightControl = document.getElementById('heightControl');
  const screenYControl = document.getElementById('screenYControl');
  const togglePanel = document.getElementById('togglePanel');
  const layoutPanel = document.getElementById('layoutPanel');
  let players = {};
  let attacks = [];
  let layoutGap = 0;
  let offsetX = 0;
  let offsetY = 0;
  let screenYOffset = 0;
  let backgroundImg = null;
  let socket = null;
  let audioConfig = {};
  let audioCache = {};
  const HORDE_ID = '__HORDE__';
  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  function cw() { return canvas.width; }
  function ch() { return canvas.height; }
  function updateControlLabels() {
    document.getElementById('gapValue').textContent = Math.round(layoutGap);
    document.getElementById('offsetXValue').textContent = Math.round(offsetX);
    document.getElementById('offsetYValue').textContent = Math.round(offsetY);
    document.getElementById('heightValue').textContent = heightControl.value + '%';
    const v = parseInt(screenYControl.value, 10);
    document.getElementById('screenYValue').textContent = v === 0 ? '↕ Centre' : v > 0 ? `▲ ${v}%` : `▼ ${Math.abs(v)}%`;
  }
  gapControl.oninput = () => { layoutGap = parseFloat(gapControl.value); updateControlLabels(); };
  offsetXControl.oninput = () => { offsetX = parseFloat(offsetXControl.value); updateControlLabels(); };
  offsetYControl.oninput = () => { offsetY = parseFloat(offsetYControl.value); updateControlLabels(); };
  heightControl.oninput = () => { container.style.height = heightControl.value + 'vh'; resizeCanvas(); updateControlLabels(); };
  screenYControl.oninput = () => { screenYOffset = -parseFloat(screenYControl.value); updateControlLabels(); };
  togglePanel.onclick = () => { layoutPanel.classList.toggle('hidden'); togglePanel.querySelector('.panel-tab-icon').textContent = layoutPanel.classList.contains('hidden') ? '⚙' : '⚡'; };
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  updateControlLabels();
  function isPlayerAlive(player) { return player && player.alive !== false; }
  function topPlayers() { return Object.values(players).filter(p => isPlayerAlive(p) && p.uniqueId !== HORDE_ID).sort((a,b) => (b.hp||0)-(a.hp||0)).slice(0,5); }
  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest = Object.values(players).filter(p => isPlayerAlive(p) && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return { uniqueId: HORDE_ID, nickname: 'THE HORDE', hp: rest.reduce((s,p) => s + (p.hp||0), 0), maxHp: rest.reduce((s,p) => s + (p.maxHp||100), 0), hordeCount: rest.length, alive: true };
  }
  function getPlayerPosition(index, total) {
    const W = cw();
    const H = ch();
    const cardH = H * 0.5 * 0.84;
    const cardW = cardH * 0.72;
    const totalWidth = cardW * total + layoutGap * Math.max(0, total - 1);
    const startX = (W - totalWidth) / 2 + offsetX;
    return { x: startX + index * (cardW + layoutGap) + cardW / 2, y: H * (0.28 + screenYOffset * 0.005) + offsetY };
  }
  function getHordePosition() { return { x: cw() / 2 + offsetX, y: ch() * (0.72 + screenYOffset * 0.005) + offsetY }; }
  function canvasToViewport(cx, cy) { const rect = canvas.getBoundingClientRect(); const scaleX = rect.width / cw(); const scaleY = rect.height / ch(); return { x: rect.left + cx * scaleX, y: rect.top + cy * scaleY }; }
  function getAudio(filename) { if (!audioCache[filename]) { const audio = new Audio(`/audio/${filename}`); audio.preload = 'auto'; audioCache[filename] = audio; } return audioCache[filename]; }
  function playSound(type) { const filename = audioConfig[type]; if (!filename) return; try { const a = getAudio(filename); a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }
  function showDamage(canvasX, canvasY, damage, kill) { const vp = canvasToViewport(canvasX, canvasY); const el = document.createElement('div'); el.className = `damage${kill ? ' kill' : ''}`; el.textContent = kill ? '💀 KILL!' : `-${Math.round(damage)}`; el.style.left = vp.x + 'px'; el.style.top = vp.y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 900); }
  class Particle { constructor(x,y,opts={}) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*(opts.speed||4); this.vy=(Math.random()-0.5)*(opts.speed||4)-(opts.rise||0); this.life=1; this.decay=opts.decay||(0.02+Math.random()*0.03); this.r=opts.radius||(2+Math.random()*3); this.color=opts.color||'#7afcff'; this.emoji=opts.emoji||null; this.fs=opts.fontSize||18; } update() { this.x += this.vx; this.y += this.vy; this.vy += 0.06; this.life -= this.decay; return this.life > 0; } draw(c) { c.save(); c.globalAlpha = Math.max(0,this.life); if (this.emoji) { c.font = `${this.fs}px Arial`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(this.emoji,this.x,this.y); } else { c.fillStyle=this.color; c.shadowColor=this.color; c.shadowBlur=8; c.beginPath(); c.arc(this.x,this.y,this.r*Math.max(0,this.life),0,Math.PI*2); c.fill(); } c.restore(); } }
  class Attack { constructor(from,to,type='laser'){ this.from=from; this.to=to; this.type=type; this.start=Date.now(); this.progress=0; this.particles=[]; this.spawned=false; this.duration=500; if(type==='projectile')this.duration=600; if(type==='gift')this.duration=900; if(type==='explosion')this.duration=750; if(type==='fire'){ this.duration=550; for(let i=0;i<40;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:4+Math.random()*4,color:'#ff8844',radius:2+Math.random()*3,decay:0.03 })); } } } update(){ const elapsed=Date.now()-this.start; this.progress=Math.min(1,elapsed/this.duration); this.particles=this.particles.filter(p=>p.update()); return elapsed<this.duration||this.particles.length>0; } draw(){ switch(this.type){ case'laser':this.drawLaser();break; case'projectile':this.drawProjectile();break; case'gift':this.drawGift();break; case'explosion':this.drawExplosion();break; case'neon':this.drawNeon();break; case'ripple':this.drawRipple();break; case'fire':this.drawFire();break; case'bubble':this.drawBubble();break; case'sphere':this.drawSphere();break; default:this.drawLaser(); } } drawLaser(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; const alpha=progress<0.6?1:1-(progress-0.6)/0.4; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.strokeStyle=`rgba(122,252,255,${alpha*0.6})`; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.strokeStyle=`rgba(255,255,255,${alpha})`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.restore(); } drawProjectile(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation='lighter'; const grad=ctx.createRadialGradient(x,y,0,x,y,16); grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(0.5,'rgba(122,252,255,0.9)'); grad.addColorStop(1,'rgba(122,252,255,0)'); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill(); ctx.restore(); } drawGift(){ if(!this.spawned){ this.spawned=true; for(let i=0;i<18;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:6+Math.random()*4, color:['#ffd84f','#ff9aff','#7afcff','#ff7777'][i%4], radius:2+Math.random()*3, decay:0.017 })); } } ctx.save(); ctx.globalCompositeOperation='lighter'; this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawExplosion(){ if(!this.spawned){ this.spawned=true; for(let i=0;i<28;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:5+Math.random()*8, color:['#ff6644','#ffcc44','#ff2222'][i%3], radius:3+Math.random()*4, decay:0.015 })); } } ctx.save(); ctx.globalCompositeOperation='lighter'; this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawNeon(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=10; ctx.strokeStyle='#00ccff'; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.restore(); } drawRipple(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=0;i<3;i++){ const t=progress - i*0.08; if(t<=0) continue; ctx.strokeStyle=`rgba(100,220,255,${1-t})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,10+t*40,0,Math.PI*2); ctx.stroke(); } ctx.restore(); } drawFire(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation='lighter'; const flame=ctx.createRadialGradient(x,y,0,x,y,24); flame.addColorStop(0,'#fff8e0'); flame.addColorStop(0.3,'#ffaa44'); flame.addColorStop(0.7,'#ff4400'); flame.addColorStop(1,'#992200'); ctx.fillStyle=flame; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawBubble(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.fillStyle='rgba(200,240,255,0.75)'; for(let i=0;i<3;i++){ const angle=Date.now()*0.003+i*1.5; const bx=x+Math.cos(angle)*8; const by=y+Math.sin(angle)*8; ctx.beginPath(); ctx.arc(bx,by,10-i*2,0,Math.PI*2); ctx.fill(); } ctx.restore(); } drawSphere(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation='lighter'; const orb=ctx.createRadialGradient(x,y,0,x,y,24); orb.addColorStop(0,'#bbffff'); orb.addColorStop(0.4,'#2288ff'); orb.addColorStop(1,'#002244'); ctx.fillStyle=orb; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); ctx.restore(); }}
  function drawBackground() {
    const W=cw(), H=ch();
    if (backgroundImg) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      ctx.drawImage(backgroundImg, (W - backgroundImg.width * scale) / 2, (H - backgroundImg.height * scale) / 2, backgroundImg.width * scale, backgroundImg.height * scale);
      return;
    }
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,'#0d1a2e');
    grad.addColorStop(1,'#050b12');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(100,200,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(140,80,255,0.25)';
    ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
  }
  function drawPlayerCard(player, pos, rank) {
    const hp = player.hp || 0;
    const maxHp = player.maxHp || 100;
    const hpPct = Math.max(0, Math.min(1, hp / maxHp));
    const H = ch();
    const cardH = H * 0.5 * 0.84;
    const avatarR = cardH * 0.26;
    const avatarY = pos.y - cardH * 0.14;
    const nameY = avatarY - avatarR - cardH * 0.06;
    const barW = cardH * 0.72 * 0.88;
    const barH = Math.max(6, cardH * 0.09);
    const barX = pos.x - barW / 2;
    const barY = avatarY + avatarR + cardH * 0.05;
    const hpTextY = barY + barH + cardH * 0.07;
    const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, avatarR * 2.5);
    glow.addColorStop(0, 'rgba(122,252,255,0.18)');
    glow.addColorStop(1, 'rgba(122,252,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, avatarR * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rank === 1 ? 'rgba(255,210,80,0.7)' : 'rgba(122,252,255,0.35)';
    ctx.lineWidth = Math.max(2, avatarR * 0.08);
    ctx.beginPath();
    ctx.arc(pos.x, avatarY, avatarR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(8,18,30,0.92)';
    ctx.beginPath();
    ctx.arc(pos.x, avatarY, avatarR - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = `${avatarR * 1.3}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(player.iconEmoji || '⚔️', pos.x, avatarY);
    const name = (player.nickname || player.uniqueId || 'Player').slice(0, 13);
    ctx.font = `bold ${Math.max(9, cardH * 0.11)}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000';
    ctx.strokeText(name, pos.x, nameY);
    ctx.fillStyle = '#fff';
    ctx.fillText(name, pos.x, nameY);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(barX, barY, barW, barH);
    const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    barGrad.addColorStop(0, hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#ff4d4d');
    barGrad.addColorStop(1, '#ffffff55');
    ctx.fillStyle = barGrad;
    ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpPct, barH - 2);
    ctx.strokeStyle = 'rgba(122,252,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.font = `${Math.max(8, cardH * 0.085)}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.5;
    ctx.strokeText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);
    ctx.fillStyle = '#ccc';
    ctx.fillText(`${Math.round(hp)}/${maxHp}`, pos.x, hpTextY);
  }
  function drawHorde(horde) {
    if (!horde) return;
    const pos = getHordePosition();
    const H = ch();
    const ring = H * 0.28;
    const pulse = 0.5 + Math.sin(Date.now() / 350) * 0.5;
    ctx.fillStyle = `rgba(255,70,70,${0.08 + pulse * 0.05})`;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, ring + pulse * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,70,70,${0.5 + pulse * 0.3})`;
    ctx.lineWidth = Math.max(2, ring * 0.1);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, ring * 0.88, 0, Math.PI * 2);
    ctx.stroke();
    ctx.font = `${ring * 1.5}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💀', pos.x, pos.y);
    ctx.font = `bold ${Math.max(10, H * 0.08)}px Segoe UI`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText('⚔ THE HORDE', pos.x - ring * 1.35, pos.y - H * 0.05);
    ctx.fillStyle = '#ff7b7b';
    ctx.fillText('⚔ THE HORDE', pos.x - ring * 1.35, pos.y - H * 0.05);
    ctx.font = `${Math.max(8, H * 0.06)}px Segoe UI`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffc2c2';
    ctx.fillText(`${horde.hordeCount} players`, pos.x - ring * 1.35, pos.y + H * 0.08);
    const hpPct = Math.min(1, horde.hp / Math.max(1, horde.maxHp));
    const barW = cw() * 0.28;
    const barH = Math.max(8, H * 0.045);
    const barX = pos.x + ring * 1.35;
    const barY = pos.y - barH / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX, barY, barW, barH);
    const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hpGrad.addColorStop(0, '#ff2222');
    hpGrad.addColorStop(1, '#ff8888');
    ctx.fillStyle = hpGrad;
    ctx.fillRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.font = `${Math.max(8, H * 0.05)}px Segoe UI`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffaaaa';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.5;
    const hpText = `${Math.round(horde.hp)} / ${Math.round(horde.maxHp)}`;
    ctx.strokeText(hpText, barX, barY + barH + H * 0.09);
    ctx.fillText(hpText, barX, barY + barH + H * 0.09);
  }
  function fireAttack(attackerId, targetId, damage, killed, special, effect) {
    const top = topPlayers();
    const horde = hordePlayer();
    let from = null;
    let to = null;
    if (attackerId === HORDE_ID) { from = horde ? getHordePosition() : null; } else { const idx = top.findIndex(p => p.uniqueId === attackerId || p.id === attackerId); if (idx !== -1) from = getPlayerPosition(idx, top.length); else from = { x: cw() / 2, y: ch() / 2 }; }
    if (targetId === HORDE_ID) { to = horde ? getHordePosition() : null; } else { const idx = top.findIndex(p => p.uniqueId === targetId || p.id === targetId); if (idx !== -1) to = getPlayerPosition(idx, top.length); else to = { x: cw() / 2, y: ch() / 2 }; }
    if (!from || !to) return;
    const map = { fire: 'fire', bubble: 'bubble', bubbles: 'bubble', neon: 'neon', ripple: 'ripple', sphere: 'sphere', laser: 'laser', projectile: 'projectile', gift: 'gift', explosion: 'explosion' };
    const type = effect ? map[String(effect).toLowerCase()] || String(effect).toLowerCase() : special ? 'gift' : killed ? 'explosion' : ['laser','projectile','neon','ripple','fire','bubble','sphere'][Math.floor(Math.random()*7)];
    attacks.push(new Attack(from, to, type));
    showDamage(to.x, to.y, damage || 0, !!killed);
    playSound(special ? 'gift' : 'attack');
  }
  function draw() {
    resizeCanvas();
    ctx.clearRect(0, 0, cw(), ch());
    drawBackground();
    const top = topPlayers();
    top.forEach((player, index) => drawPlayerCard(player, getPlayerPosition(index, top.length), index + 1));
    drawHorde(hordePlayer());
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });
    requestAnimationFrame(draw);
  }
  function normalizePlayers(state) {
    const normalized = {};
    for (const key in state) {
      const p = state[key] || {};
      p.uniqueId = p.uniqueId || p.id || key;
      normalized[p.uniqueId] = p;
    }
    return normalized;
  }
  function initSocket() {
    try {
      socket = io({ transports: ['websocket', 'polling'], timeout: 5000 });
      socket.on('connect', () => { statusDiv.textContent = '🟢 LIVE · CONNECTED'; statusDiv.className = 'connected'; socket.emit('register', { type: 'overlay' }); });
      socket.on('disconnect', () => { statusDiv.textContent = '🔴 DISCONNECTED · waiting...'; statusDiv.className = 'disconnected'; });
      socket.on('connect_error', () => { statusDiv.textContent = '⚠️ SERVER ERROR · retrying'; statusDiv.className = 'disconnected'; });
      socket.on('gameState', state => { if (state && typeof state === 'object') { players = normalizePlayers(state); if (!Object.keys(players).length) { fetch('/state').then(r => r.json()).then(s => { players = normalizePlayers(s || {}); }).catch(() => {}); } } });
      socket.on('audioConfig', cfg => { if (cfg) audioConfig = cfg; });
      socket.on('backgroundChanged', ({ filename }) => { if (!filename) { backgroundImg = null; return; } const img = new Image(); img.onload = () => { backgroundImg = img; }; img.src = `/background/${filename}?v=${Date.now()}`; });
      socket.on('attack', data => { fireAttack(data.attacker, data.target, data.damage, data.killed, data.special, data.effect); });
      socket.on('giftAttack', ({ attacker, target, damage, killed }) => { fireAttack(attacker, target, damage, killed, true); });
    } catch (error) {
      statusDiv.textContent = '❌ SOCKET ERROR · no live data';
      statusDiv.className = 'disconnected';
    }
  }
  initSocket();
  requestAnimationFrame(draw);
})();
</script>
