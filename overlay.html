<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PvP Battle Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden; background: #8edc8e;
}
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #b8f2b8 0%, #88d688 50%, #9be99b 100%);
}
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
.panel {
  position: absolute;
  background: rgba(8,12,24,0.85);
  border: 1px solid rgba(100,200,255,0.25);
  border-radius: 8px; padding: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  font-size: 12px; color: #fff;
}
.status { bottom: 12px; left: 12px; width: 280px; min-height: 100px; }
.status-title {
  font-size: 12px; font-weight: 700; color: #64c8ff;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2);
  padding-bottom: 6px;
}
.status-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.status-label { color: #a0c0ff; }
.status-value { color: #64c8ff; font-weight: 600; }
.live-indicator {
  display: inline-block; width: 8px; height: 8px;
  background: #ff4444; border-radius: 50%; margin-right: 4px;
  animation: pulse 1s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.leaderboard { top: 12px; right: 12px; width: 280px; max-height: 220px; }
.board-title {
  font-size: 12px; font-weight: 700; color: #ffd93d;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 8px; border-bottom: 1px solid rgba(255,217,61,0.2);
  padding-bottom: 6px;
}
.board-entry {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 8px; margin: 4px 0;
  background: rgba(100,200,255,0.08);
  border: 1px solid rgba(100,200,255,0.15);
  border-radius: 6px; font-size: 12px; transition: all 0.1s;
}
.board-entry.rank-1 { background: rgba(255,217,61,0.12); border-color: rgba(255,217,61,0.3); }
.board-entry.rank-2 { background: rgba(200,200,200,0.08); border-color: rgba(200,200,200,0.2); }
.board-entry.rank-3 { background: rgba(200,100,100,0.08); border-color: rgba(200,100,100,0.2); }
.rank-num  { min-width: 18px; font-weight: 700; color: #64c8ff; }
.rank-name { flex: 1; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-score { color: #ffd93d; font-weight: 700; min-width: 30px; text-align: right; }
.eventlog { right: 12px; bottom: 12px; width: 280px; height: 120px; max-height: 120px; overflow-y: auto; overflow-x: hidden; }
.controls { top: 250px; right: 12px; width: 280px; pointer-events: auto; }
.controls-title {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; font-weight: 700; color: #64c8ff;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px;
}
.controls-title button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(100,200,255,0.25);
  color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px;
}
.controls.hidden { opacity: 0.15; }
.control-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin: 10px 0; font-size: 12px; }
.control-row span { color: #e1f7ff; }
.control-row input[type="range"] { width: 100%; }
.eventlog > #eventlog { max-height: calc(100% - 26px); overflow-y: auto; }
.log-title {
  font-size: 12px; font-weight: 700; color: #64c8ff;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 8px; border-bottom: 1px solid rgba(100,200,255,0.2); padding-bottom: 6px;
}
.log-entry {
  padding: 4px 6px; margin: 2px 0;
  background: rgba(255,255,255,0.04);
  border-left: 2px solid rgba(100,200,255,0.3);
  border-radius: 4px; font-size: 10px; line-height: 1.2; color: #ddd;
}
.log-entry.kill  { background: rgba(255,51,51,0.12);  border-left-color: #ff4444; color: #ffdddd; font-weight: 600; }
.log-entry.gift  { background: rgba(255,217,61,0.12); border-left-color: #ffd93d; color: #ffe6cc; }
.eventlog::-webkit-scrollbar { width: 6px; }
.eventlog::-webkit-scrollbar-thumb { background: rgba(100,200,255,0.3); border-radius: 3px; }
.dmg-number {
  position: absolute; font-size: 32px; font-weight: 900; color: #ff3333;
  text-shadow: 0 0 12px rgba(255,51,51,0.8), 2px 2px 6px rgba(0,0,0,0.95);
  pointer-events: none; animation: dmgFloat 0.7s ease-out forwards; z-index: 30;
}
@keyframes dmgFloat {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
}
.dmg-number.kill {
  color: #ffd93d; font-size: 40px;
  text-shadow: 0 0 16px rgba(255,217,61,0.9), 2px 2px 6px rgba(0,0,0,0.95);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let players        = {};
let audioConfig    = {};   // event → filename, pushed from server
let soundEnabled   = true; // toggled by dashboard sound-settings
let laserColor     = '#7afcff';
let shotType       = 'beam';
let shotSpeed      = 1;
const lastPlayerPositions = {};
let backgroundImg  = null;
const audioCache   = {};   // filename → HTMLAudioElement

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas();
window.addEventListener('resize', setupCanvas);

// ── Layout controls ───────────────────────────────────────────────────────────
const gapXControl   = document.getElementById('gapXControl');
const gapYControl   = document.getElementById('gapYControl');
const gapXValue     = document.getElementById('gapXValue');
const gapYValue     = document.getElementById('gapYValue');
const toggleBtn     = document.getElementById('toggleControls');
const layoutControls = document.getElementById('layoutControls');

let layoutGapX = gapXControl ? Number(gapXControl.value) : 150;
let layoutGapY = gapYControl ? Number(gapYControl.value) : 260;

function syncGapLabels() {
  if (gapXValue) gapXValue.textContent = layoutGapX;
  if (gapYValue) gapYValue.textContent = layoutGapY;
}
if (gapXControl) gapXControl.addEventListener('input', () => { layoutGapX = Number(gapXControl.value); syncGapLabels(); });
if (gapYControl) gapYControl.addEventListener('input', () => { layoutGapY = Number(gapYControl.value); syncGapLabels(); });
if (toggleBtn && layoutControls) toggleBtn.addEventListener('click', () => {
  const hidden = layoutControls.classList.toggle('hidden');
  toggleBtn.textContent = hidden ? 'Show' : 'Hide';
});
syncGapLabels();

// ── Audio ─────────────────────────────────────────────────────────────────────
function getAudio(filename) {
  if (!audioCache[filename]) {
    audioCache[filename] = new Audio(`/audio/${encodeURIComponent(filename)}`);
    audioCache[filename].preload = 'auto';
  }
  return audioCache[filename];
}

function playSound(event) {
  if (!soundEnabled) return;
  const filename = audioConfig[event];
  if (!filename) return;
  try {
    const audio = getAudio(filename);
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } catch (_e) {}
}

// Preload all configured sounds so first play is instant
function preloadAudioConfig(cfg) {
  for (const filename of Object.values(cfg)) {
    if (filename) getAudio(filename);
  }
}

function parseHexColor(value) {
  if (typeof value !== 'string') return null;
  const hex = value.trim().replace('#', '');
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return {
    r: parseInt(hex.slice(0, 2), 16),
    g: parseInt(hex.slice(2, 4), 16),
    b: parseInt(hex.slice(4, 6), 16),
  };
}

function updateLaserColor(color) {
  if (typeof color !== 'string') return;
  const parsed = parseHexColor(color);
  if (parsed) {
    laserColor = `#${color.replace('#', '')}`;
  }
}

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io({ transports: ['websocket', 'polling'] });

socket.on('connect', () => {
  const statusEl = document.getElementById('serverStatus');
  if (statusEl) statusEl.textContent = '🟢 LIVE';
  socket.emit('register', { type: 'overlay' });
});

socket.on('disconnect', () => {
  const statusEl = document.getElementById('serverStatus');
  if (statusEl) statusEl.textContent = 'Offline';
});

socket.on('gameState', (state) => {
  players = state || {};
  updateUI();
});

// ── Audio config pushed from server ──────────────────────────────────────────
socket.on('audioConfig', (cfg) => {
  audioConfig = cfg || {};
  preloadAudioConfig(audioConfig);
});

socket.on('overlaySettings', (settings) => {
  if (!settings) return;
  if (typeof settings.shotType === 'string' && settings.shotType) shotType = settings.shotType;
  if (typeof settings.shotSpeed === 'number' && settings.shotSpeed > 0) shotSpeed = settings.shotSpeed;
  if (typeof settings.laserColor === 'string' && settings.laserColor) updateLaserColor(settings.laserColor);
});

socket.on('laserColor', (color) => {
  updateLaserColor(color);
});

// ── Sound event from server (attack / kill / gift / heal / respawn / follow) ─
socket.on('soundEvent', ({ event }) => {
  playSound(event);
});

// ── Dev panel: test sound buttons ─────────────────────────────────────────────
socket.on('devSound', ({ type }) => {
  // Map dev panel button names to event names
  const map = { laser: 'attack', heal: 'heal', special: 'kill' };
  playSound(map[type] || type);
});

// ── Dev panel: enable/disable overlay sounds ──────────────────────────────────
socket.on('soundSettings', ({ enabled }) => {
  soundEnabled = !!enabled;
});

socket.on('attack', ({ attacker, target, damage, killed, special }) => {
  const fromPos = getAnimationPos(attacker);
  const toPos   = getAnimationPos(target);
  if (players[attacker] && players[target]) {
    attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, shotType, shotSpeed, killed, special));
    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (killed) players[target].alive = false;
    const aName = players[attacker].nickname || attacker.slice(0, 10);
    const tName = players[target].nickname   || target.slice(0, 10);
    addLog(`⚔️ ${aName} → ${tName} -${damage}${special ? ' ⚡' : ''}${killed ? ' 💀' : ''}`, killed ? 'kill' : '');
    showDmg(toPos.x, toPos.y, damage, killed);
    updateUI();
  }
});

socket.on('giftAttack', ({ attacker, target, damage, killed }) => {
  const fromPos = getAnimationPos(attacker);
  const toPos   = getAnimationPos(target);
  if (players[attacker] && players[target]) {
    attacks.push(new Attack(fromPos.x, fromPos.y, toPos.x, toPos.y, shotType, shotSpeed, killed, true));
    players[target].hp = Math.max(0, (players[target].hp || 0) - damage);
    if (killed || players[target].hp === 0) players[target].alive = false;
    const aName = players[attacker].nickname || attacker.slice(0, 10);
    const tName = players[target].nickname   || target.slice(0, 10);
    addLog(`🎁 ${aName} → ${tName} -${damage}${killed ? ' 💀' : ''}`, killed ? 'kill' : 'gift');
    showDmg(toPos.x, toPos.y, damage, killed);
    updateUI();
  }
});

socket.on('giftEffect', ({ attacker, giftName, diamonds }) => {
  const aName = players[attacker]?.nickname || attacker || 'Someone';
  addLog(`🎁 ${aName} sent ${giftName || 'a gift'} (${diamonds || 0} 💎)`, 'gift');
});

socket.on('respawn', ({ uniqueId }) => {
  if (players[uniqueId]) {
    const name = players[uniqueId].nickname || uniqueId.slice(0, 10);
    addLog(`✨ ${name} respawned!`, '');
  }
});

socket.on('backgroundChanged', ({ filename }) => {
  if (!filename) { backgroundImg = null; return; }
  const img  = new Image();
  img.onload = () => { backgroundImg = img; };
  img.src    = `/background/${filename}?v=${Date.now()}`;
});

socket.on('forceReload', () => { location.reload(); });

// ── Player positioning ────────────────────────────────────────────────────────
function getTopPlayers(count = 20) {
  return Object.values(players)
    .filter(p => p.alive)
    .sort((a, b) => {
      const aF = a.forceSpawn ? 1 : 0;
      const bF = b.forceSpawn ? 1 : 0;
      if (aF !== bF) return bF - aF;
      const aHp   = a.hp   != null ? a.hp   : (a.maxHp   || 0);
      const bHp   = b.hp   != null ? b.hp   : (b.maxHp   || 0);
      const hpDiff = bHp - aHp;
      if (hpDiff !== 0) return hpDiff;
      return (b.maxHp || 0) - (a.maxHp || 0);
    })
    .slice(0, count);
}

function getPlayerPos(player) {
  const width  = canvas.clientWidth;
  const height = canvas.clientHeight;
  const sorted = getTopPlayers(20);
  const idx    = sorted.findIndex(p => p.uniqueId === player.uniqueId);

  if (idx === -1) return lastPlayerPositions[player.uniqueId] || { x: width / 2, y: height / 2 };

  const cols = 5, rows = 4;
  const leftBuffer = 260, rightBuffer = 320, topBuffer = 180, botBuffer = 280;
  const playW  = Math.max(400, width  - leftBuffer - rightBuffer);
  const playH  = Math.max(300, height - topBuffer  - botBuffer);
  const cellW  = Math.max(80, (playW - layoutGapX * (cols - 1)) / cols);
  const cellH  = Math.max(80, (playH - layoutGapY * (rows - 1)) / rows);
  const gridW  = cols * cellW + (cols - 1) * layoutGapX;
  const gridH  = rows * cellH + (rows - 1) * layoutGapY;
  const startX = leftBuffer + Math.max(0, (playW - gridW) / 2);
  const startY = topBuffer  + Math.max(0, (playH - gridH) / 2);
  const col    = idx % cols;
  const row    = Math.floor(idx / cols);

  return {
    x: startX + col * (cellW + layoutGapX) + cellW / 2,
    y: startY + row * (cellH + layoutGapY) + cellH / 2,
  };
}

function getAnimationPos(uniqueId) {
  if (lastPlayerPositions[uniqueId]) return lastPlayerPositions[uniqueId];
  if (players[uniqueId]) return getPlayerPos(players[uniqueId]);
  return { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 };
}

// ── Attack animation ──────────────────────────────────────────────────────────
class Attack {
  constructor(fromX, fromY, toX, toY, shotType = 'beam', shotSpeed = 1, isKill = false, isSpecial = false) {
    this.fromX = fromX; this.fromY = fromY;
    this.toX   = toX;   this.toY   = toY;
    this.shotType  = shotType;
    this.shotSpeed = Math.max(0.6, Math.min(2.2, shotSpeed));
    this.isKill    = isKill;
    this.isSpecial = isSpecial;
    this.startTime = Date.now();
    this.duration  = 700 / this.shotSpeed;
    this.progress  = 0;
  }
  update() {
    this.progress = Math.min(1, (Date.now() - this.startTime) / this.duration);
    return this.progress < 1;
  }
  draw(ctx) {
    const alpha   = 1 - this.progress;
    const easeOut = 1 - Math.pow(1 - this.progress, 2);
    const currentX = this.fromX + (this.toX - this.fromX) * easeOut;
    const currentY = this.fromY + (this.toY - this.fromY) * easeOut;
    const baseColor = this.isSpecial ? '#FFD56B' : laserColor;
    const outerColor = this.isSpecial ? 'rgba(255,213,107,0.35)' : `rgba(122,252,255,0.35)`;
    const innerColor = this.isSpecial ? 'rgba(255,242,190,0.95)' : `rgba(200,255,255,0.96)`;
    const strikeColor = this.isSpecial ? 'rgba(255,140,77,' : 'rgba(122,252,255,';
    const waveAlpha = Math.max(0.18, alpha * 0.9);
    const midAlpha = Math.max(0.3, alpha * 0.7);

    const pathX = this.toX - this.fromX;
    const pathY = this.toY - this.fromY;
    const pathLength = Math.hypot(pathX, pathY);
    const angle = Math.atan2(pathY, pathX);
    const waveOffset = Math.sin(this.progress * Math.PI * 3) * 20;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (this.shotType === 'pulse') {
      const ringRadius = 12 + this.progress * 50;
      ctx.strokeStyle = `${outerColor}`;
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(this.fromX, this.fromY, ringRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(this.fromX, this.fromY, ringRadius + 10, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `${innerColor}`;
      ctx.beginPath(); ctx.arc(this.fromX, this.fromY, 10 + (1 - alpha) * 4, 0, Math.PI * 2); ctx.fill();
    } else if (this.shotType === 'waves') {
      const waveCount = 5;
      ctx.strokeStyle = `${strikeColor}${waveAlpha})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      for (let i = 0; i <= waveCount; i += 1) {
        const t = i / waveCount;
        const px = this.fromX + pathX * t;
        const py = this.fromY + pathY * t;
        const offset = Math.sin((t + this.progress) * Math.PI * 4) * 16 * (1 - t);
        const ox = px + Math.cos(angle + Math.PI / 2) * offset;
        const oy = py + Math.sin(angle + Math.PI / 2) * offset;
        if (i === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
      }
      ctx.stroke();
      ctx.fillStyle = `${innerColor}`;
      ctx.beginPath(); ctx.arc(currentX, currentY, 9, 0, Math.PI * 2); ctx.fill();
    } else if (this.shotType === 'burst') {
      const pieces = 4;
      for (let i = 0; i < pieces; i += 1) {
        const t = (this.progress + i / pieces * 0.4) % 1;
        const bx = this.fromX + pathX * t;
        const by = this.fromY + pathY * t;
        const radius = 6 + 4 * Math.sin((t + i) * Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`;
        ctx.beginPath(); ctx.arc(bx, by, radius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = `${strikeColor}${waveAlpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(currentX, currentY); ctx.stroke();
    } else if (this.shotType === 'ripple') {
      const rippleRadius = 12 + this.progress * pathLength * 0.45;
      ctx.strokeStyle = `${outerColor}`;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(this.toX, this.toY, rippleRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `${outerColor}`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.toX, this.toY, rippleRadius + 18, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${midAlpha})`;
      ctx.beginPath(); ctx.arc(this.toX, this.toY, 14 + (1 - this.progress) * 8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = `${strikeColor}${alpha * 0.22})`;
      ctx.lineWidth = this.isSpecial ? 26 : 18;
      ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();
      ctx.strokeStyle = `${strikeColor}${midAlpha})`;
      ctx.lineWidth = this.isSpecial ? 10 : 6;
      ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();
      ctx.strokeStyle = `${innerColor}`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(this.fromX, this.fromY); ctx.lineTo(this.toX, this.toY); ctx.stroke();
      ctx.fillStyle = `${innerColor}`;
      ctx.shadowColor = `${strikeColor}${alpha * 0.5})`;
      ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(currentX, currentY, this.isSpecial ? 12 : 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    }

    if (this.shotType !== 'ripple') {
      const ringRadius = 12 + this.progress * 22;
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.35})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.toX, this.toY, ringRadius, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

const attacks = [];

// ── UI helpers ────────────────────────────────────────────────────────────────
function updateUI() {
  const alive  = Object.values(players).filter(p => p.alive);
  const shown  = Math.min(20, alive.length);
  const playerCountEl  = document.getElementById('playerCount');
  const showingCountEl = document.getElementById('showingCount');
  const leaderboardEl  = document.getElementById('leaderboard');

  if (playerCountEl) playerCountEl.textContent  = alive.length;
  if (showingCountEl) showingCountEl.textContent = `${shown} / ${alive.length}`;
  if (leaderboardEl) {
    const top3 = getTopPlayers(3);
    leaderboardEl.innerHTML = top3.map((p, i) => `
      <div class="board-entry rank-${i + 1}">
        <span class="rank-num">${i + 1}</span>
        <span class="rank-name">${(p.nickname || p.uniqueId || 'Player').slice(0, 14)}</span>
        <span class="rank-score">${Math.round(p.hp || 0)} HP</span>
      </div>`).join('') || '<div class="board-entry">No players</div>';
  }
}

function addLog(msg, type) {
  const log = document.getElementById('eventlog');
  if (!log) return;
  const entry = document.createElement('div');
  entry.className = `log-entry ${type || ''}`;
  entry.textContent = msg;
  log.insertBefore(entry, log.firstChild);
  while (log.children.length > 6) log.removeChild(log.lastChild);
}

function showDmg(x, y, dmg, isKill) {
  const el = document.createElement('div');
  el.className  = `dmg-number ${isKill ? 'kill' : ''}`;
  el.textContent = isKill ? '💀 KILL!' : `-${dmg}`;
  el.style.position = 'absolute';
  el.style.left  = (x - 20) + 'px';
  el.style.top   = (y - 30) + 'px';
  el.style.pointerEvents = 'none';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawBackground() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!backgroundImg) {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0,   '#b8f2b8');
    g.addColorStop(0.5, '#88d688');
    g.addColorStop(1,   '#9be99b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    return;
  }
  const scale = Math.max(w / backgroundImg.width, h / backgroundImg.height);
  const dw    = backgroundImg.width  * scale;
  const dh    = backgroundImg.height * scale;
  ctx.drawImage(backgroundImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

function drawPlayers() {
  const sorted = getTopPlayers(20);
  sorted.forEach((player, idx) => {
    const pos  = getPlayerPos(player);
    if (player.uniqueId) lastPlayerPositions[player.uniqueId] = { x: pos.x, y: pos.y };

    const rank   = idx + 1;
    const hpPct  = Math.max(0, Math.min(1, (player.hp || 100) / (player.maxHp || 100)));
    const hpVal  = Math.round(player.hp || 100);
    const maxHp  = player.maxHp || 100;
    let size = 20, nameSize = 20, barWidth = 140, emojiSize = 64;
    if      (rank === 1)  { size = 24; nameSize = 24; barWidth = 180; emojiSize = 88; }
    else if (rank === 2)  { size = 22; nameSize = 22; barWidth = 164; emojiSize = 80; }
    else if (rank === 3)  { size = 22; nameSize = 22; barWidth = 150; emojiSize = 76; }
    else if (rank <= 6)   { size = 21; nameSize = 20; barWidth = 144; emojiSize = 72; }

    const glowR = Math.max(size + 10, emojiSize / 2 + 12);
    const name  = (player.nickname || player.uniqueId || 'Player').slice(0, 14);

    ctx.font = `bold ${nameSize}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(name, pos.x, pos.y - size - 8);
    ctx.fillText(name,   pos.x, pos.y - size - 8);

    ctx.fillStyle = 'rgba(100,200,255,0.1)';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, glowR, 0, Math.PI * 2); ctx.fill();

    ctx.font = `${emojiSize}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(player.iconEmoji || '💎', pos.x, pos.y);

    const barY = pos.y + Math.max(size, emojiSize / 2) + 36;
    ctx.fillStyle = '#0a0e1a'; ctx.fillRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.strokeStyle = '#64c8ff'; ctx.lineWidth = 2;
    ctx.strokeRect(pos.x - barWidth / 2, barY, barWidth, 18);
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(pos.x - barWidth / 2 + 2, barY + 2, Math.max(0, (barWidth - 4) * hpPct), 14);
    ctx.font = '18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText(`${hpVal}/${maxHp}`, pos.x, barY + 22);
    ctx.fillText(`${hpVal}/${maxHp}`,   pos.x, barY + 22);
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  drawBackground();
  drawPlayers();
  for (let i = attacks.length - 1; i >= 0; i--) {
    if (!attacks[i].update()) {
      attacks.splice(i, 1);
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      attacks[i].draw(ctx);
      ctx.restore();
    }
  }
  requestAnimationFrame(animate);
}

animate();
updateUI();

if (!location.search.includes('v=')) {
  location.replace(location.pathname + '?v=' + Date.now());
}
</script>
