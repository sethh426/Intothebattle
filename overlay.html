<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Battle Royale Overlay · Professional Lasers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: 'Segoe UI', sans-serif; }
body { display: flex; align-items: center; justify-content: center; }
#overlay-container { position: relative; width: min(90vw, 1920px); aspect-ratio: 16 / 9; background: rgba(4, 8, 18, 0.92); border: 1px solid rgba(180, 120, 255, 0.35); border-radius: 18px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 48px rgba(140,80,255,0.18); overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
.panel-wrapper { position: fixed; top: 16px; right: 0; display: flex; align-items: flex-start; pointer-events: auto; z-index: 30; }
.panel-tab { width: 28px; background: rgba(6,10,20,0.88); border: 1px solid rgba(100,200,255,0.2); border-right: none; border-radius: 8px 0 0 8px; padding: 10px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #8fd8ff; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; writing-mode: vertical-rl; text-orientation: mixed; user-select: none; transition: background 0.2s; }
.panel-tab:hover { background: rgba(20,40,70,0.95); }
.panel-tab-icon { font-size: 13px; writing-mode: horizontal-tb; }
.layout-panel { width: 240px; padding: 14px 16px; border-radius: 0 0 0 16px; background: rgba(6,10,20,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(100,200,255,0.14); border-right: none; box-shadow: -8px 0 30px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; transform-origin: right top; max-height: 90vh; overflow-y: auto; }
.layout-panel.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
.layout-title { color: #8fd8ff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
.control { margin-bottom: 13px; }
.control-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.control-top span { font-size: 11px; color: #cfefff; }
.control input { width: 100%; appearance: none; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); outline: none; }
.control input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; }
.control input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #7afcff; box-shadow: 0 0 10px rgba(122,252,255,0.9); cursor: pointer; border: none; }
#status-badge { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 24px; padding: 4px 16px; font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #aaa; pointer-events: none; z-index: 9999; font-family: monospace; transition: 0.2s; }
#status-badge.connected { color: #7aff87; text-shadow: 0 0 4px #2eff5e; }
#status-badge.disconnected { color: #ff8866; }
.damage { position: fixed; font-weight: 900; font-size: clamp(18px,3vw,28px); color: #ff5050; text-shadow: 0 0 16px rgba(255,80,80,0.95), 2px 2px 8px rgba(0,0,0,0.9); animation: floatDamage 0.85s ease-out forwards; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); white-space: nowrap; }
.damage.kill { color: #ffd84f; font-size: clamp(22px,4vw,34px); text-shadow: 0 0 20px rgba(255,216,79,0.95); }
@keyframes floatDamage { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(0.65); } }
</style>
</head>
<body>
<div id="overlay-container">
  <canvas id="canvas"></canvas>
</div>
<div class="ui-layer">
  <div class="panel-wrapper">
    <div class="panel-tab" id="togglePanel"><span class="panel-tab-icon">⚡</span>LAYOUT</div>
    <div class="layout-panel" id="layoutPanel">
      <div class="layout-title">Layout Controls</div>
      <div class="control"><div class="control-top"><span>Column Gap</span><span id="gapValue">0</span></div><input id="gapControl" type="range" min="0" max="200" value="0" /></div>
      <div class="control"><div class="control-top"><span>Horizontal Offset</span><span id="offsetXValue">0</span></div><input id="offsetXControl" type="range" min="-400" max="400" value="0" /></div>
      <div class="control"><div class="control-top"><span>Vertical Position</span><span id="offsetYValue">0</span></div><input id="offsetYControl" type="range" min="-200" max="200" value="0" /></div>
      <div class="control"><div class="control-top"><span>Layout Height</span><span id="heightValue">85%</span></div><input id="heightControl" type="range" min="30" max="100" value="85" /></div>
      <div class="control"><div class="control-top"><span>Zoom</span><span id="zoomValue">100%</span></div><input id="zoomControl" type="range" min="60" max="140" value="100" /></div>
    </div>
  </div>
</div>
<div id="status-badge" class="disconnected">⚡ CONNECTING...</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: true });
  const container = document.getElementById("overlay-container");
  const statusDiv = document.getElementById("status-badge");
  const gapControl = document.getElementById("gapControl");
  const offsetXControl = document.getElementById("offsetXControl");
  const offsetYControl = document.getElementById("offsetYControl");
  const heightControl = document.getElementById("heightControl");
  const zoomControl = document.getElementById("zoomControl");
  const togglePanel = document.getElementById("togglePanel");
  const layoutPanel = document.getElementById("layoutPanel");
  let players = {};
  let attacks = [];
  let layoutGap = 0;
  let offsetX = 0;
  let offsetY = 0;
  let layoutZoom = 1;
  let backgroundImg = null;
  let socket = null;
  let audioConfig = {};
  let audioCache = {};
  let overlaySettings = { shotType: "beam", laserColor: "#7afcff" };
  const HORDE_ID = "__HORDE__";
  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  function cw() { return canvas.width; }
  function ch() { return canvas.height; }
  function updateControlLabels() {
    document.getElementById("gapValue").textContent = Math.round(layoutGap);
    document.getElementById("offsetXValue").textContent = Math.round(offsetX);
    document.getElementById("offsetYValue").textContent = Math.round(offsetY);
    document.getElementById("heightValue").textContent = heightControl.value + "%";
    document.getElementById("zoomValue").textContent = `${Math.round(layoutZoom * 100)}%`;
  }
  gapControl.oninput = () => { layoutGap = parseFloat(gapControl.value); updateControlLabels(); };
  offsetXControl.oninput = () => { offsetX = parseFloat(offsetXControl.value); updateControlLabels(); };
  offsetYControl.oninput = () => { offsetY = parseFloat(offsetYControl.value); updateControlLabels(); };
  heightControl.oninput = () => { container.style.height = heightControl.value + "vh"; resizeCanvas(); updateControlLabels(); };
  zoomControl.oninput = () => { layoutZoom = parseFloat(zoomControl.value) / 100; updateControlLabels(); };
  togglePanel.onclick = () => { layoutPanel.classList.toggle("hidden"); togglePanel.querySelector(".panel-tab-icon").textContent = layoutPanel.classList.contains("hidden") ? "⚙" : "⚡"; };
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  updateControlLabels();
  function isPlayerAlive(player) { return player && player.alive !== false; }
  function topPlayers() { return Object.values(players).filter(p => isPlayerAlive(p) && p.uniqueId !== HORDE_ID).sort((a,b) => (b.hp||0)-(a.hp||0)).slice(0,5); }
  function hordePlayer() {
    const topSet = new Set(topPlayers().map(p => p.uniqueId));
    const rest = Object.values(players).filter(p => isPlayerAlive(p) && !topSet.has(p.uniqueId));
    if (!rest.length) return null;
    return { uniqueId: HORDE_ID, nickname: "THE HORDE", hp: rest.reduce((s,p) => s + (p.hp||0), 0), maxHp: rest.reduce((s,p) => s + (p.maxHp||100), 0), hordeCount: rest.length, alive: true };
  }
  function getPlayerPosition(index, total) {
    const W = cw();
    const H = ch();
    const cardH = H * 0.5 * 0.84 * layoutZoom;
    const cardW = cardH * 0.72;
    const totalWidth = cardW * total + layoutGap * Math.max(0, total - 1);
    const startX = (W - totalWidth) / 2 + offsetX;
    return { x: startX + index * (cardW + layoutGap) + cardW / 2, y: H * 0.28 + offsetY + (H * 0.16 * (1 - layoutZoom)) };
  }
  function getPositionForPlayer(playerId) {
    const alive = Object.values(players).filter(p => isPlayerAlive(p) && p.uniqueId !== HORDE_ID);
    const index = alive.findIndex(p => p.uniqueId === playerId || p.id === playerId);
    if (index === -1) return null;
    const total = alive.length;
    const W = cw();
    const H = ch();
    const cardH = H * 0.5 * 0.84 * layoutZoom;
    const cardW = cardH * 0.72;
    const totalWidth = cardW * total + layoutGap * Math.max(0, total - 1);
    const startX = (W - totalWidth) / 2 + offsetX;
    return { x: startX + index * (cardW + layoutGap) + cardW / 2, y: H * 0.28 + offsetY + (H * 0.16 * (1 - layoutZoom)) };
  }
  function getHordePosition() {
    const W = cw();
    const H = ch();
    return { x: W / 2 + offsetX, y: H * 0.72 + offsetY + (H * 0.20 * (1 - layoutZoom)) };
  }
  function canvasToViewport(cx, cy) { const rect = canvas.getBoundingClientRect(); const scaleX = rect.width / cw(); const scaleY = rect.height / ch(); return { x: rect.left + cx * scaleX, y: rect.top + cy * scaleY }; }
  function getAudio(filename) { if (!audioCache[filename]) { const audio = new Audio(`/audio/${filename}`); audio.preload = "auto"; audioCache[filename] = audio; } return audioCache[filename]; }
  function playSound(type) { const filename = audioConfig[type]; if (!filename) return; try { const a = getAudio(filename); a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }
  function showDamage(canvasX, canvasY, damage, kill) { const vp = canvasToViewport(canvasX, canvasY); const el = document.createElement("div"); el.className = `damage${kill ? " kill" : ""}`; el.textContent = kill ? "💀 KILL!" : `-${Math.round(damage)}`; el.style.left = vp.x + "px"; el.style.top = vp.y + "px"; document.body.appendChild(el); setTimeout(() => el.remove(), 900); }
  class Particle { constructor(x,y,opts={}) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*(opts.speed||4); this.vy=(Math.random()-0.5)*(opts.speed||4)-(opts.rise||0); this.life=1; this.decay=opts.decay||(0.02+Math.random()*0.03); this.r=opts.radius||(2+Math.random()*3); this.color=opts.color||"#7afcff"; this.emoji=opts.emoji||null; this.fs=opts.fontSize||18; } update() { this.x += this.vx; this.y += this.vy; this.vy += 0.06; this.life -= this.decay; return this.life > 0; } draw(c) { c.save(); c.globalAlpha = Math.max(0,this.life); if (this.emoji) { c.font = `${this.fs}px Arial`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(this.emoji,this.x,this.y); } else { c.fillStyle=this.color; c.shadowColor=this.color; c.shadowBlur=8; c.beginPath(); c.arc(this.x,this.y,this.r*Math.max(0,this.life),0,Math.PI*2); c.fill(); } c.restore(); } }
  class Attack { constructor(from,to,type="laser"){ this.from=from; this.to=to; this.type=type; this.start=Date.now(); this.progress=0; this.particles=[]; this.spawned=false; this.duration=500; if(type==="projectile")this.duration=600; if(type==="gift")this.duration=900; if(type==="explosion")this.duration=750; if(type==="fire"){ this.duration=550; for(let i=0;i<40;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:4+Math.random()*4,color:overlaySettings.laserColor || '#ff8844',radius:2+Math.random()*3,decay:0.03 })); } } } update(){ const elapsed=Date.now()-this.start; this.progress=Math.min(1,elapsed/this.duration); this.particles=this.particles.filter(p=>p.update()); return elapsed<this.duration||this.particles.length>0; } draw(){ switch(this.type){ case"laser":this.drawLaser();break; case"projectile":this.drawProjectile();break; case"gift":this.drawGift();break; case"explosion":this.drawExplosion();break; case"neon":this.drawNeon();break; case"ripple":this.drawRipple();break; case"fire":this.drawFire();break; case"bubble":this.drawBubble();break; case"sphere":this.drawSphere();break; default:this.drawLaser(); } } drawLaser(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; const alpha=progress<0.6?1:1-(progress-0.6)/0.4; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#7afcff'; ctx.globalAlpha = alpha * 0.65; ctx.strokeStyle = color; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.globalAlpha = alpha; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.restore(); } drawProjectile(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#7afcff'; const grad=ctx.createRadialGradient(x,y,0,x,y,16); grad.addColorStop(0,"rgba(255,255,255,1)"); grad.addColorStop(0.5,`${color}99`); // Use laserColor with some transparency grad.addColorStop(1,`${color}00`); // Fully transparent at the edge ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill(); ctx.restore(); } drawGift(){ if(!this.spawned){ this.spawned=true; const heartEmojis = ['❤️','💖','💘','💝']; // More focused burst of hearts for(let i=0;i<12;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:4+Math.random()*3, emoji: heartEmojis[i % heartEmojis.length], fontSize: 20 + Math.random()*12, decay: 0.02, rise: 2 })); } } ctx.save(); ctx.globalCompositeOperation="lighter"; this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawExplosion(){ if(!this.spawned){ this.spawned=true; // Redesign explosion to be a flash/expanding ring const color = overlaySettings.laserColor || '#ff6644'; // Use laserColor for explosion for(let i=0;i<20;i++){ this.particles.push(new Particle(this.to.x,this.to.y,{ speed:3+Math.random()*5, color:color, radius:2+Math.random()*3, decay:0.015 })); } } ctx.save(); ctx.globalCompositeOperation="lighter"; // Draw an expanding ring for a more impactful explosion if (this.progress < 0.5) { const radius = 10 + this.progress * 100; const alpha = 1 - (this.progress * 2); ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(this.to.x, this.to.y, radius, 0, Math.PI * 2); ctx.stroke(); } this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawNeon(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#00ccff'; ctx.lineWidth=10; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=15; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(x,y); ctx.stroke(); ctx.restore(); } drawRipple(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#7afcff'; for(let i=0;i<3;i++){ const t=progress - i*0.08; if(t<=0) continue; ctx.strokeStyle=`${color}${Math.floor((1-t)*255).toString(16).padStart(2, '0')}`; // Use laserColor with alpha ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,10+t*40,0,Math.PI*2); ctx.stroke(); } ctx.restore(); } drawFire(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#ffaa44'; const flame=ctx.createRadialGradient(x,y,0,x,y,24); flame.addColorStop(0,'#fff8e0'); flame.addColorStop(0.3,color); flame.addColorStop(0.7,'#ff4400'); flame.addColorStop(1,'rgba(255,0,0,0)'); ctx.fillStyle=flame; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); this.particles.forEach(p=>p.draw(ctx)); ctx.restore(); } drawBubble(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#7afcff'; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.stroke(); ctx.restore(); } drawSphere(){ const {from,to,progress}=this; const x=from.x+(to.x-from.x)*progress; const y=from.y+(to.y-from.y)*progress; ctx.save(); ctx.globalCompositeOperation="lighter"; const color = overlaySettings.laserColor || '#7afcff'; const grad=ctx.createRadialGradient(x,y,0,x,y,20); grad.addColorStop(0,"rgba(255,255,255,1)"); grad.addColorStop(0.5,`${color}cc`); grad.addColorStop(1,`${color}00`); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill(); ctx.restore(); } }
  function fireAttack(attackerId, targetId, damage, killed, special, effect) {
    const top = topPlayers();
    const horde = hordePlayer();
    let from = null;
    let to = null;
    if (attackerId === HORDE_ID) {
      from = horde ? getHordePosition() : null;
    } else {
      const topIdx = top.findIndex(p => p.uniqueId === attackerId || p.id === attackerId);
      if (topIdx !== -1) {
        from = getPlayerPosition(topIdx, top.length);
      } else {
        from = getPositionForPlayer(attackerId) || (horde ? getHordePosition() : null);
      }
    }
    if (targetId === HORDE_ID) {
      to = horde ? getHordePosition() : null;
    } else {
      const topIdx = top.findIndex(p => p.uniqueId === targetId || p.id === targetId);
      if (topIdx !== -1) {
        to = getPlayerPosition(topIdx, top.length);
      } else {
        to = getPositionForPlayer(targetId) || (horde ? getHordePosition() : null);
      }
    }
    if (!from || !to) {
      console.warn(`Overlay attack skipped: unknown attacker=${attackerId} target=${targetId}`);
      return;
    }
    const map = {
      fire: "fire",
      bubble: "bubble",
      bubbles: "bubble",
      water: "bubble",
      beam: "laser",
      laser: "laser",
      shot: "laser",
      projectile: "projectile",
      neon: "neon",
      ripple: "ripple",
      wave: "ripple", // Ensure consistency with dashboard
      waves: "ripple", // Map 'waves' to 'ripple'
      waterbeam: "bubble",
      water_beam: "bubble",
      sphere: "sphere",
      gift: "gift",
      hearts: "gift",
      explosion: "explosion",
      boom: "explosion"
    };
    let type;
    if (effect) {
      type = map[String(effect).toLowerCase()] || String(effect).toLowerCase();
    } else if (special) {
      type = "gift";
    } else if (killed) {
      type = "explosion";
    } else {
      switch (overlaySettings.shotType) {
        case "pulse": type = "fire"; break;
        case "wave": type = "ripple"; break; // Ensure consistency
        case "waves": type = "ripple"; break; // Handle 'waves' from server
        default: type = "laser";
      }
    }
    attacks.push(new Attack(from, to, type));
    showDamage(to.x, to.y, damage || 0, !!killed);
    playSound(special ? "gift" : "attack");
  }
  function draw() {
    resizeCanvas();
    ctx.clearRect(0, 0, cw(), ch());
    drawBackground();
    const top = topPlayers();
    top.forEach((player, index) => drawPlayerCard(player, getPlayerPosition(index, top.length), index + 1));
    drawHorde(hordePlayer());
    attacks = attacks.filter(a => { const alive = a.update(); if (alive) a.draw(); return alive; });
    requestAnimationFrame(draw);
  }
  function normalizePlayers(state) {
    const normalized = {};
    for (const key in state) {
      const p = state[key] || {};
      p.uniqueId = p.uniqueId || p.id || key;
      normalized[p.uniqueId] = p;
    }
    return normalized;
  }
  function initSocket() {
    try {
      socket = io({ transports: ["websocket", "polling"], timeout: 5000 });
      socket.on("connect", () => { statusDiv.textContent = "🟢 LIVE · CONNECTED"; statusDiv.className = "connected"; socket.emit("register", { type: "overlay" }); });
      socket.on("disconnect", () => { statusDiv.textContent = "🔴 DISCONNECTED · waiting..."; statusDiv.className = "disconnected"; });
      socket.on("connect_error", () => { statusDiv.textContent = "⚠️ SERVER ERROR · retrying"; statusDiv.className = "disconnected"; });
      socket.on("gameState", state => { if (state && typeof state === "object") { players = normalizePlayers(state); if (!Object.keys(players).length) { fetch("/state").then(r => r.json()).then(s => { players = normalizePlayers(s || {}); }).catch(() => {}); } } });
      socket.on("audioConfig", cfg => { if (cfg) audioConfig = cfg; });
      socket.on("overlaySettings", settings => { if (settings && typeof settings === "object") overlaySettings = { ...overlaySettings, ...settings }; });
      socket.on("laserColor", color => { if (typeof color === "string") overlaySettings.laserColor = color; });
      socket.on("backgroundChanged", ({ filename }) => { if (!filename) { backgroundImg = null; return; } const img = new Image(); img.onload = () => { backgroundImg = img; }; img.src = `/background/${filename}?v=${Date.now()}`; });
      socket.on("attack", data => { fireAttack(data.attacker, data.target, data.damage, data.killed, data.special, data.effect); });
      socket.on("giftAttack", ({ attacker, target, damage, killed }) => { fireAttack(attacker, target, damage, killed, true); });

      // Add missing socket listeners
      socket.on("soundEvent", ({ event }) => { playSound(event); });
      socket.on("forceReload", () => { location.reload(); });
      socket.on("layoutUpdate", ({ gapX, gapY }) => {
        // Assuming gapX and gapY from stats.html map to layoutGap and a derived offsetY/offsetX
        // This mapping might need refinement based on how layout is truly intended to work.
        layoutGap = gapX; // Direct mapping for column gap
        // For offsetX and offsetY, we need to decide how to map them from gapX/gapY
        // For now, let's just update layoutGap and assume other controls are manual or need more info.
        // If the intention is to fully sync layout, we need to define how gapX/gapY affect offsetX/offsetY/zoom/height
        // For now, I'll just update the gapControl value and let the user manually adjust others if needed.
        gapControl.value = gapX;
        // For simplicity, let's assume layoutUpdate from stats.html primarily affects gap and not direct offsets for now.
        // If stats.html also sends offsetX/offsetY/height/zoom, those should be mapped here.
        // For now, I'll only update gapControl and let other controls remain manual in overlay.
        updateControlLabels();
      });
      socket.on("giftEffect", ({ attacker, giftName, diamonds }) => {
        // The existing fireAttack for giftAttack already handles the visual effect.
        // This listener might be for additional visual flair or logging.
        // For now, I'll just ensure the sound is played if needed.
        playSound("gift");
      });
      socket.on("respawn", ({ uniqueId }) => {
        playSound("respawn");
        // Visual effect for respawn could be added here if desired
      });
      socket.on("follow", ({ uniqueId, nickname }) => {
        playSound("follow");
        // Visual effect for follow could be added here if desired
      });
      socket.on("like", ({ uniqueId, nickname }) => {
        playSound("like");
        // Visual effect for like could be added here if desired
      });

    } catch (error) {
      statusDiv.textContent = "❌ SOCKET ERROR · no live data";
      statusDiv.className = "disconnected";
    }
  }
  initSocket();
  requestAnimationFrame(draw);
})();
</script>
