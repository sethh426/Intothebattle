<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Overlay Diagnostic</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
        #log { background: #000; padding: 10px; white-space: pre-wrap; font-size: 14px; max-height: 90vh; overflow: auto; }
        .error { color: #f88; }
        .success { color: #8f8; }
    </style>
</head>
<body>
<h2>🔌 Socket.IO Connection Test</h2>
<div id="log">Waiting for connection...</div>

<script>
    const logDiv = document.getElementById('log');
    function log(msg, isError = false) {
        const p = document.createElement('div');
        p.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
        p.className = isError ? 'error' : '';
        if (!isError && msg.includes('✅')) p.className = 'success';
        logDiv.appendChild(p);
        console.log(msg);
    }

    const socket = io({
        transports: ['websocket', 'polling'],
        reconnectionAttempts: 5,
        timeout: 10000
    });

    socket.on('connect', () => {
        log('✅ Socket connected! ID: ' + socket.id);
        socket.emit('register', { type: 'overlay' });
        log('✅ Emitted "register" with type=overlay');
    });

    socket.on('connect_error', (err) => {
        log('❌ Connect error: ' + err.message, true);
        if (err.message === 'Unauthorized') {
            log('❌ Authentication failed – you are not logged in or session expired.', true);
            log('👉 Go to /dashboard, log in, then reload this page.', true);
        }
    });

    socket.on('disconnect', (reason) => {
        log('⚠️ Disconnected: ' + reason);
    });

    socket.on('gameState', (state) => {
        const count = Object.keys(state || {}).length;
        log(`📦 Received gameState with ${count} players`);
    });

    socket.on('error', (err) => {
        log('🔴 Socket error: ' + JSON.stringify(err), true);
    });
</script>
</body>
</html>
