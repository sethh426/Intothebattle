<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Battle Royale LIVE</title>
  <style>
    :root { --bg:#050d1a; --surface:#0f1726; --border:#3751ff22; --text:#e8eef8; --muted:#8ca2d1; --accent:#4d96ff; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
    body{min-height:100vh;background:linear-gradient(180deg,#020611 0%,#070d22 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(520px,100%);background:rgba(10,18,36,.96);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35);}
    h1{font-size:2rem;margin-bottom:12px;}
    p{color:var(--muted);margin-bottom:24px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px;}
    input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;}
    button{width:100%;padding:14px 16px;border:none;border-radius:14px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#6ab0ff);cursor:pointer;}
    .notice{border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:.95rem;}
    .error{background:rgba(255,85,95,.12);border:1px solid rgba(255,85,95,.18);color:#ffb1b1;}
    .success{background:rgba(107,203,119,.12);border:1px solid rgba(107,203,119,.18);color:#c6ffcf;}
    .helper{margin-top:18px;color:var(--muted);font-size:.95rem;}
    .helper a{color:var(--accent);text-decoration:none;}
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Register - IntoTheBattle",
    "url": "https://intothebattle.com/register",
    "description": "Create a creator account to manage your overlay, rooms, and subscription."
  }
  </script>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p>Register with email, name, and TikTok username to manage your live game room and subscription.</p>
    <div id="status"></div>
    <div class="form-group"><label for="name">Name</label><input id="name" type="text" autocomplete="name" /></div>
    <div class="form-group"><label for="tiktokUsername">TikTok Username</label><input id="tiktokUsername" type="text" autocomplete="off" placeholder="yourusername" /></div>
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" /></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" /></div>
    <button id="registerBtn" type="button">Register</button>
    <p class="helper">Already have an account? <a href="/login">Login here</a>.</p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    document.getElementById('registerBtn').addEventListener('click', async () => {
      statusEl.innerHTML = '';
      const name = document.getElementById('name').value.trim();
      const tiktokUsername = document.getElementById('tiktokUsername').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!name || !tiktokUsername || !email || !password) {
        statusEl.innerHTML = '<div class="notice error">All fields are required.</div>';
        return;
      }
      try {
        const res = await fetch('/auth/user/register', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body: JSON.stringify({ name, tiktokUsername, email, password }),
        });
        const json = await res.json();
        if (!res.ok) {
          statusEl.innerHTML = `<div class="notice error">${json.error || 'Registration failed.'}</div>`;
          return;
        }
        window.location.href = '/dashboard';
      } catch (err) {
        statusEl.innerHTML = '<div class="notice error">Registration failed. Try again.</div>';
      }
    });
  </script>
</body>
</html>
