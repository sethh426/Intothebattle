name: Schema validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: "schema-validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  schema-validation:
    name: Run schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run JSON-LD validator
        run: python tools/validate_schema.py

      - name: Run JSON-LD expansion validator
        run: python tools/validate_schema_expand.py

      - name: Ensure schema reports are committed
        run: |
          git diff --exit-code -- \
            schema_validation_report.json \
            schema_validation_report.txt \
            schema_expansion_report.json \
            schema_expansion_report.txt
