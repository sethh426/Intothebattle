name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      API_KEY: test
      JWT_SECRET: test_jwt_secret_for_ci_only
      DEV_TEST_MODE: "false"
      SKIP_DB: "true"
      OVERLAY_TOKEN_SECRET: test_overlay_secret_for_ci_only
      DIAGNOSTICS_TOKEN: test_diagnostics_secret_for_ci_only
      APP_BASE_URL: https://intothebattle.test
      POSTMARK_API_TOKEN: postmark_ci_token
      POSTMARK_MESSAGE_STREAM: outbound
      EMAIL_FROM: "IntoTheBattle <no-reply@intothebattle.test>"
      PAYPAL_CLIENT_ID: paypal_ci_client
      PAYPAL_CLIENT_SECRET: paypal_ci_secret
      PAYPAL_MODE: live
      PAYPAL_PLAN_ID: P-CIPLAN
      PAYPAL_WEBHOOK_ID: WH-CI
      GOOGLE_CLIENT_ID: google_ci_client
      GOOGLE_CLIENT_SECRET: google_ci_secret
      GOOGLE_OAUTH_REDIRECT_URI: https://intothebattle.test/auth/google/callback
      DISK_PATH: ${{ runner.temp }}/intothebattle-data
      SPONSOR_STRICT_MEDIA_GATE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Python schema validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Stability audit and syntax check
        run: npm run audit:stability

      - name: Business logic smoke tests
        run: npm run test:logic

      - name: Marketing automation smoke tests
        run: npm run test:marketing

      - name: Launch readiness script sanity check
        run: npm run launch:check:local

      - name: Start server and check /healthz
        run: |
          mkdir -p "$DISK_PATH"
          PORT=3000 node server.js >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sS http://localhost:3000/healthz >/dev/null; then
              echo "healthz OK"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to respond; dumping logs"
          tail -n 200 server.log
          exit 1

      - name: Upload server startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-startup-log
          path: server.log
          if-no-files-found: ignore

      - name: Validate schemas
        run: npm run validate:schemas

      - name: HTTP smoke tests
        run: npm run test:http

      - name: Socket.IO room smoke tests
        run: npm run test:socket

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright visual smoke tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

  postgres-migrations:
    name: Check Postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intothebattle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intothebattle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      API_KEY: test
      JWT_SECRET: test_jwt_secret_for_ci_only
      OVERLAY_TOKEN_SECRET: test_overlay_secret_for_ci_only
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intothebattle_ci
      DISK_PATH: ${{ runner.temp }}/intothebattle-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database startup migrations
        run: |
          mkdir -p "$DISK_PATH"
          node --input-type=module <<'NODE'
          import { getDbHealthSnapshot } from './tiktokbr/db/db.js';

          const deadline = Date.now() + 20000;
          while (Date.now() < deadline) {
            const health = getDbHealthSnapshot();
            if (health.initialized) {
              console.log('Postgres migrations initialized successfully');
              process.exit(0);
            }
            if (health.lastError) {
              console.log(`Waiting for DB initialization: ${health.lastError}`);
            }
            await new Promise(resolve => setTimeout(resolve, 500));
          }

          console.error('Postgres migrations did not initialize in time');
          console.error(JSON.stringify(getDbHealthSnapshot(), null, 2));
          process.exit(1);
          NODE
