name: OVH Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OVH_HOST: ${{ vars.OVH_HOST || '51.81.186.80' }}
      OVH_USER: ${{ vars.OVH_USER || 'ubuntu' }}

    steps:
      - name: Check deploy credentials
        id: deploy_config
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          if [ -z "$OVH_SSH_KEY" ]; then
            echo "::notice::Skipping OVH deploy because the OVH_SSH_KEY repository secret is not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "OVH_SSH_KEY is set (${#OVH_SSH_KEY} chars)."
          fi
          echo "Target host: ${OVH_USER}@${OVH_HOST}"

      - name: Diagnose OVH network reachability
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          echo "--- host resolution ---"
          getent hosts "$OVH_HOST" || echo "(not resolvable via getent; fine if OVH_HOST is already a raw IP)"
          echo "--- TCP connect to ${OVH_HOST}:22 (10s timeout) ---"
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${OVH_HOST}/22" 2>/tmp/tcp_err.log; then
            echo "RESULT: TCP connect to ${OVH_HOST}:22 SUCCEEDED"
          else
            echo "RESULT: TCP connect to ${OVH_HOST}:22 FAILED"
            cat /tmp/tcp_err.log 2>/dev/null || true
          fi

      - name: Checkout
        if: steps.deploy_config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.deploy_config.outputs.ready == 'true'
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/ovh_deploy_key
          chmod 600 ~/.ssh/ovh_deploy_key
          echo "--- key fingerprint (not the key itself) ---"
          ssh-keygen -lf ~/.ssh/ovh_deploy_key || echo "RESULT: ssh-keygen could not parse OVH_SSH_KEY (check for CRLF line endings / missing trailing newline / wrong format)"
          echo "--- ssh-keyscan (10s timeout) ---"
          if ssh-keyscan -T 10 -H "$OVH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan_err.log; then
            echo "RESULT: ssh-keyscan succeeded"
          else
            echo "RESULT: ssh-keyscan failed (continuing anyway so later steps can surface more detail)"
          fi
          cat /tmp/keyscan_err.log 2>/dev/null || true

      - name: Test SSH auth
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          ssh -vvv -i ~/.ssh/ovh_deploy_key -o ConnectTimeout=10 -o BatchMode=yes \
            "${OVH_USER}@${OVH_HOST}" 'echo "RESULT: SSH auth OK as $(whoami)@$(hostname)"' \
            2>&1 | tail -c 6000

      - name: Package release
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          git archive --format=tar.gz -o "/tmp/intothebattle-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Upload release
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          scp -i ~/.ssh/ovh_deploy_key -o ConnectTimeout=15 "/tmp/intothebattle-${GITHUB_SHA}.tar.gz" "${OVH_USER}@${OVH_HOST}:/tmp/intothebattle-${GITHUB_SHA}.tar.gz"

      - name: Deploy on OVH
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/ovh_deploy_key -o ConnectTimeout=15 "${OVH_USER}@${OVH_HOST}" 'bash -s' -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          commit="$1"
          archive="/tmp/intothebattle-$commit.tar.gz"
          app_dir=/opt/intothebattle
          backup_dir="/opt/intothebattle.previous-$(date +%Y%m%d%H%M%S)"
          db_backup_dir=/opt/intothebattle-db-backups
          db_backup="$db_backup_dir/intothebattle-before-$commit-$(date +%Y%m%d%H%M%S).dump"

          test -f "$archive"
          if docker inspect intothebattle-postgres-1 >/dev/null 2>&1; then
            sudo mkdir -p "$db_backup_dir"
            docker exec intothebattle-postgres-1 pg_dump -U intothebattle -d intothebattle -Fc | sudo tee "$db_backup" >/dev/null
            sudo test -s "$db_backup"
            sudo find "$db_backup_dir" -type f -name 'intothebattle-before-*.dump' -mtime +14 -delete
            echo "Database backup created: $db_backup"
          fi
          sudo mv "$app_dir" "$backup_dir"
          sudo mkdir -p "$app_dir"
          sudo tar -xzf "$archive" -C "$app_dir"
          if compgen -G "$backup_dir/.env.production*" >/dev/null; then sudo cp -a "$backup_dir"/.env.production* "$app_dir"/; fi
          if [ -d "$backup_dir/backups" ]; then sudo cp -a "$backup_dir/backups" "$app_dir/backups"; fi
          printf '%s\n' "$commit" | sudo tee "$app_dir/.deployed-github-commit" >/dev/null
          sudo chown -R "$USER:$USER" "$app_dir"

          cd "$app_dir"
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans

          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' intothebattle-app-1 2>/dev/null || echo starting)
            [ "$status" = healthy ] && break
            sleep 2
          done

          docker exec intothebattle-postgres-1 psql -U intothebattle -d intothebattle -v ON_ERROR_STOP=1 \
            -c "UPDATE room_player_stats SET alive = 0, force_spawn = 0 WHERE alive <> 0 OR force_spawn <> 0;"

          started_iso=$(docker inspect -f '{{.State.StartedAt}}' intothebattle-app-1)
          cutoff=$(date -u -d "$started_iso" '+%Y-%m-%d %H:%M:%S')
          docker exec intothebattle-postgres-1 psql -U intothebattle -d intothebattle -v ON_ERROR_STOP=1 \
            -c "UPDATE live_sessions SET status = 'ended', ended_at = CURRENT_TIMESTAMP, summary_json = COALESCE(summary_json, '{\"reason\":\"github_auto_deploy_cleanup\"}'), updated_at = CURRENT_TIMESTAMP WHERE status = 'active' AND started_at < TIMESTAMP '$cutoff';"

          curl -fsS --max-time 20 https://intothebattle.com/healthz >/dev/null
          REMOTE
