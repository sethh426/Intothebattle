name: Render Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main

concurrency:
  group: render-production-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-health:
    name: Check Render production health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_HEALTH_URLS: "https://www.intothebattle.com/healthz https://intothebattle.com/healthz"
      RENDER_APP_URLS: "https://www.intothebattle.com/ https://intothebattle.com/"
      RENDER_DEPLOY_GRACE_SECONDS: "300"
      RENDER_CHECK_ATTEMPTS: "45"
      RENDER_RETRY_SECONDS: "10"

    steps:
      - name: Wait for Render deploy after push
        if: github.event_name == 'push'
        run: sleep "$RENDER_DEPLOY_GRACE_SECONDS"

      - name: Check Render /healthz
        run: |
          set -euo pipefail
          for url in $RENDER_HEALTH_URLS; do
            echo "Checking $url"
            passed=0
            for i in $(seq 1 "$RENDER_CHECK_ATTEMPTS"); do
              status=$(curl -sS -o /tmp/render-health-body.txt -w "%{http_code}" --max-time 10 "$url" || true)
              if [ "$status" = "200" ]; then
                cat /tmp/render-health-body.txt
                echo "Render health check passed for $url"
                passed=1
                break
              fi
              echo "Attempt $i/$RENDER_CHECK_ATTEMPTS failed for $url with HTTP status ${status:-curl-error}; retrying in $RENDER_RETRY_SECONDS seconds..."
              tail -c 500 /tmp/render-health-body.txt || true
              sleep "$RENDER_RETRY_SECONDS"
            done
            if [ "$passed" -ne 1 ]; then
              echo "Render health check failed after retries for $url"
              exit 1
            fi
          done

      - name: Check public homepage responds
        run: |
          set -euo pipefail
          for url in $RENDER_APP_URLS; do
            echo "Checking $url"
            output="/tmp/home-$(echo "$url" | tr -c 'A-Za-z0-9' '_').html"
            passed=0
            for i in $(seq 1 "$RENDER_CHECK_ATTEMPTS"); do
              status=$(curl -sS -o "$output" -w "%{http_code}" --max-time 15 "$url" || true)
              bytes=$(wc -c <"$output" 2>/dev/null || echo 0)
              if [ "$status" = "200" ] && [ "$bytes" -gt 0 ]; then
                echo "Homepage responded with $bytes bytes for $url"
                passed=1
                break
              fi
              echo "Attempt $i/$RENDER_CHECK_ATTEMPTS failed for $url with HTTP status ${status:-curl-error} and $bytes bytes; retrying in $RENDER_RETRY_SECONDS seconds..."
              tail -c 500 "$output" || true
              sleep "$RENDER_RETRY_SECONDS"
            done
            if [ "$passed" -ne 1 ]; then
              echo "Homepage check failed after retries for $url"
              exit 1
            fi
          done
