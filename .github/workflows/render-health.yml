name: Render Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main

concurrency:
  group: render-production-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-health:
    name: Check Render production health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_HEALTH_URLS: "https://www.intothebattle.com/healthz https://intothebattle.com/healthz"
      RENDER_APP_URLS: "https://www.intothebattle.com/ https://intothebattle.com/"
      RENDER_DEPLOY_GRACE_SECONDS: "180"

    steps:
      - name: Wait for Render deploy after push
        if: github.event_name == 'push'
        run: sleep "$RENDER_DEPLOY_GRACE_SECONDS"

      - name: Check Render /healthz
        run: |
          set -euo pipefail
          for url in $RENDER_HEALTH_URLS; do
            echo "Checking $url"
            passed=0
            for i in $(seq 1 30); do
              if curl -fsSL --max-time 10 "$url"; then
                echo "Render health check passed for $url"
                passed=1
                break
              fi
              echo "Attempt $i failed for $url; retrying in 10 seconds..."
              sleep 10
            done
            if [ "$passed" -ne 1 ]; then
              echo "Render health check failed after retries for $url"
              exit 1
            fi
          done

      - name: Check public homepage responds
        run: |
          set -euo pipefail
          for url in $RENDER_APP_URLS; do
            echo "Checking $url"
            output="/tmp/home-$(echo "$url" | tr -c 'A-Za-z0-9' '_').html"
            passed=0
            for i in $(seq 1 30); do
              if curl -fsSL --max-time 15 "$url" >"$output" && test -s "$output"; then
                echo "Homepage responded with $(wc -c <"$output") bytes for $url"
                passed=1
                break
              fi
              echo "Attempt $i failed for $url; retrying in 10 seconds..."
              sleep 10
            done
            if [ "$passed" -ne 1 ]; then
              echo "Homepage check failed after retries for $url"
              exit 1
            fi
          done
