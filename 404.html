<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | IntoTheBattle</title>
  <meta name="description" content="The requested IntoTheBattle page could not be found." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/intothebattlelogo_logo_only.svg" />
  <link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg" />
  <script type="module" src="/js/clarity-loader.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:   #f5c842;
      --gold-l: #ffe99a;
      --ember:  #ff7a3a;
      --red:    #ff2a4a;
      --blue:   #00c8ff;
      --txt:    #edf0fa;
      --muted:  #8896ae;
      --dim:    #4e5a6c;
      --border: rgba(255,255,255,0.09);
      --b-gold: rgba(245,200,66,0.28);
      --panel:  rgba(255,255,255,0.048);
      --ease:   0.18s cubic-bezier(0.4,0,0.2,1);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--txt);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* Page container */
    .page {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.7fr);
      gap: clamp(28px, 5vw, 60px);
      align-items: center;
    }

    /* Left copy */
    .copy { }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .brand-link .logo-box {
      width: 50px; height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(245,200,66,0.36);
      background: rgba(245,200,66,0.07);
      box-shadow: 0 0 24px rgba(245,200,66,0.16);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .brand-link .logo-box img { width: 100%; height: auto; display: block; transform: scale(1.07); }
    .brand-link span {
      color: var(--gold-l);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 7px; width: fit-content;
      margin-bottom: 16px; padding: 7px 13px;
      border: 1px solid rgba(0,200,255,0.28); border-radius: 999px;
      background: rgba(0,200,255,0.08); color: rgba(0,200,255,0.85);
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    }

    h1 {
      font-family: 'Black Ops One', sans-serif;
      font-size: clamp(52px, 10vw, 120px);
      line-height: 0.84;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--txt);
      text-shadow: 0 0 60px rgba(245,200,66,0.15);
      margin-bottom: 20px;
    }
    h1 span {
      display: block;
      background: linear-gradient(110deg, #fff5d6, var(--gold), var(--ember));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      max-width: 580px;
      color: var(--muted);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 0 22px; border-radius: 14px;
      font-weight: 800; font-size: 14px; cursor: pointer; border: none;
      transition: transform var(--ease), filter var(--ease), box-shadow var(--ease);
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn-primary { color: #0a0700; background: linear-gradient(135deg, var(--gold), var(--gold-l) 42%, var(--ember)); box-shadow: 0 6px 24px rgba(245,200,66,0.28); }
    .btn-primary:hover { box-shadow: 0 10px 32px rgba(245,200,66,0.40); }
    .btn-secondary { color: var(--txt); border: 1px solid var(--border); background: var(--panel); }

    /* Right radar visual */
    .radar-visual {
      position: relative;
      aspect-ratio: 1;
      max-width: 380px;
      width: 100%;
      border: 1px solid var(--b-gold);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(0,200,255,0.12) 0%, transparent 40%),
        radial-gradient(circle at center, rgba(245,200,66,0.05) 0%, transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
      box-shadow: 0 0 80px rgba(0,200,255,0.08), 0 32px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
      overflow: hidden;
      justify-self: center;
    }

    /* Radar grid lines */
    .radar-visual::before {
      content: "";
      position: absolute;
      inset: 20px;
      background:
        linear-gradient(rgba(0,200,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.07) 1px, transparent 1px);
      background-size: 30px 30px;
      border-radius: 50%;
    }

    /* Radar circles */
    .radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,200,255,0.14);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .radar-ring:nth-child(1) { width: 60%; height: 60%; }
    .radar-ring:nth-child(2) { width: 80%; height: 80%; border-color: rgba(245,200,66,0.10); }

    /* Sweep line */
    @keyframes radar-sweep {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .radar-sweep {
      position: absolute;
      top: 50%; left: 50%;
      width: 50%; height: 50%;
      transform-origin: 0% 100%;
      animation: radar-sweep 3.5s linear infinite;
      background: conic-gradient(from 270deg, rgba(0,200,255,0.22) 0deg, transparent 50deg);
    }

    /* Center 404 */
    .radar-code {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 46%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(3,6,14,0.80);
      border: 2px solid rgba(245,200,66,0.40);
      box-shadow: 0 0 40px rgba(245,200,66,0.16), inset 0 0 30px rgba(0,200,255,0.07);
      font-family: 'Black Ops One', sans-serif;
      font-size: clamp(36px, 6vw, 72px);
      letter-spacing: 0.04em;
      color: var(--gold-l);
    }

    /* Signal blips */
    .blip {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    @keyframes blip-pulse { 0%,100%{opacity:0.9;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
    .blip-1 { top: 22%; left: 20%; background: var(--blue); box-shadow: 0 0 14px var(--blue); animation: blip-pulse 2.1s ease-in-out infinite; }
    .blip-2 { top: 30%; right: 18%; background: var(--red); box-shadow: 0 0 14px var(--red); animation: blip-pulse 1.7s ease-in-out infinite 0.6s; }
    .blip-3 { bottom: 22%; left: 32%; background: var(--gold); box-shadow: 0 0 14px var(--gold); animation: blip-pulse 2.4s ease-in-out infinite 1.1s; }

    /* Responsive */
    @media (max-width: 760px) {
      body { padding: 18px; }
      .page { grid-template-columns: 1fr; text-align: center; }
      .radar-visual { order: -1; max-width: 260px; margin: 0 auto; }
      .brand-link { margin-left: auto; margin-right: auto; }
      .eyebrow { margin-left: auto; margin-right: auto; }
      .description { margin-left: auto; margin-right: auto; }
      .actions { justify-content: center; flex-direction: column; }
      .actions .btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/css/site-refresh.css" />
</head>
<body>
  <main class="page">
    <section class="copy">
      <a class="brand-link" href="/" aria-label="IntoTheBattle home">
        <div class="logo-box">
          <img src="/intothebattlelogo_logo_only.svg" alt="IntoTheBattle logo" width="50" height="50" />
        </div>
        <span>IntoTheBattle</span>
      </a>
      <div class="eyebrow">Signal lost</div>
      <h1>Page <span>not found</span></h1>
      <p class="description">The arena link you followed is offline, moved, or typed wrong. Head back to the main site or open your creator dashboard to get back into the fight.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Return home</a>
        <a class="btn btn-secondary" href="/dashboard">Open dashboard</a>
      </div>
    </section>

    <aside class="radar-visual" aria-hidden="true">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-sweep"></div>
      <div class="radar-code">404</div>
      <div class="blip blip-1"></div>
      <div class="blip blip-2"></div>
      <div class="blip blip-3"></div>
    </aside>
  </main>
</body>
</html>
