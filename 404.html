<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | IntoTheBattle</title>
  <meta name="description" content="The requested IntoTheBattle page could not be found." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/intothebattlelogo_logo_only.svg" />
  <link rel="apple-touch-icon" href="/intothebattlelogo_logo_only.svg" />
  <script type="module" src="/js/clarity-loader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #f6c95b;
      --gold2: #fff0b9;
      --cyan: #55e7ff;
      --red: #e83b5f;
      --ink: #050608;
      --muted: #a8afbf;
      --text: #fff8e6;
      --line: rgba(246,201,91,.22);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0, rgba(246,201,91,.18), transparent 30%),
        radial-gradient(circle at 84% 14%, rgba(232,59,95,.14), transparent 30%),
        radial-gradient(circle at 76% 78%, rgba(85,231,255,.11), transparent 34%),
        linear-gradient(180deg, #050608 0%, #030406 62%, #020307 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(246,201,91,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,231,255,.035) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(85,231,255,.13), transparent 13%, transparent 87%, rgba(246,201,91,.12)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 5px);
      opacity: .55;
    }
    main {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(280px, .72fr);
      gap: clamp(26px, 5vw, 58px);
      align-items: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      color: var(--gold2);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      border: 1px solid rgba(246,201,91,.36);
      background: rgba(246,201,91,.08);
      box-shadow: 0 0 34px rgba(246,201,91,.18);
    }
    .eyebrow {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 8px 12px;
      border: 1px solid rgba(85,231,255,.28);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(85,231,255,.07);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 780px;
      font-size: clamp(54px, 11vw, 132px);
      line-height: .82;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 44px rgba(246,201,91,.18);
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(105deg, #fff8d8, var(--gold), #ff6a3d);
      -webkit-background-clip: text;
      background-clip: text;
    }
    p {
      max-width: 620px;
      margin-top: 22px;
      color: #c6cedc;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.65;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    .btn {
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .16s ease, filter .16s ease, border-color .16s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .primary {
      color: #170c02;
      background: linear-gradient(135deg, var(--gold), #fff0b9 52%, #ff6a3d);
      box-shadow: 0 18px 46px rgba(246,201,91,.22);
    }
    .secondary {
      color: #fff;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.055);
    }
    .radar {
      position: relative;
      min-height: 430px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(85,231,255,.14), transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      box-shadow: 0 34px 90px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .radar::before {
      content: "";
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(85,231,255,.24);
      background:
        linear-gradient(rgba(85,231,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,231,255,.08) 1px, transparent 1px);
      background-size: 34px 34px;
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    }
    .radar::after {
      content: "";
      position: absolute;
      width: 62%;
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(246,201,91,.28);
      box-shadow: 0 0 0 42px rgba(246,201,91,.025), 0 0 0 92px rgba(85,231,255,.025);
    }
    .code {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: min(220px, 58%);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(246,201,91,.46);
      color: var(--gold2);
      background: rgba(3,7,14,.78);
      box-shadow: 0 0 54px rgba(246,201,91,.18), inset 0 0 40px rgba(85,231,255,.08);
      font-size: clamp(52px, 8vw, 90px);
      font-weight: 1000;
      letter-spacing: .06em;
    }
    .signal {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }
    .s1 { left: 21%; top: 28%; }
    .s2 { right: 19%; top: 34%; background: var(--red); box-shadow: 0 0 18px var(--red); }
    .s3 { left: 35%; bottom: 20%; background: var(--gold); box-shadow: 0 0 18px var(--gold); }
    @media (max-width: 820px) {
      body { padding: 18px; }
      main { grid-template-columns: 1fr; }
      .radar { min-height: 300px; order: -1; }
      .brand { margin-bottom: 22px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/css/site-refresh.css" />
</head>
<body>
  <main>
    <section>
      <a class="brand" href="/" aria-label="IntoTheBattle home">
        <img src="/intothebattlelogo_logo_only.svg" alt="" />
        IntoTheBattle
      </a>
      <div class="eyebrow">Signal lost</div>
      <h1>Page <span>not found</span></h1>
      <p>The arena link you followed is offline, moved, or typed wrong. Check back in 10 minutes, or head back to the main site and open your creator dashboard.</p>
      <div class="actions">
        <a class="btn primary" href="/">Return home</a>
        <a class="btn secondary" href="/dashboard">Open dashboard</a>
      </div>
    </section>
    <aside class="radar" aria-hidden="true">
      <div class="code">404</div>
      <span class="signal s1"></span>
      <span class="signal s2"></span>
      <span class="signal s3"></span>
    </aside>
  </main>
</body>
</html>
